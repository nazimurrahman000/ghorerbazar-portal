    function openConfirmWarningModal(title, message, badgeText, onConfirmAction) {

    function getNowTimeStr() {
      return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function sanitizeTimeDisplay(raw) {
      if (!raw || raw === '--:--') return '--:--';
      let s = String(raw).replace(/^'/, '').trim();
      if (s.includes('1899') || s.includes('GMT') || s.includes('মানক')) {
        const d = new Date(s.replace(/\s*\(.*?\)\s*/g, ''));
        if (!isNaN(d.getTime())) {
          return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        const m = s.match(/(\d{1,2}:\d{2}:\d{2})/);
        if (m) return m[1];
      }
      return s;
    }
    function dateToInputVal(dateStr) {
      if (!dateStr || dateStr === 'ALL') return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/'); if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }
    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }
    function cleanDisplayDate(raw) {
      if (!raw) return getTodayFormatted();
      let s = String(raw).trim();
      const p = s.split('/');
      if (p.length === 3) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const mIdx = parseInt(p[1], 10) - 1;
        if (mIdx >= 0 && mIdx < 12) return `${p[0]} ${months[mIdx]} ${p[2]}`;
      }
      return s;
    }
    function formatHMS(sec) {
      sec = Math.max(0, Math.floor(Number(sec) || 0));
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function recordActivityLog(actionTitle, detailsText, sendStandaloneSync = false) {
      if (!currentUser) return {};
      const logEntry = {
        date: getTodayFormatted(),
        time: getNowTimeStr(),
        userId: String(currentUser.id),
        userName: currentUser.name,
        role: currentUser.role,
        team: currentUser.team,
        action: actionTitle,
        details: detailsText
      };
      let logs = getStored('activity_logs', []);
      logs.unshift(logEntry);
      if (logs.length > 300) logs = logs.slice(0, 300);
      setStored('activity_logs', logs);

      const meta = {
        actorId: logEntry.userId,
        actorName: logEntry.userName,
        actorRole: logEntry.role,
        actorTeam: logEntry.team,
        logDate: logEntry.date,
        logTime: logEntry.time,
        logAction: logEntry.action,
        logDetails: logEntry.details
      };
      if (sendStandaloneSync) {
        postToSheet('ACTIVITY_LOG', meta);
      }
      return meta;
    }

    function getUserOnlineStatus(userId) {
      const uid = String(userId);
      if (currentUser && String(currentUser.id) === uid) {
        if (currentUser.role === 'agent') {
          const today = getTodayFormatted();
          const myAtt = getStored('attendance_records', []).find(a => String(a.userId) === uid && a.date === today);
          if (myAtt && myAtt.status === 'On Break') return 'On Break';
        }
        return 'Online';
      }

      const now = Date.now();
      const onlineList = getStored('online_users', []);
      const oRec = onlineList.find(o => String(o.id) === uid);
      if (oRec && oRec.state !== 'Offline' && oRec.lastSeen && (now - Number(oRec.lastSeen)) < 180000) {
        return oRec.state === 'On Break' ? 'On Break' : 'Online';
      }

      const today = getTodayFormatted();
      const attRec = getStored('attendance_records', []).find(a => String(a.userId) === uid && a.date === today);
      if (attRec && attRec.status !== 'Completed') {
        if (attRec.lastTick && (now - Number(attRec.lastTick)) < 180000) {
          return attRec.status === 'On Break' ? 'On Break' : 'Online';
        }
      }
      return 'Offline';
    }

        result[k] = { ...DEFAULT_PRODUCTS[k], ...(prodOverrides[k] || {}) };
      });
      return result;
    }

    function getUsersForMonth(mKey) {
      const baseUsers = getStored('users', DEFAULT_USERS).map(normalizeUserRecord);
      const configs = getStored('monthly_configs', {});
      const mCfg = configs[mKey || selectedMonthKey] || {};
      const userOverrides = mCfg.users || {};
      return baseUsers.map(u => {
        let updated = { ...u };
        if (userOverrides[u.id]) {
          updated.grade = userOverrides[u.id].grade || u.grade;
          updated.baseTarget = Number(userOverrides[u.id].baseTarget ?? u.baseTarget);
        }
        return normalizeUserRecord(updated);
      });
    }

    function getRosterForMonth(mKey) {
      const mk = mKey || selectedMonthKey;
      const savedList = getStored('roster_records', []);
      const monthRows = savedList.filter(r => r.monthKey === mk);
      const allUsers = getStored('users', DEFAULT_USERS).map(normalizeUserRecord);

      return DEFAULT_ROSTER.map(defRow => {
        const override = monthRows.find(r => String(r.id) === String(defRow.id));
        const usr = allUsers.find(u => String(u.id) === String(defRow.id));
        return {
          ...defRow,
          name: usr ? usr.name : defRow.name,
          ...(override || {})

    function ensureAgentAttendanceSession(user) {
      if (!user || user.role !== 'agent') return null;
      const today = getTodayFormatted();
      let attList = getStored('attendance_records', []);
      let rec = attList.find(a => String(a.userId) === String(user.id) && a.date === today);

      if (!rec) {
        rec = {
          date: today,
          userId: String(user.id),
          userName: user.name,
          team: user.team,
          loginTime: getNowTimeStr(),
          logoutTime: '--:--',
          status: 'Working',
          breakReason: '-',
          breakLogs: '-',
          activeSeconds: 0,
          breakSeconds: 0,
          lastTick: Date.now()
        };
        attList.unshift(rec);
        setStored('attendance_records', attList);
        postToSheet('ATTENDANCE_SYNC', rec);
      } else {
        rec.loginTime = sanitizeTimeDisplay(rec.loginTime);
        rec.logoutTime = sanitizeTimeDisplay(rec.logoutTime);
        if (rec.status === 'Completed') {
          rec.status = 'Working';
          rec.logoutTime = '--:--';
        }
        rec.lastTick = Date.now();
        setStored('attendance_records', attList);
      }
      return rec;
    }

    function startLiveDutyClock() {
      if (dutyTimerInterval) clearInterval(dutyTimerInterval);
      dutyTimerInterval = setInterval(() => {
        if (!currentUser || currentUser.role !== 'agent') return;
        const today = getTodayFormatted();
        let attList = getStored('attendance_records', []);
        let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
        if (!rec || rec.status === 'Completed') return;

        const now = Date.now();
        const elapsed = Math.max(1, Math.round((now - (rec.lastTick || now)) / 1000));
        rec.lastTick = now;

        if (rec.status === 'On Break') {
          rec.breakSeconds = (Number(rec.breakSeconds) || 0) + elapsed;
        } else if (rec.status === 'Working') {
          rec.activeSeconds = (Number(rec.activeSeconds) || 0) + elapsed;
        }
        setStored('attendance_records', attList);

        const wClock = document.getElementById('live-work-timer');
        const bClock = document.getElementById('live-break-timer');
        if (wClock) wClock.textContent = formatHMS(rec.activeSeconds);
        if (bClock) bClock.textContent = formatHMS(rec.breakSeconds);

        if ((rec.activeSeconds + rec.breakSeconds) % 25 === 0) {
          postToSheet('ATTENDANCE_SYNC', rec);
        }
      }, 1000);
    }

    async function handleStartBreak(e) {
      e.preventDefault();

      const reason = document.getElementById('breakReasonSelect').value;

    function getTargetData(user, scopeOverride, mKey) {
      const allUsers = getUsersForMonth(mKey || selectedMonthKey);
      let baseTarget = 0;
      let agentCount = 1;
      
      if (canViewAll(user)) {
        const defaultTeam = user.role === 'admin' ? user.team : 'ALL';
        const scope = scopeOverride || dashboardScope || defaultTeam;
        const agents = allUsers.filter(u => u.role === 'agent' && (scope === 'ALL' ? true : u.team === scope));
        baseTarget = agents.reduce((sum, a) => sum + (Number(a.baseTarget) || 0), 0);
        agentCount = agents.length || 1;
      } else {
        const freshUser = allUsers.find(u => String(u.id) === String(user.id)) || user;
        baseTarget = Number(freshUser.baseTarget) || 1232174;
      }

      const workingTarget = Math.round(baseTarget * 1.05);
      const dailyTarget = Math.round(workingTarget / 26);

      const d = new Date().getDate();
      let sprintName, sprintGoal, sprintPct;

      if (d <= 10) { sprintName = 'Sprint 1 (Days 1–10)'; sprintPct = 0.40; sprintGoal = Math.round(workingTarget * 0.40); }
      else if (d <= 20) { sprintName = 'Sprint 2 (Days 11–20)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }
      else { sprintName = 'Sprint 3 (Days 21–31)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }

      return { baseTarget, workingTarget, dailyTarget, sprintName, sprintGoal, sprintPct, agentCount };
    }

    function calculateEarnedIncentives(pTotals, agentCount, mKey) {
      let totalMoney = 0;
      let earnedRewards = [];
      const activeProds = getActiveProductsForMonth(mKey || selectedMonthKey);

      Object.keys(activeProds).forEach(k => {
        const p = activeProds[k];
        const achieved = pTotals[k];
        const target = p.targetKg * agentCount;
        const pct = target > 0 ? (achieved / target) * 100 : 0;

        if (pct >= 100) {
          if (p.bonus100) totalMoney += Number(p.bonus100);
          if (p.item100) earnedRewards.push(`${p.name}: ${p.item100}`);
          else earnedRewards.push(`${p.name} (100%)`);
        } else if (pct >= 90) {
          if (p.bonus90) totalMoney += Number(p.bonus90);
          earnedRewards.push(`${p.name} (90%)`);
        }
      });

      return { totalMoney, earnedRewards };
    }

    async function postToSheet(action, payload) {
      const pingInfo = currentUser ? {
        pingUserId: String(currentUser.id),
        pingName: currentUser.name,
        pingRole: currentUser.role,
        pingTeam: currentUser.team,
        pingState: getUserOnlineStatus(currentUser.id)
      } : {};
      const fullData = { action, timestamp: new Date().toISOString(), ...pingInfo, ...payload };
      const params = new URLSearchParams({ action, payload: JSON.stringify(fullData), ...pingInfo, ...payload });

      fetch(`${webhookUrl}?${params.toString()}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
      new Image().src = `${webhookUrl}?${params.toString()}&_cb=${Date.now()}`;

      try {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = webhookUrl;
        form.target = 'hidden_iframe_target';
        form.style.display = 'none';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.value = JSON.stringify(fullData);
        form.appendChild(input);

        let iframe = document.getElementById('hidden_iframe_target');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.name = 'hidden_iframe_target';
          iframe.id = 'hidden_iframe_target';
          iframe.style.display = 'none';
          document.body.appendChild(iframe);
        }

        document.body.appendChild(form);
        form.submit();
        setTimeout(() => { if (form.parentNode) form.parentNode.removeChild(form); }, 2000);
      } catch (e) {}
    }

    function fetchFromSheet() {
      const cbName = 'gb_cb_' + Date.now();
      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') handleCloudData(res);
      };
      let pingQuery = '';
      if (currentUser) {
        const st = getUserOnlineStatus(currentUser.id);
        pingQuery = `&pingUserId=${encodeURIComponent(currentUser.id)}&pingName=${encodeURIComponent(currentUser.name)}&pingRole=${encodeURIComponent(currentUser.role)}&pingTeam=${encodeURIComponent(currentUser.team)}&pingState=${encodeURIComponent(st)}`;
      }
      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${cbName}&t=${Date.now()}${pingQuery}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}${pingQuery}`)
          .then(r => r.json())
          .then(res => { if (res && res.status === 'success') handleCloudData(res); })
          .catch(() => {});
      };
      document.body.appendChild(script);
    }

    function isUserInteractingWithControl() {
      const active = document.activeElement;
      if (!active) return false;
      const tag = (active.tagName || '').toUpperCase();
      return tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA';
    }

    function hasOnlineStateChanged(cloudList, localList) {
      if (!Array.isArray(cloudList) || !Array.isArray(localList)) return true;
      if (cloudList.length !== localList.length) return true;
      const norm = arr => arr.map(u => `${u.id}_${u.state}_${getUserOnlineStatus(u.id)}`).sort().join('|');
      return norm(cloudList) !== norm(localList);
    }

    function hasAttendanceChanged(cloudAtt, localAtt) {
      if (!Array.isArray(cloudAtt) || !Array.isArray(localAtt)) return true;
      if (cloudAtt.length !== localAtt.length) return true;
      const stripTick = arr => arr.map(({ lastTick, ...rest }) => rest);
      return JSON.stringify(stripTick(cloudAtt)) !== JSON.stringify(stripTick(localAtt));
    }

    function handleCloudData(res) {
      let changed = false;
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          changed = true;
        }
      }
      if (Array.isArray(res.attendanceRecords)) {
        const localAtt = getStored('attendance_records', []);
        const today = getTodayFormatted();
        const mergedAtt = res.attendanceRecords.map(cloudRec => {
          cloudRec.loginTime = sanitizeTimeDisplay(cloudRec.loginTime);
          cloudRec.logoutTime = sanitizeTimeDisplay(cloudRec.logoutTime);
          if (currentUser && currentUser.role === 'agent' && String(cloudRec.userId) === String(currentUser.id) && cloudRec.date === today) {
            const myLocal = localAtt.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
            if (myLocal && myLocal.status !== 'Completed' && (myLocal.activeSeconds > cloudRec.activeSeconds || myLocal.breakSeconds > cloudRec.breakSeconds)) {
              return myLocal;
            }
          }
          return cloudRec;
        });
        const stateChanged = hasAttendanceChanged(mergedAtt, localAtt);
        setStored('attendance_records', mergedAtt);
        if (stateChanged) changed = true;
      }
      if (Array.isArray(res.onlineUsers)) {
        const localOnline = getStored('online_users', []);
        const onlineStateDiff = hasOnlineStateChanged(res.onlineUsers, localOnline);
        setStored('online_users', res.onlineUsers);
        if (onlineStateDiff) changed = true;
      }
      if (Array.isArray(res.activityLogs) && res.activityLogs.length > 0) {
        const localLogs = getStored('activity_logs', []);
        if (JSON.stringify(res.activityLogs) !== JSON.stringify(localLogs)) {
          setStored('activity_logs', res.activityLogs);
          changed = true;
        }
      }
      if (Array.isArray(res.rosterRecords) && res.rosterRecords.length > 0) {
        const localRoster = getStored('roster_records', []);
        if (JSON.stringify(res.rosterRecords) !== JSON.stringify(localRoster)) {
          setStored('roster_records', res.rosterRecords);
          changed = true;
        }
      }
      if (res.monthlyConfigs && typeof res.monthlyConfigs === 'object') {
        const localCfg = getStored('monthly_configs', {});
        if (JSON.stringify(res.monthlyConfigs) !== JSON.stringify(localCfg)) {
          setStored('monthly_configs', res.monthlyConfigs);
          changed = true;
        }
      }
      if (Array.isArray(res.customUsers) && res.customUsers.length > 0) {
        const currentUsers = getStored('users', DEFAULT_USERS);
        const mergedMap = new Map();
        DEFAULT_USERS.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        currentUsers.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        res.customUsers.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        const mergedArr = Array.from(mergedMap.values());
        if (JSON.stringify(mergedArr) !== JSON.stringify(currentUsers)) {
          setStored('users', mergedArr);
          changed = true;
        }
      }
      if (changed && currentUser && !isAnyModalOpen() && !isUserInteractingWithControl()) {
        renderAppLayout();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const rawUser = getStored('users', DEFAULT_USERS).map(normalizeUserRecord).find(u => String(u.id) === id && u.pass === pass);
      if (!rawUser) { alert('Invalid Employee ID or Password!'); return; }
      const user = normalizeUserRecord(rawUser);
      currentUser = user;
      setStored('session_user', user);
      dashboardScope = user.role === 'admin' ? user.team : 'ALL';
      monthlyPerfTeamScope = user.role === 'admin' ? user.team : 'ALL';
      monthlyPerfAgentId = 'ALL';
      logsFilterScope = 'ALL';
      reportsDateFilter = getTodayFormatted();

      recordActivityLog('User Login', `Signed in to the portal (${user.role.toUpperCase()})`, true);

      if (user.role === 'agent') {
        ensureAgentAttendanceSession(user);
        startLiveDutyClock();
      }
      init();
    }

    async function handleLogout() {
      if (currentUser) {
        if (currentUser.role === 'agent') {
          if (!confirm('Are you sure you want to End Duty & Logout for today?')) return;
          const today = getTodayFormatted();
          let attList = getStored('attendance_records', []);
          let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
          if (rec) {
            rec.status = 'Completed';
            rec.breakReason = '-';
            rec.logoutTime = getNowTimeStr();
            setStored('attendance_records', attList);
            await postToSheet('ATTENDANCE_SYNC', rec);

        }
        const logMeta = recordActivityLog('User Logout', `Logged out of the portal (${currentUser.role.toUpperCase()})`);
        await postToSheet('USER_LOGOUT', { userId: String(currentUser.id), userName: currentUser.name, team: currentUser.team, ...logMeta });

      if (pollInterval) clearInterval(pollInterval);
      if (dutyTimerInterval) clearInterval(dutyTimerInterval);
      currentUser = null;
      localStorage.removeItem('gb_session_user');
      document.getElementById('app').innerHTML = renderLogin();

      const sprintSalesAmount = thisMonthSales.reduce((acc, curr) => {

        if (tInfo.sprintName.includes('Sprint 2') && d > 10 && d <= 20) return acc + Number(curr.amount || 0);
        if (tInfo.sprintName.includes('Sprint 3') && d > 20) return acc + Number(curr.amount || 0);
        return acc;

    function renderDutyRosterView() {
      const u = currentUser;
      const isEditable = isFullAdmin(u);
      const roster = getRosterForMonth(selectedMonthKey);
      const days = ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'];
      const dayLabels = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

      const samadRows = roster.filter(r => r.team === 'Team Samad');
      const nazimRows = roster.filter(r => r.team === 'Team Nazim');

      function computeRosterSummary(rows, excludeTL) {
        const filtered = excludeTL ? rows.filter(r => !r.isTL && r.id !== '10107' && r.id !== '10122') : rows;
        const counts = {
          morning: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 },
          general: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 },
          evening: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 },
          night: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 },
          doCount: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 }
        };
        filtered.forEach(r => {
          days.forEach(d => {
            const val = String(r[d] || '').toUpperCase();
            if (val.includes('7:00')) counts.morning[d]++;
            else if (val.includes('10:00')) counts.general[d]++;
            else if (val.includes('3:00')) counts.evening[d]++;
            else if (val.includes('NIGHT') || val.includes('11:00')) counts.night[d]++;
            else if (val === 'DO' || val.includes('OFF')) counts.doCount[d]++;
          });
        });
        return counts;
      }

      const samadSum = computeRosterSummary(samadRows, true);
      const nazimSum = computeRosterSummary(nazimRows, true);
      const combinedAll = computeRosterSummary(roster, false);
      const combinedNoTL = computeRosterSummary(roster, true);

      function renderShiftCell(row, dKey) {
        const val = row[dKey] || '3:00 PM';
        const cellClass = val === 'DO' ? 'roster-do' : (val === 'Night' ? 'roster-night' : 'text-slate-700 font-semibold');
        if (!isEditable) {
          return `<td class="px-1.5 py-2 border border-slate-200 text-center text-[11px] whitespace-nowrap ${cellClass}">${val}</td>`;
        }
        return `
          <td class="p-1 border border-slate-200 text-center ${cellClass}">
            <select onchange="handleRosterShiftChange('${row.id}', '${dKey}', this.value)" class="w-full bg-transparent text-center text-[11px] font-bold focus:outline-none cursor-pointer">
              ${SHIFT_OPTIONS.map(opt => `<option value="${opt}" ${opt === val ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
          </td>
        `;
      }

                  <td colspan="2" class="p-1.5 border border-slate-200">In Total (Agents)</td>

                    </tr>
                  </thead>
                  <tbody>
                    ${samadRows.map(r => `
                      <tr class="${r.isTL ? 'bg-slate-50 font-extrabold' : 'hover:bg-slate-50/60'}">
                        <td class="px-1.5 py-2 border border-slate-200 text-center font-mono font-bold">${r.id}</td>
                        <td class="px-2 py-2 border border-slate-200 font-bold text-slate-900 whitespace-nowrap">${r.name} ${r.isTL ? '<span class="text-[10px] text-blue-600 font-black">(TL)</span>' : ''}</td>
                        ${days.map(d => renderShiftCell(r, d)).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
              ${renderTeamSummaryTable('Team Samad — Roster Summary', samadSum)}
            </div>

            <div>
              <div class="card-dynamic overflow-hidden">
                <div class="bg-orange-500 text-white px-4 py-2.5 font-black text-xs text-center uppercase tracking-wider">Team: Facebook (Nazim)</div>
                <table class="w-full text-[11px] border-collapse">
                  <thead class="bg-slate-50 font-extrabold text-slate-600">
                    <tr>
                      <th class="px-1.5 py-2 border border-slate-200">ID</th>
                      <th class="px-2 py-2 border border-slate-200 text-left">Name</th>
                      ${dayLabels.map(dl => `<th class="px-1.5 py-2 border border-slate-200">${dl}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${nazimRows.map(r => `

    async function handleRosterShiftChange(empId, dayKey, newShift) {
      if (!isFullAdmin(currentUser)) return;
      const roster = getRosterForMonth(selectedMonthKey);
      const targetRow = roster.find(r => String(r.id) === String(empId));
      if (!targetRow) return;

      targetRow[dayKey] = newShift;
      targetRow.monthKey = selectedMonthKey;

      let savedList = getStored('roster_records', []);
      const idx = savedList.findIndex(r => r.monthKey === selectedMonthKey && String(r.id) === String(empId));
      if (idx !== -1) savedList[idx] = targetRow;
      else savedList.push(targetRow);
      setStored('roster_records', savedList);

      const logMeta = recordActivityLog('Updated Duty Roster', `Changed ${targetRow.name}'s (${empId}) ${dayKey.toUpperCase()} shift to "${newShift}" (${selectedMonthKey})`);
      renderAppLayout();
      await postToSheet('SAVE_ROSTER_ROW', { ...targetRow, ...logMeta });
    }

        const workTgt = Math.round(baseTgt * 1.05);
        const tSales = monthSales.filter(s => s.team === teamName);
        const leads = tSales.reduce((s, c) => s + Number(c.leads || 0), 0);
        const orders = tSales.reduce((s, c) => s + Number(c.orders || 0), 0);
        const revenue = tSales.reduce((s, c) => s + Number(c.amount || 0), 0);
        const conv = leads > 0 ? ((orders / leads) * 100).toFixed(2) : '0.00';
        const pct = workTgt > 0 ? Math.min(100, Math.round((revenue / workTgt) * 100)) : 0;
        return { teamName, agentCount: tAgents.length, workTgt, leads, orders, revenue, conv, pct };
      }

    async function handleSaveProductConfig(e) {
      e.preventDefault();
      if (!isFullAdmin(currentUser)) return;
      let configs = getStored('monthly_configs', {});
      if (!configs[selectedMonthKey]) configs[selectedMonthKey] = { users: {}, products: {} };
      if (!configs[selectedMonthKey].products) configs[selectedMonthKey].products = {};

      Object.keys(DEFAULT_PRODUCTS).forEach(k => {
        const kgVal = Number(document.getElementById(`cfg_kg_${k}`).value) || DEFAULT_PRODUCTS[k].targetKg;
        const b100Val = Number(document.getElementById(`cfg_b100_${k}`).value) || 0;
        configs[selectedMonthKey].products[k] = {
          targetKg: kgVal,
          bonus100: b100Val
        };
      });

      setStored('monthly_configs', configs);
      const logMeta = recordActivityLog('Updated Product Incentives', `Modified monthly product KG targets & bonuses for ${selectedMonthKey}`);

      closeModal('productConfigModal');
      renderAppLayout();
    }

    function onAttModalChange() {
      const agId = document.getElementById('attAgentId').value;
      const dateStr = inputValToDateStr(document.getElementById('attDate').value);
      const attList = getStored('attendance_records', []);
      const ex = attList.find(a => String(a.userId) === String(agId) && a.date === dateStr);
      if (ex) {
        document.getElementById('attLogin').value = sanitizeTimeDisplay(ex.loginTime);
        document.getElementById('attLogout').value = sanitizeTimeDisplay(ex.logoutTime);
        document.getElementById('attWorkMins').value = Math.round((Number(ex.activeSeconds) || 0) / 60);
        document.getElementById('attBreakMins').value = Math.round((Number(ex.breakSeconds) || 0) / 60);
        document.getElementById('attStatus').value = ex.status || 'Working';
        document.getElementById('attReason').value = ex.breakReason || '-';
      } else {
        document.getElementById('attLogin').value = getNowTimeStr();
        document.getElementById('attLogout').value = '--:--';
        document.getElementById('attWorkMins').value = 0;
        document.getElementById('attBreakMins').value = 0;
        document.getElementById('attStatus').value = 'Working';
        document.getElementById('attReason').value = '-';
      }
    }

    async function handleAdminSaveAttendance(e) {
      e.preventDefault();
      if (!isFullAdmin(currentUser)) return;
      const allUsers = getStored('users', DEFAULT_USERS);
      const agId = document.getElementById('attAgentId').value;
      const ag = allUsers.find(u => String(u.id) === String(agId));
      const dateStr = inputValToDateStr(document.getElementById('attDate').value);

      let attList = getStored('attendance_records', []);
      const idx = attList.findIndex(a => String(a.userId) === String(agId) && a.date === dateStr);

      const rec = {
        date: dateStr,
        userId: String(ag.id),
        userName: ag.name,
        team: ag.team,
        loginTime: document.getElementById('attLogin').value.trim() || '--:--',
        logoutTime: document.getElementById('attLogout').value.trim() || '--:--',
        status: document.getElementById('attStatus').value,
        breakReason: document.getElementById('attReason').value.trim() || '-',
        breakLogs: idx !== -1 ? attList[idx].breakLogs : 'Edited by Admin',
        activeSeconds: (Number(document.getElementById('attWorkMins').value) || 0) * 60,
        breakSeconds: (Number(document.getElementById('attBreakMins').value) || 0) * 60,
        lastTick: Date.now()
      };

      if (idx !== -1) attList[idx] = rec; else attList.unshift(rec);
      setStored('attendance_records', attList);
      const logMeta = recordActivityLog('Edited Attendance', `Updated attendance record for ${ag.name} (${ag.id}) on ${dateStr}`);
      await postToSheet('ATTENDANCE_SYNC', { ...rec, ...logMeta });
      alert('Attendance record updated and synced!');
      closeModal('editAttModal');
      renderAppLayout();
    }

    async function handleSaveUser(e) {
      e.preventDefault();
      if (!isFullAdmin(currentUser)) return;
      const targetId = document.getElementById('usrId').value.trim();
      const existingUser = getStored('users', DEFAULT_USERS).find(u => String(u.id) === String(targetId));
      if (existingUser && !canEditTargetUser(currentUser, existingUser)) {
        alert('Permission Denied: You cannot overwrite a protected Admin ID.');
        return;
      }

      let roleVal = document.getElementById('usrRole').value;
      if (roleVal === 'admin' && !isSuperAdmin(currentUser) && String(targetId) !== String(currentUser.id)) {
        alert('Permission Denied: Only Nazim (Super Admin) can create Admin accounts. You can create Agent or Supervisor IDs.');
        return;
      }

      const gradeVal = roleVal === 'admin' ? 'TL' : (roleVal === 'supervisor' ? 'Supervisor' : document.getElementById('usrGrade').value);
      const rawName = document.getElementById('usrName').value.trim();

      const newUser = normalizeUserRecord({
        id: targetId,
        name: rawName,
        team: document.getElementById('usrTeam').value,
        grade: gradeVal,
        role: roleVal,
        pass: document.getElementById('usrPass').value.trim(),
        baseTarget: Number(document.getElementById('usrTarget').value) || 0
      });

      let users = getStored('users', DEFAULT_USERS);
      const idx = users.findIndex(u => String(u.id) === String(newUser.id));
      const isNewAccount = idx === -1;
      if (idx !== -1) users[idx] = newUser; else users.push(newUser);
      setStored('users', users);

      let configs = getStored('monthly_configs', {});
      if (!configs[selectedMonthKey]) configs[selectedMonthKey] = { users: {}, products: {} };
      if (!configs[selectedMonthKey].users) configs[selectedMonthKey].users = {};
      configs[selectedMonthKey].users[newUser.id] = { grade: newUser.grade, baseTarget: newUser.baseTarget };
      setStored('monthly_configs', configs);

      const logMeta = recordActivityLog(
        isNewAccount ? 'Created User ID' : 'Updated User ID',
        `${isNewAccount ? 'Created' : 'Updated'} ${newUser.role.toUpperCase()} ID: ${newUser.name} (${newUser.id}), Grade: ${newUser.grade}, Target: ৳${newUser.baseTarget.toLocaleString()}`
      );

      await postToSheet('SAVE_USER', { ...newUser, ...logMeta });
      await postToSheet('SAVE_MONTHLY_CONFIG', { monthKey: selectedMonthKey, configJson: JSON.stringify(configs[selectedMonthKey]) });
      alert(`User ID (${newUser.id}) with Grade "${newUser.grade}" saved and synced!`);
      closeModal('userModal');
      renderAppLayout();
    }

      if (!targetUser) return;

        return;

      openConfirmWarningModal(
        `Delete User ID (${targetUser.id})?`,

    function updateLiveRatio() {
      const u = currentUser;
      const allUsers = getUsersForMonth(selectedMonthKey);
      const agentId = isFullAdmin(u) ? document.getElementById('subAgentId')?.value : u.id;
      const targetAgent = allUsers.find(usr => String(usr.id) === String(agentId)) || u;

      const workingTarget = Math.round((Number(targetAgent.baseTarget) || 1232174) * 1.05);
      const dailyTarget = Math.round(workingTarget / 26);

      const leads = Number(document.getElementById('subLeads')?.value) || 0;
      const orders = Number(document.getElementById('subOrders')?.value) || 0;
      const amount = Number(document.getElementById('subAmount')?.value) || 0;

      const conv = leads > 0 ? ((orders / leads) * 100).toFixed(2) : '0.00';
      const ach = dailyTarget > 0 ? Math.round((amount / dailyTarget) * 100) : 0;

      document.getElementById('liveConvRatio').textContent = conv + '%';
      document.getElementById('liveDailyTarget').textContent = '৳' + dailyTarget.toLocaleString();
      document.getElementById('liveDailyAch').textContent = ach + '%';
    }

    async function handleSalesSubmit(e) {
      e.preventDefault();
      const u = currentUser;
      if (isSupervisor(u)) return;
      const allUsers = getUsersForMonth(selectedMonthKey);
      const targetAgent = isFullAdmin(u) ? allUsers.find(usr => String(usr.id) === String(document.getElementById('subAgentId').value)) : u;

      const leads = Number(document.getElementById('subLeads').value) || 0;
      const orders = Number(document.getElementById('subOrders').value) || 0;
      const amount = Number(document.getElementById('subAmount').value) || 0;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);

      let sales = getStored('sales_records', []);
      const idx = sales.findIndex(s => String(s.userId) === String(targetAgent.id) && s.date === dateStr);
      const isUpdate = idx !== -1;

      if (isUpdate) {
        const oldRec = sales[idx];
        const confirmModify = confirm(
          `⚠️ Warning — Existing Record Edit / Overwrite:\n\n` +
          `Agent: ${targetAgent.name} (${targetAgent.id})\n` +
          `Date: ${dateStr}\n` +
          `Previous Data: Leads ${oldRec.leads}, Orders ${oldRec.orders}, Amount ৳${Number(oldRec.amount).toLocaleString()}\n` +
          `New Data: Leads ${leads}, Orders ${orders}, Amount ৳${amount.toLocaleString()}\n\n` +
          `Are you sure you want to update this record across Agent Panel, Central Dashboard, Monthly Performance & Google Sheet?`
        );
        if (!confirmModify) return;
      }

      const submittedMonthKey = dateStr.substring(3);
      if (submittedMonthKey && submittedMonthKey.length === 7) {
        selectedMonthKey = submittedMonthKey;
        localStorage.setItem('gb_selected_month', selectedMonthKey);
      }
      reportsDateFilter = dateStr;

      const entry = {
        userId: String(targetAgent.id),
        userName: targetAgent.name,
        team: targetAgent.team,
        date: dateStr,
        leads: leads,
        orders: orders,
        amount: amount,
        ratio: leads > 0 ? Number(((orders / leads) * 100).toFixed(2)) : 0,
        ajwa: Number(document.getElementById('subAjwa').value) || 0,
        pinkSalt: Number(document.getElementById('subPinkSalt').value) || 0,
        blackGarlic: Number(document.getElementById('subBlackGarlic').value) || 0,
        sunHoney: Number(document.getElementById('subSunHoney').value) || 0,
        bsHoney: Number(document.getElementById('subBSHoney').value) || 0,
        gawaGhee: Number(document.getElementById('subGawaGhee').value) || 0
      };

      sales = sales.filter(s => !(String(s.userId) === String(entry.userId) && s.date === entry.date));
      sales.unshift(entry);
      setStored('sales_records', sales);

      const logMeta = recordActivityLog(
        isUpdate ? 'Updated Sales Report' : 'Submitted Sales Report',
        `${isUpdate ? 'Updated' : 'Submitted'} sales report for ${targetAgent.name} (${dateStr}) — Leads: ${leads}, Orders: ${orders}, Amount: ৳${amount.toLocaleString()}`
      );

      await postToSheet('DAILY_SALES_SUBMIT', { ...entry, ...logMeta });
      
      alert(`Report ${isUpdate ? 'updated' : 'saved'} and synced across Agent Panel, Central Dashboard & Google Sheet!`);
      closeModal('submitModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }

    async function handleAiErpPicturesUpload(event) {
      const files = Array.from(event.target.files || []);
      if (files.length === 0) return;

      const progBox = document.getElementById('aiScanProgressBox');
      const resBox = document.getElementById('aiAnalysisResultContainer');
      const stageTitle = document.getElementById('aiScanStageTitle');
      const stageSub = document.getElementById('aiScanStageSub');
      const pctBadge = document.getElementById('aiScanPctBadge');

      if (progBox) progBox.classList.remove('hidden');
      if (resBox) resBox.classList.add('hidden');

      let combinedText = '';
      try {
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          if (stageTitle) stageTitle.textContent = `AI Scanning Picture ${i + 1} of ${files.length} (${f.name})...`;
          const worker = await Tesseract.createWorker('eng');
          const ret = await worker.recognize(f);
          await worker.terminate();
          combinedText += '\n' + (ret?.data?.text || '');
          if (pctBadge) pctBadge.textContent = `${Math.round(((i + 1) / files.length) * 100)}% Done`;
        }

        const rawArea = document.getElementById('aiRawOcrTextarea');
        if (rawArea) rawArea.value = combinedText.trim();

        analyzeErpOcrText(combinedText);
      } catch (err) {
        alert('Could not scan image automatically: ' + (err.message || err) + '. You can still add or paste rows below.');
        analyzeErpOcrText('');
      } finally {
        if (progBox) progBox.classList.add('hidden');
        event.target.value = '';
      }
    }

    // Helper: Fuzzy match agent from text line or token
    function matchAgentInLine(lineText, allAgents) {
      const lower = String(lineText || '').toLowerCase();
      // 1. Check exact Employee ID match (e.g., 10191, 10289, etc.)
      for (const ag of allAgents) {
        if (lower.includes(String(ag.id).toLowerCase())) return ag;
      }
      // 2. Check full name or distinctive name parts
      const aliases = {
        '10191': ['shagor', 'sagor'],
        '10289': ['dipu', 'abdullah dipu'],
        '11044': ['eraz', 'hasibul', 'iraz'],
        '10741': ['shujon', 'sujon', 'kamruzzaman'],
        '10803': ['mahmud', 'abdullah mahmud'],
        '11042': ['ashiqur', 'ashik', 'ashiq'],
        '10328': ['rayhan', 'raihan', 'sheikh'],
        '10135': ['ranju', 'ronju'],
        '10098': ['shuvo', 'habibur'],
        '10136': ['al-amin kazi', 'alamin kazi', 'kazi'],
        '11007': ['zubayer', 'jubayer', 'zubaer'],
        '11101': ['mehedi', 'amin'],
        '11120': ['abu sayed', 'sayed', 'saied'],
        '11130': ['rabbir', 'rabbi', 'mollah', 'molla'],
        '10806': ['soad', 'suad', 'abdullah al soad'],
        '10128': ['al-amin', 'alamin', 'al amin']
      };

      // Check multi-word aliases first (like 'al-amin kazi' before 'al-amin')
      const sortedAgents = [...allAgents].sort((a, b) => b.name.length - a.name.length);
      for (const ag of sortedAgents) {
        if (lower.includes(ag.name.toLowerCase())) return ag;
        const agAliases = aliases[String(ag.id)] || [];
        for (const al of agAliases) {
          const regex = new RegExp(`\\b${al.replace('-', '[-\\s]?')}\\b`, 'i');
          if (regex.test(lower)) return ag;
        }
      }
      return null;
    }

    // Helper: Extract date from line if present (supports DD/MM/YYYY, YYYY-MM-DD, DD-MM-YYYY, DD Nov 2026)
    function extractDateFromText(text, fallbackDate) {
      const s = String(text || '');
      // Pattern 1: DD/MM/YYYY or DD-MM-YYYY
      const m1 = s.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](20\d{2})\b/);
      if (m1) {
        return `${String(m1[1]).padStart(2, '0')}/${String(m1[2]).padStart(2, '0')}/${m1[3]}`;
      }
      // Pattern 2: YYYY-MM-DD
      const m2 = s.match(/\b(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/);
      if (m2) {
        return `${String(m2[3]).padStart(2, '0')}/${String(m2[2]).padStart(2, '0')}/${m2[1]}`;
      }
      // Pattern 3: DD Mon YYYY or Mon DD, YYYY
      const monthsMap = { jan:'01', feb:'02', mar:'03', apr:'04', may:'05', jun:'06', jul:'07', aug:'08', sep:'09', oct:'10', nov:'11', dec:'12' };
      const m3 = s.match(/\b(\d{1,2})[\s\-]+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-,]*(20\d{2})?\b/i);
      if (m3) {
        const day = String(m3[1]).padStart(2, '0');
        const mon = monthsMap[m3[2].toLowerCase().substring(0, 3)];
        const yr = m3[3] || selectedMonthKey.split('/')[1] || '2026';
        return `${day}/${mon}/${yr}`;
      }
      return fallbackDate;
    }

    // Helper: Detect product keyword & convert gm/kg quantity
    function extractProductAmountsFromLine(lineText) {
      const lower = String(lineText || '').toLowerCase();
      const prods = { ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0 };
      let foundAnyProd = false;

      const prodPatterns = [
        { key: 'ajwa', regex: /ajwa(?:\s*dates)?[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'pinkSalt', regex: /(?:pink\s*)?salt[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'blackGarlic', regex: /(?:black\s*)?garlic[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'sunHoney', regex: /(?:sundarban|sun\.?\s*h|sundarban\s*honey)[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'bsHoney', regex: /(?:black\s*seed|bs\.?\s*h|kalojira)[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'gawaGhee', regex: /(?:gawa\s*)?ghee[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i }
      ];

      prodPatterns.forEach(pp => {
        const m = lower.match(pp.regex);
        if (m) {
          let val = parseFloat(m[1]) || 0;
          const unit = (m[2] || '').toLowerCase();
          if (unit === 'gm' || unit === 'g' || val >= 100) {
            val = Number((val / 1000).toFixed(2));
          }
          prods[pp.key] = val;
          foundAnyProd = true;
        }
      });

      return { prods, foundAnyProd };
    }

    function analyzeErpOcrText(ocrText) {
      const allAgents = getUsersForMonth(selectedMonthKey).filter(u => u.role === 'agent');
      const existingSales = getStored('sales_records', []);
      const lines = String(ocrText || '').split(/\r?\n/);

      // Check if there is a global date or global agent mentioned in the header of the picture
      let currentContextDate = (reportsDateFilter && reportsDateFilter !== 'ALL') ? reportsDateFilter : getTodayFormatted();
      let currentContextAgent = null;

      const mergedMap = new Map(); // key: `${userId}_${date}`

      lines.forEach(rawLine => {
        const line = rawLine.trim();
        if (!line || line.length < 2) return;

        // Update context date if a standalone date header is found
        const detectedDate = extractDateFromText(line, null);
        if (detectedDate) currentContextDate = detectedDate;

        // Check if an agent is mentioned on this line
        const lineAgent = matchAgentInLine(line, allAgents);
        if (lineAgent) currentContextAgent = lineAgent;

        const activeAgent = lineAgent || currentContextAgent;
        if (!activeAgent) return;

        const rowDate = detectedDate || currentContextDate;

        // Remove agent ID, agent name, and date strings from line before extracting numbers
        let cleanedForNums = line
          .replace(new RegExp(activeAgent.id, 'g'), ' ')
          .replace(/\b\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}\b/g, ' ')
          .replace(/\b20\d{2}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/g, ' ')
          .replace(/\d+(?:\.\d+)?\s*%/g, ' '); // ignore conversion % numbers

        const { prods, foundAnyProd } = extractProductAmountsFromLine(cleanedForNums);

        // Extract all numeric tokens
        const numMatches = cleanedForNums.match(/\d[\d,]*(?:\.\d+)?/g) || [];
        const nums = numMatches
          .map(n => parseFloat(n.replace(/,/g, '')))
          .filter(n => !isNaN(n) && n >= 0);

        // If line only had agent name and no numbers, wait for subsequent lines or skip
        if (nums.length === 0 && !foundAnyProd) return;

        const key = `${activeAgent.id}_${rowDate}`;
        const prev = mergedMap.get(key) || {
          userId: String(activeAgent.id),
          userName: activeAgent.name,
          team: activeAgent.team,
          date: rowDate,
          category: 'Sales Report',
          leads: 0,
          orders: 0,
          amount: 0,
          ajwa: 0,
          pinkSalt: 0,
          blackGarlic: 0,
          sunHoney: 0,
          bsHoney: 0,
          gawaGhee: 0
        };

        if (foundAnyProd) {
          Object.keys(prods).forEach(pk => {
            if (prods[pk] > 0) prev[pk] = prods[pk];
          });
        }

        // Heuristic for Sales numbers (Leads, Orders, Amount)
        // Usually Sales Amount is >= 1500, Leads is 20..1500, Orders is 1..300
        const bigAmounts = nums.filter(n => n >= 1500);
        const smallInts = nums.filter(n => n < 1500 && Number.isInteger(n));

        if (bigAmounts.length > 0) {
          prev.amount = Math.max(...bigAmounts);
        }
        if (smallInts.length >= 2) {
          // Larger of the two small integers is typically Leads, smaller is Orders
          const sortedSmall = [...smallInts].sort((a, b) => b - a);
          prev.leads = sortedSmall[0];
          prev.orders = sortedSmall[1];
        } else if (smallInts.length === 1 && !foundAnyProd && prev.orders === 0) {
          prev.orders = smallInts[0];
        }

        // Determine detected category label
        const hasSales = prev.amount > 0 || prev.leads > 0 || prev.orders > 0;
        const hasProds = (prev.ajwa + prev.pinkSalt + prev.blackGarlic + prev.sunHoney + prev.bsHoney + prev.gawaGhee) > 0;
        prev.category = (hasSales && hasProds) ? 'Sales + Product' : (hasProds ? 'Product Report' : 'Sales Report');

        mergedMap.set(key, prev);
      });

      aiDetectedRecords = Array.from(mergedMap.values());

      // If OCR couldn't find structured agent lines, provide 1 editable row so admin is never stuck
      if (aiDetectedRecords.length === 0 && allAgents.length > 0) {
        const firstAg = allAgents[0];
        aiDetectedRecords.push({
          userId: String(firstAg.id),
          userName: firstAg.name,
          team: firstAg.team,
          date: currentContextDate,
          category: 'Sales + Product',
          leads: 0,
          orders: 0,
          amount: 0,
          ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0
        });
      }

      // Check existing database records for duplicate protection
      aiDetectedRecords = aiDetectedRecords.map(rec => {
        const existingRec = existingSales.find(s => String(s.userId) === String(rec.userId) && s.date === rec.date);
        const isDuplicate = Boolean(existingRec);
        return {
          ...rec,
          isDuplicate,
          // New records are checked by default; Duplicate records are UNCHECKED by default to prevent accidental overwrite!
          selected: !isDuplicate
        };
      });

      renderAiDetectedPreviewTable();
    }

    function renderAiDetectedPreviewTable() {
      const resBox = document.getElementById('aiAnalysisResultContainer');
      if (resBox) resBox.classList.remove('hidden');

      const allAgents = getUsersForMonth(selectedMonthKey).filter(u => u.role === 'agent');
      const existingSales = getStored('sales_records', []);

      // Re-verify duplicate status whenever Agent or Date is changed in the preview table
      let dupCount = 0;
      aiDetectedRecords.forEach(r => {
        const agObj = allAgents.find(a => String(a.id) === String(r.userId));
        if (agObj) {
          r.userName = agObj.name;
          r.team = agObj.team;
        }
        r.isDuplicate = existingSales.some(s => String(s.userId) === String(r.userId) && s.date === r.date);
        if (r.isDuplicate) dupCount++;
      });

      const uniqueAgentsCount = new Set(aiDetectedRecords.map(r => r.userId)).size;
      const uniqueDates = Array.from(new Set(aiDetectedRecords.map(r => r.date)));

      const headlineEl = document.getElementById('aiSummaryHeadline');
      const detailsEl = document.getElementById('aiSummaryDetails');
      const dupBanner = document.getElementById('aiDuplicateAlertBanner');

      if (headlineEl) {
        headlineEl.textContent = `AI Detected ${aiDetectedRecords.length} Report Entry(s) across ${uniqueAgentsCount} Agent(s) • Date(s): ${uniqueDates.join(', ')}`;

      if (detailsEl) {
        detailsEl.textContent = `Please review the detected Sales & Product quantities below. Check the rows you approve and click "Approve & Add Selected Data to System".`;

      if (dupBanner) {
        if (dupCount > 0) dupBanner.classList.remove('hidden');
        else dupBanner.classList.add('hidden');

          </td>
          <td class="p-2.5 text-center bg-orange-50/30">
            <input type="number" step="0.01" min="0" value="${r.sunHoney}" oninput="aiDetectedRecords[${idx}].sunHoney=Number(this.value)||0" class="w-14 px-1.5 py-1 bg-white border border-orange-200 rounded-lg text-center font-bold">
          </td>
          <td class="p-2.5 text-center bg-blue-50/30">
            <input type="number" step="0.01" min="0" value="${r.bsHoney}" oninput="aiDetectedRecords[${idx}].bsHoney=Number(this.value)||0" class="w-14 px-1.5 py-1 bg-white border border-blue-200 rounded-lg text-center font-bold">
          </td>
          <td class="p-2.5 text-center bg-emerald-50/30">
            <input type="number" step="0.01" min="0" value="${r.gawaGhee}" oninput="aiDetectedRecords[${idx}].gawaGhee=Number(this.value)||0" class="w-14 px-1.5 py-1 bg-white border border-emerald-200 rounded-lg text-center font-bold">
          </td>
          <td class="p-2.5 text-center">
            <button type="button" onclick="removeAiDetectedRow(${idx})" class="w-7 h-7 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 flex items-center justify-center mx-auto">
              <i class="fa-solid fa-trash-can text-[11px]"></i>
            </button>
          </td>
        </tr>
      `).join('');

      updateAiFooterSummary();
    }

    function onAiRowCheckChange(idx, isChecked) {
      if (!aiDetectedRecords[idx]) return;
      if (aiDetectedRecords[idx].isDuplicate && isChecked) {
        const ok = confirm(`Duplicate Warning: ${aiDetectedRecords[idx].userName} already has a report on ${aiDetectedRecords[idx].date}.\n\nDo you want to approve updating/merging this existing record?`);
        if (!ok) {
          renderAiDetectedPreviewTable();
          return;
        }
      }
      aiDetectedRecords[idx].selected = isChecked;
      updateAiFooterSummary();
    }

    function onAiRowAgentOrDateChange(idx, field, val) {
      if (!aiDetectedRecords[idx]) return;
      aiDetectedRecords[idx][field] = val;
      const existingSales = getStored('sales_records', []);
      const isDup = existingSales.some(s => String(s.userId) === String(aiDetectedRecords[idx].userId) && s.date === aiDetectedRecords[idx].date);
      aiDetectedRecords[idx].isDuplicate = isDup;
      aiDetectedRecords[idx].selected = !isDup;
      renderAiDetectedPreviewTable();
    }

    function toggleAllAiRows(checked) {
      aiDetectedRecords.forEach(r => {
        if (checked && r.isDuplicate) return; // keep duplicates protected unless individually confirmed
        r.selected = checked;
      });
      renderAiDetectedPreviewTable();
    }

    function addManualAiRow() {
      const allAgents = getUsersForMonth(selectedMonthKey).filter(u => u.role === 'agent');
      const firstAg = allAgents[0];
      if (!firstAg) return;
      const d = (reportsDateFilter && reportsDateFilter !== 'ALL') ? reportsDateFilter : getTodayFormatted();
      const existingSales = getStored('sales_records', []);
      const isDup = existingSales.some(s => String(s.userId) === String(firstAg.id) && s.date === d);
      aiDetectedRecords.push({
        userId: String(firstAg.id),
        userName: firstAg.name,
        team: firstAg.team,
        date: d,
        category: 'Sales + Product',
        leads: 0, orders: 0, amount: 0,
        ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0,
        isDuplicate: isDup,
        selected: !isDup
      });
      renderAiDetectedPreviewTable();
    }

    function removeAiDetectedRow(idx) {
      aiDetectedRecords.splice(idx, 1);
      renderAiDetectedPreviewTable();
    }

    function updateAiFooterSummary() {
      const selectedRows = aiDetectedRecords.filter(r => r.selected);
      const infoEl = document.getElementById('aiFooterSelectionInfo');
      if (infoEl) {
        infoEl.innerHTML = `<strong class="text-purple-700">${selectedRows.length} of ${aiDetectedRecords.length}</strong> detected record(s) selected for approval & cloud sync.`;
      }
    }

    async function approveAndSaveAiRecords() {
      if (!isFullAdmin(currentUser)) return;
      const approvedRows = aiDetectedRecords.filter(r => r.selected);
      if (approvedRows.length === 0) {
        alert('Please select at least 1 detected row to approve and save!');
        return;
      }

      const dupApproved = approvedRows.filter(r => r.isDuplicate);
      if (dupApproved.length > 0) {
        const confirmOverwrite = confirm(`Warning: ${dupApproved.length} selected row(s) already exist in the system for the same Agent & Date.\n\nClick OK to confirm updating them with the non-zero values from this import.`);
        if (!confirmOverwrite) return;
      }

      let sales = getStored('sales_records', []);
      const allAgents = getUsersForMonth(selectedMonthKey).filter(u => u.role === 'agent');

      for (const item of approvedRows) {
        const agObj = allAgents.find(a => String(a.id) === String(item.userId));
        if (!agObj) continue;

        const existingIdx = sales.findIndex(s => String(s.userId) === String(agObj.id) && s.date === item.date);
        const oldRec = existingIdx !== -1 ? sales[existingIdx] : null;

        // Smart merge: if updating an existing record and the picture only had Product Report (or only Sales Report),
        // preserve existing non-zero fields unless new non-zero values were provided!
        const finalLeads = Number(item.leads) > 0 ? Number(item.leads) : (oldRec ? Number(oldRec.leads) || 0 : 0);
        const finalOrders = Number(item.orders) > 0 ? Number(item.orders) : (oldRec ? Number(oldRec.orders) || 0 : 0);
        const finalAmount = Number(item.amount) > 0 ? Number(item.amount) : (oldRec ? Number(oldRec.amount) || 0 : 0);

        const entry = {
          userId: String(agObj.id),
          userName: agObj.name,
          team: agObj.team,
          date: item.date,
          leads: finalLeads,
          orders: finalOrders,
          amount: finalAmount,
          ratio: finalLeads > 0 ? Number(((finalOrders / finalLeads) * 100).toFixed(2)) : 0,
          ajwa: Number(item.ajwa) > 0 ? Number(item.ajwa) : (oldRec ? Number(oldRec.ajwa) || 0 : 0),
          pinkSalt: Number(item.pinkSalt) > 0 ? Number(item.pinkSalt) : (oldRec ? Number(oldRec.pinkSalt) || 0 : 0),
          blackGarlic: Number(item.blackGarlic) > 0 ? Number(item.blackGarlic) : (oldRec ? Number(oldRec.blackGarlic) || 0 : 0),
          sunHoney: Number(item.sunHoney) > 0 ? Number(item.sunHoney) : (oldRec ? Number(oldRec.sunHoney) || 0 : 0),
          bsHoney: Number(item.bsHoney) > 0 ? Number(item.bsHoney) : (oldRec ? Number(oldRec.bsHoney) || 0 : 0),
          gawaGhee: Number(item.gawaGhee) > 0 ? Number(item.gawaGhee) : (oldRec ? Number(oldRec.gawaGhee) || 0 : 0)
        };

        if (existingIdx !== -1) sales[existingIdx] = entry;
        else sales.unshift(entry);

        const mKey = item.date.substring(3);
        if (mKey && mKey.length === 7) {
          selectedMonthKey = mKey;
          localStorage.setItem('gb_selected_month', selectedMonthKey);
        }
        reportsDateFilter = item.date;

        const logMeta = recordActivityLog(
          existingIdx !== -1 ? 'AI ERP Updated Report' : 'AI ERP Imported Report',
          `AI ERP Import for ${agObj.name} (${item.date}) — Amt: ৳${entry.amount.toLocaleString()}, Orders: ${entry.orders}`
        );
        await postToSheet('DAILY_SALES_SUBMIT', { ...entry, ...logMeta });
      }

      setStored('sales_records', sales);
      alert(`Successfully approved and added ${approvedRows.length} report record(s) to the Portal & Google Sheet!`);
      closeModal('aiImportModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }


    window.addEventListener('load', init);
  </script>
</body>
</html>
