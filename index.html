    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap');

    const DEFAULT_USERS = [
      { id: '10122', name: 'Md. Nazimur Rahman (TL)', role: 'admin', team: 'Team Nazim', pass: 'admin123' },
      { id: '10107', name: 'Md Abdus Samad (TL)', role: 'admin', team: 'Team Samad', pass: 'admin123' },

      { id: '10289', name: 'Abdullah Dipu', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11044', name: 'Hasibul Islam Eraz', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10741', name: 'Kamruzzaman Shujon', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10803', name: 'Md. Abdullah Mahmud', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11042', name: 'Md. Ashiqur Rahman', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10328', name: 'Sheikh MD Rayhan', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10135', name: 'Ranju Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },

      { id: '10098', name: 'Habibur Rahman Shuvo', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10136', name: 'Al-Amin Kazi', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11007', name: 'Zubayer Al Mahmud', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11101', name: 'Md. Mehedi Amin', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11120', name: 'Abu Sayed', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11130', name: 'Rabbir Hossain Molla', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10806', name: 'Abdullah Al Soad', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10128', name: 'Al-Amin', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 }
    ];

    function getStored(k, d) { const r = localStorage.getItem('gb_' + k); return r ? JSON.parse(r) : d; }
    function setStored(k, v) { localStorage.setItem('gb_' + k, JSON.stringify(v)); }

    if (!localStorage.getItem('gb_users')) {
      setStored('users', DEFAULT_USERS);
    }

    let currentUser = getStored('session_user', null);
    let activeTab = 'dashboard';
    let timerInterval = null;
    let pollInterval = null;
    let webhookUrl = localStorage.getItem('gb_webhook_url') || DEFAULT_WEBHOOK_URL;

    function getTodayFormatted() {
      const d = new Date();
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function cleanDisplayDate(raw) {
      if (!raw) return getTodayFormatted();
      let s = String(raw).trim();
      if (s.includes("GMT") || s.includes("T")) {
        try {
          const d = new Date(s);
          if (!isNaN(d.getTime())) {
            const day = String(d.getDate()).padStart(2, '0');
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${day} ${months[d.getMonth()]} ${d.getFullYear()}`;
          }
        } catch(e) {}
      }
      const p = s.split('/');
      if (p.length === 3) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const mIdx = parseInt(p[1], 10) - 1;
        if (mIdx >= 0 && mIdx < 12) {
          return `${p[0]} ${months[mIdx]} ${p[2]}`;
        }
      }
      return s;
    }

    function dateToInputVal(dateStr) {
      if (!dateStr) return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/');
      if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }

    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-');
      if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }

    function getUserTargetInfo(user) {
      const allUsers = getStored('users', []);
      if (user.role === 'admin') {
        const teamAgents = allUsers.filter(u => u.role === 'agent' && u.team === user.team);
        const monthlyAmount = teamAgents.reduce((sum, a) => sum + (Number(a.monthlyAmountTarget) || 0), 0);
        const monthlyOrders = teamAgents.reduce((sum, a) => sum + (Number(a.monthlyOrdersTarget) || 0), 0);
        return {
          monthlyAmountTarget: monthlyAmount,
          monthlyOrdersTarget: monthlyOrders,
          dailyAmountTarget: Math.round(monthlyAmount / 26),
          dailyOrdersTarget: Math.round(monthlyOrders / 26),
          agentCount: teamAgents.length
        };
      } else {
        const fresh = allUsers.find(u => u.id === user.id) || user;
        const monthlyAmount = Number(fresh.monthlyAmountTarget) || 320000;
        const monthlyOrders = Number(fresh.monthlyOrdersTarget) || 260;
        return {
          monthlyAmountTarget: monthlyAmount,
          monthlyOrdersTarget: monthlyOrders,
          dailyAmountTarget: Math.round(monthlyAmount / 26),
          dailyOrdersTarget: Math.round(monthlyOrders / 26),
          agentCount: 1
        };
      }
    }

    function getFreshUser() {
      if (!currentUser) return null;
      const users = getStored('users', []);
      const match = users.find(u => u.id === currentUser.id);
      if (match) {
        currentUser = { ...currentUser, ...match };
        setStored('session_user', currentUser);
      }
      return currentUser;
    }

    // 100% UNIVERSAL SYNC FOR BOTH ADMIN & AGENTS
    async function postToSheet(action, payload) {
      try {
        const fullData = { action, timestamp: new Date().toISOString(), ...payload };
        const params = new URLSearchParams({
          action: action,
          payload: JSON.stringify(fullData),
          ...payload
        });

        fetch(`${webhookUrl}?${params.toString()}`, {
          method: 'GET',
          mode: 'no-cors'
        }).catch(() => {});

        new Image().src = `${webhookUrl}?${params.toString()}&_cb=${Date.now()}`;
      } catch (e) {
        console.warn('Sync warning:', e);
      }
    }

    function fetchFromSheet() {
      const callbackName = 'gb_cb_' + Date.now();
      window[callbackName] = function(res) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') {
          handleCloudDataReceived(res);
        }
      };

      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${callbackName}&t=${Date.now()}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}`)
          .then(r => r.json())
          .then(res => {
            if (res && res.status === 'success') handleCloudDataReceived(res);
          })
          .catch(() => {});
      };
      document.body.appendChild(script);
    }

    function handleCloudDataReceived(res) {
      let hasChanges = false;
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          hasChanges = true;
        }
      }

      if (hasChanges && currentUser) {
        getFreshUser();
        render();
      }
    }

    function startBackgroundSync() {
      if (pollInterval) clearInterval(pollInterval);
      fetchFromSheet();
      pollInterval = setInterval(fetchFromSheet, 3000);
    }

    function init() {
      getFreshUser();
      render();
      if (currentUser && currentUser.role === 'agent') startShiftTimer();
      startBackgroundSync();
    }

    function render() {
      const app = document.getElementById('app');
      if (!currentUser) {
        app.innerHTML = renderLogin();
      } else {
        getFreshUser();
        app.innerHTML = renderAppLayout();
        attachCharts();
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-orange-50/30 to-blue-50/40">
          <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-8">
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-500 text-white shadow-lg shadow-orange-500/30 mb-4">
                <i class="fa-solid fa-basket-shopping text-3xl"></i>
              </div>
              <h1 class="text-2xl font-black tracking-tight text-slate-900">Ghorerbazar</h1>
              <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest">Sign In to SalesTrack</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">User ID (Emp ID)</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-regular fa-id-badge text-lg"></i>
                  </span>
                  <input type="text" id="loginId" required placeholder="e.g. 10122 or 10191" 
                    class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all">
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-lock text-base"></i>
                  </span>
                  <input type="password" id="loginPass" required placeholder="••••••••" 
                    class="w-full pl-11 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all">
                  <button type="button" onclick="togglePassVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600">
                    <i id="passIcon" class="fa-regular fa-eye"></i>
                  </button>
                </div>
              </div>
              <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200 font-semibold text-center"></div>
              <button type="submit" 
                class="w-full py-3.5 px-4 bg-orange-500 hover:bg-orange-600 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function togglePassVisibility() {
      const i = document.getElementById('loginPass');
      const ic = document.getElementById('passIcon');
      if (i.type === 'password') { i.type = 'text'; ic.className = 'fa-regular fa-eye-slash'; }
      else { i.type = 'password'; ic.className = 'fa-regular fa-eye'; }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const errBox = document.getElementById('loginError');

      const users = getStored('users', []);
      const user = users.find(u => u.id === id && u.pass === pass);

      if (!user) {
        errBox.textContent = 'ভুল User ID অথবা Password!';
        errBox.classList.remove('hidden');
        return;
      }

      currentUser = user;
      setStored('session_user', user);

      if (user.role === 'agent') {
        const attendance = getStored('attendance', []);
        const todayStr = getTodayFormatted();
        let session = attendance.find(a => a.userId === user.id && a.date === todayStr);
        if (!session) {
          session = {
            userId: user.id,
            userName: user.name,
            team: user.team,
            date: todayStr,
            loginTime: new Date().toLocaleTimeString(),
            activeSeconds: 0,
            breakSeconds: 0,
            isOnBreak: false
          };
          attendance.push(session);
          setStored('attendance', attendance);
          postToSheet('AGENT_LOGIN', session);
        }
      }

      render();
      if (currentUser.role === 'agent') startShiftTimer();
      startBackgroundSync();
    }

    function handleLogout() {
      if (timerInterval) clearInterval(timerInterval);
      if (pollInterval) clearInterval(pollInterval);
      if (currentUser && currentUser.role === 'agent') {
        postToSheet('AGENT_LOGOUT', { userId: currentUser.id, name: currentUser.name, time: new Date().toLocaleTimeString() });
      }
      currentUser = null;
      localStorage.removeItem('gb_session_user');
      activeTab = 'dashboard';
      render();
    }

    function startShiftTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const attendance = getStored('attendance', []);
        const todayStr = getTodayFormatted();
        const session = attendance.find(a => a.userId === currentUser.id && a.date === todayStr);
        if (session) {
          if (session.isOnBreak) session.breakSeconds = (session.breakSeconds || 0) + 1;
          else session.activeSeconds = (session.activeSeconds || 0) + 1;
          setStored('attendance', attendance);
          
          const shiftEl = document.getElementById('timer-working-clock');
          if (shiftEl) shiftEl.textContent = formatTime(session.activeSeconds);
        }
      }, 1000);
    }

    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function toggleBreak() {
      const attendance = getStored('attendance', []);
      const todayStr = getTodayFormatted();
      const session = attendance.find(a => a.userId === currentUser.id && a.date === todayStr);
      if (session) {
        session.isOnBreak = !session.isOnBreak;
        setStored('attendance', attendance);
        postToSheet('BREAK_TOGGLE', { userId: currentUser.id, isOnBreak: session.isOnBreak, time: new Date().toLocaleTimeString() });
        render();
      }
    }

    function setTab(tab) {
      activeTab = tab;
      render();
    }

                </button>

                  <i class="fa-regular fa-clock text-sm"></i> Attendance & Live
                </button>
                <button onclick="setTab('performance')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'performance' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-chart-pie text-sm"></i> Performance
                </button>
                <button onclick="setTab('daily_reports')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'daily_reports' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-file-invoice text-sm"></i> Daily Reports
                </button>
                <button onclick="setTab('target')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'target' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-bullseye text-sm"></i> Target Setup

                <button onclick="setTab('ranking')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'ranking' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-trophy text-sm"></i> Ranking & Teams
                </button>
                ${u.role === 'admin' ? `

                  <i class="fa-solid fa-gear text-sm"></i> Settings & Cloud Sync
                </button>
                ` : ''}
              </nav>
            </div>

            <div class="space-y-4">
              <div class="p-4 rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 text-center relative overflow-hidden">

          <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">

              </div>

                    ${u.name.charAt(0)}

                  <div class="text-left">
                    <p class="text-xs font-bold text-slate-800 leading-none">${u.name}</p>
                    <span class="text-[10px] font-semibold text-slate-400 uppercase">${u.role === 'admin' ? 'Admin (TL)' : 'Agent'}</span>
                  </div>

              </div>
            </header>

            <main class="p-8 flex-1">
              ${renderTabContent()}
            </main>
          </div>
        </div>

        <!-- Submit / Edit / DELETE Daily Report Modal -->
        <div id="submitModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">

                <div>
                  <h3 id="modalTitle" class="text-sm font-extrabold text-slate-900">Daily Sales Report</h3>
                  <p class="text-[11px] text-slate-400">প্রতি দিনের ১টি রিপোর্ট (এডিট বা ডিলিট করা যাবে)</p>
                </div>
              </div>
              <button onclick="closeModal('submitModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="eodReportForm" onsubmit="handleSalesSubmit(event)" class="space-y-3.5">
              <div id="agentSelectContainer" class="${u.role === 'admin' ? '' : 'hidden'}">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Select Agent</label>
                <select id="subAgentId" onchange="onReportTargetChanged()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
                  ${getStored('users', []).filter(usr => usr.role === 'agent').map(usr => `
                    <option value="${usr.id}">${usr.name} (ID: ${usr.id} • ${usr.team})</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Report Date (তারিখ নির্বাচন)</label>
                <input type="date" id="subDate" required onchange="onReportTargetChanged()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
                <p id="existingNotice" class="text-[10px] font-bold text-amber-600 mt-1 hidden">
                  <i class="fa-solid fa-circle-exclamation mr-1"></i> এই তারিখে ইতিমধ্যে রিপোর্ট রয়েছে। আপনি এটি এডিট বা ডিলিট করতে পারবেন।
                </p>
              </div>

              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Total Leads</label>
                  <input type="number" id="subLeads" required min="1" placeholder="50" oninput="calculatePreviewRatio()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Total Orders</label>
                  <input type="number" id="subOrders" required min="0" placeholder="10" oninput="calculatePreviewRatio()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Amount (৳)</label>
                  <input type="number" id="subAmount" required min="0" placeholder="25000" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-100">
                <div>
                  <p class="text-[10px] font-bold text-slate-400 uppercase">Daily Goal Achieved</p>
                  <p id="prevAchieve" class="text-base font-black text-amber-500 mt-0.5">0%</p>
                </div>
                <div>
                  <p class="text-[10px] font-bold text-slate-400 uppercase">Conversion Ratio</p>
                  <p id="prevRatio" class="text-base font-black text-blue-600 mt-0.5">0.00%</p>
                </div>
              </div>

              <div class="flex items-center justify-between pt-2">
                <div>
                  <button type="button" id="deleteReportBtn" onclick="handleDeleteCurrentReport()" class="hidden px-4 py-2 rounded-xl text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 transition-colors flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i> <span>Delete Report</span>
                  </button>
                </div>

                <div class="flex items-center gap-2">
                  <button type="button" onclick="closeModal('submitModal')" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100">Cancel</button>
                  <button type="submit" id="submitBtnText" class="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md shadow-blue-600/20 flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> <span>Submit Report</span>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>

        <!-- Set Target Modal (Admin) -->
        <div id="targetModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-base font-extrabold text-slate-900">Set Agent Monthly Target</h3>
              <button onclick="closeModal('targetModal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleSaveTarget(event)" class="space-y-4">
              <input type="hidden" id="tgtAgentId">
              <div>
                <p id="tgtAgentName" class="text-xs font-bold text-blue-600 mb-2"></p>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Monthly Orders Target</label>
                <input type="number" id="tgtMonthlyOrders" required min="1" oninput="calculateDailyBreakdown()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold">
              </div>
              <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Monthly Sales Amount (BDT)</label>
                <input type="number" id="tgtMonthlyAmount" required min="1" oninput="calculateDailyBreakdown()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold">
              </div>
              <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md">
                Save & Update Target
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function openReportModal(targetAgentId, targetDateStr) {
      const u = getFreshUser();
      const dateInput = document.getElementById('subDate');
      dateInput.value = dateToInputVal(targetDateStr || getTodayFormatted());

      if (u.role === 'admin') {
        const select = document.getElementById('subAgentId');
        if (targetAgentId) select.value = targetAgentId;
      }

      onReportTargetChanged();
      openModal('submitModal');
    }

    function onReportTargetChanged() {
      const u = getFreshUser();
      const allSales = getStored('sales_records', []);

      let agentId = u.id;
      if (u.role === 'admin') {
        agentId = document.getElementById('subAgentId').value;
      }

      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      const existing = allSales.find(s => s.userId === agentId && s.date === dateStr);

      const notice = document.getElementById('existingNotice');
      const btnText = document.querySelector('#submitBtnText span');
      const delBtn = document.getElementById('deleteReportBtn');

      if (existing) {
        document.getElementById('subLeads').value = existing.leads;
        document.getElementById('subOrders').value = existing.orders;
        document.getElementById('subAmount').value = existing.amount;
        notice.classList.remove('hidden');
        delBtn.classList.remove('hidden');
        btnText.textContent = `Update Report (${dateStr})`;
      } else {
        document.getElementById('subLeads').value = '';
        document.getElementById('subOrders').value = '';
        document.getElementById('subAmount').value = '';
        notice.classList.add('hidden');
        delBtn.classList.add('hidden');
        btnText.textContent = 'Submit Report';
      }
      calculatePreviewRatio();
    }

    function calculatePreviewRatio() {
      const u = getFreshUser();
      const allUsers = getStored('users', []);
      let targetUser = u;
      if (u.role === 'admin') {
        const selId = document.getElementById('subAgentId')?.value;
        targetUser = allUsers.find(usr => usr.id === selId) || u;
      }

      const t = getUserTargetInfo(targetUser);
      const l = Number(document.getElementById('subLeads').value) || 0;
      const o = Number(document.getElementById('subOrders').value) || 0;
      const ratio = l > 0 ? ((o / l) * 100).toFixed(2) : '0.00';
      document.getElementById('prevRatio').textContent = ratio + '%';

      const dOrdersTarget = t.dailyOrdersTarget;
      const achieve = dOrdersTarget > 0 ? Math.round((o / dOrdersTarget) * 100) : 0;
      document.getElementById('prevAchieve').textContent = achieve + '%';
    }

    async function handleSalesSubmit(e) {
      e.preventDefault();
      const u = getFreshUser();
      const allUsers = getStored('users', []);

      let agent = u;
      if (u.role === 'admin') {
        const selId = document.getElementById('subAgentId').value;
        agent = allUsers.find(usr => usr.id === selId) || u;
      }

      const t = getUserTargetInfo(agent);
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      const leads = Number(document.getElementById('subLeads').value) || 0;
      const orders = Number(document.getElementById('subOrders').value) || 0;
      const amount = Number(document.getElementById('subAmount').value) || 0;
      const ratio = leads > 0 ? ((orders / leads) * 100).toFixed(2) : 0;
      const dOrdersTarget = t.dailyOrdersTarget;
      const achieve = dOrdersTarget > 0 ? Math.round((orders / dOrdersTarget) * 100) : 0;

      let sales = getStored('sales_records', []);
      const existingIdx = sales.findIndex(s => s.userId === agent.id && s.date === dateStr);

      const entry = {
        id: existingIdx !== -1 ? sales[existingIdx].id : 'rec_' + agent.id + '_' + Date.now(),
        userId: agent.id,
        userName: agent.name,
        team: agent.team,
        date: dateStr,
        time: new Date().toLocaleTimeString(),
        leads,
        orders,
        amount,
        ratio: Number(ratio),
        achievement: achieve
      };

      if (existingIdx !== -1) sales[existingIdx] = entry;
      else sales.unshift(entry);

      setStored('sales_records', sales);
      render();

      await postToSheet('DAILY_SALES_SUBMIT', entry);
      alert(`ধন্যবাদ! ${agent.name}-এর ${dateStr} তারিখের রিপোর্ট সফলভাবে ক্লাউডে সেভ হয়েছে।`);
      closeModal('submitModal');
      setTimeout(fetchFromSheet, 1500);
    }

    async function handleDeleteCurrentReport(userIdParam, dateParam) {
      const u = getFreshUser();
      let agentId = userIdParam || u.id;
      if (!userIdParam && u.role === 'admin') {
        agentId = document.getElementById('subAgentId').value;
      }
      const dateStr = dateParam || inputValToDateStr(document.getElementById('subDate').value);

      if (!confirm(`আপনি কি নিশ্চিতভাবে এই রিপোর্টটি (${dateStr}) মুছে ফেলতে চান? এটি গুগল শিট থেকেও মুছে যাবে।`)) {
        return;
      }

      let sales = getStored('sales_records', []);
      sales = sales.filter(s => !(s.userId === agentId && s.date === dateStr));
      setStored('sales_records', sales);
      render();

      await postToSheet('DELETE_SALES_RECORD', { userId: agentId, date: dateStr });
      alert('রিপোর্টটি সফলভাবে ডিলিট করা হয়েছে!');
      closeModal('submitModal');
      setTimeout(fetchFromSheet, 1500);
    }

    function renderTabContent() {
      switch(activeTab) {
        case 'dashboard': return renderDashboardView();
        case 'attendance': return renderAttendanceView();
        case 'performance': return renderPerformanceView();
        case 'daily_reports': return renderDailyReportsView();
        case 'target': return renderTargetSetupView();
        case 'ranking': return renderRankingView();
        case 'settings': return renderSettingsView();
        default: return renderDashboardView();
      }
    }

    function renderDashboardView() {
      const u = getFreshUser();
      const t = getUserTargetInfo(u);
      const sales = getStored('sales_records', []);
      const todayStr = getTodayFormatted();
      const attendance = getStored('attendance', []);
      const todaySession = attendance.find(a => a.userId === u.id && a.date === todayStr) || { activeSeconds: 0, breakSeconds: 0, isOnBreak: false };

      const mySales = u.role === 'admin' 
        ? sales.filter(s => s.team === u.team) 
        : sales.filter(s => s.userId === u.id);

      const totalLeads = mySales.reduce((a, c) => a + c.leads, 0);
      const totalOrders = mySales.reduce((a, c) => a + c.orders, 0);
      const totalAmount = mySales.reduce((a, c) => a + c.amount, 0);
      const avgConversionRatio = totalLeads > 0 ? ((totalOrders / totalLeads) * 100).toFixed(2) : '0.00';

      const targetAmount = t.monthlyAmountTarget;
      const targetOrders = t.monthlyOrdersTarget;
      const dailyOrdersTarget = t.dailyOrdersTarget;
      const dailyAmountTarget = t.dailyAmountTarget;
      const achievePct = targetAmount > 0 ? Math.min(100, Math.round((totalAmount / targetAmount) * 100)) : 0;

      return `
        <div class="space-y-6">
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-2xl font-black text-slate-900 leading-tight">Welcome, ${u.name}! 👋</h2>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${u.role === 'admin' ? 'bg-orange-100 text-orange-800' : 'bg-blue-100 text-blue-800'}">
                  ${u.team} (${u.role === 'admin' ? `Team Leader • ${t.agentCount} Agents Total Sum` : 'Sales Agent'})
                </span>
              </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3">
              ${u.role === 'agent' ? `
              <button onclick="openReportModal()" class="px-5 py-3 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-600/20 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-plus text-sm"></i> Submit Daily Report
              </button>
              ` : `
              <button onclick="openReportModal()" class="px-5 py-3 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-lg shadow-emerald-600/20 flex items-center gap-2 transition-all">
                <i class="fa-solid fa-file-circle-plus text-sm"></i> Add / Edit Agent Report
              </button>
              `}
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="highlight-card-blue p-5 rounded-2xl relative overflow-hidden flex flex-col justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-blue-100">Total Leads</span>
              <p class="text-3xl font-black tracking-tight text-white mt-4">${totalLeads}</p>
            </div>
            <div class="highlight-card-emerald p-5 rounded-2xl relative overflow-hidden flex flex-col justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-emerald-100">Total Orders</span>
              <p class="text-3xl font-black tracking-tight text-white mt-4">${totalOrders} / ${targetOrders}</p>
            </div>
            <div class="highlight-card-purple p-5 rounded-2xl relative overflow-hidden flex flex-col justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-purple-100">Total Sales Amount</span>
              <p class="text-2xl font-black tracking-tight text-white mt-4">৳${totalAmount.toLocaleString()}</p>
            </div>
            <div class="highlight-card-indigo p-5 rounded-2xl relative overflow-hidden flex flex-col justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-100">Monthly Target (৳)</span>
              <p class="text-2xl font-black tracking-tight text-white mt-4">৳${targetAmount.toLocaleString()}</p>
            </div>
            <div class="highlight-card-amber p-5 rounded-2xl relative overflow-hidden flex flex-col justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-amber-100">Target Achievement</span>
              <p class="text-3xl font-black tracking-tight text-white mt-4">${achievePct}%</p>
            </div>
          </div>

          <div class="card-neo p-6">
            <h3 class="text-sm font-extrabold text-slate-900 mb-4">Sales Performance Trend</h3>
            <div class="h-60 w-full"><canvas id="salesTrendChart"></canvas></div>
          </div>
        </div>
      `;
    }

    function renderAttendanceView() {
      return `<div class="card-neo p-6"><h2 class="text-lg font-black">Attendance View</h2></div>`;
    }
    function renderPerformanceView() {
      return `<div class="card-neo p-6"><h2 class="text-lg font-black">Performance View</h2></div>`;
    }
    function renderDailyReportsView() {
      const sales = getStored('sales_records', []);
      return `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-black text-slate-900">Agent Daily Reports Log</h2>
            <button onclick="openReportModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">New / Edit Report</button>
          </div>
          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b border-slate-100 uppercase text-slate-400 font-bold">
                <tr>
                  <th class="p-4">Report Date</th><th class="p-4">Agent Name</th><th class="p-4">Team</th><th class="p-4">Leads</th><th class="p-4">Orders</th><th class="p-4">Amount (BDT)</th><th class="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 font-medium">
                ${sales.length === 0 ? '<tr><td colspan="7" class="p-8 text-center text-slate-400">কোন সেলস এন্ট্রি পাওয়া যায়নি।</td></tr>' : ''}
                ${sales.map(s => `
                  <tr>
                    <td class="p-4">${cleanDisplayDate(s.date)}</td>
                    <td class="p-4 font-bold">${s.userName} (${s.userId})</td>
                    <td class="p-4">${s.team}</td>
                    <td class="p-4">${s.leads}</td>
                    <td class="p-4 font-bold text-blue-600">${s.orders}</td>
                    <td class="p-4 font-bold text-emerald-600">৳${s.amount.toLocaleString()}</td>
                    <td class="p-4 text-right">
                      <button onclick="openReportModal('${s.userId}', '${s.date}')" class="px-3 py-1 bg-slate-100 text-slate-600 rounded font-bold">Edit</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
    function renderTargetSetupView() { return `<div class="card-neo p-6"><h2 class="text-lg font-black">Target Setup</h2></div>`; }
    function renderRankingView() { return `<div class="card-neo p-6"><h2 class="text-lg font-black">Rankings</h2></div>`; }
    function renderSettingsView() {
      return `
        <div class="max-w-xl card-neo p-6 space-y-5">
          <h2 class="text-lg font-black text-slate-900">Cloud Sync Settings</h2>
          <input type="url" id="settingsWebhook" value="${webhookUrl}" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold">
          <button onclick="saveSettingsWebhook()" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold">Save & Connect</button>
        </div>
      `;
    }
    function saveSettingsWebhook() {
      webhookUrl = document.getElementById('settingsWebhook').value.trim() || DEFAULT_WEBHOOK_URL;
      localStorage.setItem('gb_webhook_url', webhookUrl);
      alert('Updated!'); fetchFromSheet();
    }
    function attachCharts() {
      const ctx = document.getElementById('salesTrendChart');
      if (ctx) {
        new Chart(ctx, {
          type: 'bar',
          data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], datasets: [{ data: [10, 20, 30, 25, 40, 50, 35], backgroundColor: '#2563eb' }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
      }
    }
    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }
    window.addEventListener('load', init);
  </script>
</body>
