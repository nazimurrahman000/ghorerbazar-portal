    function getTodayFormatted() {
      const d = new Date(); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;

    function dateToInputVal(dateStr) {
      if (!dateStr) return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/'); if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }
    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }
    function cleanDisplayDate(raw) {
      if (!raw) return getTodayFormatted();
      let s = String(raw).trim();
      const p = s.split('/');
      if (p.length === 3) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const mIdx = parseInt(p[1], 10) - 1;
        if (mIdx >= 0 && mIdx < 12) return `${p[0]} ${months[mIdx]} ${p[2]}`;
      }
      return s;
    }

    // Sprint, Monthly & Daily Target Logic (+5% Extra Return Buffer & 26 Working Days)
    function getTargetData(user) {
      const allUsers = getStored('users', []);
      let baseTarget = 0;
      let agentCount = 1;
      
      if (user.role === 'admin') {
        const teamAgents = allUsers.filter(u => u.role === 'agent' && u.team === user.team);
        baseTarget = teamAgents.reduce((sum, a) => sum + (a.baseTarget || 0), 0);
        agentCount = teamAgents.length || 1;
      } else {
        const freshUser = allUsers.find(u => u.id === user.id) || user;
        baseTarget = freshUser.baseTarget || 0;
      }

      const workingTarget = Math.round(baseTarget * 1.05); // +5% Extra for Return/Cancel
      const dailyTarget = Math.round(workingTarget / 26);  // 26 Working days daily target

      const d = new Date().getDate();
      let sprintName, sprintGoal, sprintPct;

      if (d <= 10) { sprintName = 'Sprint 1 (Days 1–10)'; sprintPct = 0.40; sprintGoal = Math.round(workingTarget * 0.40); }
      else if (d <= 20) { sprintName = 'Sprint 2 (Days 11–20)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }
      else { sprintName = 'Sprint 3 (Days 21–31)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }

      return { baseTarget, workingTarget, dailyTarget, sprintName, sprintGoal, sprintPct, agentCount };
    }

    // TRIPLE-REDUNDANCY SYNC
    async function postToSheet(action, payload) {
      const fullData = { action, timestamp: new Date().toISOString(), ...payload };
      const params = new URLSearchParams({ action, payload: JSON.stringify(fullData), ...payload });

      fetch(`${webhookUrl}?${params.toString()}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
      new Image().src = `${webhookUrl}?${params.toString()}&_cb=${Date.now()}`;

      try {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = webhookUrl;
        form.target = 'hidden_iframe_target';
        form.style.display = 'none';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.value = JSON.stringify(fullData);
        form.appendChild(input);

        let iframe = document.getElementById('hidden_iframe_target');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.name = 'hidden_iframe_target';
          iframe.id = 'hidden_iframe_target';
          iframe.style.display = 'none';
          document.body.appendChild(iframe);
        }

        document.body.appendChild(form);
        form.submit();
        setTimeout(() => { if (form.parentNode) form.parentNode.removeChild(form); }, 2000);
      } catch (e) {}
    }

    function fetchFromSheet() {
      const cbName = 'gb_cb_' + Date.now();
      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') handleCloudData(res);
      };
      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${cbName}&t=${Date.now()}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}`)
          .then(r => r.json())
          .then(res => { if (res && res.status === 'success') handleCloudData(res); })
          .catch(() => {});
      };
      document.body.appendChild(script);
    }

    function handleCloudData(res) {
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          if (currentUser) renderAppLayout();
        }
      }
    }

    function updateLiveRatio() {
      const u = currentUser;
      const allUsers = getStored('users', []);
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId')?.value : u.id;
      const targetAgent = allUsers.find(usr => String(usr.id) === String(agentId)) || u;

      const workingTarget = Math.round((targetAgent.baseTarget || 1232174) * 1.05);
      const dailyTarget = Math.round(workingTarget / 26);

      const leads = Number(document.getElementById('subLeads')?.value) || 0;
      const orders = Number(document.getElementById('subOrders')?.value) || 0;
      const amount = Number(document.getElementById('subAmount')?.value) || 0;

      const conv = leads > 0 ? ((orders / leads) * 100).toFixed(2) : '0.00';
      const ach = dailyTarget > 0 ? Math.round((amount / dailyTarget) * 100) : 0;

      document.getElementById('liveConvRatio').textContent = conv + '%';
      document.getElementById('liveDailyTarget').textContent = '৳' + dailyTarget.toLocaleString();
      document.getElementById('liveDailyAch').textContent = ach + '%';
    }

    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

    function openReportModal(agentId, dateStr) {
      document.getElementById('subDate').value = dateToInputVal(dateStr || getTodayFormatted());
      if (currentUser.role === 'admin' && agentId) {
        document.getElementById('subAgentId').value = agentId;
      }
      onModalChange();
      openModal('submitModal');
    }

    function onModalChange() {
      const u = currentUser;
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      
      const sales = getStored('sales_records', []);
      const existing = sales.find(s => String(s.userId) === String(agentId) && s.date === dateStr);
      
      if (existing) {
        document.getElementById('subLeads').value = existing.leads || 0;
        document.getElementById('subOrders').value = existing.orders || 0;
        document.getElementById('subAmount').value = existing.amount || 0;
        document.getElementById('subAjwa').value = existing.ajwa || '';
        document.getElementById('subPinkSalt').value = existing.pinkSalt || '';
        document.getElementById('subBlackGarlic').value = existing.blackGarlic || '';
        document.getElementById('subSunHoney').value = existing.sunHoney || '';
        document.getElementById('subBSHoney').value = existing.bsHoney || '';
        document.getElementById('subGawaGhee').value = existing.gawaGhee || '';
        document.getElementById('deleteReportBtn').classList.remove('hidden');
      } else {
        ['subLeads','subOrders','subAmount','subAjwa','subPinkSalt','subBlackGarlic','subSunHoney','subBSHoney','subGawaGhee'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('deleteReportBtn').classList.add('hidden');
      }
      updateLiveRatio();
    }

    async function handleSalesSubmit(e) {
      e.preventDefault();
      const u = currentUser;
      const allUsers = getStored('users', []);
      const targetAgent = u.role === 'admin' ? allUsers.find(usr => usr.id === document.getElementById('subAgentId').value) : u;

      const leads = Number(document.getElementById('subLeads').value) || 0;
      const orders = Number(document.getElementById('subOrders').value) || 0;
      const amount = Number(document.getElementById('subAmount').value) || 0;

      const entry = {
        userId: String(targetAgent.id),
        userName: targetAgent.name,
        team: targetAgent.team,
        date: inputValToDateStr(document.getElementById('subDate').value),
        leads: leads,
        orders: orders,
        amount: amount,
        ratio: leads > 0 ? Number(((orders / leads) * 100).toFixed(2)) : 0,
        ajwa: Number(document.getElementById('subAjwa').value) || 0,
        pinkSalt: Number(document.getElementById('subPinkSalt').value) || 0,
        blackGarlic: Number(document.getElementById('subBlackGarlic').value) || 0,
        sunHoney: Number(document.getElementById('subSunHoney').value) || 0,
        bsHoney: Number(document.getElementById('subBSHoney').value) || 0,
        gawaGhee: Number(document.getElementById('subGawaGhee').value) || 0
      };

      let sales = getStored('sales_records', []);
      const idx = sales.findIndex(s => String(s.userId) === String(entry.userId) && s.date === entry.date);
      if (idx !== -1) sales[idx] = entry; else sales.unshift(entry);
      setStored('sales_records', sales);

      await postToSheet('DAILY_SALES_SUBMIT', entry);
      
      alert(`সফলভাবে সেভ ও সিঙ্ক হয়েছে!`);
      closeModal('submitModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }

    async function handleDelete() {
      const u = currentUser;
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);

      if (!confirm(`আপনি কি নিশ্চিতভাবে ${dateStr} তারিখের এই রিপোর্টটি ডিলিট করতে চান?`)) return;
      
      let sales = getStored('sales_records', []);
      sales = sales.filter(s => !(String(s.userId) === String(agentId) && s.date === dateStr));
      setStored('sales_records', sales);

      await postToSheet('DELETE_SALES_RECORD', { userId: String(agentId), date: dateStr });
      
      alert('রিপোর্ট সফলভাবে ডিলিট হয়েছে!');
      closeModal('submitModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
