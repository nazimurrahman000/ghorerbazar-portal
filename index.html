<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghorerbazar - SalesTrack Pro Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
    .glass-sidebar { background: #ffffff; border-right: 1px solid #e2e8f0; }
    .card-neo { background: #ffffff; border-radius: 20px; border: 1px solid #eef2f8; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); }
    .tab-active { background: #2563eb; color: #ffffff !important; box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.5); }
    
    .highlight-card-blue {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.35);
    }
    .highlight-card-emerald {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(5, 150, 105, 0.35);
    }
    .highlight-card-purple {
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(124, 58, 237, 0.35);
    }
    .highlight-card-amber {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(234, 88, 12, 0.35);
    }
    .highlight-card-indigo {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(79, 70, 229, 0.35);
    }
    .highlight-card-rose {
      background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
      color: #ffffff;
      box-shadow: 0 12px 28px -6px rgba(225, 29, 72, 0.35);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const DEFAULT_USERS = [
      // Admins (TL) - Team Targets will dynamically calculate as sum of their agents
      { id: '10122', name: 'Md. Nazimur Rahman (TL)', role: 'admin', team: 'Team Nazim', pass: 'admin123' },
      { id: '10107', name: 'Md Abdus Samad (TL)', role: 'admin', team: 'Team Samad', pass: 'admin123' },
      
      // Team Nazim Agents
      { id: '10191', name: 'Shagor Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 650, monthlyAmountTarget: 1300000 },
      { id: '10289', name: 'Abdullah Dipu', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11044', name: 'Hasibul Islam Eraz', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10741', name: 'Kamruzzaman Shujon', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10803', name: 'Md. Abdullah Mahmud', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11042', name: 'Md. Ashiqur Rahman', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10328', name: 'Sheikh MD Rayhan', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10135', name: 'Ranju Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },

      // Team Samad Agents
      { id: '10098', name: 'Habibur Rahman Shuvo', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10136', name: 'Al-Amin Kazi', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11007', name: 'Zubayer Al Mahmud', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11101', name: 'Md. Mehedi Amin', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11120', name: 'Abu Sayed', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11130', name: 'Rabbir Hossain Molla', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10806', name: 'Abdullah Al Soad', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10128', name: 'Al-Amin', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 }
    ];

    function getStored(k, d) { const r = localStorage.getItem('gb_' + k); return r ? JSON.parse(r) : d; }
    function setStored(k, v) { localStorage.setItem('gb_' + k, JSON.stringify(v)); }

    if (!localStorage.getItem('gb_users')) {
      setStored('users', DEFAULT_USERS);
    } else {
      let u = getStored('users', []);
      u = u.map(usr => {
        if (usr.role === 'agent') {
          if (!usr.monthlyOrdersTarget) usr.monthlyOrdersTarget = 260;
          if (!usr.monthlyAmountTarget) usr.monthlyAmountTarget = 320000;
        }
        if ((usr.id === '10122' || usr.id === '10107') && usr.pass === '123456') usr.pass = 'admin123';
        return usr;
      });
      setStored('users', u);
    }

    let currentUser = getStored('session_user', null);
    let activeTab = 'dashboard';
    let timerInterval = null;
    let webhookUrl = localStorage.getItem('gb_webhook_url') || '';

    // Calculate Dynamic Target: If Admin (TL), sum of their team agents; if Agent, their personal target
    function getUserTargetInfo(user) {
      const allUsers = getStored('users', []);
      if (user.role === 'admin') {
        const teamAgents = allUsers.filter(u => u.role === 'agent' && u.team === user.team);
        const monthlyAmount = teamAgents.reduce((sum, a) => sum + (Number(a.monthlyAmountTarget) || 0), 0);
        const monthlyOrders = teamAgents.reduce((sum, a) => sum + (Number(a.monthlyOrdersTarget) || 0), 0);
        return {
          monthlyAmountTarget: monthlyAmount,
          monthlyOrdersTarget: monthlyOrders,
          dailyAmountTarget: Math.round(monthlyAmount / 26),
          dailyOrdersTarget: Math.round(monthlyOrders / 26),
          agentCount: teamAgents.length
        };
      } else {
        const fresh = allUsers.find(u => u.id === user.id) || user;
        const monthlyAmount = Number(fresh.monthlyAmountTarget) || 320000;
        const monthlyOrders = Number(fresh.monthlyOrdersTarget) || 260;
        return {
          monthlyAmountTarget: monthlyAmount,
          monthlyOrdersTarget: monthlyOrders,
          dailyAmountTarget: Math.round(monthlyAmount / 26),
          dailyOrdersTarget: Math.round(monthlyOrders / 26),
          agentCount: 1
        };
      }
    }

    function getFreshUser() {
      if (!currentUser) return null;
      const users = getStored('users', []);
      const match = users.find(u => u.id === currentUser.id);
      if (match) {
        currentUser = { ...currentUser, ...match };
        setStored('session_user', currentUser);
        return currentUser;
      }
      return currentUser;
    }

    async function syncToGoogleSheet(action, payload) {
      if (!webhookUrl) return;
      try {
        await fetch(webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, timestamp: new Date().toISOString(), ...payload })
        });
      } catch (err) {
        console.warn('Sheet sync error:', err);
      }
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'gb_users' || e.key === 'gb_sales_records' || e.key === 'gb_attendance') {
        getFreshUser();
        render();
      }
    });

    function init() {
      getFreshUser();
      render();
      if (currentUser && currentUser.role === 'agent') startShiftTimer();
    }

    function render() {
      const app = document.getElementById('app');
      if (!currentUser) {
        app.innerHTML = renderLogin();
      } else {
        getFreshUser();
        app.innerHTML = renderAppLayout();
        attachCharts();
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-orange-50/30 to-blue-50/40">
          <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-8">
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-500 text-white shadow-lg shadow-orange-500/30 mb-4">
                <i class="fa-solid fa-basket-shopping text-3xl"></i>
              </div>
              <h1 class="text-2xl font-black tracking-tight text-slate-900">Ghorerbazar</h1>
              <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest">Sign In to SalesTrack</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">User ID (Emp ID)</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-regular fa-id-badge text-lg"></i>
                  </span>
                  <input type="text" id="loginId" required placeholder="e.g. 10122 or 10191" 
                    class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all">
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-lock text-base"></i>
                  </span>
                  <input type="password" id="loginPass" required placeholder="••••••••" 
                    class="w-full pl-11 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all">
                  <button type="button" onclick="togglePassVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600">
                    <i id="passIcon" class="fa-regular fa-eye"></i>
                  </button>
                </div>
              </div>
              <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200 font-semibold text-center"></div>
              <button type="submit" 
                class="w-full py-3.5 px-4 bg-orange-500 hover:bg-orange-600 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function togglePassVisibility() {
      const i = document.getElementById('loginPass');
      const ic = document.getElementById('passIcon');
      if (i.type === 'password') { i.type = 'text'; ic.className = 'fa-regular fa-eye-slash'; }
      else { i.type = 'password'; ic.className = 'fa-regular fa-eye'; }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const errBox = document.getElementById('loginError');

      const users = getStored('users', []);
      const user = users.find(u => u.id === id && u.pass === pass);

      if (!user) {
        errBox.textContent = 'ভুল User ID অথবা Password!';
        errBox.classList.remove('hidden');
        return;
      }

      currentUser = user;
      setStored('session_user', user);

      if (user.role === 'agent') {
        const attendance = getStored('attendance', []);
        const todayStr = new Date().toLocaleDateString('en-GB');
        let session = attendance.find(a => a.userId === user.id && a.date === todayStr);
        if (!session) {
          session = {
            userId: user.id,
            userName: user.name,
            team: user.team,
            date: todayStr,
            loginTime: new Date().toLocaleTimeString(),
            activeSeconds: 0,
            breakSeconds: 0,
            isOnBreak: false
          };
          attendance.push(session);
          setStored('attendance', attendance);
          syncToGoogleSheet('AGENT_LOGIN', session);
        }
      }

      render();
      if (currentUser.role === 'agent') startShiftTimer();
    }

    function handleLogout() {
      if (timerInterval) clearInterval(timerInterval);
      if (currentUser && currentUser.role === 'agent') {
        syncToGoogleSheet('AGENT_LOGOUT', { userId: currentUser.id, name: currentUser.name, time: new Date().toLocaleTimeString() });
      }
      currentUser = null;
      localStorage.removeItem('gb_session_user');
      activeTab = 'dashboard';
      render();
    }

    function startShiftTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const attendance = getStored('attendance', []);
        const todayStr = new Date().toLocaleDateString('en-GB');
        const session = attendance.find(a => a.userId === currentUser.id && a.date === todayStr);
        if (session) {
          if (session.isOnBreak) session.breakSeconds = (session.breakSeconds || 0) + 1;
          else session.activeSeconds = (session.activeSeconds || 0) + 1;
          setStored('attendance', attendance);
          
          const shiftEl = document.getElementById('timer-working-clock');
          if (shiftEl) shiftEl.textContent = formatTime(session.activeSeconds);
        }
      }, 1000);
    }

    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function toggleBreak() {
      const attendance = getStored('attendance', []);
      const todayStr = new Date().toLocaleDateString('en-GB');
      const session = attendance.find(a => a.userId === currentUser.id && a.date === todayStr);
      if (session) {
        session.isOnBreak = !session.isOnBreak;
        setStored('attendance', attendance);
        syncToGoogleSheet('BREAK_TOGGLE', { userId: currentUser.id, isOnBreak: session.isOnBreak, time: new Date().toLocaleTimeString() });
        render();
      }
    }

    function setTab(tab) {
      activeTab = tab;
      render();
    }

    function renderAppLayout() {
      const u = getFreshUser();
      return `
        <div class="flex-1 flex min-h-screen">
          <aside class="w-64 glass-sidebar flex flex-col justify-between p-5 z-20">
            <div>
              <div class="flex items-center gap-3 px-2 mb-8">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-500 text-white flex items-center justify-center font-bold shadow-md shadow-orange-500/20">
                  <i class="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                  <h1 class="text-base font-extrabold text-slate-900 tracking-tight">SalesTrack</h1>
                  <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Track • Analyze • Grow</p>
                </div>
              </div>

              <nav class="space-y-1.5">
                <button onclick="setTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'dashboard' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-house text-sm"></i> Dashboard
                </button>
                <button onclick="setTab('attendance')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'attendance' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-regular fa-clock text-sm"></i> Attendance & Live
                </button>
                <button onclick="setTab('performance')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'performance' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-chart-pie text-sm"></i> Performance
                </button>
                <button onclick="setTab('daily_reports')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'daily_reports' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-file-invoice text-sm"></i> Daily Reports
                </button>
                <button onclick="setTab('target')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'target' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-bullseye text-sm"></i> Target Setup
                </button>
                <button onclick="setTab('ranking')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'ranking' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-trophy text-sm"></i> Ranking & Teams
                </button>
                ${u.role === 'admin' ? `
                <button onclick="setTab('settings')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold transition-all ${activeTab === 'settings' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}">
                  <i class="fa-solid fa-gear text-sm"></i> Settings & Sync
                </button>
                ` : ''}
              </nav>
            </div>

            <div class="space-y-4">
              <div class="p-4 rounded-2xl bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 text-center relative overflow-hidden">
                <i class="fa-solid fa-bullseye text-4xl text-blue-200 absolute -bottom-2 -right-2"></i>
                <h4 class="text-xs font-extrabold text-blue-900">Hit Your Target!</h4>
                <p class="text-[11px] text-blue-600 mt-1 font-medium">Let's achieve more together.</p>
              </div>

              <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 transition-colors">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
              </button>
            </div>
          </aside>

          <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <header class="h-16 px-8 flex items-center justify-between border-b border-slate-200 bg-white sticky top-0 z-10">
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Workspace</span>
                <span class="text-slate-300">/</span>
                <span class="text-xs font-extrabold text-slate-800 uppercase tracking-wider capitalize">${activeTab.replace('_', ' ')}</span>
              </div>
              <div class="flex items-center gap-4">
                <span class="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-lg flex items-center gap-2">
                  <i class="fa-regular fa-calendar"></i> ${new Date().toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}
                </span>
                <div class="flex items-center gap-2.5 pl-3 border-l border-slate-200">
                  <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                    ${u.name.charAt(0)}
                  </div>
                  <div class="text-left">
                    <p class="text-xs font-bold text-slate-800 leading-none">${u.name}</p>
                    <span class="text-[10px] font-semibold text-slate-400 uppercase">${u.role === 'admin' ? 'Admin (TL)' : 'Agent'}</span>
                  </div>
                </div>
              </div>
            </header>

            <main class="p-8 flex-1">
              ${renderTabContent()}
            </main>
          </div>
        </div>

        <!-- Submit Daily Report Modal -->
        <div id="submitModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-200">
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-sm font-bold">
                  <i class="fa-solid fa-file-lines"></i>
                </div>
                <div>
                  <h3 class="text-sm font-extrabold text-slate-900">Submit Daily Report</h3>
                  <p class="text-[11px] text-slate-400">Please fill in your sales report for today</p>
                </div>
              </div>
              <button onclick="closeModal('submitModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="eodReportForm" onsubmit="handleSalesSubmit(event)" class="space-y-3.5">
              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Total Leads</label>
                  <input type="number" id="subLeads" required min="1" placeholder="420" oninput="calculatePreviewRatio()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Total Orders</label>
                  <input type="number" id="subOrders" required min="0" placeholder="58" oninput="calculatePreviewRatio()" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                  <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Amount (৳)</label>
                  <input type="number" id="subAmount" required min="0" placeholder="112500" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 focus:ring-2 focus:ring-blue-500">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-100">
                <div>
                  <p class="text-[10px] font-bold text-slate-400 uppercase">Today Achievement</p>
                  <p id="prevAchieve" class="text-base font-black text-amber-500 mt-0.5">0%</p>
                </div>
                <div>
                  <p class="text-[10px] font-bold text-slate-400 uppercase">Conversion Ratio</p>
                  <p id="prevRatio" class="text-base font-black text-blue-600 mt-0.5">0.00%</p>
                </div>
              </div>

              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal('submitModal')" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100">Cancel</button>

    function calculatePreviewRatio() {
      const u = getFreshUser();
      const t = getUserTargetInfo(u);
      const l = Number(document.getElementById('subLeads').value) || 0;
      const o = Number(document.getElementById('subOrders').value) || 0;
      const ratio = l > 0 ? ((o / l) * 100).toFixed(2) : '0.00';
      document.getElementById('prevRatio').textContent = ratio + '%';

      const dOrdersTarget = t.dailyOrdersTarget;
      const achieve = dOrdersTarget > 0 ? Math.round((o / dOrdersTarget) * 100) : 0;
      document.getElementById('prevAchieve').textContent = achieve + '%';
    }

    function calculateDailyBreakdown() {
      const mo = Number(document.getElementById('tgtMonthlyOrders').value) || 0;
      const ma = Number(document.getElementById('tgtMonthlyAmount').value) || 0;
      document.getElementById('calcDailyOrders').textContent = Math.round(mo / 26);
      document.getElementById('calcDailyAmount').textContent = Math.round(ma / 26).toLocaleString();
    }

    function openTargetModal(agentId) {
      const users = getStored('users', []);
      const agent = users.find(u => u.id === agentId);
      if (!agent) return;
      document.getElementById('tgtAgentId').value = agent.id;
      document.getElementById('tgtAgentName').textContent = `${agent.name} (ID: ${agent.id} • ${agent.team})`;
      document.getElementById('tgtMonthlyOrders').value = agent.monthlyOrdersTarget || 260;
      document.getElementById('tgtMonthlyAmount').value = agent.monthlyAmountTarget || 320000;
      calculateDailyBreakdown();
      openModal('targetModal');
    }

    function handleSaveTarget(e) {
      e.preventDefault();
      const id = document.getElementById('tgtAgentId').value;
      const mo = Number(document.getElementById('tgtMonthlyOrders').value) || 260;
      const ma = Number(document.getElementById('tgtMonthlyAmount').value) || 320000;

      const users = getStored('users', []);
      const idx = users.findIndex(u => u.id === id);
      if (idx !== -1) {
        users[idx].monthlyOrdersTarget = mo;
        users[idx].monthlyAmountTarget = ma;
        setStored('users', users);

        if (currentUser && currentUser.id === id) {
          currentUser.monthlyOrdersTarget = mo;
          currentUser.monthlyAmountTarget = ma;
          setStored('session_user', currentUser);
        }

        syncToGoogleSheet('UPDATE_TARGET', { userId: id, monthlyOrdersTarget: mo, monthlyAmountTarget: ma, dailyOrdersTarget: Math.round(mo/26), dailyAmountTarget: Math.round(ma/26) });
        alert('টার্গেট সফলভাবে আপডেট হয়েছে!');
        closeModal('targetModal');
        render();
      }
    }

    function handleSalesSubmit(e) {
      e.preventDefault();
      const u = getFreshUser();
      const t = getUserTargetInfo(u);
      const leads = Number(document.getElementById('subLeads').value) || 0;
      const orders = Number(document.getElementById('subOrders').value) || 0;
      const amount = Number(document.getElementById('subAmount').value) || 0;
      const ratio = leads > 0 ? ((orders / leads) * 100).toFixed(2) : 0;
      const dOrdersTarget = t.dailyOrdersTarget;
      const achieve = dOrdersTarget > 0 ? Math.round((orders / dOrdersTarget) * 100) : 0;

      const sales = getStored('sales_records', []);
      const entry = {
        id: 'rec_' + Date.now(),
        userId: u.id,
        userName: u.name,
        team: u.team,
        date: new Date().toLocaleDateString('en-GB'),
        time: new Date().toLocaleTimeString(),
        leads,
        orders,
        amount,
        ratio: Number(ratio),
        achievement: achieve
      };

      sales.unshift(entry);
      setStored('sales_records', sales);
      syncToGoogleSheet('DAILY_SALES_SUBMIT', entry);

      alert('Daily Report submitted successfully!');
      closeModal('submitModal');
      render();
    }

                      <td class="p-4"><span class="px-2 py-0.5 rounded font-bold ${u.team === 'Team Nazim' ? 'badge-soft-orange' : 'badge-soft-blue'}">${u.team}</span></td>
                      <td class="p-4">${badge}</td>
                      <td class="p-4 font-semibold text-slate-600">${s ? s.loginTime : '--:--'}</td>
                      <td class="p-4 font-mono font-bold text-emerald-600">${s ? formatTime(s.activeSeconds) : '00:00:00'}</td>
                      <td class="p-4 font-mono font-bold text-amber-600">${s ? formatTime(s.breakSeconds) : '00:00:00'}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderPerformanceView() {
      return `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-black text-slate-900">Conversion & Performance Analytics</h2>
            <p class="text-xs text-slate-400 font-semibold">Detailed breakdown of conversion rates, leads efficiency, and order volume</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card-neo p-6">
              <h3 class="text-sm font-extrabold text-slate-900 mb-4">Conversion Rate Distribution</h3>
              <div class="h-64">
                <canvas id="conversionPieChart"></canvas>
              </div>
            </div>
            <div class="card-neo p-6 flex flex-col justify-center">
              <h3 class="text-sm font-extrabold text-slate-900 mb-2">Performance Formula Applied</h3>
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono space-y-2 mb-4">
                <p>• Conversion Ratio = (Total Orders ÷ Total Leads) × 100%</p>
                <p>• Team Leader Target = Sum of all Agents' Targets in that Team</p>
                <p>• Daily Target = Monthly Target Amount ÷ 26 Working Days</p>
                <p>• Achievement Ratio = (Actual Revenue ÷ Monthly Target Amount) × 100%</p>
              </div>
              <p class="text-xs text-slate-500 font-medium leading-relaxed">
                টিম লিডারদের টার্গেট স্বয়ংক্রিয়ভাবে তাদের অধীনে থাকা এজেন্টদের টার্গেটের মোট যোগফল (Sum) হিসেবে হিসাব করা হয়েছে।
              </p>
            </div>
          </div>
        </div>
      `;
    }

    function renderDailyReportsView() {
      const sales = getStored('sales_records', []);

      return `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-black text-slate-900">Agent Daily Reports Log</h2>
              <p class="text-xs text-slate-400 font-semibold">Historical daily logs with auto conversion rates</p>
            </div>
            ${currentUser && currentUser.role === 'agent' ? `
            <button onclick="openModal('submitModal')" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow-md">
              <i class="fa-solid fa-plus mr-1"></i> New Entry
            </button>
            ` : ''}
          </div>

          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b border-slate-100 uppercase text-slate-400 font-bold">
                <tr>
                  <th class="p-4">Date & Time</th>
                  <th class="p-4">Agent Name</th>
                  <th class="p-4">Team</th>
                  <th class="p-4">Leads</th>
                  <th class="p-4">Orders</th>
                  <th class="p-4">Amount (BDT)</th>
                  <th class="p-4">Conversion Ratio</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 font-medium">
                ${sales.length === 0 ? '<tr><td colspan="7" class="p-8 text-center text-slate-400">কোন সেলস এন্ট্রি এখনো সাবমিট করা হয়নি।</td></tr>' : ''}
                ${sales.map(s => `
                  <tr class="hover:bg-slate-50/50">
                    <td class="p-4 font-semibold text-slate-600">${s.date} <span class="text-[10px] text-slate-400">${s.time}</span></td>
                    <td class="p-4 font-bold text-slate-800">${s.userName} <span class="text-[10px] text-slate-400">(${s.userId})</span></td>
                    <td class="p-4"><span class="px-2 py-0.5 rounded font-bold ${s.team === 'Team Nazim' ? 'badge-soft-orange' : 'badge-soft-blue'}">${s.team}</span></td>
                    <td class="p-4">${s.leads}</td>
                    <td class="p-4 font-bold text-blue-600">${s.orders}</td>
                    <td class="p-4 font-bold text-emerald-600">৳${s.amount.toLocaleString()}</td>
                    <td class="p-4">
                      <span class="px-2.5 py-1 rounded-full text-[10px] font-extrabold ${s.ratio >= 20 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-700'}">
                        ${s.ratio}%
                      </span>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderTargetSetupView() {
      const users = getStored('users', []).filter(u => u.role === 'agent');

      // Calculate Total Team Targets
      const nazimAgents = users.filter(u => u.team === 'Team Nazim');
      const samadAgents = users.filter(u => u.team === 'Team Samad');

      const nazimTotalAmount = nazimAgents.reduce((s, a) => s + (Number(a.monthlyAmountTarget) || 0), 0);
      const nazimTotalOrders = nazimAgents.reduce((s, a) => s + (Number(a.monthlyOrdersTarget) || 0), 0);

      const samadTotalAmount = samadAgents.reduce((s, a) => s + (Number(a.monthlyAmountTarget) || 0), 0);
      const samadTotalOrders = samadAgents.reduce((s, a) => s + (Number(a.monthlyOrdersTarget) || 0), 0);

      return `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <div>
              <h2 class="text-xl font-black text-slate-900">Target Management (Automatic Team Leader Summation)</h2>
              <p class="text-xs text-slate-400 font-semibold">টিম লিডারদের টার্গেট স্বয়ংক্রিয়ভাবে তাদের অধীনে থাকা এজেন্টদের টার্গেটের যোগফল (Sum) হিসেবে হিসাব হবে</p>
            </div>
          </div>

          <!-- Team Leader Summation Cards -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="p-5 rounded-2xl bg-orange-50/70 border border-orange-200">
              <span class="text-xs font-black uppercase tracking-wider text-orange-800">Team Nazim Leader Goal (Md. Nazimur Rahman)</span>
              <div class="flex items-baseline justify-between mt-2">
                <span class="text-2xl font-black text-slate-900">৳${nazimTotalAmount.toLocaleString()}</span>
                <span class="text-sm font-bold text-orange-700">${nazimTotalOrders} Orders (${nazimAgents.length} Agents)</span>
              </div>
              <p class="text-[11px] font-semibold text-slate-500 mt-1">Daily Target Sum: ৳${Math.round(nazimTotalAmount/26).toLocaleString()} (${Math.round(nazimTotalOrders/26)} Orders/day)</p>
            </div>

            <div class="p-5 rounded-2xl bg-blue-50/70 border border-blue-200">
              <span class="text-xs font-black uppercase tracking-wider text-blue-800">Team Samad Leader Goal (Md Abdus Samad)</span>
              <div class="flex items-baseline justify-between mt-2">
                <span class="text-2xl font-black text-slate-900">৳${samadTotalAmount.toLocaleString()}</span>
                <span class="text-sm font-bold text-blue-700">${samadTotalOrders} Orders (${samadAgents.length} Agents)</span>
              </div>
              <p class="text-[11px] font-semibold text-slate-500 mt-1">Daily Target Sum: ৳${Math.round(samadTotalAmount/26).toLocaleString()} (${Math.round(samadTotalOrders/26)} Orders/day)</p>
            </div>
          </div>

          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b border-slate-100 uppercase text-slate-400 font-bold">
                <tr>
                  <th class="p-4">Agent Name</th>
                  <th class="p-4">Team</th>
                  <th class="p-4">Monthly Target (Amount)</th>
                  <th class="p-4">Daily Target (Amount ÷ 26)</th>
                  <th class="p-4">Monthly Orders</th>
                  <th class="p-4">Daily Orders</th>
                  ${currentUser && currentUser.role === 'admin' ? '<th class="p-4 text-right">Action</th>' : ''}
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 font-medium">
                ${users.map(u => {
                  const mOrders = u.monthlyOrdersTarget || 260;
                  const dOrders = Math.round(mOrders / 26);
                  const mAmount = u.monthlyAmountTarget || 320000;
                  const dAmount = Math.round(mAmount / 26);

                  return `
                    <tr class="hover:bg-slate-50/50">
                      <td class="p-4 font-bold text-slate-800">${u.name} <div class="text-[10px] text-slate-400">ID: ${u.id}</div></td>
                      <td class="p-4"><span class="px-2 py-0.5 rounded font-bold ${u.team === 'Team Nazim' ? 'badge-soft-orange' : 'badge-soft-blue'}">${u.team}</span></td>
                      <td class="p-4 font-extrabold text-emerald-600">৳${mAmount.toLocaleString()}</td>
                      <td class="p-4 font-bold text-slate-700 bg-emerald-50/30">৳${dAmount.toLocaleString()} / day</td>
                      <td class="p-4 font-extrabold text-blue-600">${mOrders} Orders</td>
                      <td class="p-4 font-bold text-slate-700 bg-amber-50/50">${dOrders} / day</td>
                      ${currentUser && currentUser.role === 'admin' ? `
                        <td class="p-4 text-right">
                          <button onclick="openTargetModal('${u.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors">
                            <i class="fa-solid fa-pen-to-square"></i> Set Target
                          </button>
                        </td>
                      ` : ''}
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderRankingView() {
      const users = getStored('users', []).filter(u => u.role === 'agent');
      const sales = getStored('sales_records', []);

      const agentRanks = users.map(u => {
        const uSales = sales.filter(s => s.userId === u.id);
        const orders = uSales.reduce((a, c) => a + c.orders, 0);
        const amount = uSales.reduce((a, c) => a + c.amount, 0);
        const leads = uSales.reduce((a, c) => a + c.leads, 0);
        const ratio = leads > 0 ? Number(((orders / leads) * 100).toFixed(1)) : 0;
        const target = u.monthlyAmountTarget || 320000;
        const achieve = target > 0 ? Math.round((amount / target) * 100) : 0;
        return { ...u, orders, amount, leads, ratio, achieve };
      });

      agentRanks.sort((a, b) => b.amount - a.amount || b.orders - a.orders);

      return `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-black text-slate-900">Overall Agent Rankings & Leaderboard</h2>
            <p class="text-xs text-slate-400 font-semibold">Real-time performance hierarchy across all teams (Sorted by Revenue Amount)</p>
          </div>

          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b border-slate-100 uppercase text-slate-400 font-bold">
                <tr>
                  <th class="p-4">Rank</th>
                  <th class="p-4">Agent Name</th>
                  <th class="p-4">Team</th>
                  <th class="p-4">Total Amount (৳)</th>
                  <th class="p-4">Total Orders</th>
                  <th class="p-4">Conversion Rate</th>
                  <th class="p-4">Amount Achievement</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 font-medium">
                ${agentRanks.map((ag, index) => {
                  let rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-xs">${index + 1}</span>`;
                  if (index === 0) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-400 text-white flex items-center justify-center font-bold text-xs shadow-md"><i class="fa-solid fa-crown text-[10px]"></i></span>`;
                  if (index === 1) rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-300 text-slate-800 flex items-center justify-center font-bold text-xs">2</span>`;
                  if (index === 2) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-700 text-white flex items-center justify-center font-bold text-xs">3</span>`;

                  return `
                    <tr class="hover:bg-slate-50/50">
                      <td class="p-4">${rankBadge}</td>
                      <td class="p-4 font-bold text-slate-800">${ag.name} <span class="text-[10px] text-slate-400">(${ag.id})</span></td>
                      <td class="p-4"><span class="px-2 py-0.5 rounded font-bold ${ag.team === 'Team Nazim' ? 'badge-soft-orange' : 'badge-soft-blue'}">${ag.team}</span></td>
                      <td class="p-4 font-black text-emerald-600 text-sm">৳${ag.amount.toLocaleString()}</td>
                      <td class="p-4 font-bold text-slate-900">${ag.orders}</td>
                      <td class="p-4 font-bold text-blue-600">${ag.ratio}%</td>
                      <td class="p-4">
                        <div class="flex items-center gap-2">
                          <span class="font-extrabold text-slate-700">${ag.achieve}%</span>
                          <div class="w-20 bg-slate-100 rounded-full h-1.5">
                            <div class="bg-blue-600 h-1.5 rounded-full" style="width: ${Math.min(100, ag.achieve)}%"></div>
                          </div>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSettingsView() {
      return `
        <div class="max-w-xl card-neo p-6 space-y-5">
          <div>
            <h2 class="text-lg font-black text-slate-900">Google Sheets Storage & Integration</h2>
            <p class="text-xs text-slate-400 font-semibold mt-1">Webhook URL link to auto save all submissions into Google Sheets</p>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">Google Apps Script Webhook URL</label>
            <input type="url" id="settingsWebhook" value="${webhookUrl}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold focus:ring-2 focus:ring-blue-500">
          </div>
          <button onclick="saveSettingsWebhook()" class="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-md">
            Save & Connect Sheets
          </button>
        </div>
      `;
    }

    function saveSettingsWebhook() {
      const url = document.getElementById('settingsWebhook').value.trim();
      webhookUrl = url;
      localStorage.setItem('gb_webhook_url', url);
      alert('Webhook URL updated and saved!');
    }

    function attachCharts() {
      if (activeTab === 'dashboard') {
        const ctx = document.getElementById('salesTrendChart');
        if (ctx) {
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
              datasets: [{
                label: 'Sales Revenue (৳)',
                data: [15000, 28000, 42000, 35000, 58000, 62000, 48000],
                backgroundColor: '#2563eb',
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } },
                x: { grid: { display: false }, ticks: { font: { size: 10 } } }
              }
            }
          });
        }
      } else if (activeTab === 'performance') {
        const ctxP = document.getElementById('conversionPieChart');
        if (ctxP) {
          new Chart(ctxP, {
            type: 'doughnut',
            data: {
              labels: ['Converted Orders', 'Unconverted Leads'],
              datasets: [{
                data: [58, 362],
                backgroundColor: ['#059669', '#e2e8f0']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom' } }
            }
          });
        }
      }
    }

    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

    window.addEventListener('load', init);
  </script>
</body>
</html>
