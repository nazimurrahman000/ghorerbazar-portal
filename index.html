      if (document.activeElement && document.activeElement.id === 'aiRawOcrTextarea') return;

      const cbData = e.clipboardData || e.originalEvent?.clipboardData;
      if (!cbData) return;

      const imageFiles = [];
      if (cbData.items && cbData.items.length > 0) {
        for (let i = 0; i < cbData.items.length; i++) {
          const item = cbData.items[i];
          if (item.type && item.type.indexOf('image') !== -1) {
            const blob = item.getAsFile();
            if (blob) imageFiles.push(blob);
          }
        }
      }
      if (imageFiles.length === 0 && cbData.files && cbData.files.length > 0) {
        for (let i = 0; i < cbData.files.length; i++) {
          const f = cbData.files[i];
          if (f.type && f.type.indexOf('image') !== -1) {
            imageFiles.push(f);
          }
        }
      }

      if (imageFiles.length > 0) {
        e.preventDefault();
        await processAiErpImageFiles(imageFiles);
        return;
      }

      // Also support pasting copied ERP Table Text directly with Ctrl+V!
      const pastedText = cbData.getData && cbData.getData('text/plain');
      if (pastedText && pastedText.trim().length > 10 && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) {
        e.preventDefault();
        const rawArea = document.getElementById('aiRawOcrTextarea');
        if (rawArea) rawArea.value = pastedText.trim();
        analyzeErpOcrText(pastedText);
        showPortalToast('ERP Table Text Analyzed!', 'Calculated exact product quantities from your pasted text!', 'success');
      }
    });

    // Helper: Fuzzy match agent from text line or token
    function matchAgentInLine(lineText, allAgents) {
      const lower = String(lineText || '').toLowerCase();
      for (const ag of allAgents) {
        if (lower.includes(String(ag.id).toLowerCase())) return ag;
      }
      const aliases = {
        '10191': ['shagor', 'sagor'],
        '10289': ['dipu', 'abdullah dipu'],
        '11044': ['eraz', 'hasibul', 'iraz'],
        '10741': ['shujon', 'sujon', 'kamruzzaman'],
        '10803': ['mahmud', 'abdullah mahmud'],
        '11042': ['ashiqur', 'ashik', 'ashiq'],
        '10328': ['rayhan', 'raihan', 'sheikh'],
        '10135': ['ranju', 'ronju'],
        '10357': ['faruque', 'faruk', 'faruq', 'md. faruque', 'faruque hossain'],
        '10098': ['shuvo', 'habibur'],
        '10136': ['al-amin kazi', 'alamin kazi', 'kazi'],
        '11007': ['zubayer', 'jubayer', 'zubaer'],
        '11101': ['mehedi', 'amin'],
        '11120': ['abu sayed', 'sayed', 'saied'],
        '11130': ['rabbir', 'rabbi', 'mollah', 'molla'],
        '10806': ['soad', 'suad', 'abdullah al soad'],
        '10128': ['al-amin', 'alamin', 'al amin']
      };

      const sortedAgents = [...allAgents].sort((a, b) => b.name.length - a.name.length);
      for (const ag of sortedAgents) {
        if (lower.includes(ag.name.toLowerCase())) return ag;
        const agAliases = aliases[String(ag.id)] || [];
        for (const al of agAliases) {
          const regex = new RegExp(`\\b${al.replace('-', '[-\\s]?')}\\b`, 'i');
          if (regex.test(lower)) return ag;
        }
      }
      return null;
    }

    function extractDateFromText(text, fallbackDate) {
      const s = String(text || '');
      const m1 = s.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](20\d{2})\b/);
      if (m1) {
        return `${String(m1[1]).padStart(2, '0')}/${String(m1[2]).padStart(2, '0')}/${m1[3]}`;
      }
      const m2 = s.match(/\b(20\d{2})[\/\-](\d{1,2})[\/\-](\d{1,2})\b/);
      if (m2) {
        return `${String(m2[3]).padStart(2, '0')}/${String(m2[2]).padStart(2, '0')}/${m2[1]}`;
      }
      const monthsMap = { jan:'01', feb:'02', mar:'03', apr:'04', may:'05', jun:'06', jul:'07', aug:'08', sep:'09', oct:'10', nov:'11', dec:'12' };
      const m3 = s.match(/\b(\d{1,2})[\s\-]+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-,]*(20\d{2})?\b/i);
      if (m3) {
        const day = String(m3[1]).padStart(2, '0');
        const mon = monthsMap[m3[2].toLowerCase().substring(0, 3)];
        const yr = m3[3] || selectedMonthKey.split('/')[1] || '2026';
        return `${day}/${mon}/${yr}`;
      }
      return fallbackDate;
    }

    function extractProductAmountsFromLine(lineText) {
      const lower = String(lineText || '').toLowerCase();
      const prods = { ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0 };
      let foundAnyProd = false;

      const prodPatterns = [
        { key: 'ajwa', regex: /ajwa(?:\s*dates)?[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'pinkSalt', regex: /(?:pink\s*)?salt[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'blackGarlic', regex: /(?:black\s*)?garlic[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'sunHoney', regex: /(?:sundarban|sun\.?\s*h|sundarban\s*honey)[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'bsHoney', regex: /(?:black\s*seed|bs\.?\s*h|kalojira)[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i },
        { key: 'gawaGhee', regex: /(?:gawa\s*)?ghee[\s:=-]*(\d+(?:\.\d+)?)\s*(kg|gm|g)?/i }
      ];

      prodPatterns.forEach(pp => {
        const m = lower.match(pp.regex);
        if (m) {
          let val = parseFloat(m[1]) || 0;
          const unit = (m[2] || '').toLowerCase();
          if (unit === 'gm' || unit === 'g' || val >= 100) {
            val = Number((val / 1000).toFixed(2));
          }
          prods[pp.key] = val;
          foundAnyProd = true;
        }
      });

      return { prods, foundAnyProd };
    }

    // Master ERP Product Code & Variant Weight Dictionary
    // Even if OCR misreads "500gm" or "1kg", the Product Code or Barcode identifies the exact product & weight!
    const ERP_PRODUCT_CODE_MAP = {
      'A000010': { cat: 'gawaGhee', unitKg: 0.5, label: '500gm' },
      'A000011': { cat: 'gawaGhee', unitKg: 1.0, label: '1kg' },
      'A000112': { cat: 'gawaGhee', unitKg: 0.25, label: '250gm' },
      'A000101': { cat: 'gawaGhee', unitKg: 0.2, label: '200gm' },
      'A000344': { cat: 'gawaGhee', unitKg: 0.1, label: '100gm' },
      'A000102': { cat: 'gawaGhee', unitKg: 0.4, label: '400gm' },

      'A000008': { cat: 'sunHoney', unitKg: 0.5, label: '500gm' },
      'A000009': { cat: 'sunHoney', unitKg: 1.0, label: '1kg' },
      'A000214': { cat: 'sunHoney', unitKg: 0.25, label: '250gm' },

      'A000006': { cat: 'bsHoney', unitKg: 0.5, label: '500g' },
      'A000007': { cat: 'bsHoney', unitKg: 1.0, label: '1kg' },
      'A000215': { cat: 'bsHoney', unitKg: 0.25, label: '250g' },

      'A002067': { cat: 'pinkSalt', unitKg: 0.5, label: '500g' },
      'A000064': { cat: 'blackGarlic', unitKg: 0.5, label: '500gm' },

      'A000444': { cat: 'ajwa', unitKg: 1.0, label: '1kg' },
      'A000440': { cat: 'ajwa', unitKg: 0.5, label: '500g' },
      'A001520': { cat: 'ajwa', unitKg: 1.0, label: '1kg' },
      'A000445': { cat: 'ajwa', unitKg: 0.5, label: '500gm' }
    };

    // Helper: Parse ERP Product Sales Summary row (e.g. "1 Gawa Ghee 500gm A000010 Shosti food 8941140120048 Ghorerbazar ৳0.00 56")
    // Calculates: (Variant Weight in KG) × (Quantity Sold) = Total KG
    function parseErpProductSummaryRow(lineText) {
      const raw = String(lineText || '').trim();
      const lower = raw.toLowerCase();
      if (!lower || lower.startsWith('products:') || lower.startsWith('report filters') || /^total\s*:/i.test(lower) || /product\s*name.*quantity\s*sold/i.test(lower)) {
        return null;
      }

      // 1. Check if line contains a known ERP Product Code (e.g. A000010, A000008, etc., even if 'A' is OCR'd as '4' or 'O' as '0')
      let matchedCodeInfo = null;
      const codeMatch = raw.match(/\b[A4][0O]{2}\d{4}\b/i);
      if (codeMatch) {
        const normCode = 'A' + codeMatch[0].substring(1).replace(/[Oo]/g, '0');
        if (ERP_PRODUCT_CODE_MAP[normCode]) {
          matchedCodeInfo = ERP_PRODUCT_CODE_MAP[normCode];
        }
      }

      // 2. Detect Product Category by Name or Product Code
      let cat = matchedCodeInfo ? matchedCodeInfo.cat : null;
      if (!cat) {
        if (/black\s*seed\s*honey|bs\.?\s*h|kalojira/i.test(lower)) cat = 'bsHoney';
        else if (/sundarban\s*honey|sun\.?\s*h|honeyraj.*(?:00008|00009|00214)/i.test(lower)) cat = 'sunHoney';
        else if (/gawa\s*ghee|\bghee\b|shosti\s*food/i.test(lower)) cat = 'gawaGhee';
        else if (/pink\s*salt|himalayan|\bsalt\b/i.test(lower)) cat = 'pinkSalt';
        else if (/black\s*garlic|\bgarlic\b/i.test(lower)) cat = 'blackGarlic';
        else if (/ajwa|khejuri|dates/i.test(lower)) cat = 'ajwa';
      }
      if (!cat) return null;

      // 3. Detect Variant Weight (e.g., 500gm, 500 g, 1kg, 250gm, 200gm, 400gm, 100gm)
      let unitKg = matchedCodeInfo ? matchedCodeInfo.unitKg : 1.0;
      let sizeLabel = matchedCodeInfo ? matchedCodeInfo.label : '1kg';
      let sizeEndIdx = 0;

      // Support OCR variations like "500gm", "500 gm", "500g", "5009", "500qm", "1kg", "1 kg", "1kq", "250gm", "200gm", "100gm", "400gm"
      const weightRegex = /\b(500|250|200|400|100|1|2|0\.5|0\.25)\s*(kg|kq|k9|gm|qm|9m|g|q)\b/i;
      const wMatch = lower.match(weightRegex);
      if (wMatch) {
        const wNum = parseFloat(wMatch[1]) || 1;
        const wUnit = wMatch[2].toLowerCase();
        if (wUnit.startsWith('k') || wNum <= 5) {
          unitKg = wNum;
          sizeLabel = `${wNum}kg`;
        } else {
          unitKg = wNum / 1000;
          sizeLabel = `${wNum}gm`;
        }
        sizeEndIdx = wMatch.index + wMatch[0].length;
      } else {
        // Check if OCR merged 'g' into '9' (e.g. "5009m", "5009", "2509m", "2509", "2009m", "1009m", "4009m")
        const mergedGMatch = lower.match(/\b(500|250|200|400|100)[9qgo0]m?\b/i);
        if (mergedGMatch) {
          const wNum = parseFloat(mergedGMatch[1]);
          unitKg = wNum / 1000;
          sizeLabel = `${wNum}gm`;
          sizeEndIdx = mergedGMatch.index + mergedGMatch[0].length;
        }
      }

      // 4. Extract Quantity Sold (Always the rightmost integer in the row, after Store Name / Cost Price)
      let tail = sizeEndIdx > 0 ? raw.substring(sizeEndIdx) : raw;

      // If "Ghorerbazar" is in the row, Quantity Sold is always to the right of "Ghorerbazar"!
      const storeMatch = tail.match(/ghorer\s*bazar/i);
      if (storeMatch) {
        tail = tail.substring(storeMatch.index + storeMatch[0].length);
      } else {
        // Strip Product Codes (A000010) and 13-digit Barcodes (8941140120048)
        tail = tail
          .replace(/\b[A-Za-z0-9]*\d{5,16}\b/g, ' ')
          .replace(/\b[A-Za-z]+\d{3,8}\b/g, ' ');
      }

      // Strip Cost Price / Total Price tokens like "৳0.00", "b0.00", "60.00", "80.00", "0.00", "৳12,450.00"
      tail = tail
        .replace(/(?:[৳b68t€$]?\s*)?\d[\d,]*\.\d{2}\b/gi, ' ')
        .replace(/\b0[.,]00\b/g, ' ')
        .replace(/\b\d{1,3}(?:,\d{3})+(?:\.\d+)?\b/g, ' ');

      const intTokens = (tail.match(/\b(\d{1,4})\b/g) || [])
        .map(t => parseInt(t, 10))
        .filter(n => !isNaN(n) && n > 0 && n < 5000);

      let qty = 0;
      if (intTokens.length > 0) {
        // The rightmost integer on the line is Quantity Sold!
        qty = intTokens[intTokens.length - 1];
      }

      if (qty > 0) {
        const totalKg = Number((unitKg * qty).toFixed(2));
        return { cat, unitKg, qty, totalKg, itemSummary: `${sizeLabel} × ${qty} = ${totalKg}kg` };
      }
      return null;
    }

    function detectErpMonthlyProductSummaryMode(ocrText) {
      const s = String(ocrText || '');
      const hasRangeHeader = /date\s*range|product\s*sales\s*report|products\s*sales\s*summary|quantity\s*sold|product\s*code|barcode|order\s*by|store\s*name|cost\s*price/i.test(s);
      const monthsMap = { jan:'01', feb:'02', mar:'03', apr:'04', may:'05', jun:'06', jul:'07', aug:'08', sep:'09', oct:'10', nov:'11', dec:'12' };
      const mRange = s.match(/\b(\d{1,2})[\s\-]+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s\-,]*(20\d{2})\b/i);
      let detectedMonthKey = selectedMonthKey;
      if (mRange) {
        const mon = monthsMap[mRange[2].toLowerCase().substring(0, 3)];
        const yr = mRange[3];
        if (mon && yr) detectedMonthKey = `${mon}/${yr}`;
      }
      return { isProductSummaryReport: hasRangeHeader, detectedMonthKey };
    }

    function analyzeErpOcrText(ocrText) {
      const allAgents = getUsersForMonth(selectedMonthKey).filter(u => u.role === 'agent');
      const existingSales = deduplicateSalesRecordsList(getStored('sales_records', []));
      const fullText = String(ocrText || '');
      const rawLines = fullText.split(/\r?\n/);

      // Merge any wrapped lines where a product row got split across two lines by OCR
      const lines = [];
      for (let i = 0; i < rawLines.length; i++) {
        const cur = rawLines[i].trim();
        if (!cur) continue;
        // If current line has a product name/code but no quantity at the end, and next line is just numbers/price, join them
        if (i + 1 < rawLines.length) {
          const nxt = rawLines[i + 1].trim();
          if (/(?:ghee|honey|salt|garlic|ajwa|dates)/i.test(cur) && !/\b\d{1,4}\s*$/.test(cur) && /^[৳b680.,\s\d]+$/.test(nxt)) {
            lines.push(cur + ' ' + nxt);
            i++;
            continue;
          }
        }
        lines.push(cur);
      }

      // 1. Detect Agent across the entire OCR text
      let globalDetectedAgent = null;
      for (const rawLine of lines) {
        if (/order\s*by|agent|employee|name|id/i.test(rawLine)) {
          const ag = matchAgentInLine(rawLine, allAgents);
          if (ag) { globalDetectedAgent = ag; break; }
        }
      }
      if (!globalDetectedAgent) {
        for (const rawLine of lines) {
          const ag = matchAgentInLine(rawLine, allAgents);
          if (ag) { globalDetectedAgent = ag; break; }
        }
      }

      const { isProductSummaryReport, detectedMonthKey } = detectErpMonthlyProductSummaryMode(fullText);

      // 2. Parse ERP Product Sales Summary rows (Variant Weight x Quantity Sold)
      const sumProds = { ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0 };
      const catBreakdowns = { ajwa: [], pinkSalt: [], blackGarlic: [], sunHoney: [], bsHoney: [], gawaGhee: [] };
      let matchedProdRowsCount = 0;

      lines.forEach(rawLine => {
        const parsedRow = parseErpProductSummaryRow(rawLine);
        if (parsedRow) {
          sumProds[parsedRow.cat] = Number((sumProds[parsedRow.cat] + parsedRow.totalKg).toFixed(2));
          catBreakdowns[parsedRow.cat].push(parsedRow.itemSummary);
          matchedProdRowsCount++;
        } else if (!isProductSummaryReport) {
          const { prods, foundAnyProd } = extractProductAmountsFromLine(rawLine);
          if (foundAnyProd) {
            Object.keys(prods).forEach(pk => {
              if (prods[pk] > 0) {
                sumProds[pk] = Number((sumProds[pk] + prods[pk]).toFixed(2));
                matchedProdRowsCount++;
              }
            });
          }
        }
      });

      const prodShortLabels = {
        gawaGhee: 'Gawa Ghee',
        sunHoney: 'Sundarban Honey',
        bsHoney: 'Black Seed Honey',
        pinkSalt: 'Pink Salt',
        ajwa: 'Ajwa Dates',
        blackGarlic: 'Black Garlic'
      };
      const groupedBreakdownParts = [];
      Object.keys(prodShortLabels).forEach(k => {
        if (catBreakdowns[k] && catBreakdowns[k].length > 0) {
          groupedBreakdownParts.push(`<strong>${prodShortLabels[k]} (${sumProds[k]}kg):</strong> [${catBreakdowns[k].join(' + ')}]`);
        }
      });

      let summaryOrders = 0, summaryLeads = 0, summaryAmount = 0;
      const cleanFull = fullText.replace(/b(?=\d)/gi, '৳');
      const moneyMatches = cleanFull.match(/(?:৳|tk|bdt)\s*(\d[\d,]*(?:\.\d+)?)/gi) || [];
      if (moneyMatches.length > 0 && !isProductSummaryReport) {
        const parsedMoney = moneyMatches.map(m => parseFloat(m.replace(/[^\d.]/g, ''))).filter(n => !isNaN(n) && n >= 500);
        if (parsedMoney.length > 0) summaryAmount = Math.round(Math.max(...parsedMoney));
      }

      if ((isProductSummaryReport || matchedProdRowsCount > 0) && (matchedProdRowsCount > 0 || summaryAmount > 0)) {
        const detectedUid = globalDetectedAgent ? String(globalDetectedAgent.id) : '';
        const detectedName = globalDetectedAgent ? globalDetectedAgent.name : 'Select Agent';
        const detectedTeam = globalDetectedAgent ? globalDetectedAgent.team : '';
        const monthlyRecordDateKey = `MONTHLY_PROD_${detectedMonthKey}`;
        const existingRec = detectedUid ? existingSales.find(s => String(s.userId) === detectedUid && s.date === monthlyRecordDateKey) : null;

        aiDetectedRecords = [{
          userId: detectedUid,
          userName: detectedName,
          team: detectedTeam,
          agentWasAutoDetected: Boolean(globalDetectedAgent),
          date: monthlyRecordDateKey,
          isMonthlyProductSummary: true,
          monthKey: detectedMonthKey,
          matchedRowsCount: matchedProdRowsCount,
          breakdownText: groupedBreakdownParts.join(' • '),
          category: globalDetectedAgent
            ? `Detected: ${detectedName} (${detectedMonthKey})`
            : `Select Agent Below (${detectedMonthKey})`,
          leads: summaryLeads,
          orders: summaryOrders,
          amount: 0,
          ajwa: sumProds.ajwa,
          pinkSalt: sumProds.pinkSalt,
          blackGarlic: sumProds.blackGarlic,
          sunHoney: sumProds.sunHoney,
          bsHoney: sumProds.bsHoney,
          gawaGhee: sumProds.gawaGhee,
          isDuplicate: Boolean(existingRec),
          selected: true
        }];
        renderAiDetectedPreviewTable();
        return;
      }

      // 3. Standard Date-Wise Multi-Agent or Single-Agent Sales Report Parsing
      let currentContextDate = extractDateFromText(fullText, null) || ((reportsDateFilter && reportsDateFilter !== 'ALL') ? reportsDateFilter : getTodayFormatted());
      let currentContextAgent = globalDetectedAgent;
      const mergedMap = new Map();

      lines.forEach(rawLine => {
        const line = rawLine.trim();
        if (!line || line.length < 2) return;
        if (/^products:|^report filters:/i.test(line)) return;

        const detectedDate = extractDateFromText(line, null);
        if (detectedDate) currentContextDate = detectedDate;

        const lineAgent = matchAgentInLine(line, allAgents);
        if (lineAgent) currentContextAgent = lineAgent;

        const activeAgent = lineAgent || currentContextAgent;
        if (!activeAgent) return;

        const rowDate = detectedDate || currentContextDate;
        let cleanedForNums = line
          .replace(new RegExp(activeAgent.id, 'g'), ' ')
          .replace(/\b\d{1,2}[\/\-]\d{1,2}[\/\-]20\d{2}\b/g, ' ')
          .replace(/\b20\d{2}[\/\-]\d{1,2}[\/\-]\d{1,2}\b/g, ' ')
          .replace(/\d+(?:\.\d+)?\s*%/g, ' ');

        const { prods, foundAnyProd } = extractProductAmountsFromLine(cleanedForNums);
        const numMatches = cleanedForNums.match(/\d[\d,]*(?:\.\d+)?/g) || [];
        const nums = numMatches.map(n => parseFloat(n.replace(/,/g, ''))).filter(n => !isNaN(n) && n > 0);

        if (nums.length === 0 && !foundAnyProd) return;

        const key = `${activeAgent.id}_${rowDate}`;
        const prev = mergedMap.get(key) || {
          userId: String(activeAgent.id),
          userName: activeAgent.name,
          team: activeAgent.team,
          agentWasAutoDetected: true,
          date: rowDate,
          isMonthlyProductSummary: false,
          category: `Detected: ${activeAgent.name}`,
          leads: 0, orders: 0, amount: 0,
          ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0
        };

        if (foundAnyProd) {
          Object.keys(prods).forEach(pk => { if (prods[pk] > 0) prev[pk] = prods[pk]; });
        }

        const bigAmounts = nums.filter(n => n >= 1200);
        const smallInts = nums.filter(n => n < 1200 && Number.isInteger(n));

        if (bigAmounts.length > 0) prev.amount = Math.max(prev.amount, Math.round(Math.max(...bigAmounts)));
        if (smallInts.length >= 2) {
          const sortedSmall = [...smallInts].sort((a, b) => b - a);
          prev.leads = Math.max(prev.leads, sortedSmall[0]);
          prev.orders = Math.max(prev.orders, sortedSmall[1]);
        } else if (smallInts.length === 1 && prev.orders === 0) {
          prev.orders = smallInts[0];
        }

        if (prev.amount > 0 || prev.leads > 0 || prev.orders > 0 || foundAnyProd) {
          mergedMap.set(key, prev);
        }
      });

      aiDetectedRecords = Array.from(mergedMap.values());

      if (aiDetectedRecords.length === 0) {
        const allNums = (fullText.replace(/\b202\d\b/g, ' ').match(/\d[\d,]*(?:\.\d+)?/g) || [])
          .map(n => parseFloat(n.replace(/,/g, '')))
          .filter(n => !isNaN(n) && n > 0);
        const bigs = allNums.filter(n => n >= 1200 && n < 10000000);
        const smalls = allNums.filter(n => n > 0 && n < 1000 && Number.isInteger(n));

        const detectedUid = globalDetectedAgent ? String(globalDetectedAgent.id) : '';
        const detectedName = globalDetectedAgent ? globalDetectedAgent.name : 'Select Agent';
        const detectedTeam = globalDetectedAgent ? globalDetectedAgent.team : '';
        aiDetectedRecords.push({
          userId: detectedUid,
          userName: detectedName,
          team: detectedTeam,
          agentWasAutoDetected: Boolean(globalDetectedAgent),
          date: currentContextDate,
          isMonthlyProductSummary: false,
          category: globalDetectedAgent ? `Detected: ${detectedName}` : 'Select Agent Name',
          leads: smalls.length >= 2 ? Math.max(...smalls) : 0,
          orders: smalls.length >= 1 ? Math.min(...smalls) : 0,
          amount: bigs.length > 0 ? Math.round(Math.max(...bigs)) : 0,
          ajwa: sumProds.ajwa, pinkSalt: sumProds.pinkSalt, blackGarlic: sumProds.blackGarlic,
          sunHoney: sumProds.sunHoney, bsHoney: sumProds.bsHoney, gawaGhee: sumProds.gawaGhee
        });
      }

      aiDetectedRecords = aiDetectedRecords.map(rec => {
        const existingRec = rec.userId ? existingSales.find(s => String(s.userId) === String(rec.userId) && s.date === rec.date) : null;
        const isDuplicate = Boolean(existingRec);
        return {
          ...rec,
          isDuplicate,
          selected: rec.isMonthlyProductSummary ? true : !isDuplicate
        };
      });

      renderAiDetectedPreviewTable();
    }

    function renderAiDetectedPreviewTable() {
      const resBox = document.getElementById('aiAnalysisResultContainer');
      if (resBox) resBox.classList.remove('hidden');

        aiDetectedRecords[idx].isMonthlyProductSummary = true;
        aiDetectedRecords[idx].category = `Till-Now Product Total (${selectedMonthKey})`;

    function onAiRowCheckChange(idx, isChecked) {
      if (!aiDetectedRecords[idx]) return;
      aiDetectedRecords[idx].selected = isChecked;
      if (aiDetectedRecords[idx].isDuplicate && !String(aiDetectedRecords[idx].date || '').startsWith('MONTHLY_PROD_') && isChecked) {

        aiDetectedRecords[idx].agentWasAutoDetected = true;
      }

      const isDup = aiDetectedRecords[idx].userId
        ? existingSales.some(s => String(s.userId) === String(aiDetectedRecords[idx].userId) && s.date === aiDetectedRecords[idx].date)
        : false;
      aiDetectedRecords[idx].isDuplicate = isDup;
      aiDetectedRecords[idx].selected = String(aiDetectedRecords[idx].date || '').startsWith('MONTHLY_PROD_') ? true : !isDup;
      renderAiDetectedPreviewTable();

    function executeAiApprovalCommit(approvedRows) {
      let sales = getStored('sales_records', []);
      const allAgents = getUsersForMonth(selectedMonthKey).filter(u => u.role === 'agent');
      const syncPayloads = [];
      const lastUpdateFormatted = formatFullMonthDateDisplay(getTodayFormatted());

      for (const item of approvedRows) {
        const agObj = allAgents.find(a => String(a.id) === String(item.userId));
        if (!agObj) continue;

        const isMonthlyProd = String(item.date || '').startsWith('MONTHLY_PROD_');
        if (isMonthlyProd) {
          const mKey = item.date.replace('MONTHLY_PROD_', '') || selectedMonthKey;
          // Clear any old daily product numbers for this agent in this month so the new Till-Now Total is exact
          sales = sales.map(s => {
            if (String(s.userId) === String(agObj.id) && String(s.date || '').endsWith(mKey) && !String(s.date).startsWith('MONTHLY_PROD_')) {
              return { ...s, ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0 };
            }
            return s;
          });
        }

        const existingIdx = sales.findIndex(s => String(s.userId) === String(agObj.id) && s.date === item.date);
        const oldRec = existingIdx !== -1 ? sales[existingIdx] : null;

        const finalLeads = isMonthlyProd ? 0 : (Number(item.leads) > 0 ? Number(item.leads) : (oldRec ? Number(oldRec.leads) || 0 : 0));
        const finalOrders = isMonthlyProd ? 0 : (Number(item.orders) > 0 ? Number(item.orders) : (oldRec ? Number(oldRec.orders) || 0 : 0));
        const finalAmount = isMonthlyProd ? 0 : (Number(item.amount) > 0 ? Number(item.amount) : (oldRec ? Number(oldRec.amount) || 0 : 0));

        const entry = {
          userId: String(agObj.id),
          userName: agObj.name,
          team: agObj.team,
          date: item.date,
          lastUpdatedDate: lastUpdateFormatted,
          submittedAt: lastUpdateFormatted,
          leads: finalLeads,
          orders: finalOrders,
          amount: finalAmount,
          ratio: finalLeads > 0 ? Number(((finalOrders / finalLeads) * 100).toFixed(2)) : 0,
          ajwa: isMonthlyProd ? (Number(item.ajwa) || 0) : (Number(item.ajwa) > 0 ? Number(item.ajwa) : (oldRec ? Number(oldRec.ajwa) || 0 : 0)),
          pinkSalt: isMonthlyProd ? (Number(item.pinkSalt) || 0) : (Number(item.pinkSalt) > 0 ? Number(item.pinkSalt) : (oldRec ? Number(oldRec.pinkSalt) || 0 : 0)),
          blackGarlic: isMonthlyProd ? (Number(item.blackGarlic) || 0) : (Number(item.blackGarlic) > 0 ? Number(item.blackGarlic) : (oldRec ? Number(oldRec.blackGarlic) || 0 : 0)),
          sunHoney: isMonthlyProd ? (Number(item.sunHoney) || 0) : (Number(item.sunHoney) > 0 ? Number(item.sunHoney) : (oldRec ? Number(oldRec.sunHoney) || 0 : 0)),
          bsHoney: isMonthlyProd ? (Number(item.bsHoney) || 0) : (Number(item.bsHoney) > 0 ? Number(item.bsHoney) : (oldRec ? Number(oldRec.bsHoney) || 0 : 0)),
          gawaGhee: isMonthlyProd ? (Number(item.gawaGhee) || 0) : (Number(item.gawaGhee) > 0 ? Number(item.gawaGhee) : (oldRec ? Number(oldRec.gawaGhee) || 0 : 0))
        };

        if (existingIdx !== -1) sales[existingIdx] = entry;
        else sales.unshift(entry);

        if (isMonthlyProd) {
          const mKey = item.date.replace('MONTHLY_PROD_', '');
          if (mKey && mKey.length === 7) {
            selectedMonthKey = mKey;
            localStorage.setItem('gb_selected_month', selectedMonthKey);
          }
        } else {
          const mKey = item.date.substring(3);
          if (mKey && mKey.length === 7) {
            selectedMonthKey = mKey;
            localStorage.setItem('gb_selected_month', selectedMonthKey);
          }
          reportsDateFilter = item.date;
        }

        const logMeta = recordActivityLog(
          isMonthlyProd ? 'AI Drive Product Total Import' : (existingIdx !== -1 ? 'AI ERP Updated Report' : 'AI ERP Imported Report'),
          isMonthlyProd
            ? `AI ERP Drive Product Total for ${agObj.name} (Last Update: ${lastUpdateFormatted}) — Ajwa:${entry.ajwa}kg, Salt:${entry.pinkSalt}kg, Garlic:${entry.blackGarlic}kg, Sun.H:${entry.sunHoney}kg, BS.H:${entry.bsHoney}kg, Ghee:${entry.gawaGhee}kg`
            : `AI ERP Import for ${agObj.name} (${item.date}) — Amt: ৳${entry.amount.toLocaleString()}, Orders: ${entry.orders}`
        );
        syncPayloads.push({ ...entry, ...logMeta });
      }

      setStored('sales_records', sales);
      closeModal('aiImportModal');
      renderAppLayout();
      showPortalToast('AI Data Approved & Synced!', `Successfully updated ${approvedRows.length} agent record(s) across Portal & Google Sheet!`, 'success');

      (async () => {
        for (const pl of syncPayloads) {
          await postToSheet('DAILY_SALES_SUBMIT', pl).catch(() => {});
        }
        setTimeout(fetchFromSheet, 1500);
      })();
    }

    async function approveAndSaveAiRecords() {
      if (!hasFeatureAccess(currentUser, 'feat_ai_erp_import')) return;
      const approvedRows = aiDetectedRecords.filter(r => r.selected);
      if (approvedRows.length === 0) {
        showPortalToast('No Rows Selected', 'Please check at least 1 detected row to approve and save!', 'error');
        return;
      }
      const missingAgentRow = approvedRows.find(r => !r.userId);
      if (missingAgentRow) {
        showPortalToast('Select Agent Name First!', 'The uploaded screenshot did not include the Agent Name. Please select the Agent from the highlighted dropdown before clicking Approve!', 'error');
        return;
      }

      const dupApproved = approvedRows.filter(r => r.isDuplicate && !String(r.date || '').startsWith('MONTHLY_PROD_'));
      if (dupApproved.length > 0) {
        openConfirmWarningModal(
          `Update ${dupApproved.length} Existing Record(s)?`,
          `<strong>${dupApproved.length} selected row(s)</strong> already exist in the system for the same Agent & Date.\n\nDo you want to merge/update them with the values from this AI import?`,
          'Duplicate Overwrite Confirmation',
          () => {
            executeAiApprovalCommit(approvedRows);
          },
          'Yes, Approve & Update',
          true
        );
        return;
      }

      executeAiApprovalCommit(approvedRows);
    }

    function getAgentTodayRosterShiftInfo(user) {
      if (!user) return { isDayOff: true, shiftLabel: 'DO', endText: '-' };
      const now = new Date();
      const mKey = `${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
      const rosterList = getRosterForMonth(mKey);
      const myRoster = rosterList.find(r => String(r.id) === String(user.id));
      if (!myRoster) return { isDayOff: false, shiftLabel: '3:00 PM', endHour: 23, endMin: 0, endText: '11:00 PM' };

      const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
      const todayIdx = now.getDay();
      const yesterdayIdx = (todayIdx + 6) % 7;

      const todayShift = String(myRoster[dayKeys[todayIdx]] || '3:00 PM').trim();
      const yesterdayShift = String(myRoster[dayKeys[yesterdayIdx]] || '3:00 PM').trim();

      // Special handling for Night shift (11:00 PM -> 7:00 AM next morning)
      // If it's early morning (before 8:00 AM) and yesterday's shift was Night, the agent is finishing yesterday's Night shift at 7:00 AM today!
      if (now.getHours() < 8 && yesterdayShift.toUpperCase().includes('NIGHT')) {
        return {
          isDayOff: false,
          shiftLabel: 'Night (11:00 PM – 7:00 AM)',
          endHour: 7,
          endMin: 0,
          endText: '7:00 AM',
          shiftDateKey: `${getTodayFormatted()}_NIGHT_END`
        };
      }

      if (todayShift.toUpperCase() === 'DO' || todayShift.toUpperCase().includes('OFF')) {
        return { isDayOff: true, shiftLabel: 'DO (Day Off)', endText: 'Day Off' };
      }

      // 8-Hour Duty Shift Mapping from Roster:
      // 1) "7:00 AM" (Morning) -> 7:00 AM to 3:00 PM (15:00), reminder at 2:55 PM
      // 2) "10:00 AM" (General) -> 10:00 AM to 6:00 PM (18:00), reminder at 5:55 PM
      // 3) "3:00 PM" (Evening) -> 3:00 PM to 11:00 PM (23:00), reminder at 10:55 PM
      // 4) "Night" (11:00 PM) -> 11:00 PM to 7:00 AM, reminder at 6:55 AM
      if (todayShift.includes('7:00')) {
        return {
          isDayOff: false,
          shiftLabel: '7:00 AM – 3:00 PM',
          endHour: 15,
          endMin: 0,
          endText: '3:00 PM',
          shiftDateKey: `${getTodayFormatted()}_7AM`
        };
      }
      if (todayShift.includes('10:00')) {
        return {
          isDayOff: false,
          shiftLabel: '10:00 AM – 6:00 PM',
          endHour: 18,
          endMin: 0,
          endText: '6:00 PM',
          shiftDateKey: `${getTodayFormatted()}_10AM`
        };
      }
      if (todayShift.includes('3:00')) {
        return {
          isDayOff: false,
          shiftLabel: '3:00 PM – 11:00 PM',
          endHour: 23,
          endMin: 0,
          endText: '11:00 PM',
          shiftDateKey: `${getTodayFormatted()}_3PM`
        };
      }
      if (todayShift.toUpperCase().includes('NIGHT') || todayShift.includes('11:00')) {
        return {
          isDayOff: false,
          shiftLabel: 'Night (11:00 PM – 7:00 AM)',
          endHour: 7,
          endMin: 0,
          endText: '7:00 AM',
          shiftDateKey: `${getTodayFormatted()}_NIGHT`
        };
      }

      return {
        isDayOff: false,
        shiftLabel: todayShift,
        endHour: 15,
        endMin: 0,
        endText: '3:00 PM',
        shiftDateKey: `${getTodayFormatted()}_${todayShift}`
      };
    }

    function getBellNotifVisualMeta(n) {
      const act = String(n.actionType || n.title || '').toUpperCase();
      if (n.type === 'admin_notice') {
        return { bg: 'bg-gradient-to-br from-amber-500 to-orange-600 text-white', icon: 'fa-bullhorn', badgeBg: 'bg-orange-100 text-orange-800 border border-orange-200', badgeText: '📢 Official Notice' };
      }
      if (n.type === 'chat_dm') {
        return { bg: 'bg-blue-600 text-white', icon: 'fa-comment-dots', badgeBg: 'bg-blue-100 text-blue-800', badgeText: 'New Message' };
      }
      if (n.type === 'duty_reminder') {
        return { bg: 'bg-amber-500 text-white', icon: 'fa-file-pen', badgeBg: 'bg-amber-100 text-amber-800', badgeText: 'Duty Alert' };
      }
      if (act.includes('DELETE')) {
        return { bg: 'bg-red-600 text-white', icon: 'fa-trash-can', badgeBg: 'bg-red-100 text-red-800', badgeText: 'Deleted' };
      }
      if (act.includes('UPDATE') || act.includes('EDIT')) {
        return { bg: 'bg-indigo-600 text-white', icon: 'fa-pen-to-square', badgeBg: 'bg-indigo-100 text-indigo-800', badgeText: 'Edited' };
      }
      if (act.includes('SUBMIT') || act.includes('IMPORT') || act.includes('SALES')) {
        return { bg: 'bg-emerald-600 text-white', icon: 'fa-file-circle-check', badgeBg: 'bg-emerald-100 text-emerald-800', badgeText: 'Data Added' };
      }
      if (act.includes('LOGIN')) {
        return { bg: 'bg-blue-600 text-white', icon: 'fa-right-to-bracket', badgeBg: 'bg-blue-100 text-blue-800', badgeText: 'Logged In' };
      }
      if (act.includes('LOGOUT')) {
        return { bg: 'bg-slate-600 text-white', icon: 'fa-power-off', badgeBg: 'bg-slate-200 text-slate-700', badgeText: 'Logged Out' };

      if (act.includes('BREAK')) {
        return { bg: 'bg-amber-500 text-white', icon: 'fa-mug-hot', badgeBg: 'bg-amber-100 text-amber-800', badgeText: 'On Break' };

      }
      return { bg: 'bg-purple-600 text-white', icon: 'fa-bell', badgeBg: 'bg-purple-100 text-purple-800', badgeText: 'Activity' };

    function syncAdminBellNotificationsFromActivityLogs(logsList, triggerLivePopup = false) {
      if (!currentUser || !hasFeatureAccess(currentUser, 'feat_bell_floor_alerts') || !Array.isArray(logsList)) return;

      const seenStorageKey = `gb_admin_seen_act_${currentUser.id}`;
      const clearedStorageKey = `gb_admin_cleared_act_${currentUser.id}`;
      let seenSigs = [];
      let clearedSigs = [];
      try { seenSigs = JSON.parse(localStorage.getItem(seenStorageKey) || '[]'); } catch (e) {}
      try { clearedSigs = JSON.parse(localStorage.getItem(clearedStorageKey) || '[]'); } catch (e) {}

      const seenSet = new Set(seenSigs);
      const clearedSet = new Set(clearedSigs);
      const isFirstSeed = seenSet.size === 0;

      const myNotifs = getNotificationsForCurrentUser();
      const existingNotifMap = new Map();
      myNotifs.forEach(n => { if (n.sig) existingNotifMap.set(n.sig, n); });

      const newlyArrivedForToast = [];
      const recentLogs = logsList.slice(0, 60);

      for (let i = recentLogs.length - 1; i >= 0; i--) {
        const log = recentLogs[i];
        if (!log || !log.userId) continue;
        const sig = `${log.date}|${log.time}|${log.userId}|${log.action}|${log.details}`;
        if (clearedSet.has(sig)) continue;

        if (!existingNotifMap.has(sig)) {
          const isSelfAction = String(log.userId) === String(currentUser.id);
          // On initial load, mark older historical logs (index >= 5) as read so badge only highlights recent activity
          const markAsRead = isSelfAction || (isFirstSeed && i >= 5);

          const notifObj = {
            id: 'actnotif_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
            sig: sig,
            userId: String(currentUser.id),
            actorId: String(log.userId),
            actorName: log.userName || ('ID ' + log.userId),
            actorTeam: log.team || '',
            actorRole: log.role || 'agent',
            actionType: log.action || 'Activity',
            date: log.date || getTodayFormatted(),
            time: sanitizeTimeDisplay(log.time),
            title: `${log.userName} (${log.userId}) — ${log.action}`,
            message: log.details || '',
            type: 'admin_activity',
            read: markAsRead
          };

          myNotifs.unshift(notifObj);
          existingNotifMap.set(sig, notifObj);

          if (!seenSet.has(sig)) {
            seenSet.add(sig);
            if (triggerLivePopup && !isFirstSeed && !isSelfAction) {
              newlyArrivedForToast.push(notifObj);
            }
          }
        }
      }

      localStorage.setItem(seenStorageKey, JSON.stringify(Array.from(seenSet).slice(-250)));
      saveNotificationsForCurrentUser(myNotifs.slice(0, 80));

      // Show live top-right toast for newly arrived agent activity (up to 2 most recent at once)
      newlyArrivedForToast.slice(-2).forEach(nObj => {
        const vMeta = getBellNotifVisualMeta(nObj);
        const toastType = nObj.actionType.toUpperCase().includes('DELETE')
          ? 'error'
          : (nObj.actionType.toUpperCase().includes('BREAK') || nObj.actionType.toUpperCase().includes('UPDATE') ? 'warning' : 'success');
        showPortalToast(nObj.title, nObj.message, toastType);
      });
    }

    function checkRosterDutyEndNotification() {
      if (!currentUser || currentUser.role !== 'agent') return;

      const shiftInfo = getAgentTodayRosterShiftInfo(currentUser);
      // Point 4: If agent has Day Off (DO), no duty-end notification will be sent
      if (!shiftInfo || shiftInfo.isDayOff) return;

      const now = new Date();
      const nowTotalMins = now.getHours() * 60 + now.getMinutes();
      const endTotalMins = shiftInfo.endHour * 60 + shiftInfo.endMin;

      // Calculate remaining minutes until shift ends
      const diffMins = endTotalMins - nowTotalMins;

      // Point 2 & 4: Trigger exactly 5 minutes before duty ends (e.g., 2:55 PM for 3:00 PM end)
      // Also catches if tab was inactive/backgrounded and woke up within the last 5 minutes before shift end (1..5 mins)
      if (diffMins > 0 && diffMins <= 5) {
        pushUserNotification(
          'Submit Your Report',
          `Your duty (${shiftInfo.shiftLabel}) ends at ${shiftInfo.endText} (in ${diffMins} min${diffMins === 1 ? '' : 's'}). Please submit your daily sales & product report before logging out!`,
          'duty_reminder',
          shiftInfo.shiftDateKey
        );
      }
    }

    function getChatAndNoticeHubStore() {
      const configs = getStored('monthly_configs', {});

      return {

    function saveChatAndNoticeHubStore(hubData) {
      const configs = getStored('monthly_configs', {});
      const trimmedHub = {
        messages: (hubData.messages || []).slice(-220),
        notices: (hubData.notices || []).slice(-40),

    function isChatMessageVisibleToUser(msg, user) {
      if (!msg || !user) return false;
      if (msg.roomId === 'GLOBAL_GROUP') return true;
      if (msg.roomId === 'TEAM_NAZIM') return canViewAll(user) || user.team === 'Team Nazim';
      if (msg.roomId === 'TEAM_SAMAD') return canViewAll(user) || user.team === 'Team Samad';
      if (String(msg.roomId || '').startsWith('DM_')) {
        const parts = String(msg.roomId).split('_');
        return parts.includes(String(user.id));
      }
      return false;
    }

    function getLastReadMapForUser() {
      if (!currentUser) return {};
      const localMap = (() => {
        try { return JSON.parse(localStorage.getItem(`gb_chat_read_${currentUser.id}`) || '{}'); }
        catch (e) { return {}; }
      })();
      const { readReceipts } = getChatAndNoticeHubStore();
      const cloudMap = readReceipts[String(currentUser.id)] || {};
      const merged = { ...cloudMap };
      Object.keys(localMap).forEach(rId => {
        merged[rId] = Math.max(Number(merged[rId] || 0), Number(localMap[rId] || 0));
      });
      return merged;
    }

    // Marks channel as read locally AND syncs read receipt to cloud if there were unread messages from others
    function markChatChannelRead(channelId, syncToCloudIfNeeded = true) {
      if (!currentUser || !channelId) return;
      const uid = String(currentUser.id);
      const nowTs = Date.now();

      const hub = getChatAndNoticeHubStore();
      if (!hub.readReceipts) hub.readReceipts = {};
      if (!hub.readReceipts[uid]) hub.readReceipts[uid] = {};

      const prevCloudReadTs = Number(hub.readReceipts[uid][channelId] || 0);
      const latestMsgFromOthersTs = hub.messages
        .filter(m => m.roomId === channelId && String(m.senderId) !== uid)
        .reduce((max, m) => Math.max(max, Number(m.ts || 0)), 0);

      const localMap = getLastReadMapForUser();
      localMap[channelId] = Math.max(nowTs, latestMsgFromOthersTs);
      localStorage.setItem(`gb_chat_read_${uid}`, JSON.stringify(localMap));

      if (latestMsgFromOthersTs > prevCloudReadTs) {
        hub.readReceipts[uid][channelId] = Math.max(nowTs, latestMsgFromOthersTs);
        if (syncToCloudIfNeeded) {
          saveChatAndNoticeHubStore(hub);
        } else {
          const configs = getStored('monthly_configs', {});
          configs['CHAT_AND_NOTICES'] = hub;
          setStored('monthly_configs', configs);
        }
      }
    }

    // Returns list of users who have SEEN a specific message!
    function getSeenByUsersForMessage(msg, allUsers) {
      if (!msg) return [];
      const { readReceipts } = getChatAndNoticeHubStore();
      const msgTs = Number(msg.ts || 0);
      const senderId = String(msg.senderId);
      const roomId = String(msg.roomId || '');

      if (roomId.startsWith('DM_')) {
        const parts = roomId.split('_');
        const partnerId = parts[1] === senderId ? parts[2] : parts[1];
        const partnerReadTs = Number((readReceipts[partnerId] && readReceipts[partnerId][roomId]) || 0);
        if (partnerReadTs >= msgTs) {
          const pObj = allUsers.find(u => String(u.id) === String(partnerId));
          return [pObj ? pObj.name : `ID ${partnerId}`];
        }
        return [];
      }

      // Group message: check all users who have read this group channel at or after msgTs
      const seenNames = [];
      allUsers.forEach(usr => {
        const uid = String(usr.id);
        if (uid === senderId) return;
        const uReadTs = Number((readReceipts[uid] && readReceipts[uid][roomId]) || 0);
        if (uReadTs >= msgTs) {
          seenNames.push(usr.name);
        }
      });
      return seenNames;
    }

    function getUnreadCountForChannel(channelId) {
      if (!currentUser) return 0;
      const map = getLastReadMapForUser();
      const lastReadTs = Number(map[channelId] || 0);
      const { messages } = getChatAndNoticeHubStore();
      return messages.filter(m =>
        m.roomId === channelId &&
        String(m.senderId) !== String(currentUser.id) &&
        Number(m.ts || 0) > lastReadTs
      ).length;
    }

    function getUnreadChatCountForUser() {
      if (!currentUser) return 0;
      const map = getLastReadMapForUser();
      const { messages } = getChatAndNoticeHubStore();
      return messages.filter(m => {
        if (!isChatMessageVisibleToUser(m, currentUser)) return false;
        if (String(m.senderId) === String(currentUser.id)) return false;
        const lastReadTs = Number(map[m.roomId] || 0);
        return Number(m.ts || 0) > lastReadTs;
      }).length;
    }

    function getUnreadDmCountForUser() {
      if (!currentUser) return 0;
      const map = getLastReadMapForUser();
      const { messages } = getChatAndNoticeHubStore();
      return messages.filter(m => {
        if (!String(m.roomId || '').startsWith('DM_')) return false;
        if (!isChatMessageVisibleToUser(m, currentUser)) return false;
        if (String(m.senderId) === String(currentUser.id)) return false;
        const lastReadTs = Number(map[m.roomId] || 0);
        return Number(m.ts || 0) > lastReadTs;
      }).length;
    }

    function syncIncomingChatAndNoticesFromConfigs(allConfigs, triggerPopup = false) {
      if (!currentUser || !allConfigs || typeof allConfigs !== 'object') return;
      const hub = allConfigs['CHAT_AND_NOTICES'];
      if (!hub) return;

      const notices = Array.isArray(hub.notices) ? hub.notices : [];
      const messages = Array.isArray(hub.messages) ? hub.messages : [];

      // 1. Process Official Admin Notices into every user's Bell Notification Center!
      const seenNoticeKey = `gb_seen_notices_${currentUser.id}`;
      let seenNotices = [];
      try { seenNotices = JSON.parse(localStorage.getItem(seenNoticeKey) || '[]'); } catch (e) {}
      const seenNoticeSet = new Set(seenNotices);

      const myNotifs = getNotificationsForCurrentUser();
      const existingIds = new Set(myNotifs.map(n => n.id));
      let addedNewNotice = false;

      notices.forEach(nt => {
        if (!nt || !nt.id) return;
        if (nt.targetTeam && nt.targetTeam !== 'ALL' && !canViewAll(currentUser) && currentUser.team !== nt.targetTeam) {
          return;
        }
        const notifId = `notice_${nt.id}`;
        if (!existingIds.has(notifId)) {
          const isSender = String(nt.senderId) === String(currentUser.id);
          const notifObj = {
            id: notifId,
            userId: String(currentUser.id),
            date: nt.date || getTodayFormatted(),
            time: nt.time || getNowTimeStr(),
            title: `📢 ${nt.title || 'Official Notice'} (${nt.senderName})`,
            message: nt.message || '',
            type: 'admin_notice',
            read: isSender
          };
          myNotifs.unshift(notifObj);
          existingIds.add(notifId);
          addedNewNotice = true;

          if (!seenNoticeSet.has(nt.id)) {
            seenNoticeSet.add(nt.id);
            if (!isSender) {
              showPortalToast(notifObj.title, notifObj.message, 'warning');
            }
          }
        }
      });

      if (addedNewNotice) {
        localStorage.setItem(seenNoticeKey, JSON.stringify(Array.from(seenNoticeSet).slice(-100)));
        saveNotificationsForCurrentUser(myNotifs.slice(0, 80));
      }

      // 2. Process incoming Direct Messages (DMs) & Group messages
      const seenMsgKey = `gb_seen_chat_toasts_${currentUser.id}`;
      let seenMsgs = [];
      try { seenMsgs = JSON.parse(localStorage.getItem(seenMsgKey) || '[]'); } catch (e) {}
      const seenMsgSet = new Set(seenMsgs);
      const isInitialChatSeed = seenMsgSet.size === 0;

      messages.slice(-30).forEach(m => {
        if (!m || !m.id) return;
        if (!seenMsgSet.has(m.id)) {
          seenMsgSet.add(m.id);
          if (triggerPopup && !isInitialChatSeed && String(m.senderId) !== String(currentUser.id)) {
            if (isChatMessageVisibleToUser(m, currentUser)) {
              const isDm = String(m.roomId || '').startsWith('DM_');
              if (activeTab === 'chat' && activeChatChannelId === m.roomId) {
                markChatChannelRead(m.roomId, true);
              } else {
                showPortalToast(
                  isDm ? `💬 Personal Message from ${m.senderName}` : `👥 Group Message (${m.senderName})`,
                  m.text,
                  'success'
                );
              }
            }
          }
        }
      });

      localStorage.setItem(seenMsgKey, JSON.stringify(Array.from(seenMsgSet).slice(-220)));
    }

    function handleSendOfficialAnnouncement(e) {
      e.preventDefault();
      if (!hasFeatureAccess(currentUser, 'feat_post_notice')) return;

      const titleVal = (document.getElementById('annTitleInput')?.value || '').trim() || 'Official Notice';
      const targetVal = document.getElementById('annTargetSelect')?.value || 'ALL';
      const msgVal = (document.getElementById('annMessageInput')?.value || '').trim();
      const postInChat = document.getElementById('annAlsoPostInGroupChat')?.checked;
      if (!msgVal) return;

      const hub = getChatAndNoticeHubStore();
      const newNotice = {
        id: 'nt_' + Date.now(),
        senderId: String(currentUser.id),
        senderName: currentUser.name,
        targetTeam: targetVal,
        title: titleVal,
        message: msgVal,
        date: getTodayFormatted(),
        time: getNowTimeStr(),
        ts: Date.now()
      };
      hub.notices.push(newNotice);

      if (postInChat) {
        const roomTarget = targetVal === 'Team Nazim' ? 'TEAM_NAZIM' : (targetVal === 'Team Samad' ? 'TEAM_SAMAD' : 'GLOBAL_GROUP');
        hub.messages.push({
          id: 'msg_' + Date.now() + '_ann',
          roomId: roomTarget,
          senderId: String(currentUser.id),
          senderName: currentUser.name,
          senderRole: currentUser.role,
          senderTeam: currentUser.team,
          text: `📢 [OFFICIAL NOTICE: ${titleVal}] — ${msgVal}`,
          isNotice: true,
          date: newNotice.date,
          time: newNotice.time,
          ts: Date.now()
        });
      }

      // Mark notice as seen by sender before syncing so it never fires a duplicate toast
      const seenNoticeKey = `gb_seen_notices_${currentUser.id}`;
      let seenNotices = [];
      try { seenNotices = JSON.parse(localStorage.getItem(seenNoticeKey) || '[]'); } catch (err) {}
      seenNotices.push(newNotice.id);
      localStorage.setItem(seenNoticeKey, JSON.stringify(seenNotices.slice(-100)));

      saveChatAndNoticeHubStore(hub);
      syncIncomingChatAndNoticesFromConfigs(getStored('monthly_configs', {}), false);

      recordActivityLog('Broadcasted Official Notice', `Sent Notice "${titleVal}" (${targetVal}): ${msgVal}`, false);
      document.getElementById('annMessageInput').value = '';
      closeModal('announceModal');
      renderAppLayout();
      showPortalToast('Official Notice Broadcasted!', `Sent "${titleVal}" to ${targetVal} Bell Notifications.`, 'success');

    function handleSendChatMessage(e) {

      const inputEl = document.getElementById('chatComposerInput');
      const textVal = (inputEl?.value || '').trim();
      if (!textVal) return;

      // Clear input BEFORE renderAppLayout() so renderAppLayout's draft-saver doesn't restore the old text!
      inputEl.value = '';

      const hub = getChatAndNoticeHubStore();
      const nowTs = Date.now();
      const newMsg = {
        id: 'msg_' + nowTs + '_' + Math.random().toString(36).substring(2, 6),
        roomId: activeChatChannelId,
        senderId: String(currentUser.id),
        senderName: currentUser.name,
        senderRole: currentUser.role,
        senderTeam: currentUser.team,
        text: textVal,
        date: getTodayFormatted(),
        time: getNowTimeStr(),
        ts: nowTs
      };

      hub.messages.push(newMsg);
      if (!hub.readReceipts) hub.readReceipts = {};
      if (!hub.readReceipts[String(currentUser.id)]) hub.readReceipts[String(currentUser.id)] = {};
      hub.readReceipts[String(currentUser.id)][activeChatChannelId] = nowTs;

      const configs = getStored('monthly_configs', {});
      configs['CHAT_AND_NOTICES'] = {
        messages: (hub.messages || []).slice(-220),
        notices: (hub.notices || []).slice(-40),
        readReceipts: hub.readReceipts || {}
      };
      setStored('monthly_configs', configs);
      markChatChannelRead(activeChatChannelId, false);

      // Render immediately on sender's screen in 0ms
      renderAppLayout();
      const refreshedInput = document.getElementById('chatComposerInput');
      if (refreshedInput) refreshedInput.focus();

      // Send lightweight atomic SEND_CHAT_MESSAGE to Google Sheet + fast sync!
      postToSheet('SEND_CHAT_MESSAGE', {
        messageObj: newMsg,
        monthKey: 'CHAT_AND_NOTICES',
        configJson: JSON.stringify(configs['CHAT_AND_NOTICES'])
      }).then(() => {
        fetchFromSheet();
      }).catch(() => {});

    function renderChatHubView() {
      const u = currentUser;
      const allUsers = getUsersForMonth(selectedMonthKey);
      const { messages, notices } = getChatAndNoticeHubStore();

      markChatChannelRead(activeChatChannelId, true);

      // Build available Group Channels
      const groupChannels = [
        { id: 'GLOBAL_GROUP', name: '🌐 Full Floor Group (All)', subtitle: 'Everyone — Admins, Supervisor & All Agents', badgeColor: 'bg-blue-600' }
      ];
      if (canViewAll(u) || u.team === 'Team Nazim') {
        groupChannels.push({ id: 'TEAM_NAZIM', name: '🟠 Team Nazim Group', subtitle: 'TL Nazim & Team Nazim Agents', badgeColor: 'bg-orange-500' });
      }
      if (canViewAll(u) || u.team === 'Team Samad') {
        groupChannels.push({ id: 'TEAM_SAMAD', name: '🔵 Team Samad Group', subtitle: 'TL Samad & Team Samad Agents', badgeColor: 'bg-indigo-600' });
      }

      const groupUnreadTotal = groupChannels.reduce((acc, gc) => acc + getUnreadCountForChannel(gc.id), 0);
      const dmUnreadTotal = getUnreadDmCountForUser();

      // Build Direct Message (1-on-1) contacts list
      // Priority sorting:
      // 1) Users with UNREAD messages waiting for you at the very top!
      // 2) Users with recent conversation history
      // 3) Online / On Break status
      const otherUsers = allUsers
        .filter(usr => String(usr.id) !== String(u.id))
        .filter(usr => {
          if (activeChatLeftFilter === 'ADMINS') return usr.role === 'admin' || usr.role === 'supervisor';
          if (activeChatLeftFilter === 'AGENTS') return usr.role === 'agent';
          return true;
        })
        .filter(usr => {
          if (!chatSearchQuery.trim()) return true;
          const q = chatSearchQuery.toLowerCase();
          return usr.name.toLowerCase().includes(q) || String(usr.id).includes(q) || (usr.team || '').toLowerCase().includes(q);
        })
        .map(usr => {
          const dmId = getDmRoomId(u.id, usr.id);
          const unreadCnt = getUnreadCountForChannel(dmId);
          const dmMsgs = messages.filter(m => m.roomId === dmId);
          const lastMsg = dmMsgs.length > 0 ? dmMsgs[dmMsgs.length - 1] : null;
          const lastTs = lastMsg ? Number(lastMsg.ts || 0) : 0;
          return { usr, dmId, unreadCnt, lastMsg, lastTs, totalDmMsgs: dmMsgs.length };
        })
        .filter(item => {
          if (activeChatLeftFilter === 'INBOX') {
            return item.totalDmMsgs > 0 || item.unreadCnt > 0;
          }
          return true;
        })
        .sort((a, b) => {
          if (b.unreadCnt !== a.unreadCnt) return b.unreadCnt - a.unreadCnt;
          if (b.lastTs !== a.lastTs) return b.lastTs - a.lastTs;
          const stRank = (usr) => {
            const st = getUserOnlineStatus(usr.id);
            return st === 'Online' ? 1 : (st === 'On Break' ? 2 : 3);
          };
          return stRank(a.usr) - stRank(b.usr);
        });

      // Determine active channel header details
      let activeHeaderTitle = '🌐 Full Floor Group (All)';
      let activeHeaderSub = 'Group Chat • All Admins, Supervisor & Agents can communicate here';
      let activeHeaderBadge = renderOnlineStatusBadge(u.id);
      let isDmChannel = false;

      const matchedGroup = groupChannels.find(g => g.id === activeChatChannelId);
      if (matchedGroup) {
        activeHeaderTitle = matchedGroup.name;
        activeHeaderSub = matchedGroup.subtitle;
      } else if (String(activeChatChannelId).startsWith('DM_')) {
        isDmChannel = true;
        const parts = String(activeChatChannelId).split('_');
        const partnerId = parts[1] === String(u.id) ? parts[2] : parts[1];
        const partnerObj = allUsers.find(usr => String(usr.id) === String(partnerId));
        if (partnerObj) {
          activeHeaderTitle = `${partnerObj.name} (${partnerObj.id})`;
          activeHeaderSub = `Personal 1-on-1 Inbox • ${partnerObj.role === 'admin' ? 'Team Leader (Admin)' : (partnerObj.role === 'supervisor' ? 'Supervisor' : `${partnerObj.team} • Grade ${partnerObj.grade}`)}`;
          activeHeaderBadge = renderOnlineStatusBadge(partnerObj.id);
        }
      }

    function openUserRoleControlForId(targetId) {

    function onRoleMgmtSearchInput(val) {
      roleMgmtSearchQuery = String(val || '');

        el.focus();

    function handleToggleSingleUserFeature(targetUserId, featureKey, checkboxEl) {
      if (!isSuperAdmin(currentUser)) return;
      const uid = String(targetUserId);
      if (uid === '10122') return;

      const allUsers = getUsersForMonth(selectedMonthKey);
      const targetUser = allUsers.find(u => String(u.id) === uid);
      if (!targetUser) return;

      const featObj = PORTAL_FEATURES_CATALOG.find(f => f.key === featureKey);
      const featName = featObj ? featObj.label : featureKey;
      const isChecked = checkboxEl.checked;

      // Revert checkbox visually until confirmed
      checkboxEl.checked = !isChecked;

      openConfirmWarningModal(
        `Confirm Permission Change?`,
        `Are you sure you want to <strong>${isChecked ? 'ENABLE' : 'DISABLE'}</strong> feature <strong>"${featName}"</strong> for <strong>${targetUser.name} (${uid})</strong>?`,
        'Role & Access Confirmation',
        async () => {
          const permStore = getRolePermissionsStore();
          if (!permStore[uid]) {
            permStore[uid] = { ...getDefaultFeaturePermissionsForRole(targetUser.role) };
          }
          permStore[uid][featureKey] = Boolean(isChecked);
          saveRolePermissionsStore(permStore);

          recordActivityLog(
            'Updated Feature Access',
            `Nazim ${isChecked ? 'ENABLED' : 'DISABLED'} "${featName}" for ${targetUser.name} (${uid})`,
            true
          );
          renderAppLayout();
          showPortalToast(
            isChecked ? 'Feature Enabled & Synced' : 'Feature Revoked & Synced',
            `"${featName}" is now ${isChecked ? 'ACTIVE' : 'OFF'} for ${targetUser.name} (${uid}).`,
            isChecked ? 'success' : 'warning'
          );
        },
        'Yes, Confirm Change',
        true
      );
    }

    function handleApplyRolePresetToUser(targetUserId, presetType) {
      if (!isSuperAdmin(currentUser)) return;
      const uid = String(targetUserId);
      if (uid === '10122') return;

      const allUsers = getUsersForMonth(selectedMonthKey);
      const targetUser = allUsers.find(u => String(u.id) === uid);
      if (!targetUser) return;

      openConfirmWarningModal(
        `Apply Preset "${presetType}"?`,
        `Are you sure you want to apply preset template <strong>"${presetType}"</strong> to <strong>${targetUser.name} (${uid})</strong>? This will update all their feature permissions instantly upon confirmation.`,
        'Role Preset Confirmation',
        async () => {
          const permStore = getRolePermissionsStore();
          if (presetType === 'RESET_DEFAULT') {
            delete permStore[uid];
          } else if (presetType === 'FULL_ADMIN') {
            permStore[uid] = { ...getDefaultFeaturePermissionsForRole('admin') };
          } else if (presetType === 'SUPERVISOR_VIEW') {
            permStore[uid] = { ...getDefaultFeaturePermissionsForRole('supervisor') };
          } else if (presetType === 'STANDARD_AGENT') {
            permStore[uid] = { ...getDefaultFeaturePermissionsForRole('agent') };
          } else if (presetType === 'ENABLE_ALL') {
            const allOn = {};
            PORTAL_FEATURES_CATALOG.forEach(f => { allOn[f.key] = true; });
            permStore[uid] = allOn;
          }

          saveRolePermissionsStore(permStore);
          recordActivityLog(
            'Applied Role Preset',
            `Nazim applied "${presetType}" permission preset to ${targetUser.name} (${uid})`,
            true
          );
          renderAppLayout();
          showPortalToast('Permission Preset Applied!', `Updated all feature switches for ${targetUser.name} (${uid}).`, 'success');
        },
        'Yes, Apply Preset',
        true
      );
    }

    function handleChangeBaseRoleFromAccessPanel(targetUserId, newRoleVal) {
      if (!isSuperAdmin(currentUser)) return;
      const uid = String(targetUserId);
      if (uid === '10122') return;

      let users = getStored('users', DEFAULT_USERS);
      const idx = users.findIndex(u => String(u.id) === uid);
      if (idx === -1) return;

      users[idx].role = newRoleVal;
      if (newRoleVal === 'admin') users[idx].grade = 'TL';
      else if (newRoleVal === 'supervisor') {
        users[idx].grade = 'Supervisor';
        users[idx].team = 'All Teams';
      }
      users[idx] = normalizeUserRecord(users[idx]);
      setStored('users', users);

      const permStore = getRolePermissionsStore();
      permStore[uid] = { ...getDefaultFeaturePermissionsForRole(newRoleVal) };
      saveRolePermissionsStore(permStore);

      const logMeta = recordActivityLog(
        'Changed User Base Role',
        `Nazim changed ${users[idx].name} (${uid}) primary role to ${newRoleVal.toUpperCase()}`,
        false
      );
      postToSheet('SAVE_USER', { ...users[idx], ...logMeta }).catch(() => {});

      renderAppLayout();
      showPortalToast('Primary Role Updated!', `${users[idx].name} (${uid}) is now set as ${newRoleVal.toUpperCase()}.`, 'success');
    }

      }

      const filteredUsers = controllableUsers.filter(u => {
        if (roleMgmtTeamFilter === 'ADMIN_SUP' && u.role === 'agent') return false;
        if (roleMgmtTeamFilter === 'Team Nazim' && u.team !== 'Team Nazim') return false;
        if (roleMgmtTeamFilter === 'Team Samad' && u.team !== 'Team Samad') return false;
        if (roleMgmtSearchQuery.trim()) {
          const q = roleMgmtSearchQuery.toLowerCase();
          return u.name.toLowerCase().includes(q) || String(u.id).includes(q) || (u.team || '').toLowerCase().includes(q);
        }
        return true;
      });

      const targetUser = controllableUsers.find(u => String(u.id) === String(selectedRoleMgmtUserId)) || controllableUsers[0];
      const targetPerms = targetUser ? getEffectivePermissionsForUser(targetUser) : {};
      const permStore = getRolePermissionsStore();
      const hasCustomOverride = targetUser && Boolean(permStore[String(targetUser.id)]);

      const categories = ['Sidebar Tabs', 'Floor Visibility', 'Action Capabilities'];
      const totalEnabledForTarget = PORTAL_FEATURES_CATALOG.filter(f => targetPerms[f.key]).length;

      return `
        <div class="space-y-5">
          <!-- Top Hero Banner -->
          <div class="p-5 rounded-3xl bg-gradient-to-r from-slate-900 via-purple-950 to-indigo-950 text-white shadow-xl flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border border-purple-500/30">
            <div class="flex items-center gap-4">
              <div class="w-13 h-13 p-3.5 rounded-2xl bg-gradient-to-br from-purple-500 to-indigo-600 text-white flex items-center justify-center text-2xl shadow-lg shrink-0">
                <i class="fa-solid fa-user-shield"></i>
              </div>
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase bg-amber-400 text-slate-950 shadow">
                    <i class="fa-solid fa-crown mr-1"></i>Nazim Exclusive Master Panel (ID: 10122)
                  </span>
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-white/10 text-purple-200 border border-white/15">
                    Invisible to Other Admins, Supervisors & Agents
                  </span>
                </div>
                <h2 class="text-xl font-black text-white mt-1.5">Granular ID-by-ID Role & Feature Access Control</h2>
                <p class="text-xs font-bold text-slate-300 mt-0.5">
                  Select any Employee ID on the left and toggle ON/OFF exactly which tabs, buttons, and admin features that specific ID can use!
                </p>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-2.5 shrink-0">
              <div class="p-3 rounded-2xl bg-white/10 border border-white/20 flex items-center gap-3">
                <div>
                  <span class="text-[9px] font-black uppercase text-amber-300 block">Monthly Sprint Target Tab (${selectedMonthKey})</span>
                  <strong class="text-xs font-extrabold text-white">${isSprintSystemActiveForMonth(selectedMonthKey) ? '✅ Active for All Agents' : '🚫 Deactivated for Agents'}</strong>
                </div>
                <button type="button" onclick="toggleSprintSystemForMonth('${selectedMonthKey}')" class="px-3 py-2 rounded-xl text-xs font-black shadow transition-colors ${isSprintSystemActiveForMonth(selectedMonthKey) ? 'bg-rose-500 hover:bg-rose-600 text-white' : 'bg-emerald-500 hover:bg-emerald-600 text-white'}">
                  <i class="fa-solid ${isSprintSystemActiveForMonth(selectedMonthKey) ? 'fa-power-off' : 'fa-bolt'} mr-1"></i>
                  ${isSprintSystemActiveForMonth(selectedMonthKey) ? 'Deactivate Sprint' : 'Activate Sprint'}
                </button>
              </div>
              <div class="px-4 py-2.5 rounded-2xl bg-white/10 border border-white/15 text-right">
                <span class="text-[10px] font-extrabold uppercase text-purple-300 block">Controllable IDs</span>
                <strong class="text-lg font-black text-white">${controllableUsers.length} Accounts</strong>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <!-- Left Column: Select Any Employee ID -->
            <div class="lg:col-span-4 card-dynamic overflow-hidden flex flex-col max-h-[760px]">
              <div class="p-4 bg-white border-b border-slate-200 space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="text-xs font-black uppercase tracking-wider text-slate-900">
                    <i class="fa-solid fa-id-badge text-purple-600 mr-1.5"></i>1. Select Employee ID
                  </h3>
                  <span class="text-[10px] font-extrabold text-slate-400">${filteredUsers.length} shown</span>
                </div>

                <!-- Filter Pills -->
                <div class="flex flex-wrap gap-1">
                  ${[
                    { key: 'ALL', label: 'All IDs' },
                    { key: 'ADMIN_SUP', label: 'TL / Sup' },
                    { key: 'Team Nazim', label: 'Team Nazim' },
                    { key: 'Team Samad', label: 'Team Samad' }
                  ].map(f => `
                    <button type="button" onclick="setRoleMgmtTeamFilter('${f.key}')" class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold transition-colors ${roleMgmtTeamFilter === f.key ? 'bg-purple-600 text-white shadow' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'}">
                      ${f.label}
                    </button>
                  `).join('')}
                </div>

                <!-- Search Input -->
                <div class="relative">
                  <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-3 top-2.5"></i>
                  <input type="text" id="roleMgmtUserSearchInput" value="${roleMgmtSearchQuery}" oninput="onRoleMgmtSearchInput(this.value)" placeholder="Search by name or ID (e.g. 10191)..." class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:bg-white">
                </div>
              </div>

              <div id="roleLeftSidebarViewport" class="flex-1 overflow-y-auto p-2.5 space-y-1.5 bg-slate-50/50">
                ${filteredUsers.map(usr => {
                  const isSel = targetUser && String(usr.id) === String(targetUser.id);
                  const uPerms = getEffectivePermissionsForUser(usr);
                  const activeFeatCount = PORTAL_FEATURES_CATALOG.filter(f => uPerms[f.key]).length;
                  const isCustom = Boolean(permStore[String(usr.id)]);
                  const roleBadge = usr.role === 'admin'
                    ? 'bg-purple-100 text-purple-800'
                    : (usr.role === 'supervisor' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-200 text-slate-700');

                  return `
                    <button type="button" onclick="selectRoleMgmtUser('${usr.id}')" class="w-full p-3 rounded-2xl text-left flex items-center justify-between gap-2.5 transition-colors ${isSel ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md' : 'bg-white hover:bg-purple-50/60 text-slate-800 border border-slate-200/80'}">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-9 h-9 rounded-xl ${isSel ? 'bg-white/20 text-white' : 'bg-purple-100 text-purple-700'} flex items-center justify-center font-black text-xs shrink-0">
                          ${usr.name.charAt(0)}
                        </div>
                        <div class="min-w-0">
                          <div class="flex items-center gap-1.5">
                            <span class="text-xs font-extrabold truncate">${usr.name}</span>
                            <span class="text-[10px] font-mono font-black ${isSel ? 'text-purple-200' : 'text-blue-600'}">(${usr.id})</span>
                          </div>
                          <div class="flex items-center gap-1.5 mt-0.5">
                            <span class="px-1.5 py-0.2 rounded text-[9px] font-black uppercase ${isSel ? 'bg-white/20 text-white' : roleBadge}">${usr.role}</span>
                            <span class="text-[10px] font-bold ${isSel ? 'text-purple-100' : 'text-slate-400'}">${usr.team}</span>
                            ${isCustom ? `<span class="px-1.5 py-0.2 rounded text-[8px] font-black uppercase ${isSel ? 'bg-amber-400 text-slate-950' : 'bg-amber-100 text-amber-800'}">Customized</span>` : ''}
                          </div>
                        </div>
                      </div>
                      <div class="text-right shrink-0">
                        <span class="px-2 py-1 rounded-lg text-[10px] font-black ${isSel ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-700'}">
                          ${activeFeatCount}/${PORTAL_FEATURES_CATALOG.length}
                        </span>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Right Column: Feature-by-Feature Switches for Selected ID -->
            <div class="lg:col-span-8 space-y-4">
              ${targetUser ? `
              <!-- Selected User Control Header -->
              <div class="card-dynamic p-5 bg-white border-t-4 border-t-purple-600">
                <div class="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 pb-4 border-b border-slate-100">
                  <div class="flex items-center gap-3.5">
                    <div class="w-12 h-12 rounded-2xl bg-purple-600 text-white flex items-center justify-center font-black text-lg shadow">
                      ${targetUser.name.charAt(0)}
                    </div>
                    <div>
                      <div class="flex flex-wrap items-center gap-2">
                        <h3 class="text-lg font-black text-slate-900">${targetUser.name}</h3>
                        <span class="px-2.5 py-0.5 rounded-lg bg-blue-50 text-blue-700 font-mono text-xs font-black">ID: ${targetUser.id}</span>
                        ${renderOnlineStatusBadge(targetUser.id)}
                        ${hasCustomOverride ? `<span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-black uppercase"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Custom Feature Set Active</span>` : `<span class="px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-bold uppercase">Default Role Permissions</span>`}
                      </div>
                      <p class="text-xs font-bold text-slate-500 mt-1">
                        Team: <strong class="text-slate-800">${targetUser.team}</strong> • Grade: <strong class="text-slate-800">${targetUser.grade}</strong> • Active Features: <strong class="text-purple-600">${totalEnabledForTarget} of ${PORTAL_FEATURES_CATALOG.length} Enabled</strong>
                      </p>
                    </div>
                  </div>

                  <!-- Primary Role Switcher -->
                  <div class="flex items-center gap-2 bg-slate-50 p-2 rounded-2xl border border-slate-200">
                    <span class="text-[10px] font-black uppercase text-slate-500 pl-1">Base Role:</span>
                    <select onchange="promptChangeBaseRole('${targetUser.id}', this)" class="px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-extrabold text-slate-900 cursor-pointer">
                      <option value="agent" ${targetUser.role === 'agent' ? 'selected' : ''}>Sales Agent</option>
                      <option value="supervisor" ${targetUser.role === 'supervisor' ? 'selected' : ''}>Supervisor (View All)</option>
                      <option value="admin" ${targetUser.role === 'admin' ? 'selected' : ''}>Admin / TL</option>
                    </select>
                  </div>
                </div>

                <!-- 1-Click Preset Templates -->
                <div class="pt-3.5 flex flex-wrap items-center justify-between gap-2">
                  <span class="text-[11px] font-extrabold text-slate-500"><i class="fa-solid fa-bolt text-amber-500 mr-1"></i>Quick Role Templates for ${targetUser.name.split(' ')[0]}:</span>
                  <div class="flex flex-wrap items-center gap-1.5">
                    <button type="button" onclick="handleApplyRolePresetToUser('${targetUser.id}', 'STANDARD_AGENT')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-extrabold">
                      Agent Default
                    </button>
                    <button type="button" onclick="handleApplyRolePresetToUser('${targetUser.id}', 'SUPERVISOR_VIEW')" class="px-3 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-extrabold">
                      Supervisor (View All)
                    </button>
                    <button type="button" onclick="handleApplyRolePresetToUser('${targetUser.id}', 'FULL_ADMIN')" class="px-3 py-1.5 rounded-xl bg-purple-50 hover:bg-purple-100 text-purple-700 text-[11px] font-extrabold">
                      Full Admin Access
                    </button>
                    <button type="button" onclick="handleApplyRolePresetToUser('${targetUser.id}', 'RESET_DEFAULT')" class="px-3 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-[11px] font-extrabold">
                      <i class="fa-solid fa-rotate-left mr-1"></i>Reset to Role Default
                    </button>
                  </div>
                </div>
              </div>

              <!-- Feature Categories & Toggle Cards -->
              ${categories.map(catName => {
                const catFeatures = PORTAL_FEATURES_CATALOG.filter(f => f.category === catName);
                return `
                  <div class="card-dynamic p-5 bg-white">
                    <div class="flex items-center justify-between mb-3.5 pb-2 border-b border-slate-100">
                      <h4 class="text-xs font-black uppercase tracking-wider text-slate-800">
                        <i class="fa-solid fa-sliders text-purple-600 mr-1.5"></i>${catName} (${catFeatures.filter(f => targetPerms[f.key]).length}/${catFeatures.length} Active)
                      </h4>
                      <span class="text-[10px] font-bold text-slate-400">Click any switch to add/remove feature for ID ${targetUser.id}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                      ${catFeatures.map(feat => {
                        const isOn = Boolean(targetPerms[feat.key]);
                        return `
                          <label class="p-3.5 rounded-2xl border transition-colors cursor-pointer flex items-start justify-between gap-3 ${isOn ? 'bg-purple-50/40 border-purple-300 shadow-xs' : 'bg-slate-50/70 border-slate-200 opacity-75 hover:opacity-100'}">
                            <div class="flex items-start gap-3 min-w-0">
                              <div class="w-9 h-9 rounded-xl ${isOn ? 'bg-purple-600 text-white' : 'bg-slate-200 text-slate-500'} flex items-center justify-center text-xs shrink-0 mt-0.5 shadow-xs transition-colors">
                                <i class="fa-solid ${feat.icon}"></i>
                              </div>
                              <div class="min-w-0">
                                <div class="flex items-center gap-1.5">
                                  <span class="text-xs font-black text-slate-900">${feat.label}</span>
                                </div>
                                <p class="text-[11px] font-semibold text-slate-500 mt-0.5 leading-snug">${feat.desc}</p>
                              </div>
                            </div>
                            <div class="shrink-0 pt-1">
                              <input type="checkbox" ${isOn ? 'checked' : ''} onchange="handleToggleSingleUserFeature('${targetUser.id}', '${feat.key}', this)" class="w-5 h-5 accent-purple-600 rounded cursor-pointer">
                            </div>
                          </label>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }


    window.addEventListener('load', init);
  </script>
</body>
</html>
