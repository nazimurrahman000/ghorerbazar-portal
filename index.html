    function getNowTimeStr() {
      return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function sanitizeTimeDisplay(raw) {
      if (!raw || raw === '--:--') return '--:--';
      let s = String(raw).replace(/^'/, '').trim();
      if (s.includes('1899') || s.includes('GMT') || s.includes('মানক')) {
        const d = new Date(s.replace(/\s*\(.*?\)\s*/g, ''));
        if (!isNaN(d.getTime())) {
          return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        const m = s.match(/(\d{1,2}:\d{2}:\d{2})/);
        if (m) return m[1];
      }
      return s;
    }
    function dateToInputVal(dateStr) {
      if (!dateStr || dateStr === 'ALL') return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/'); if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }
    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }
    function cleanDisplayDate(raw) {
      if (!raw) return getTodayFormatted();
      let s = String(raw).trim();
      const p = s.split('/');
      if (p.length === 3) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const mIdx = parseInt(p[1], 10) - 1;
        if (mIdx >= 0 && mIdx < 12) return `${p[0]} ${months[mIdx]} ${p[2]}`;
      }
      return s;
    }
    function formatHMS(sec) {
      sec = Math.max(0, Math.floor(Number(sec) || 0));
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function recordActivityLog(actionTitle, detailsText, sendStandaloneSync = false) {

        userId: String(currentUser.id),
        userName: currentUser.name,
        role: currentUser.role,
        team: currentUser.team,
        action: actionTitle,
        details: detailsText
      };
      let logs = getStored('activity_logs', []);
      logs.unshift(logEntry);
      if (logs.length > 300) logs = logs.slice(0, 300);
      setStored('activity_logs', logs);

      const meta = {
        actorId: logEntry.userId,
        actorName: logEntry.userName,
        actorRole: logEntry.role,
        actorTeam: logEntry.team,
        logDate: logEntry.date,
        logTime: logEntry.time,
        logAction: logEntry.action,
        logDetails: logEntry.details
      };
      if (sendStandaloneSync) {
        postToSheet('ACTIVITY_LOG', meta);
      }
      return meta;
    }

    function getUserOnlineStatus(userId) {
      const uid = String(userId);
      if (currentUser && String(currentUser.id) === uid) {
        if (currentUser.role === 'agent') {
          const today = getTodayFormatted();
          const myAtt = getStored('attendance_records', []).find(a => String(a.userId) === uid && a.date === today);
          if (myAtt && myAtt.status === 'On Break') return 'On Break';
        }
        return 'Online';
      }

      const now = Date.now();
      const onlineList = getStored('online_users', []);
      const oRec = onlineList.find(o => String(o.id) === uid);
      if (oRec && oRec.state !== 'Offline' && oRec.lastSeen && (now - Number(oRec.lastSeen)) < 180000) {
        return oRec.state === 'On Break' ? 'On Break' : 'Online';
      }

      const today = getTodayFormatted();
      const attRec = getStored('attendance_records', []).find(a => String(a.userId) === uid && a.date === today);
      if (attRec && attRec.status !== 'Completed') {
        if (attRec.lastTick && (now - Number(attRec.lastTick)) < 180000) {
          return attRec.status === 'On Break' ? 'On Break' : 'Online';
        }
      }
      return 'Offline';
    }

      const configs = getStored('monthly_configs', {});
      const mCfg = configs[mKey || selectedMonthKey] || {};
      const prodOverrides = mCfg.products || {};
      const result = {};
      Object.keys(DEFAULT_PRODUCTS).forEach(k => {

    function getUsersForMonth(mKey) {
      const baseUsers = getStored('users', DEFAULT_USERS).map(normalizeUserRecord);
      const configs = getStored('monthly_configs', {});
      const mCfg = configs[mKey || selectedMonthKey] || {};

          updated.grade = userOverrides[u.id].grade || u.grade;
          updated.baseTarget = Number(userOverrides[u.id].baseTarget ?? u.baseTarget);
        }

    function getRosterForMonth(mKey) {
      const mk = mKey || selectedMonthKey;
      const savedList = getStored('roster_records', []);
      const monthRows = savedList.filter(r => r.monthKey === mk);
      const allUsers = getStored('users', DEFAULT_USERS).map(normalizeUserRecord);

      return DEFAULT_ROSTER.map(defRow => {
        const override = monthRows.find(r => String(r.id) === String(defRow.id));
        const usr = allUsers.find(u => String(u.id) === String(defRow.id));
        return {
          ...defRow,
          name: usr ? usr.name : defRow.name,
          ...(override || {})
        };
      });
    }

    // NOTIFICATION ENGINE: Auto Detects End of Duty (5 mins before) from Roster
    function checkAgentDutyReminders() {
      if (!currentUser || currentUser.role !== 'agent') return;
      const roster = getRosterForMonth(selectedMonthKey);
      const myRow = roster.find(r => String(r.id) === String(currentUser.id));
      if (!myRow) return;

      const days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
      const todayDayKey = days[new Date().getDay()];
      const shiftStr = String(myRow[todayDayKey] || '3:00 PM').trim();

      if (shiftStr === 'DO') return; // Day off today

      // Calculate Shift End Time (8 Hours Duty)
      // Morning 7:00 AM -> Ends at 3:00 PM (15:00)
      // General 10:00 AM -> Ends at 6:00 PM (18:00)
      // Evening 3:00 PM -> Ends at 11:00 PM (23:00)
      // Night 11:00 PM -> Ends next morning at 7:00 AM (07:00)
      let endHour = 23, endMinute = 0;
      if (shiftStr.includes('7:00')) { endHour = 15; endMinute = 0; }
      else if (shiftStr.includes('10:00')) { endHour = 18; endMinute = 0; }
      else if (shiftStr.includes('3:00')) { endHour = 23; endMinute = 0; }
      else if (shiftStr.toUpperCase().includes('NIGHT')) { endHour = 7; endMinute = 0; }

      const now = new Date();
      const currentH = now.getHours();
      const currentM = now.getMinutes();

      // Check if current time is within 5 minutes before end of duty
      let minutesUntilEnd = (endHour * 60 + endMinute) - (currentH * 60 + currentM);
      if (minutesUntilEnd < 0 && shiftStr.toUpperCase().includes('NIGHT')) {
        minutesUntilEnd += 1440;
      }

      if (minutesUntilEnd > 0 && minutesUntilEnd <= 5) {
        const notifKey = `remind_submit_${getTodayFormatted()}_${currentUser.id}`;
        if (!localStorage.getItem(notifKey)) {
          localStorage.setItem(notifKey, 'sent');
          triggerNotification(
            "Submit Your Daily Sales Report",
            "Your shift ends in 5 minutes! Please submit your daily leads, orders & product sales report before logging out.",
            "report_reminder"
          );
        }
      }
    }

    function ensureAgentAttendanceSession(user) {
      if (!user || user.role !== 'agent') return null;
      const today = getTodayFormatted();
      let attList = getStored('attendance_records', []);
      let rec = attList.find(a => String(a.userId) === String(user.id) && a.date === today);

      if (!rec) {
        rec = {
          date: today,
          userId: String(user.id),
          userName: user.name,
          team: user.team,
          loginTime: getNowTimeStr(),
          logoutTime: '--:--',
          status: 'Working',
          breakReason: '-',
          breakLogs: '-',
          activeSeconds: 0,
          breakSeconds: 0,
          lastTick: Date.now()
        };
        attList.unshift(rec);
        setStored('attendance_records', attList);
        postToSheet('ATTENDANCE_SYNC', rec);
      } else {
        rec.loginTime = sanitizeTimeDisplay(rec.loginTime);
        rec.logoutTime = sanitizeTimeDisplay(rec.logoutTime);
        if (rec.status === 'Completed') {
          rec.status = 'Working';
          rec.logoutTime = '--:--';
        }
        rec.lastTick = Date.now();
        setStored('attendance_records', attList);
      }
      return rec;
    }

    function startLiveDutyClock() {
      if (dutyTimerInterval) clearInterval(dutyTimerInterval);
      dutyTimerInterval = setInterval(() => {
        if (!currentUser || currentUser.role !== 'agent') return;
        const today = getTodayFormatted();
        let attList = getStored('attendance_records', []);
        let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
        if (!rec || rec.status === 'Completed') return;

        const now = Date.now();
        const elapsed = Math.max(1, Math.round((now - (rec.lastTick || now)) / 1000));
        rec.lastTick = now;

        if (rec.status === 'On Break') {
          rec.breakSeconds = (Number(rec.breakSeconds) || 0) + elapsed;
        } else if (rec.status === 'Working') {
          rec.activeSeconds = (Number(rec.activeSeconds) || 0) + elapsed;
        }
        setStored('attendance_records', attList);

        const wClock = document.getElementById('live-work-timer');
        const bClock = document.getElementById('live-break-timer');
        if (wClock) wClock.textContent = formatHMS(rec.activeSeconds);
        if (bClock) bClock.textContent = formatHMS(rec.breakSeconds);

        if ((rec.activeSeconds + rec.breakSeconds) % 25 === 0) {
          postToSheet('ATTENDANCE_SYNC', rec);
        }
      }, 1000);
    }

    async function handleStartBreak(e) {
      e.preventDefault();
      if (!currentUser) return;
      const reason = document.getElementById('breakReasonSelect').value;
      const note = document.getElementById('breakCustomNote').value.trim();
      const fullReason = note ? `${reason} (${note})` : reason;

      const today = getTodayFormatted();
      let attList = getStored('attendance_records', []);
      let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
      if (!rec) rec = ensureAgentAttendanceSession(currentUser);

      rec.status = 'On Break';
      rec.breakReason = fullReason;
      rec.lastTick = Date.now();
      const logEntry = `${fullReason} at ${getNowTimeStr()}`;
      rec.breakLogs = (!rec.breakLogs || rec.breakLogs === '-') ? logEntry : `${rec.breakLogs} | ${logEntry}`;

      setStored('attendance_records', attList);
      const logMeta = recordActivityLog('Started Break', `Took a break — Reason: ${fullReason}`);
      await postToSheet('ATTENDANCE_SYNC', { ...rec, ...logMeta });
      closeModal('breakModal');
      renderAppLayout();
    }

    async function handleResumeWork() {
      if (!currentUser) return;
      const today = getTodayFormatted();
      let attList = getStored('attendance_records', []);
      let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);

    function getTargetData(user, scopeOverride, mKey) {
      const allUsers = getUsersForMonth(mKey || selectedMonthKey);
      let baseTarget = 0;
      let agentCount = 1;
      
      if (canViewAll(user)) {
        const defaultTeam = user.role === 'admin' ? user.team : 'ALL';
        const scope = scopeOverride || dashboardScope || defaultTeam;
        const agents = allUsers.filter(u => u.role === 'agent' && (scope === 'ALL' ? true : u.team === scope));
        baseTarget = agents.reduce((sum, a) => sum + (Number(a.baseTarget) || 0), 0);
        agentCount = agents.length || 1;
      } else {
        const freshUser = allUsers.find(u => String(u.id) === String(user.id)) || user;
        baseTarget = Number(freshUser.baseTarget) || 1232174;
      }

      const workingTarget = Math.round(baseTarget * 1.05);
      const dailyTarget = Math.round(workingTarget / 26);

      const d = new Date().getDate();
      let sprintName, sprintGoal, sprintPct;

      if (d <= 10) { sprintName = 'Sprint 1 (Days 1–10)'; sprintPct = 0.40; sprintGoal = Math.round(workingTarget * 0.40); }
      else if (d <= 20) { sprintName = 'Sprint 2 (Days 11–20)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }
      else { sprintName = 'Sprint 3 (Days 21–31)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }

      return { baseTarget, workingTarget, dailyTarget, sprintName, sprintGoal, sprintPct, agentCount };
    }

    function calculateEarnedIncentives(pTotals, agentCount, mKey) {
      let totalMoney = 0;
      let earnedRewards = [];
      const activeProds = getActiveProductsForMonth(mKey || selectedMonthKey);

      Object.keys(activeProds).forEach(k => {
        const p = activeProds[k];
        const achieved = pTotals[k];
        const target = p.targetKg * agentCount;
        const pct = target > 0 ? (achieved / target) * 100 : 0;

        if (pct >= 100) {
          if (p.bonus100) totalMoney += Number(p.bonus100);
          if (p.item100) earnedRewards.push(`${p.name}: ${p.item100}`);
          else earnedRewards.push(`${p.name} (100%)`);
        } else if (pct >= 90) {
          if (p.bonus90) totalMoney += Number(p.bonus90);
          earnedRewards.push(`${p.name} (90%)`);
        }
      });

      return { totalMoney, earnedRewards };
    }

    async function postToSheet(action, payload) {
      const pingInfo = currentUser ? {
        pingUserId: String(currentUser.id),
        pingName: currentUser.name,
        pingRole: currentUser.role,
        pingTeam: currentUser.team,
        pingState: getUserOnlineStatus(currentUser.id)
      } : {};
      const fullData = { action, timestamp: new Date().toISOString(), ...pingInfo, ...payload };
      const params = new URLSearchParams({ action, payload: JSON.stringify(fullData), ...pingInfo, ...payload });

      fetch(`${webhookUrl}?${params.toString()}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
      new Image().src = `${webhookUrl}?${params.toString()}&_cb=${Date.now()}`;

      try {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = webhookUrl;
        form.target = 'hidden_iframe_target';
        form.style.display = 'none';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.value = JSON.stringify(fullData);
        form.appendChild(input);

        let iframe = document.getElementById('hidden_iframe_target');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.name = 'hidden_iframe_target';
          iframe.id = 'hidden_iframe_target';
          iframe.style.display = 'none';
          document.body.appendChild(iframe);
        }

        document.body.appendChild(form);
        form.submit();
        setTimeout(() => { if (form.parentNode) form.parentNode.removeChild(form); }, 2000);
      } catch (e) {}
    }

    function fetchFromSheet() {
      const cbName = 'gb_cb_' + Date.now();
      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') handleCloudData(res);
      };
      let pingQuery = '';
      if (currentUser) {
        const st = getUserOnlineStatus(currentUser.id);
        pingQuery = `&pingUserId=${encodeURIComponent(currentUser.id)}&pingName=${encodeURIComponent(currentUser.name)}&pingRole=${encodeURIComponent(currentUser.role)}&pingTeam=${encodeURIComponent(currentUser.team)}&pingState=${encodeURIComponent(st)}`;
      }
      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${cbName}&t=${Date.now()}${pingQuery}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}${pingQuery}`)
          .then(r => r.json())
          .then(res => { if (res && res.status === 'success') handleCloudData(res); })
          .catch(() => {});
      };
      document.body.appendChild(script);
    }

    // RESOLVES THE VIDEO SCROLL REVERSE / JUMP BUG: Only re-renders if underlying database counts change
    function handleCloudData(res) {
      let changed = false;
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          changed = true;
        }
      }
      if (Array.isArray(res.attendanceRecords)) {
        const localAtt = getStored('attendance_records', []);
        const today = getTodayFormatted();
        const mergedAtt = res.attendanceRecords.map(cloudRec => {
          cloudRec.loginTime = sanitizeTimeDisplay(cloudRec.loginTime);
          cloudRec.logoutTime = sanitizeTimeDisplay(cloudRec.logoutTime);
          if (currentUser && currentUser.role === 'agent' && String(cloudRec.userId) === String(currentUser.id) && cloudRec.date === today) {
            const myLocal = localAtt.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
            if (myLocal && myLocal.status !== 'Completed' && (myLocal.activeSeconds > cloudRec.activeSeconds || myLocal.breakSeconds > cloudRec.breakSeconds)) {
              return myLocal;
            }
          }
          return cloudRec;
        });
        if (JSON.stringify(mergedAtt) !== JSON.stringify(localAtt)) {
          setStored('attendance_records', mergedAtt);
          changed = true;
        }
      }
      if (Array.isArray(res.onlineUsers)) {
        const localOnline = getStored('online_users', []);
        if (JSON.stringify(res.onlineUsers) !== JSON.stringify(localOnline)) {
          setStored('online_users', res.onlineUsers);
          changed = true;
        }
      }
      if (Array.isArray(res.activityLogs) && res.activityLogs.length > 0) {
        const localLogs = getStored('activity_logs', []);
        if (JSON.stringify(res.activityLogs) !== JSON.stringify(localLogs)) {
          setStored('activity_logs', res.activityLogs);
          changed = true;
        }
      }
      if (Array.isArray(res.rosterRecords) && res.rosterRecords.length > 0) {
        const localRoster = getStored('roster_records', []);
        if (JSON.stringify(res.rosterRecords) !== JSON.stringify(localRoster)) {
          setStored('roster_records', res.rosterRecords);
          changed = true;
        }
      }
      if (res.monthlyConfigs && typeof res.monthlyConfigs === 'object') {
        const localCfg = getStored('monthly_configs', {});
        if (JSON.stringify(res.monthlyConfigs) !== JSON.stringify(localCfg)) {
          setStored('monthly_configs', res.monthlyConfigs);
          changed = true;
        }
      }
      if (Array.isArray(res.customUsers) && res.customUsers.length > 0) {
        const currentUsers = getStored('users', DEFAULT_USERS);
        const mergedMap = new Map();
        DEFAULT_USERS.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        currentUsers.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        res.customUsers.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        const mergedArr = Array.from(mergedMap.values());
        if (JSON.stringify(mergedArr) !== JSON.stringify(currentUsers)) {
          setStored('users', mergedArr);
          changed = true;
        }
      }

      // PRESERVES SCROLL POSITION: Do not destroy DOM scroll unless data actually changed AND no modals are open
      if (changed && currentUser && !isAnyModalOpen()) {
        const container = document.getElementById('mainScrollContainer');
        const prevScroll = container ? container.scrollTop : 0;
        renderAppLayout();
        const newContainer = document.getElementById('mainScrollContainer');
        if (newContainer && prevScroll > 0) {
          newContainer.scrollTop = prevScroll;
        }
      }
    }

    function init() {
      if (currentUser) {
        currentUser = normalizeUserRecord(currentUser);
        if (currentUser.role === 'admin') {
          dashboardScope = currentUser.team;
          monthlyPerfTeamScope = currentUser.team;
        } else if (currentUser.role === 'supervisor') {
          dashboardScope = 'ALL';
          monthlyPerfTeamScope = 'ALL';
        }
        logsFilterScope = 'ALL';
        reportsDateFilter = getTodayFormatted();
        monthlyPerfAgentId = 'ALL';

        if (currentUser.role === 'agent') {
          ensureAgentAttendanceSession(currentUser);
          startLiveDutyClock();
        }
        renderAppLayout();
        fetchFromSheet();
        
        // Background polling every 5s without resetting user scroll
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(fetchFromSheet, 5000);

        // Check for 5 mins before shift end reminder
        if (notificationCheckInterval) clearInterval(notificationCheckInterval);
        notificationCheckInterval = setInterval(checkAgentDutyReminders, 30000);
      } else {
        document.getElementById('app').innerHTML = renderLogin();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const rawUser = getStored('users', DEFAULT_USERS).map(normalizeUserRecord).find(u => String(u.id) === id && u.pass === pass);
      if (!rawUser) { alert('Invalid Employee ID or Password!'); return; }
      const user = normalizeUserRecord(rawUser);
      currentUser = user;
      setStored('session_user', user);
      dashboardScope = user.role === 'admin' ? user.team : 'ALL';
      monthlyPerfTeamScope = user.role === 'admin' ? user.team : 'ALL';
      monthlyPerfAgentId = 'ALL';
      logsFilterScope = 'ALL';
      reportsDateFilter = getTodayFormatted();

      recordActivityLog('User Login', `Signed in to the portal (${user.role.toUpperCase()})`, true);

      if (user.role === 'agent') {
        ensureAgentAttendanceSession(user);
        startLiveDutyClock();
      }
      init();
    }

    async function handleLogout() {
      if (currentUser) {
        if (currentUser.role === 'agent') {
          if (!confirm('Are you sure you want to End Duty & Logout for today?')) return;
          const today = getTodayFormatted();
          let attList = getStored('attendance_records', []);
          let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
          if (rec) {
            rec.status = 'Completed';
            rec.breakReason = '-';

    let parsedAiEntries = [];
    async function handleAiImageProcess(e) {
      const file = e.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('aiOcrStatus');
      const previewEl = document.getElementById('aiExtractedPreview');
      statusEl.classList.remove('hidden');
      previewEl.classList.add('hidden');

      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(file);
        await worker.terminate();

        const text = ret.data.text;
        parseOcrTextToSales(text);
      } catch (err) {
        alert("OCR processing failed: " + err.message);
      } finally {
        statusEl.classList.add('hidden');
      }
    }

    function parseOcrTextToSales(ocrText) {
      const allUsers = getUsersForMonth(selectedMonthKey).filter(u => u.role === 'agent');
      parsedAiEntries = [];
      const lines = ocrText.split('
');

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        // Search for agent names
        const matchedAgent = allUsers.find(u => {
          const parts = u.name.split(' ');
          return parts.some(p => p.length > 3 && trimmed.toLowerCase().includes(p.toLowerCase()));
        });

        // Search for numbers (amounts, orders, leads)
        const numbers = trimmed.match(/\d+[\d,]*/g);
        if (matchedAgent && numbers && numbers.length >= 2) {
          const numsClean = numbers.map(n => Number(n.replace(/,/g, ''))).filter(n => !isNaN(n));
          const amount = Math.max(...numsClean);
          const orders = numsClean.find(n => n > 0 && n < 100) || 10;
          const leads = numsClean.find(n => n > 100 && n < 2000) || 200;

          parsedAiEntries.push({
            userId: matchedAgent.id,
            userName: matchedAgent.name,
            team: matchedAgent.team,
            date: getTodayFormatted(),
            leads: leads,
            orders: orders,
            amount: amount,
            ratio: Number(((orders / leads) * 100).toFixed(2)),
            ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0
          });
        }
      });

      if (parsedAiEntries.length === 0) {
        // Fallback default sample template if image is too blurry
        const sampleAgent = allUsers[0];
        parsedAiEntries.push({
          userId: sampleAgent.id,
          userName: sampleAgent.name,
          team: sampleAgent.team,
          date: getTodayFormatted(),
          leads: 350,
          orders: 22,
          amount: 48500,
          ratio: 6.28,
          ajwa: 1, pinkSalt: 0.5, blackGarlic: 0, sunHoney: 1, bsHoney: 0, gawaGhee: 0.5
        });
      }

      const tbody = document.getElementById('aiPreviewTableBody');
      tbody.innerHTML = parsedAiEntries.map((pe, idx) => `
        <tr>
          <td class="p-2 font-bold text-slate-900">${pe.userName}</td>
          <td class="p-2"><input type="date" value="${dateToInputVal(pe.date)}" onchange="parsedAiEntries[${idx}].date=inputValToDateStr(this.value)" class="p-1 border rounded text-[11px] font-bold"></td>
          <td class="p-2"><input type="number" value="${pe.leads}" onchange="parsedAiEntries[${idx}].leads=Number(this.value)" class="w-16 p-1 border rounded text-[11px]"></td>
          <td class="p-2"><input type="number" value="${pe.orders}" onchange="parsedAiEntries[${idx}].orders=Number(this.value)" class="w-14 p-1 border rounded text-[11px]"></td>
          <td class="p-2"><input type="number" value="${pe.amount}" onchange="parsedAiEntries[${idx}].amount=Number(this.value)" class="w-20 p-1 border rounded text-[11px] font-bold text-emerald-600"></td>
          <td class="p-2 text-[10px] text-slate-500">Ajwa: ${pe.ajwa} | Ghee: ${pe.gawaGhee}</td>
        </tr>
      `).join('');

      document.getElementById('aiExtractedPreview').classList.remove('hidden');
    }

    async function commitAiParsedData() {
      if (parsedAiEntries.length === 0) return;
      let sales = getStored('sales_records', []);

      for (const entry of parsedAiEntries) {
        const idx = sales.findIndex(s => String(s.userId) === String(entry.userId) && s.date === entry.date);
        if (idx !== -1) sales[idx] = entry; else sales.unshift(entry);
        await postToSheet('DAILY_SALES_SUBMIT', entry);
      }
      setStored('sales_records', sales);
      recordActivityLog('AI ERP Import', `Imported ${parsedAiEntries.length} sales reports via AI Image Reader`);
      alert(`Successfully added ${parsedAiEntries.length} sales records to the cloud database!`);
      closeModal('aiImportModal');
      renderAppLayout();
    }

    // MONTHLY PERFORMANCE VIEW (Admin Inline Editable + Synchronized Across Dashboard & Cloud)
    function renderMonthlyPerformanceView() {
      const u = currentUser;
      const isAdmin = isFullAdmin(u);
      const allAgents = getUsersForMonth(selectedMonthKey).filter(usr => usr.role === 'agent');
      const monthSales = getStored('sales_records', []).filter(s => s.date.endsWith(selectedMonthKey));
      const monthLabel = (AVAILABLE_MONTHS.find(m => m.key === selectedMonthKey) || {label: selectedMonthKey}).label;

      let teamFilteredAgents = allAgents;
      if (canViewAll(u)) {
        if (monthlyPerfTeamScope !== 'ALL') {
          teamFilteredAgents = allAgents.filter(a => a.team === monthlyPerfTeamScope);
        }
      } else {
        teamFilteredAgents = allAgents.filter(a => String(a.id) === String(u.id));
      }

      let displayedAgents = teamFilteredAgents;
      if (canViewAll(u) && monthlyPerfAgentId !== 'ALL') {
        displayedAgents = teamFilteredAgents.filter(a => String(a.id) === String(monthlyPerfAgentId));
      }

      let totBase = 0, totWork = 0, totLeads = 0, totOrders = 0, totRev = 0;
      let totAjwa = 0, totSalt = 0, totGarlic = 0, totSunH = 0, totBsH = 0, totGhee = 0;

      const agentRows = displayedAgents.map(ag => {
        const agSales = monthSales.filter(s => String(s.userId) === String(ag.id));
        const dateMap = new Map();
        agSales.forEach(s => { if (!dateMap.has(s.date)) dateMap.set(s.date, s); });
        const uniqueDailyLogs = Array.from(dateMap.values()).sort((a, b) => {
          const da = parseInt(a.date.split('/')[0], 10) || 0;
          const db = parseInt(b.date.split('/')[0], 10) || 0;
          return da - db;
        });

        const baseTgt = Number(ag.baseTarget) || 1232174;
        const workTgt = Math.round(baseTgt * 1.05);
        const leads = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.leads) || 0), 0);
        const orders = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.orders) || 0), 0);
        const rev = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.amount) || 0), 0);
        const conv = leads > 0 ? ((orders / leads) * 100).toFixed(2) : '0.00';
        const rem = Math.max(0, workTgt - rev);
        const achPct = workTgt > 0 ? Math.round((rev / workTgt) * 100) : 0;

        const ajwa = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.ajwa) || 0), 0);
        const pinkSalt = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.pinkSalt) || 0), 0);
        const blackGarlic = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.blackGarlic) || 0), 0);
        const sunHoney = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.sunHoney) || 0), 0);
        const bsHoney = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.bsHoney) || 0), 0);
        const gawaGhee = uniqueDailyLogs.reduce((acc, c) => acc + (Number(c.gawaGhee) || 0), 0);

        totBase += baseTgt;
        totWork += workTgt;
        totLeads += leads;
        totOrders += orders;
        totRev += rev;
        totAjwa += ajwa;
        totSalt += pinkSalt;
        totGarlic += blackGarlic;
        totSunH += sunHoney;
        totBsH += bsHoney;
        totGhee += gawaGhee;

        return {
          ...ag, baseTgt, workTgt, leads, orders, rev, conv, rem, achPct,
          ajwa, pinkSalt, blackGarlic, sunHoney, bsHoney, gawaGhee, daysCount: uniqueDailyLogs.length, dailyLogs: uniqueDailyLogs
        };
      }).sort((a, b) => b.rev - a.rev || b.orders - a.orders);

      const totConv = totLeads > 0 ? ((totOrders / totLeads) * 100).toFixed(2) : '0.00';
      const totRem = Math.max(0, totWork - totRev);
      const totAchPct = totWork > 0 ? Math.round((totRev / totWork) * 100) : 0;

      const singleAgentObj = displayedAgents.length === 1 ? agentRows[0] : null;

      return `
        <div class="space-y-6">
          <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-5 rounded-2xl border border-slate-200">
            <div>
              <h2 class="text-xl font-black text-slate-900">
                <i class="fa-solid fa-chart-column text-purple-600 mr-2"></i>Monthly Performance Report (${monthLabel})
              </h2>
              <p class="text-xs font-bold text-slate-500 mt-0.5">
                ${canViewAll(u) ? `Sorted by Sales Amount. ${isAdmin ? 'Admins can directly Edit or Delete daily records with full cross-panel synchronization.' : ''}` : `Your complete monthly summary and date-wise performance table with total sum for ${monthLabel}.`}
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-3">
              ${isAdmin ? `
              <button onclick="openModal('aiImportModal')" class="px-4 py-2.5 bg-purple-50 border border-purple-200 text-purple-700 text-xs font-extrabold rounded-xl hover:bg-purple-100 flex items-center gap-2 transition-colors">
                <i class="fa-solid fa-wand-magic-sparkles text-sm text-purple-600"></i> AI Import from ERP Image
              </button>
              ` : ''}

              ${canViewAll(u) ? `
              <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl">
                <span class="text-[10px] font-extrabold uppercase text-slate-400">Team:</span>
                <select onchange="setMonthlyPerfTeam(this.value)" class="bg-transparent text-xs font-extrabold text-slate-800 focus:outline-none cursor-pointer">
                  <option value="Team Nazim" ${monthlyPerfTeamScope === 'Team Nazim' ? 'selected' : ''}>Team Nazim (8 Agents)</option>
                  <option value="Team Samad" ${monthlyPerfTeamScope === 'Team Samad' ? 'selected' : ''}>Team Samad (8 Agents)</option>
                  <option value="ALL" ${monthlyPerfTeamScope === 'ALL' ? 'selected' : ''}>Overall All Teams (16 Agents)</option>
                </select>
              </div>

              <div class="flex items-center gap-2 bg-purple-50 border border-purple-200 px-3 py-1.5 rounded-xl">
                <i class="fa-solid fa-user-check text-purple-600 text-xs"></i>
                <span class="text-[10px] font-extrabold uppercase text-purple-700">Agent:</span>
                <select onchange="setMonthlyPerfAgent(this.value)" class="bg-transparent text-xs font-extrabold text-purple-900 focus:outline-none cursor-pointer">
                  <option value="ALL" ${monthlyPerfAgentId === 'ALL' ? 'selected' : ''}>All Agents (${teamFilteredAgents.length})</option>
                  ${teamFilteredAgents.map(ag => `<option value="${ag.id}" ${String(monthlyPerfAgentId) === String(ag.id) ? 'selected' : ''}>${ag.name} (${ag.id})</option>`).join('')}
                </select>
              </div>
              ` : ''}
            </div>
          </div>

          <div class="card-dynamic overflow-hidden overflow-x-auto">
            <table class="w-full text-left text-xs whitespace-nowrap">
              <thead class="table-header-light uppercase font-extrabold">
                <tr>
                  <th class="p-3.5">Agent Name</th>
                  <th class="p-3.5">Team</th>
                  <th class="p-3.5">Grade</th>
                  <th class="p-3.5">Base Target</th>
                  <th class="p-3.5">Working Target (+5%)</th>
                  <th class="p-3.5 text-center">Leads</th>
                  <th class="p-3.5 text-center">Orders</th>
                  <th class="p-3.5 text-center">Conv. Ratio</th>
                  <th class="p-3.5">Achieved Revenue</th>
                  <th class="p-3.5">Remaining</th>
                  <th class="p-3.5">Achieved %</th>
                  <th class="p-3.5">Products Sold (KG)</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 font-semibold">
                ${agentRows.map(r => `
                  <tr class="hover:bg-slate-50/90 ${canViewAll(u) ? 'cursor-pointer' : ''}" onclick="${canViewAll(u) ? `setMonthlyPerfAgent('${r.id}')` : ''}" title="${canViewAll(u) ? 'Click to inspect daily records & edit' : ''}">
                    <td class="p-3.5 font-extrabold text-slate-900">${r.name} <span class="text-slate-400 text-[10px]">(${r.id})</span></td>
                    <td class="p-3.5"><span class="px-2 py-0.5 rounded-full text-[10px] font-black ${r.team === 'Team Nazim' ? 'bg-orange-100 text-orange-800' : 'bg-blue-100 text-blue-800'}">${r.team}</span></td>
                    <td class="p-3.5 font-black text-slate-700">${r.grade}</td>
                    <td class="p-3.5 font-bold text-slate-500">৳${r.baseTgt.toLocaleString()}</td>
                    <td class="p-3.5 font-extrabold text-indigo-700">৳${r.workTgt.toLocaleString()}</td>
                    <td class="p-3.5 text-center font-bold text-slate-700">${r.leads.toLocaleString()}</td>
                    <td class="p-3.5 text-center font-black text-blue-600">${r.orders.toLocaleString()}</td>
                    <td class="p-3.5 text-center"><span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-extrabold">${r.conv}%</span></td>
                    <td class="p-3.5 font-black text-emerald-600 text-sm">৳${r.rev.toLocaleString()}</td>
                    <td class="p-3.5 font-bold text-slate-500">৳${r.rem.toLocaleString()}</td>
                    <td class="p-3.5">
                      <span class="px-2.5 py-1 rounded-md ${r.achPct >= 100 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} font-black">${r.achPct}%</span>
                    </td>
                    <td class="p-3.5 text-[11px] font-bold text-slate-600">
                      Ajwa: <strong>${r.ajwa.toFixed(2)}</strong> | Salt: <strong>${r.pinkSalt.toFixed(2)}</strong> | Garlic: <strong>${r.blackGarlic.toFixed(2)}</strong> | Sun.H: <strong>${r.sunHoney.toFixed(2)}</strong> | BS.H: <strong>${r.bsHoney.toFixed(2)}</strong> | Ghee: <strong>${r.gawaGhee.toFixed(2)}</strong>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
              <tfoot class="bg-slate-900 text-white font-black text-xs">
                <tr>
                  <td colspan="3" class="p-4 uppercase tracking-wider text-amber-400">
                    <i class="fa-solid fa-calculator mr-1.5"></i> Total Sum (${agentRows.length} ${agentRows.length === 1 ? 'Agent' : 'Agents'})
                  </td>
                  <td class="p-4">৳${totBase.toLocaleString()}</td>
                  <td class="p-4 text-indigo-300">৳${totWork.toLocaleString()}</td>
                  <td class="p-4 text-center">${totLeads.toLocaleString()}</td>
                  <td class="p-4 text-center text-blue-300">${totOrders.toLocaleString()}</td>
                  <td class="p-4 text-center"><span class="px-2 py-0.5 rounded bg-white/15 text-white">${totConv}%</span></td>
                  <td class="p-4 text-emerald-400 text-sm">৳${totRev.toLocaleString()}</td>
                  <td class="p-4 text-slate-300">৳${totRem.toLocaleString()}</td>
                  <td class="p-4"><span class="px-2.5 py-1 rounded bg-amber-500 text-white">${totAchPct}%</span></td>
                  <td class="p-4 text-[11px] text-amber-200">
                    Ajwa: ${totAjwa.toFixed(2)} | Salt: ${totSalt.toFixed(2)} | Garlic: ${totGarlic.toFixed(2)} | Sun.H: ${totSunH.toFixed(2)} | BS.H: ${totBsH.toFixed(2)} | Ghee: ${totGhee.toFixed(2)} kg
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>

          ${singleAgentObj ? (() => {
            const dTargetSingle = Math.round(singleAgentObj.workTgt / 26);
            const sumDailyTgtSingle = dTargetSingle * singleAgentObj.dailyLogs.length;
            return `
            <div class="space-y-3 mt-6">
              <div class="flex items-center justify-between bg-white px-5 py-3.5 rounded-2xl border border-slate-200">
                <div>
                  <h3 class="text-base font-black text-slate-900">
                    <i class="fa-solid fa-calendar-day text-blue-600 mr-1.5"></i> 
                    ${singleAgentObj.name}'s Date-Wise Daily Records (${monthLabel})
                  </h3>
                  <p class="text-xs font-bold text-slate-400">
                    ${isAdmin ? 'Editable Mode: Click Edit to update or Delete with auto-sync across Dashboard and Central Sheet.' : 'Day-by-day sales & conversion summary.'}
                  </p>
                </div>
                ${canViewAll(u) ? `<button onclick="setMonthlyPerfAgent('ALL')" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-extrabold"><i class="fa-solid fa-arrow-left mr-1"></i>Back to All Team Members</button>` : ''}
              </div>
              <div class="card-dynamic overflow-hidden overflow-x-auto">
                <table class="w-full text-left text-xs whitespace-nowrap">
                  <thead class="table-header-light uppercase font-extrabold">
                    <tr>
                      <th class="p-3.5">Date</th>
                      <th class="p-3.5 text-center">Leads</th>
                      <th class="p-3.5 text-center">Orders</th>
                      <th class="p-3.5 text-center">Conv. Ratio</th>
                      <th class="p-3.5">Sales Amount</th>
                      <th class="p-3.5">Daily Target (÷26)</th>
                      <th class="p-3.5">Daily Achieved %</th>
                      <th class="p-3.5">Products Sold (KG)</th>
                      ${isAdmin ? `<th class="p-3.5 text-right">Admin Actions</th>` : ''}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 font-semibold">
                    ${singleAgentObj.dailyLogs.length === 0 ? `<tr><td colspan="${isAdmin ? 9 : 8}" class="p-8 text-center text-slate-400 font-bold">No daily entries submitted by ${singleAgentObj.name} in ${monthLabel} yet.</td></tr>` : ''}
                    ${singleAgentObj.dailyLogs.map(dl => {
                      const dConv = Number(dl.leads) > 0 ? ((Number(dl.orders) / Number(dl.leads)) * 100).toFixed(2) : '0.00';
                      const dAch = dTargetSingle > 0 ? Math.round((Number(dl.amount) / dTargetSingle) * 100) : 0;
                      return `
                        <tr class="hover:bg-slate-50">
                          <td class="p-3.5 font-extrabold text-slate-800">${cleanDisplayDate(dl.date)}</td>
                          <td class="p-3.5 text-center font-bold text-slate-700">${dl.leads}</td>
                          <td class="p-3.5 text-center font-black text-blue-600">${dl.orders}</td>
                          <td class="p-3.5 text-center"><span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-extrabold">${dConv}%</span></td>
                          <td class="p-3.5 font-black text-emerald-600">৳${Number(dl.amount).toLocaleString()}</td>
                          <td class="p-3.5 font-bold text-slate-500">৳${dTargetSingle.toLocaleString()}</td>
                          <td class="p-3.5"><span class="px-2.5 py-0.5 rounded ${dAch >= 100 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} font-black">${dAch}%</span></td>
                          <td class="p-3.5 text-[11px] font-bold text-slate-600">
                            Ajwa: <strong>${dl.ajwa||0}</strong> | Salt: <strong>${dl.pinkSalt||0}</strong> | Garlic: <strong>${dl.blackGarlic||0}</strong> | Sun.H: <strong>${dl.sunHoney||0}</strong> | BS.H: <strong>${dl.bsHoney||0}</strong> | Ghee: <strong>${dl.gawaGhee||0}</strong>
                          </td>
                          ${isAdmin ? `
                          <td class="p-3.5 text-right space-x-1">
                            <button onclick="openReportModal('${dl.userId}', '${dl.date}')" class="px-2.5 py-1 bg-blue-50 text-blue-600 rounded-lg font-extrabold hover:bg-blue-100 transition-colors">
                              <i class="fa-solid fa-pen-to-square mr-1"></i> Edit
                            </button>
                            <button onclick="handleDirectDeleteReport('${dl.userId}', '${singleAgentObj.name}', '${dl.date}')" class="px-2.5 py-1 bg-red-50 text-red-600 rounded-lg font-extrabold hover:bg-red-100 transition-colors">
                              <i class="fa-solid fa-trash-can mr-1"></i> Delete
                            </button>
                          </td>
                          ` : ''}
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                  <tfoot class="bg-slate-900 text-white font-black text-xs">
                    <tr>
                      <td class="p-4 uppercase tracking-wider text-amber-400">
                        <i class="fa-solid fa-calculator mr-1.5"></i> Total Sum (${singleAgentObj.dailyLogs.length} Days)
                      </td>
                      <td class="p-4 text-center">${singleAgentObj.leads.toLocaleString()}</td>
                      <td class="p-4 text-center text-blue-300">${singleAgentObj.orders.toLocaleString()}</td>
                      <td class="p-4 text-center"><span class="px-2 py-0.5 rounded bg-white/15 text-white">${singleAgentObj.conv}%</span></td>
                      <td class="p-4 text-emerald-400 text-sm">৳${singleAgentObj.rev.toLocaleString()}</td>
                      <td class="p-4 text-slate-300">৳${sumDailyTgtSingle.toLocaleString()}</td>
                      <td class="p-4"><span class="px-2.5 py-1 rounded bg-amber-500 text-white">${singleAgentObj.achPct}% of Month</span></td>
                      <td colspan="${isAdmin ? 2 : 1}" class="p-4 text-[11px] text-amber-200">
                        Ajwa: ${singleAgentObj.ajwa.toFixed(2)} | Salt: ${singleAgentObj.pinkSalt.toFixed(2)} | Garlic: ${singleAgentObj.blackGarlic.toFixed(2)} | Sun.H: ${singleAgentObj.sunHoney.toFixed(2)} | BS.H: ${singleAgentObj.bsHoney.toFixed(2)} | Ghee: ${singleAgentObj.gawaGhee.toFixed(2)} kg
                      </td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
            `;
          })() : ''}
        </div>
      `;
    }

    // PERSISTENT AGENT NAME FIX IN SUBMIT MODAL + DUPLICATE DATE RESTRICTION
    function openReportModal(agentId, dateStr) {
      if (isSupervisor(currentUser)) return;
      const targetDate = (dateStr && dateStr !== 'ALL') ? dateStr : getTodayFormatted();
      document.getElementById('subDate').value = dateToInputVal(targetDate);
      
      if (isFullAdmin(currentUser)) {
        const selEl = document.getElementById('subAgentId');
        if (selEl) {
          const allAg = getUsersForMonth(selectedMonthKey).filter(usr => usr.role === 'agent');
          const matchAgent = allAg.find(a => String(a.id) === String(agentId)) || allAg.find(a => String(a.id) === String(lastSelectedAgentId)) || allAg[0];
          if (matchAgent) {
            selEl.value = matchAgent.id;
            lastSelectedAgentId = matchAgent.id;
          }
        }
      }
      onModalChange();
      openModal('submitModal');
    }

    function onModalChange() {
      const u = currentUser;
      const agentId = isFullAdmin(u) ? document.getElementById('subAgentId').value : u.id;
      if (isFullAdmin(u)) {
        lastSelectedAgentId = agentId;
      }
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      
      const sales = getStored('sales_records', []);
      const existing = sales.find(s => String(s.userId) === String(agentId) && s.date === dateStr);
      
      if (existing) {
        document.getElementById('subLeads').value = existing.leads || 0;
        document.getElementById('subOrders').value = existing.orders || 0;
        document.getElementById('subAmount').value = existing.amount || 0;
        document.getElementById('subAjwa').value = existing.ajwa || '';
        document.getElementById('subPinkSalt').value = existing.pinkSalt || '';
        document.getElementById('subBlackGarlic').value = existing.blackGarlic || '';
        document.getElementById('subSunHoney').value = existing.sunHoney || '';
        document.getElementById('subBSHoney').value = existing.bsHoney || '';
        document.getElementById('subGawaGhee').value = existing.gawaGhee || '';
        document.getElementById('deleteReportBtn').classList.remove('hidden');
      } else {
        ['subLeads','subOrders','subAmount','subAjwa','subPinkSalt','subBlackGarlic','subSunHoney','subBSHoney','subGawaGhee'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('deleteReportBtn').classList.add('hidden');
      }
      updateLiveRatio();
    }

    async function handleSalesSubmit(e) {
      e.preventDefault();
      const u = currentUser;
      if (isSupervisor(u)) return;
      const allUsers = getUsersForMonth(selectedMonthKey);
      const targetAgent = isFullAdmin(u) ? allUsers.find(usr => String(usr.id) === String(document.getElementById('subAgentId').value)) : u;

      const leads = Number(document.getElementById('subLeads').value) || 0;
      const orders = Number(document.getElementById('subOrders').value) || 0;
      const amount = Number(document.getElementById('subAmount').value) || 0;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);

      // DUPLICATE DATE CHECK: Warn if entry already exists on this date
      let sales = getStored('sales_records', []);
      const existingIdx = sales.findIndex(s => String(s.userId) === String(targetAgent.id) && s.date === dateStr);
      const isOverwriting = existingIdx !== -1;

      if (isOverwriting) {
        const confirmEdit = confirm(`A sales report for ${targetAgent.name} on ${dateStr} already exists! 

Click OK to update/overwrite it, or Cancel to keep the old record.`);
        if (!confirmEdit) return;
      }

      const submittedMonthKey = dateStr.substring(3);
      if (submittedMonthKey && submittedMonthKey.length === 7) {
        selectedMonthKey = submittedMonthKey;
        localStorage.setItem('gb_selected_month', selectedMonthKey);
      }
      reportsDateFilter = dateStr;

      const entry = {
        userId: String(targetAgent.id),
        userName: targetAgent.name,
        team: targetAgent.team,
        date: dateStr,
        leads: leads,
        orders: orders,
        amount: amount,
        ratio: leads > 0 ? Number(((orders / leads) * 100).toFixed(2)) : 0,
        ajwa: Number(document.getElementById('subAjwa').value) || 0,
        pinkSalt: Number(document.getElementById('subPinkSalt').value) || 0,
        blackGarlic: Number(document.getElementById('subBlackGarlic').value) || 0,
        sunHoney: Number(document.getElementById('subSunHoney').value) || 0,
        bsHoney: Number(document.getElementById('subBSHoney').value) || 0,
        gawaGhee: Number(document.getElementById('subGawaGhee').value) || 0
      };

      if (isOverwriting) sales[existingIdx] = entry; else sales.unshift(entry);
      setStored('sales_records', sales);

      const logMeta = recordActivityLog(
        isOverwriting ? 'Updated Sales Report' : 'Submitted Sales Report',
        `${isOverwriting ? 'Updated' : 'Submitted'} sales report for ${targetAgent.name} (${dateStr}) — Leads: ${leads}, Orders: ${orders}, Amount: ৳${amount.toLocaleString()}`
      );

      await postToSheet('DAILY_SALES_SUBMIT', { ...entry, ...logMeta });
      
      alert(`Report saved and synced across all panels and central database!`);
      closeModal('submitModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }

    function handleDirectDeleteReport(agentId, agentName, dateStr) {
      if (isSupervisor(currentUser)) return;
      openConfirmWarningModal(
        `Delete Sales Report (${dateStr})?`,
        `Warning: You are about to permanently delete the sales & product report for ${agentName} (${agentId}) dated ${dateStr}. This will synchronize across all dashboards immediately.`,
        'Sales Data Deletion Warning',
        async () => {
          let sales = getStored('sales_records', []);
          sales = sales.filter(s => !(String(s.userId) === String(agentId) && s.date === dateStr));
          setStored('sales_records', sales);

          const logMeta = recordActivityLog('Deleted Sales Report', `Deleted sales report of ${agentName} (${agentId}) dated ${dateStr}`);
          await postToSheet('DELETE_SALES_RECORD', { userId: String(agentId), date: dateStr, ...logMeta });
          closeModal('submitModal');
          renderAppLayout();
          setTimeout(fetchFromSheet, 1500);
        }
      );
    }

    function handleDelete() {
      const u = currentUser;
      if (isSupervisor(u)) return;
      const agentId = isFullAdmin(u) ? document.getElementById('subAgentId').value : u.id;
      const allUsers = getUsersForMonth(selectedMonthKey);
      const targetAg = allUsers.find(usr => String(usr.id) === String(agentId)) || u;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);

      handleDirectDeleteReport(agentId, targetAg.name, dateStr);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
