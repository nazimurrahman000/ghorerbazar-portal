<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalesTrack Pro - FB Agents Incentive Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    .glass-sidebar { background: #ffffff; border-right: 1px solid #e2e8f0; }
    .card-neo { background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .tab-active { background: #2563eb; color: #ffffff !important; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    .progress-bg { background-color: #e2e8f0; border-radius: 9999px; overflow: hidden; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzSU2lVaPwCtdDJM3mvmpDSx2HQxm96nPYSkHOEpKSKGrxRPS_8A8b0v25TkT2WVHO8Fug/exec";

    // Data from Images: Team Samad & Team Nazim with their respective grades & target amounts.
    const DEFAULT_USERS = [
      { id: '10122', name: 'Md. Nazimur Rahman (TL)', role: 'admin', team: 'Team Nazim', pass: 'admin123' },
      { id: '10107', name: 'Md Abdus Samad (TL)', role: 'admin', team: 'Team Samad', pass: 'admin123' },
      
      { id: '10191', name: 'Shagor Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', grade: 'A-', baseTarget: 1232174 },
      { id: '10289', name: 'Abdullah Dipu', role: 'agent', team: 'Team Nazim', pass: '123456', grade: 'A+', baseTarget: 1619218 },
      { id: '11044', name: 'Hasibul Islam Eraz', role: 'agent', team: 'Team Nazim', pass: '123456', grade: 'B', baseTarget: 1132174 },
      { id: '10741', name: 'Kamruzzaman Shujon', role: 'agent', team: 'Team Nazim', pass: '123456', grade: 'C', baseTarget: 1032175 },
      { id: '10803', name: 'Md. Abdullah Mahmud', role: 'agent', team: 'Team Nazim', pass: '123456', grade: 'A', baseTarget: 1332174 },
      { id: '11042', name: 'Md. Ashiqur Rahman', role: 'agent', team: 'Team Nazim', pass: '123456', grade: 'B', baseTarget: 1132174 },
      { id: '10328', name: 'Sheikh MD Rayhan', role: 'agent', team: 'Team Nazim', pass: '123456', grade: 'A', baseTarget: 1332174 },
      { id: '10135', name: 'Ranju Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', grade: 'A', baseTarget: 1332174 },

      { id: '10098', name: 'Habibur Rahman Shuvo', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'A-', baseTarget: 1232174 },
      { id: '10136', name: 'Al-Amin Kazi', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'A+', baseTarget: 1619218 },
      { id: '11007', name: 'Zubayer Al Mahmud', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'C', baseTarget: 1032175 },
      { id: '11101', name: 'Md. Mehedi Amin', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'C', baseTarget: 1032175 },
      { id: '11120', name: 'Abu Sayed', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'C', baseTarget: 1032175 },
      { id: '11130', name: 'Rabbir Hossain Molla', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'B', baseTarget: 1132174 },
      { id: '10806', name: 'Abdullah Al Soad', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'A', baseTarget: 1332174 },
      { id: '10128', name: 'Al-Amin', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'A', baseTarget: 1332174 }
    ];

    // Facebook Channel Product Targets (per agent) from Image
    const FB_PRODUCTS = {
      ajwa: { name: 'Ajwa', targetKg: 69.03 },
      pinkSalt: { name: 'Pink Salt', targetKg: 10.07 },
      blackGarlic: { name: 'Black Garlic', targetKg: 6.09 },
      sunHoney: { name: 'Sundarban Honey', targetKg: 101.51 },
      bsHoney: { name: 'Black Seed Honey', targetKg: 73.09 },
      gawaGhee: { name: 'Gawa Ghee', targetKg: 153.56 }
    };

    let currentUser = JSON.parse(localStorage.getItem('gb_session_user')) || null;
    let activeTab = 'dashboard';
    let webhookUrl = localStorage.getItem('gb_webhook_url') || DEFAULT_WEBHOOK_URL;
    let pollInterval = null;

    if (!localStorage.getItem('gb_users')) localStorage.setItem('gb_users', JSON.stringify(DEFAULT_USERS));

    function getStored(key, def) { const r = localStorage.getItem('gb_' + key); return r ? JSON.parse(r) : def; }
    function setStored(key, val) { localStorage.setItem('gb_' + key, JSON.stringify(val)); }

    // Date Utilities
    function getTodayFormatted() {
      const d = new Date(); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }
    function dateToInputVal(dateStr) {
      if (!dateStr) return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/'); if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }
    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }

    // Sprint & Target Logic (5% Additional Buffer applied here)
    function getAgentTargetData(user) {
      const workingTarget = Math.round(user.baseTarget * 1.05); // 5% extra for return/cancel issue
      const d = new Date().getDate();
      let sprintName, sprintGoal, sprintPct;

      if (d <= 10) { sprintName = 'Sprint 1 (Days 1-10)'; sprintPct = 0.40; sprintGoal = Math.round(workingTarget * 0.40); }
      else if (d <= 20) { sprintName = 'Sprint 2 (Days 11-20)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }
      else { sprintName = 'Sprint 3 (Days 21-31)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }

      return { workingTarget, sprintName, sprintGoal, sprintPct };
    }

    // Central Sync System
    async function postToSheet(action, payload) {
      const fullData = { action, timestamp: new Date().toISOString(), ...payload };
      const params = new URLSearchParams({ action, payload: JSON.stringify(fullData), ...payload });
      fetch(`${webhookUrl}?${params.toString()}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
    }

    function fetchFromSheet() {
      const cbName = 'gb_cb_' + Date.now();
      window[cbName] = function(res) {
        delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') handleCloudData(res);
      };
      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${cbName}&t=${Date.now()}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}`).then(r => r.json()).then(res => { if (res && res.status === 'success') handleCloudData(res); }).catch(()=>{});
      };
      document.body.appendChild(script);
    }

    function handleCloudData(res) {
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          if (currentUser) renderAppLayout();
        }
      }
    }

    function init() {
      if (currentUser) { renderAppLayout(); pollInterval = setInterval(fetchFromSheet, 3500); }
      else { document.getElementById('app').innerHTML = renderLogin(); }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const user = getStored('users', []).find(u => u.id === id && u.pass === pass);
      if (!user) { alert('ভুল আইডি বা পাসওয়ার্ড!'); return; }
      currentUser = user; setStored('session_user', user);
      init();
    }

    function handleLogout() {
      clearInterval(pollInterval); currentUser = null; localStorage.removeItem('gb_session_user');
      document.getElementById('app').innerHTML = renderLogin();
    }

    function setTab(tab) { activeTab = tab; renderAppLayout(); }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
          <div class="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8">
            <h1 class="text-2xl font-black text-center text-slate-900 mb-6">SalesTrack Pro<br><span class="text-sm font-medium text-slate-500">FB Agents Dashboard</span></h1>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <input type="text" id="loginId" required placeholder="User ID" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm font-semibold">
              <input type="password" id="loginPass" required placeholder="Password" class="w-full px-4 py-3 bg-slate-50 border rounded-xl text-sm font-semibold">
              <button type="submit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl">Login</button>
            </form>
          </div>
        </div>
      `;
    }

    function renderAppLayout() {
      const u = currentUser;
      const html = `
        <div class="flex-1 flex min-h-screen">
          <aside class="w-64 glass-sidebar p-5 flex flex-col justify-between">
            <div>
              <h1 class="text-xl font-black text-slate-900 mb-8 px-2">SalesTrack <span class="text-blue-600">FB</span></h1>
              <nav class="space-y-2">
                <button onclick="setTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold ${activeTab === 'dashboard' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
                <button onclick="setTab('reports')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold ${activeTab === 'reports' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-list"></i> Daily Reports</button>
                ${u.role === 'admin' ? `<button onclick="setTab('team')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold ${activeTab === 'team' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-users"></i> Team Stats</button>` : ''}
              </nav>
            </div>
            <button onclick="handleLogout()" class="w-full py-3 text-sm font-bold text-red-600 bg-red-50 rounded-xl">Logout</button>
          </aside>

          <div class="flex-1 flex flex-col h-screen overflow-y-auto">
            <header class="h-16 px-8 flex items-center justify-between bg-white border-b sticky top-0 z-10">
              <h2 class="text-sm font-extrabold uppercase capitalize">${activeTab}</h2>
              <div class="flex items-center gap-4">
                <span class="px-3 py-1 bg-emerald-100 text-emerald-700 text-xs font-bold rounded-lg animate-pulse">Cloud Live</span>
                <span class="text-sm font-bold">${u.name} (${u.role === 'admin' ? 'Admin' : u.grade})</span>
              </div>
            </header>
            <main class="p-8">${renderTabContent()}</main>
          </div>
        </div>
        ${renderSubmitModal()}
      `;
      document.getElementById('app').innerHTML = html;
    }

    function renderTabContent() {
      if (activeTab === 'dashboard') return renderDashboard();
      if (activeTab === 'reports') return renderReports();
      if (activeTab === 'team') return renderTeamStats();
    }

    function renderDashboard() {
      const u = currentUser;
      const allSales = getStored('sales_records', []);
      let targetUser = u;
      let mySales = allSales.filter(s => s.userId === u.id);

      if (u.role === 'admin') {
        return `<div class="card-neo p-8 text-center"><h2 class="text-xl font-bold">Admin Dashboard Overview</h2><p class="mt-2 text-slate-500">Go to Team Stats to view agent specific details.</p><button onclick="openReportModal()" class="mt-4 px-6 py-3 bg-blue-600 text-white rounded-xl font-bold">Add Data for Agent</button></div>`;
      }

      // Agent specific calculations
      const tInfo = getAgentTargetData(u);
      
      // Calculate Sprint Achievements
      const currentMonthStr = getTodayFormatted().substring(3); // gets MM/YYYY
      const thisMonthSales = mySales.filter(s => s.date.endsWith(currentMonthStr));
      
      const sprintSalesAmount = thisMonthSales.reduce((acc, curr) => {
        const d = parseInt(curr.date.split('/')[0]);
        if (tInfo.sprintName.includes('Sprint 1') && d <= 10) return acc + curr.amount;
        if (tInfo.sprintName.includes('Sprint 2') && d > 10 && d <= 20) return acc + curr.amount;
        if (tInfo.sprintName.includes('Sprint 3') && d > 20) return acc + curr.amount;
        return acc;
      }, 0);

      const monthTotalAmount = thisMonthSales.reduce((acc, curr) => acc + curr.amount, 0);
      const sprintPct = tInfo.sprintGoal > 0 ? Math.min(100, Math.round((sprintSalesAmount / tInfo.sprintGoal) * 100)) : 0;
      const monthPct = tInfo.workingTarget > 0 ? Math.min(100, Math.round((monthTotalAmount / tInfo.workingTarget) * 100)) : 0;

      // Calculate Product Achievements (Total KG)
      const pTotals = { ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0 };
      thisMonthSales.forEach(s => {
        pTotals.ajwa += (s.ajwa || 0); pTotals.pinkSalt += (s.pinkSalt || 0);
        pTotals.blackGarlic += (s.blackGarlic || 0); pTotals.sunHoney += (s.sunHoney || 0);
        pTotals.bsHoney += (s.bsHoney || 0); pTotals.gawaGhee += (s.gawaGhee || 0);
      });

      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center bg-white p-6 rounded-2xl shadow-sm border">
            <div>
              <h2 class="text-2xl font-black text-slate-800">Welcome, ${u.name}</h2>
              <p class="text-sm font-bold text-slate-500 mt-1">Grade: ${u.grade} • Base Target: ৳${u.baseTarget.toLocaleString()} <span class="text-amber-600 font-extrabold">(+5% Buffer: ৳${tInfo.workingTarget.toLocaleString()})</span></p>
            </div>
            <button onclick="openReportModal()" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg">Submit Sales Data</button>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Sprint Progress -->
            <div class="card-neo p-6 bg-gradient-to-br from-indigo-50 to-blue-50 border-indigo-100">
              <h3 class="text-xs font-black uppercase text-indigo-800 tracking-widest mb-1">Current Sprint Focus</h3>
              <p class="text-lg font-bold text-slate-900">${tInfo.sprintName} (Target: ${tInfo.sprintPct * 100}%)</p>
              
              <div class="mt-6">
                <div class="flex justify-between text-sm font-bold mb-2">
                  <span class="text-slate-700">Sprint Target: ৳${tInfo.sprintGoal.toLocaleString()}</span>
                  <span class="text-blue-700">Achieved: ৳${sprintSalesAmount.toLocaleString()}</span>
                </div>
                <div class="progress-bg h-3"><div class="bg-blue-600 h-3 rounded-full" style="width: ${sprintPct}%"></div></div>
                <p class="text-right text-xs font-black text-slate-500 mt-1">${sprintPct}% Completed</p>
              </div>
            </div>

            <!-- Monthly Progress -->
            <div class="card-neo p-6 bg-gradient-to-br from-emerald-50 to-teal-50 border-emerald-100">
              <h3 class="text-xs font-black uppercase text-emerald-800 tracking-widest mb-1">Monthly Total (With 5% Return Buffer)</h3>
              <p class="text-lg font-bold text-slate-900">Working Target: ৳${tInfo.workingTarget.toLocaleString()}</p>
              
              <div class="mt-6">
                <div class="flex justify-between text-sm font-bold mb-2">
                  <span class="text-slate-700">Month Revenue</span>
                  <span class="text-emerald-700">৳${monthTotalAmount.toLocaleString()}</span>
                </div>
                <div class="progress-bg h-3"><div class="bg-emerald-600 h-3 rounded-full" style="width: ${monthPct}%"></div></div>
                <p class="text-right text-xs font-black text-slate-500 mt-1">${monthPct}% of Total Target</p>
              </div>
            </div>
          </div>

          <h3 class="text-lg font-black text-slate-800 mt-8 mb-4">Product Incentive Targets (FB Channel)</h3>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            ${Object.keys(FB_PRODUCTS).map(k => {
              const p = FB_PRODUCTS[k];
              const achieved = pTotals[k];
              const pct = Math.min(100, Math.round((achieved / p.targetKg) * 100));
              const isEligible = pct >= 90; // 90% is entry level for most
              return `
                <div class="card-neo p-5 ${isEligible ? 'border-amber-300 bg-amber-50/30' : ''}">
                  <h4 class="font-bold text-slate-800">${p.name}</h4>
                  <p class="text-xs text-slate-500 font-semibold mb-3">Target: ${p.targetKg} kg</p>
                  <div class="flex justify-between text-sm font-black mb-1">
                    <span class="${isEligible ? 'text-amber-600' : 'text-slate-700'}">${achieved} kg</span>
                    <span class="text-slate-400">${pct}%</span>
                  </div>
                  <div class="progress-bg h-1.5"><div class="bg-slate-800 h-1.5 rounded-full ${isEligible ? 'bg-amber-500' : ''}" style="width: ${pct}%"></div></div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderReports() {
      const u = currentUser;
      const sales = getStored('sales_records', []).filter(s => u.role === 'admin' ? true : s.userId === u.id);
      
      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <h2 class="text-xl font-black text-slate-900">Daily Sales Logs</h2>
            <button onclick="openReportModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">New Report</button>
          </div>
          <div class="card-neo overflow-hidden overflow-x-auto">
            <table class="w-full text-left text-xs whitespace-nowrap">
              <thead class="bg-slate-50 border-b font-bold text-slate-500 uppercase">
                <tr><th class="p-4">Date</th><th class="p-4">Agent</th><th class="p-4">Leads</th><th class="p-4">Orders</th><th class="p-4">Amount</th><th class="p-4">Products (kg)</th><th class="p-4 text-right">Action</th></tr>
              </thead>
              <tbody class="divide-y font-medium">
                ${sales.map(s => `
                  <tr>
                    <td class="p-4">${cleanDisplayDate(s.date)}</td>
                    <td class="p-4 font-bold text-slate-800">${s.userName}</td>
                    <td class="p-4">${s.leads}</td>
                    <td class="p-4 font-bold text-blue-600">${s.orders}</td>
                    <td class="p-4 font-black text-emerald-600">৳${s.amount.toLocaleString()}</td>
                    <td class="p-4 text-[10px] text-slate-500">
                      Ajwa:${s.ajwa} | PinkSalt:${s.pinkSalt} | Honey:${s.sunHoney} | Ghee:${s.gawaGhee}
                    </td>
                    <td class="p-4 text-right">
                      <button onclick="openReportModal('${s.userId}', '${s.date}')" class="px-3 py-1 bg-slate-100 text-slate-700 rounded font-bold hover:bg-slate-200">Edit / Delete</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderTeamStats() {
      const users = getStored('users', []).filter(u => u.role === 'agent');
      const sales = getStored('sales_records', []);
      
      return `
        <div class="space-y-6">
          <h2 class="text-xl font-black text-slate-900">Agent Team Tracking</h2>
          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b uppercase font-bold text-slate-500">
                <tr><th class="p-4">Agent</th><th class="p-4">Grade</th><th class="p-4">Working Target (w/ 5%)</th><th class="p-4">Total Revenue Achieved</th></tr>
              </thead>
              <tbody class="divide-y font-medium">
                ${users.map(ag => {
                  const agSales = sales.filter(s => s.userId === ag.id);
                  const rev = agSales.reduce((a, c) => a + c.amount, 0);
                  const workingTgt = Math.round(ag.baseTarget * 1.05);
                  return `<tr><td class="p-4 font-bold">${ag.name} (${ag.id})</td><td class="p-4 font-black">${ag.grade}</td><td class="p-4">৳${workingTgt.toLocaleString()}</td><td class="p-4 font-black text-emerald-600">৳${rev.toLocaleString()}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSubmitModal() {
      const u = currentUser;
      const users = getStored('users', []).filter(usr => usr.role === 'agent');
      
      return `
        <div id="submitModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-base font-extrabold text-slate-900">Enter Sales & Product Data</h3>
              <button onclick="closeModal('submitModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleSalesSubmit(event)" class="space-y-4">
              
              <div id="agentSelectContainer" class="${u.role === 'admin' ? '' : 'hidden'}">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Select Agent</label>
                <select id="subAgentId" onchange="onModalChange()" class="w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold">
                  ${users.map(usr => `<option value="${usr.id}">${usr.name} (${usr.id})</option>`).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Date</label>
                <input type="date" id="subDate" required onchange="onModalChange()" class="w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold">
              </div>

              <div class="grid grid-cols-3 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Leads</label><input type="number" id="subLeads" required min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold"></div>
                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Orders</label><input type="number" id="subOrders" required min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold"></div>
                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Total Amount (৳)</label><input type="number" id="subAmount" required min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold"></div>
              </div>

              <div class="border-t pt-4 mt-4">
                <h4 class="text-xs font-black text-slate-800 uppercase mb-3"><i class="fa-solid fa-box-open mr-1 text-amber-500"></i> Product Targets (Enter KG Sold)</h4>
                <div class="grid grid-cols-2 gap-3">
                  <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Ajwa (kg)</label><input type="number" step="0.01" id="subAjwa" min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Pink Salt (kg)</label><input type="number" step="0.01" id="subPinkSalt" min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Black Garlic (kg)</label><input type="number" step="0.01" id="subBlackGarlic" min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Sun. Honey (kg)</label><input type="number" step="0.01" id="subSunHoney" min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[10px] font-bold text-slate-500 mb-1">BS Honey (kg)</label><input type="number" step="0.01" id="subBSHoney" min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Gawa Ghee (kg)</label><input type="number" step="0.01" id="subGawaGhee" min="0" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold"></div>
                </div>
              </div>

              <div class="flex justify-between items-center pt-4">
                <button type="button" id="deleteReportBtn" onclick="handleDelete()" class="hidden px-4 py-2.5 text-xs font-bold text-red-600 bg-red-50 rounded-xl">Delete Record</button>
                <div class="flex gap-2 ml-auto">
                  <button type="button" onclick="closeModal('submitModal')" class="px-4 py-2.5 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl">Cancel</button>
                  <button type="submit" class="px-6 py-2.5 text-xs font-bold text-white bg-blue-600 rounded-xl shadow-lg">Save Data</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

    function openReportModal(agentId, dateStr) {
      document.getElementById('subDate').value = dateToInputVal(dateStr || getTodayFormatted());
      if (currentUser.role === 'admin' && agentId) { document.getElementById('subAgentId').value = agentId; }
      onModalChange();
      openModal('submitModal');
    }

    function onModalChange() {
      const u = currentUser;
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      
      const sales = getStored('sales_records', []);
      const existing = sales.find(s => s.userId === agentId && s.date === dateStr);
      
      if (existing) {
        document.getElementById('subLeads').value = existing.leads || '';
        document.getElementById('subOrders').value = existing.orders || '';
        document.getElementById('subAmount').value = existing.amount || '';
        document.getElementById('subAjwa').value = existing.ajwa || '';
        document.getElementById('subPinkSalt').value = existing.pinkSalt || '';
        document.getElementById('subBlackGarlic').value = existing.blackGarlic || '';
        document.getElementById('subSunHoney').value = existing.sunHoney || '';
        document.getElementById('subBSHoney').value = existing.bsHoney || '';
        document.getElementById('subGawaGhee').value = existing.gawaGhee || '';
        document.getElementById('deleteReportBtn').classList.remove('hidden');
      } else {
        ['subLeads','subOrders','subAmount','subAjwa','subPinkSalt','subBlackGarlic','subSunHoney','subBSHoney','subGawaGhee'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('deleteReportBtn').classList.add('hidden');
      }
    }

    async function handleSalesSubmit(e) {
      e.preventDefault();
      const u = currentUser;
      const allUsers = getStored('users', []);
      const targetAgent = u.role === 'admin' ? allUsers.find(usr => usr.id === document.getElementById('subAgentId').value) : u;

      const entry = {
        userId: targetAgent.id,
        userName: targetAgent.name,
        team: targetAgent.team,
        date: inputValToDateStr(document.getElementById('subDate').value),
        leads: Number(document.getElementById('subLeads').value) || 0,
        orders: Number(document.getElementById('subOrders').value) || 0,
        amount: Number(document.getElementById('subAmount').value) || 0,
        ratio: Number(document.getElementById('subLeads').value) > 0 ? Number((Number(document.getElementById('subOrders').value) / Number(document.getElementById('subLeads').value) * 100).toFixed(2)) : 0,
        ajwa: Number(document.getElementById('subAjwa').value) || 0,
        pinkSalt: Number(document.getElementById('subPinkSalt').value) || 0,
        blackGarlic: Number(document.getElementById('subBlackGarlic').value) || 0,
        sunHoney: Number(document.getElementById('subSunHoney').value) || 0,
        bsHoney: Number(document.getElementById('subBSHoney').value) || 0,
        gawaGhee: Number(document.getElementById('subGawaGhee').value) || 0
      };

      await postToSheet('DAILY_SALES_SUBMIT', entry);
      
      let sales = getStored('sales_records', []);
      const idx = sales.findIndex(s => s.userId === entry.userId && s.date === entry.date);
      if (idx !== -1) sales[idx] = entry; else sales.unshift(entry);
      setStored('sales_records', sales);
      
      alert(`ডেটা সেভ হয়েছে!`); closeModal('submitModal'); renderAppLayout(); fetchFromSheet();
    }

    async function handleDelete() {
      const u = currentUser;
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);

      if (!confirm(`এই রিপোর্ট ডিলিট করবেন?`)) return;
      await postToSheet('DELETE_SALES_RECORD', { userId: agentId, date: dateStr });
      
      let sales = getStored('sales_records', []);
      sales = sales.filter(s => !(s.userId === agentId && s.date === dateStr));
      setStored('sales_records', sales);
      
      alert('রিপোর্ট ডিলিট হয়েছে!'); closeModal('submitModal'); renderAppLayout(); fetchFromSheet();
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
