    .sidebar-light { background: #ffffff; border-right: 1px solid #e2e8f0; color: #1e293b; }

    .kpi-card-3 { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: #ffffff; box-shadow: 0 10px 20px -5px rgba(124, 58, 237, 0.35); }

    .banner-hero-light { background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); border: 1px solid #e2e8f0; color: #0f172a; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.03); }
    .table-header-light { background: #f8fafc; border-bottom: 2px solid #e2e8f0; color: #334155; }
    .sprint-banner { background: linear-gradient(135deg, #eff6ff 0%, #e0e7ff 100%); border: 1px solid #bfdbfe; }
    .monthly-banner { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); border: 1px solid #a7f3d0; }
    .incentive-banner { background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); border: 1px solid #fde68a; }

    .prod-amber { background: linear-gradient(145deg, #ffffff 0%, #fffbeb 100%); border: 1px solid #fde68a; }
    .prod-rose { background: linear-gradient(145deg, #ffffff 0%, #fff1f2 100%); border: 1px solid #fecdd3; }
    .prod-purple { background: linear-gradient(145deg, #ffffff 0%, #faf5ff 100%); border: 1px solid #e9d5ff; }
    .prod-orange { background: linear-gradient(145deg, #ffffff 0%, #fff7ed 100%); border: 1px solid #fed7aa; }
    .prod-blue { background: linear-gradient(145deg, #ffffff 0%, #eff6ff 100%); border: 1px solid #bfdbfe; }
    .prod-emerald { background: linear-gradient(145deg, #ffffff 0%, #ecfdf5 100%); border: 1px solid #a7f3d0; }

    .progress-track { background-color: rgba(15, 23, 42, 0.08); border-radius: 9999px; overflow: hidden; }
  </style>
</head>

      { id: '10806', name: 'Abdullah Al Soad', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'A', baseTarget: 1332174 },
      { id: '10128', name: 'Al-Amin', role: 'agent', team: 'Team Samad', pass: '123456', grade: 'A', baseTarget: 1332174 }
    ];

    const FB_PRODUCTS = {
      ajwa: { name: 'Ajwa Dates', targetKg: 69.03, style: 'prod-amber', badge: 'bg-amber-500 text-white', bar: 'bg-amber-500', icon: 'fa-seedling', bonus90: 600, bonus100: 1000 },
      pinkSalt: { name: 'Pink Salt', targetKg: 10.07, style: 'prod-rose', badge: 'bg-rose-500 text-white', bar: 'bg-rose-500', icon: 'fa-jar', item100: '2L Mustard Oil' },
      blackGarlic: { name: 'Black Garlic', targetKg: 6.09, style: 'prod-purple', badge: 'bg-purple-600 text-white', bar: 'bg-purple-600', icon: 'fa-spa', item100: '400gm Gawa Ghee' },
      sunHoney: { name: 'Sundarban Honey', targetKg: 101.51, style: 'prod-orange', badge: 'bg-orange-500 text-white', bar: 'bg-orange-500', icon: 'fa-droplet', bonus90: 1000, bonus100: 2000 },
      bsHoney: { name: 'Black Seed Honey', targetKg: 73.09, style: 'prod-blue', badge: 'bg-blue-600 text-white', bar: 'bg-blue-600', icon: 'fa-bottle-droplet', bonus100: 1000 },
      gawaGhee: { name: 'Gawa Ghee', targetKg: 153.56, style: 'prod-emerald', badge: 'bg-emerald-600 text-white', bar: 'bg-emerald-600', icon: 'fa-cheese', bonus90: 1200, bonus100: 2000 }
    };

    const BREAK_REASONS = [
      "Prayer Break",
      "Lunch / Meal Break",
      "Tea / Coffee Break",
      "Washroom Break",
      "Official / Team Meeting",
      "Personal / Emergency Break"
    ];

    if (!localStorage.getItem('gb_users')) {
      localStorage.setItem('gb_users', JSON.stringify(DEFAULT_USERS));
    }

    let currentUser = JSON.parse(localStorage.getItem('gb_session_user')) || null;
    let activeTab = 'dashboard';
    let adminFilterScope = (currentUser && currentUser.role === 'admin') ? currentUser.team : 'ALL';
    let pollInterval = null;
    let dutyTimerInterval = null;

    function getStored(key, def) { const r = localStorage.getItem('gb_' + key); return r ? JSON.parse(r) : def; }
    function setStored(key, val) { localStorage.setItem('gb_' + key, JSON.stringify(val)); }

    function getTodayFormatted() {
      const d = new Date(); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }
    function getNowTimeStr() {
      return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function dateToInputVal(dateStr) {
      if (!dateStr) return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/'); if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }
    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }
    function cleanDisplayDate(raw) {
      if (!raw) return getTodayFormatted();
      let s = String(raw).trim();
      const p = s.split('/');
      if (p.length === 3) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const mIdx = parseInt(p[1], 10) - 1;
        if (mIdx >= 0 && mIdx < 12) return `${p[0]} ${months[mIdx]} ${p[2]}`;
      }
      return s;
    }
    function formatHMS(sec) {
      sec = Math.max(0, Math.floor(Number(sec) || 0));
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // AGENT DUTY & BREAK TRACKING ENGINE
    function ensureAgentAttendanceSession(user) {
      if (!user || user.role !== 'agent') return null;
      const today = getTodayFormatted();
      let attList = getStored('attendance_records', []);
      let rec = attList.find(a => String(a.userId) === String(user.id) && a.date === today);

      if (!rec) {
        rec = {
          date: today,
          userId: String(user.id),
          userName: user.name,
          team: user.team,
          loginTime: getNowTimeStr(),
          logoutTime: '--:--',
          status: 'Working',
          breakReason: '-',
          breakLogs: '-',
          activeSeconds: 0,
          breakSeconds: 0,
          lastTick: Date.now()
        };
        attList.unshift(rec);
        setStored('attendance_records', attList);
        postToSheet('ATTENDANCE_SYNC', rec);
      } else if (rec.status === 'Completed') {
        // Re-logged in on the same day -> resume working
        rec.status = 'Working';
        rec.logoutTime = '--:--';
        rec.lastTick = Date.now();
        setStored('attendance_records', attList);
        postToSheet('ATTENDANCE_SYNC', rec);
      } else {
        rec.lastTick = Date.now();
        setStored('attendance_records', attList);
      }
      return rec;
    }

    function startLiveDutyClock() {
      if (dutyTimerInterval) clearInterval(dutyTimerInterval);
      dutyTimerInterval = setInterval(() => {
        if (!currentUser || currentUser.role !== 'agent') return;
        const today = getTodayFormatted();
        let attList = getStored('attendance_records', []);
        let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
        if (!rec || rec.status === 'Completed') return;

        const now = Date.now();
        const elapsed = Math.max(1, Math.round((now - (rec.lastTick || now)) / 1000));
        rec.lastTick = now;

        if (rec.status === 'On Break') {
          rec.breakSeconds = (Number(rec.breakSeconds) || 0) + elapsed;
        } else if (rec.status === 'Working') {
          rec.activeSeconds = (Number(rec.activeSeconds) || 0) + elapsed;
        }
        setStored('attendance_records', attList);

        const wClock = document.getElementById('live-work-timer');
        const bClock = document.getElementById('live-break-timer');
        if (wClock) wClock.textContent = formatHMS(rec.activeSeconds);
        if (bClock) bClock.textContent = formatHMS(rec.breakSeconds);

        // Auto sync attendance to Google Sheet every 25 seconds
        if ((rec.activeSeconds + rec.breakSeconds) % 25 === 0) {
          postToSheet('ATTENDANCE_SYNC', rec);
        }
      }, 1000);
    }

    function openBreakModal() {
      openModal('breakModal');
    }

    async function handleStartBreak(e) {
      e.preventDefault();
      if (!currentUser) return;
      const reason = document.getElementById('breakReasonSelect').value;
      const note = document.getElementById('breakCustomNote').value.trim();
      const fullReason = note ? `${reason} (${note})` : reason;

      const today = getTodayFormatted();
      let attList = getStored('attendance_records', []);
      let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
      if (!rec) rec = ensureAgentAttendanceSession(currentUser);

      rec.status = 'On Break';
      rec.breakReason = fullReason;
      rec.lastTick = Date.now();
      const logEntry = `${fullReason} at ${getNowTimeStr()}`;
      rec.breakLogs = (!rec.breakLogs || rec.breakLogs === '-') ? logEntry : `${rec.breakLogs} | ${logEntry}`;

      setStored('attendance_records', attList);
      await postToSheet('ATTENDANCE_SYNC', rec);
      closeModal('breakModal');
      renderAppLayout();
    }

    async function handleResumeWork() {
      if (!currentUser) return;
      const today = getTodayFormatted();
      let attList = getStored('attendance_records', []);
      let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
      if (!rec) return;

      rec.status = 'Working';
      rec.breakReason = '-';
      rec.lastTick = Date.now();
      rec.breakLogs = `${rec.breakLogs} (Resumed ${getNowTimeStr()})`;

      setStored('attendance_records', attList);
      await postToSheet('ATTENDANCE_SYNC', rec);
      renderAppLayout();
    }

    function getTargetData(user, scopeOverride) {
      const allUsers = getStored('users', []);
      let baseTarget = 0;
      let agentCount = 1;
      
      if (user.role === 'admin') {
        const scope = scopeOverride || adminFilterScope || user.team;
        const agents = allUsers.filter(u => u.role === 'agent' && (scope === 'ALL' ? true : u.team === scope));
        baseTarget = agents.reduce((sum, a) => sum + (Number(a.baseTarget) || 0), 0);
        agentCount = agents.length || 1;
      } else {
        const freshUser = allUsers.find(u => String(u.id) === String(user.id)) || user;
        baseTarget = Number(freshUser.baseTarget) || 1232174;
      }

      const workingTarget = Math.round(baseTarget * 1.05);
      const dailyTarget = Math.round(workingTarget / 26);

      const d = new Date().getDate();
      let sprintName, sprintGoal, sprintPct;

      if (d <= 10) { sprintName = 'Sprint 1 (Days 1–10)'; sprintPct = 0.40; sprintGoal = Math.round(workingTarget * 0.40); }
      else if (d <= 20) { sprintName = 'Sprint 2 (Days 11–20)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }
      else { sprintName = 'Sprint 3 (Days 21–31)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }

      return { baseTarget, workingTarget, dailyTarget, sprintName, sprintGoal, sprintPct, agentCount };
    }

    function calculateEarnedIncentives(pTotals, agentCount) {
      let totalMoney = 0;
      let earnedRewards = [];

      Object.keys(FB_PRODUCTS).forEach(k => {
        const p = FB_PRODUCTS[k];
        const achieved = pTotals[k];
        const target = p.targetKg * agentCount;
        const pct = target > 0 ? (achieved / target) * 100 : 0;

        if (pct >= 100) {
          if (p.bonus100) totalMoney += p.bonus100;
          if (p.item100) earnedRewards.push(`${p.name} (100%): ${p.item100}`);
          else earnedRewards.push(`${p.name} (100% Full Bonus)`);
        } else if (pct >= 90) {
          if (p.bonus90) totalMoney += p.bonus90;
          earnedRewards.push(`${p.name} (90% Entry Bonus)`);
        }
      });

      return { totalMoney, earnedRewards };
    }

    async function postToSheet(action, payload) {
      const fullData = { action, timestamp: new Date().toISOString(), ...payload };
      const params = new URLSearchParams({ action, payload: JSON.stringify(fullData), ...payload });

      fetch(`${webhookUrl}?${params.toString()}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
      new Image().src = `${webhookUrl}?${params.toString()}&_cb=${Date.now()}`;

      try {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = webhookUrl;
        form.target = 'hidden_iframe_target';
        form.style.display = 'none';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.value = JSON.stringify(fullData);
        form.appendChild(input);

        let iframe = document.getElementById('hidden_iframe_target');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.name = 'hidden_iframe_target';
          iframe.id = 'hidden_iframe_target';
          iframe.style.display = 'none';
          document.body.appendChild(iframe);
        }

        document.body.appendChild(form);
        form.submit();
        setTimeout(() => { if (form.parentNode) form.parentNode.removeChild(form); }, 2000);
      } catch (e) {}
    }

    function fetchFromSheet() {
      const cbName = 'gb_cb_' + Date.now();
      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') handleCloudData(res);
      };
      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${cbName}&t=${Date.now()}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}`)
          .then(r => r.json())
          .then(res => { if (res && res.status === 'success') handleCloudData(res); })
          .catch(() => {});
      };
      document.body.appendChild(script);
    }

    function handleCloudData(res) {
      let changed = false;
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          changed = true;
        }
      }
      if (Array.isArray(res.attendanceRecords)) {
        const localAtt = getStored('attendance_records', []);
        const today = getTodayFormatted();
        // Preserve active running seconds for the logged-in agent so cloud poll doesn't jump backwards
        const mergedAtt = res.attendanceRecords.map(cloudRec => {
          if (currentUser && currentUser.role === 'agent' && String(cloudRec.userId) === String(currentUser.id) && cloudRec.date === today) {
            const myLocal = localAtt.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
            if (myLocal && myLocal.status !== 'Completed' && (myLocal.activeSeconds > cloudRec.activeSeconds || myLocal.breakSeconds > cloudRec.breakSeconds)) {
              return myLocal;
            }
          }
          return cloudRec;
        });
        if (JSON.stringify(mergedAtt) !== JSON.stringify(localAtt)) {
          setStored('attendance_records', mergedAtt);
          changed = true;
        }
      }
      if (Array.isArray(res.customUsers) && res.customUsers.length > 0) {
        const currentUsers = getStored('users', DEFAULT_USERS);
        const mergedMap = new Map();
        DEFAULT_USERS.forEach(u => mergedMap.set(String(u.id), u));
        currentUsers.forEach(u => mergedMap.set(String(u.id), u));
        res.customUsers.forEach(u => mergedMap.set(String(u.id), u));
        const mergedArr = Array.from(mergedMap.values());
        if (JSON.stringify(mergedArr) !== JSON.stringify(currentUsers)) {
          setStored('users', mergedArr);
          changed = true;
        }
      }
      if (changed && currentUser) renderAppLayout();
    }

    function init() {
      if (currentUser) {
        if (currentUser.role === 'admin' && (!adminFilterScope || adminFilterScope === 'ALL')) {
          adminFilterScope = currentUser.team;
        }
        if (currentUser.role === 'agent') {
          ensureAgentAttendanceSession(currentUser);
          startLiveDutyClock();
        }
        renderAppLayout();
        fetchFromSheet();
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(fetchFromSheet, 3500);
      } else {
        document.getElementById('app').innerHTML = renderLogin();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const user = getStored('users', DEFAULT_USERS).find(u => String(u.id) === id && u.pass === pass);
      if (!user) { alert('Invalid Employee ID or Password!'); return; }
      currentUser = user;
      setStored('session_user', user);
      adminFilterScope = user.role === 'admin' ? user.team : 'ALL';
      if (user.role === 'agent') {
        ensureAgentAttendanceSession(user);
        startLiveDutyClock();
      }
      init();
    }

    async function handleLogout() {
      if (currentUser && currentUser.role === 'agent') {
        if (!confirm('Are you sure you want to End Duty & Logout for today?')) return;
        const today = getTodayFormatted();
        let attList = getStored('attendance_records', []);
        let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
        if (rec) {
          rec.status = 'Completed';
          rec.breakReason = '-';
          rec.logoutTime = getNowTimeStr();
          setStored('attendance_records', attList);
          await postToSheet('ATTENDANCE_SYNC', rec);
        }
      }
      if (pollInterval) clearInterval(pollInterval);
      if (dutyTimerInterval) clearInterval(dutyTimerInterval);
      currentUser = null;
      localStorage.removeItem('gb_session_user');
      document.getElementById('app').innerHTML = renderLogin();
    }

    function setTab(tab) { activeTab = tab; renderAppLayout(); }
    function setAdminScope(scope) { adminFilterScope = scope; renderAppLayout(); }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
          <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 text-slate-800 border border-slate-200">
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl tab-active text-white shadow-lg mb-4">
                <i class="fa-brands fa-facebook-f text-3xl"></i>
              </div>
              <h1 class="text-2xl font-black text-slate-900">Ghorerbazar <span class="text-blue-600">Facebook</span></h1>
              <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest">Sales & Incentive Dynamic Portal</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">

      const tInfo = getTargetData(u, adminFilterScope);
      
      const currentMonthStr = getTodayFormatted().substring(3);
      const thisMonthSales = mySales.filter(s => s.date.endsWith(currentMonthStr));
      
      const sprintSalesAmount = thisMonthSales.reduce((acc, curr) => {
        const d = parseInt(curr.date.split('/')[0], 10);
        if (tInfo.sprintName.includes('Sprint 1') && d <= 10) return acc + Number(curr.amount || 0);
        if (tInfo.sprintName.includes('Sprint 2') && d > 10 && d <= 20) return acc + Number(curr.amount || 0);

    function renderRankingAndComparison() {

      function calcTeamStats(teamName) {
        const tAgents = allUsers.filter(a => a.team === teamName);
        const baseTgt = tAgents.reduce((s, a) => s + Number(a.baseTarget || 0), 0);
        const workTgt = Math.round(baseTgt * 1.05);
        const tSales = monthSales.filter(s => s.team === teamName);
        const leads = tSales.reduce((s, c) => s + Number(c.leads || 0), 0);
        const orders = tSales.reduce((s, c) => s + Number(c.orders || 0), 0);
        const revenue = tSales.reduce((s, c) => s + Number(c.amount || 0), 0);
        const conv = leads > 0 ? ((orders / leads) * 100).toFixed(2) : '0.00';
        const pct = workTgt > 0 ? Math.min(100, Math.round((revenue / workTgt) * 100)) : 0;
        return { teamName, agentCount: tAgents.length, workTgt, leads, orders, revenue, conv, pct };
      }

    function openEditAttendanceModal(agentId, dateStr) {
      document.getElementById('attDate').value = dateToInputVal(dateStr || getTodayFormatted());

      onAttModalChange();
      openModal('editAttModal');
    }

    function onAttModalChange() {
      const agId = document.getElementById('attAgentId').value;
      const dateStr = inputValToDateStr(document.getElementById('attDate').value);
      const attList = getStored('attendance_records', []);
      const ex = attList.find(a => String(a.userId) === String(agId) && a.date === dateStr);
      if (ex) {
        document.getElementById('attLogin').value = ex.loginTime || '09:00:00 AM';
        document.getElementById('attLogout').value = ex.logoutTime || '--:--';
        document.getElementById('attWorkMins').value = Math.round((Number(ex.activeSeconds) || 0) / 60);
        document.getElementById('attBreakMins').value = Math.round((Number(ex.breakSeconds) || 0) / 60);
        document.getElementById('attStatus').value = ex.status || 'Working';
        document.getElementById('attReason').value = ex.breakReason || '-';
      } else {
        document.getElementById('attLogin').value = getNowTimeStr();
        document.getElementById('attLogout').value = '--:--';
        document.getElementById('attWorkMins').value = 0;
        document.getElementById('attBreakMins').value = 0;
        document.getElementById('attStatus').value = 'Working';
        document.getElementById('attReason').value = '-';
      }
    }

    async function handleAdminSaveAttendance(e) {
      e.preventDefault();
      const allUsers = getStored('users', DEFAULT_USERS);
      const agId = document.getElementById('attAgentId').value;
      const ag = allUsers.find(u => String(u.id) === String(agId));
      const dateStr = inputValToDateStr(document.getElementById('attDate').value);

      let attList = getStored('attendance_records', []);
      const idx = attList.findIndex(a => String(a.userId) === String(agId) && a.date === dateStr);

      const rec = {
        date: dateStr,
        userId: String(ag.id),
        userName: ag.name,
        team: ag.team,
        loginTime: document.getElementById('attLogin').value.trim() || '--:--',
        logoutTime: document.getElementById('attLogout').value.trim() || '--:--',
        status: document.getElementById('attStatus').value,
        breakReason: document.getElementById('attReason').value.trim() || '-',
        breakLogs: idx !== -1 ? attList[idx].breakLogs : 'Edited by Admin',
        activeSeconds: (Number(document.getElementById('attWorkMins').value) || 0) * 60,
        breakSeconds: (Number(document.getElementById('attBreakMins').value) || 0) * 60,
        lastTick: Date.now()
      };

      if (idx !== -1) attList[idx] = rec; else attList.unshift(rec);
      setStored('attendance_records', attList);
      await postToSheet('ATTENDANCE_SYNC', rec);
      alert('Attendance record updated and synced!');
      closeModal('editAttModal');
      renderAppLayout();
    }

    async function handleDeleteAttendance(userId, dateStr) {
      if (!confirm(`Are you sure you want to delete the attendance record for ${dateStr}?`)) return;
      let attList = getStored('attendance_records', []);
      attList = attList.filter(a => !(String(a.userId) === String(userId) && a.date === dateStr));
      setStored('attendance_records', attList);
      await postToSheet('DELETE_ATTENDANCE', { userId: String(userId), date: dateStr });
      renderAppLayout();
    }

        name: document.getElementById('usrName').value.trim(),
        team: document.getElementById('usrTeam').value,
        grade: document.getElementById('usrGrade').value,
        role: document.getElementById('usrRole').value,
        pass: document.getElementById('usrPass').value.trim(),
        baseTarget: Number(document.getElementById('usrTarget').value) || 0
      };

      let users = getStored('users', DEFAULT_USERS);
      const idx = users.findIndex(u => String(u.id) === String(newUser.id));
      if (idx !== -1) users[idx] = newUser; else users.push(newUser);
      setStored('users', users);

      await postToSheet('SAVE_USER', newUser);
      alert(`User ID (${newUser.id}) has been saved and synced to the cloud!`);
      closeModal('userModal');
      renderAppLayout();
    }

    async function handleDeleteUser(delId) {
      if (!confirm(`Are you sure you want to delete User ID: ${delId}?`)) return;
      let users = getStored('users', DEFAULT_USERS);
      users = users.filter(u => String(u.id) !== String(delId));
      setStored('users', users);

      await postToSheet('DELETE_USER', { id: String(delId) });
      renderAppLayout();
    }

    function updateLiveRatio() {
      const u = currentUser;
      const allUsers = getStored('users', DEFAULT_USERS);
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId')?.value : u.id;
      const targetAgent = allUsers.find(usr => String(usr.id) === String(agentId)) || u;

      const workingTarget = Math.round((Number(targetAgent.baseTarget) || 1232174) * 1.05);
      const dailyTarget = Math.round(workingTarget / 26);

      const leads = Number(document.getElementById('subLeads')?.value) || 0;
      const orders = Number(document.getElementById('subOrders')?.value) || 0;
      const amount = Number(document.getElementById('subAmount')?.value) || 0;

      const conv = leads > 0 ? ((orders / leads) * 100).toFixed(2) : '0.00';
      const ach = dailyTarget > 0 ? Math.round((amount / dailyTarget) * 100) : 0;

      document.getElementById('liveConvRatio').textContent = conv + '%';
      document.getElementById('liveDailyTarget').textContent = '৳' + dailyTarget.toLocaleString();
      document.getElementById('liveDailyAch').textContent = ach + '%';
    }

    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

    function openReportModal(agentId, dateStr) {
      document.getElementById('subDate').value = dateToInputVal(dateStr || getTodayFormatted());
      if (currentUser.role === 'admin' && agentId) {
        document.getElementById('subAgentId').value = agentId;
      }
      onModalChange();
      openModal('submitModal');
    }

    function onModalChange() {
      const u = currentUser;
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      
      const sales = getStored('sales_records', []);
      const existing = sales.find(s => String(s.userId) === String(agentId) && s.date === dateStr);
      
      if (existing) {
        document.getElementById('subLeads').value = existing.leads || 0;
        document.getElementById('subOrders').value = existing.orders || 0;
        document.getElementById('subAmount').value = existing.amount || 0;
        document.getElementById('subAjwa').value = existing.ajwa || '';
        document.getElementById('subPinkSalt').value = existing.pinkSalt || '';
        document.getElementById('subBlackGarlic').value = existing.blackGarlic || '';
        document.getElementById('subSunHoney').value = existing.sunHoney || '';
        document.getElementById('subBSHoney').value = existing.bsHoney || '';
        document.getElementById('subGawaGhee').value = existing.gawaGhee || '';
        document.getElementById('deleteReportBtn').classList.remove('hidden');
      } else {
        ['subLeads','subOrders','subAmount','subAjwa','subPinkSalt','subBlackGarlic','subSunHoney','subBSHoney','subGawaGhee'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('deleteReportBtn').classList.add('hidden');
      }
      updateLiveRatio();
    }

    async function handleSalesSubmit(e) {
      e.preventDefault();
      const u = currentUser;
      const allUsers = getStored('users', DEFAULT_USERS);
      const targetAgent = u.role === 'admin' ? allUsers.find(usr => String(usr.id) === String(document.getElementById('subAgentId').value)) : u;

      const leads = Number(document.getElementById('subLeads').value) || 0;
      const orders = Number(document.getElementById('subOrders').value) || 0;
      const amount = Number(document.getElementById('subAmount').value) || 0;

      const entry = {
        userId: String(targetAgent.id),
        userName: targetAgent.name,
        team: targetAgent.team,
        date: inputValToDateStr(document.getElementById('subDate').value),
        leads: leads,
        orders: orders,
        amount: amount,
        ratio: leads > 0 ? Number(((orders / leads) * 100).toFixed(2)) : 0,
        ajwa: Number(document.getElementById('subAjwa').value) || 0,
        pinkSalt: Number(document.getElementById('subPinkSalt').value) || 0,
        blackGarlic: Number(document.getElementById('subBlackGarlic').value) || 0,
        sunHoney: Number(document.getElementById('subSunHoney').value) || 0,
        bsHoney: Number(document.getElementById('subBSHoney').value) || 0,
        gawaGhee: Number(document.getElementById('subGawaGhee').value) || 0
      };

      let sales = getStored('sales_records', []);
      const idx = sales.findIndex(s => String(s.userId) === String(entry.userId) && s.date === entry.date);
      if (idx !== -1) sales[idx] = entry; else sales.unshift(entry);
      setStored('sales_records', sales);

      await postToSheet('DAILY_SALES_SUBMIT', entry);
      
      alert(`Report saved and synced to the cloud successfully!`);
      closeModal('submitModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }

    async function handleDelete() {
      const u = currentUser;
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);

      if (!confirm(`Are you sure you want to delete the report for ${dateStr}?`)) return;
      
      let sales = getStored('sales_records', []);
      sales = sales.filter(s => !(String(s.userId) === String(agentId) && s.date === dateStr));
      setStored('sales_records', sales);

      await postToSheet('DELETE_SALES_RECORD', { userId: String(agentId), date: dateStr });
      
      alert('Report deleted successfully!');
      closeModal('submitModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
