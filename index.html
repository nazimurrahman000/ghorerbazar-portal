      20%, 60% { transform: rotate(14deg); }
      40%, 80% { transform: rotate(-14deg); }

    @keyframes toastSlideIn {

    function getStored(key, def) { const r = localStorage.getItem('gb_' + key); return r ? JSON.parse(r) : def; }

    function getNowTimeStr() {
      return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    function sanitizeTimeDisplay(raw) {
      if (!raw || raw === '--:--') return '--:--';
      let s = String(raw).replace(/^'/, '').trim();
      if (s.includes('1899') || s.includes('GMT') || s.includes('মানক')) {
        const d = new Date(s.replace(/\s*\(.*?\)\s*/g, ''));
        if (!isNaN(d.getTime())) {
          return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        const m = s.match(/(\d{1,2}:\d{2}:\d{2})/);
        if (m) return m[1];
      }
      return s;
    }
    function dateToInputVal(dateStr) {
      if (!dateStr || dateStr === 'ALL') return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/'); if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }
    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }
    function cleanDisplayDate(raw) {
      if (!raw) return getTodayFormatted();
      let s = String(raw).trim();
      const p = s.split('/');
      if (p.length === 3) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const mIdx = parseInt(p[1], 10) - 1;
        if (mIdx >= 0 && mIdx < 12) return `${p[0]} ${months[mIdx]} ${p[2]}`;
      }
      return s;
    }
    function formatHMS(sec) {
      sec = Math.max(0, Math.floor(Number(sec) || 0));
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

      let logs = getStored('activity_logs', []);
      logs.unshift(logEntry);

      setStored('activity_logs', logs);

      const meta = {
        actorId: logEntry.userId,
        actorName: logEntry.userName,
        actorRole: logEntry.role,
        actorTeam: logEntry.team,
        logDate: logEntry.date,
        logTime: logEntry.time,
        logAction: logEntry.action,
        logDetails: logEntry.details
      };
      if (currentUser && hasFeatureAccess(currentUser, 'feat_bell_floor_alerts')) {
        syncAdminBellNotificationsFromActivityLogs(logs, false);
      }
      if (sendStandaloneSync) {
        postToSheet('ACTIVITY_LOG', meta);

    function getUserOnlineStatus(userId) {
      const uid = String(userId);
      if (currentUser && String(currentUser.id) === uid) {
        if (currentUser.role === 'agent') {
          const today = getTodayFormatted();
          const myAtt = getStored('attendance_records', []).find(a => String(a.userId) === uid && a.date === today);
          if (myAtt && myAtt.status === 'On Break') return 'On Break';
        }
        return 'Online';
      }

      const now = Date.now();
      const onlineList = getStored('online_users', []);
      const oRec = onlineList.find(o => String(o.id) === uid);
      // Strict 35-second live heartbeat window: since every open tab pings every ~1.5s,
      // anyone who closed their browser or logged out is marked Offline within 35 seconds!
      // Never fall back to attendance_records.lastTick because historical attendance rows stay in the sheet all day.
      if (oRec && oRec.state !== 'Offline' && oRec.lastSeen && (now - Number(oRec.lastSeen)) < 35000) {
        return oRec.state === 'On Break' ? 'On Break' : 'Online';
      }
      return 'Offline';
    }

    let isHardRefreshing = false;

    async function handleHardRefreshPortal() {
      isHardRefreshing = true;
      showPortalToast('Hard Refreshing Portal...', 'Clearing browser cache & reloading latest version (Ctrl + F5)...', 'warning');
      try {
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
        }
      } catch (e) {}
      // Keep fresh online users (< 35s old) in localStorage so the Online count stays 100% accurate
      // during the 1-2s reload, while pruning any expired/offline records!
      try {
        const now = Date.now();
        const existingOnline = getStored('online_users', []);
        const freshOnly = existingOnline.filter(o => o && o.state !== 'Offline' && o.lastSeen && (now - Number(o.lastSeen)) < 35000);
        setStored('online_users', freshOnly);
      } catch (e) {}
      setTimeout(() => {
        const cleanUrl = window.location.origin + window.location.pathname + '?_hr=' + Date.now();
        window.location.replace(cleanUrl);
      }, 200);
    }

    function handleProfilePicSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file || !currentUser) return;
      const targetId = String(profilePicTargetUserId || currentUser.id);

      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const size = 96;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minDim = Math.min(img.width, img.height);
          const sx = (img.width - minDim) / 2;
          const sy = (img.height - minDim) / 2;
          ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.72);

          localStorage.setItem('gb_avatar_' + targetId, compressedDataUrl);
          const configs = getStored('monthly_configs', {});
          if (!configs['USER_AVATARS'] || typeof configs['USER_AVATARS'] !== 'object') {
            configs['USER_AVATARS'] = {};
          }
          configs['USER_AVATARS'][targetId] = compressedDataUrl;
          setStored('monthly_configs', configs);

          closeModal('profilePicModal');
          renderAppLayout();
          showPortalToast('Profile Picture Updated!', 'Your profile photo is now live across the portal.', 'success');

          postToSheet('SAVE_MONTHLY_CONFIG', {
            monthKey: 'USER_AVATARS',
            configJson: JSON.stringify(configs['USER_AVATARS'])
          }).catch(() => {});
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function handleRemoveProfilePic(userId) {

    function startLiveDutyClock() {
      if (dutyTimerInterval) clearInterval(dutyTimerInterval);
      dutyTimerInterval = setInterval(() => {
        if (!currentUser || currentUser.role !== 'agent') return;
        const today = getTodayFormatted();
        let attList = getStored('attendance_records', []);
        let rec = attList.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
        if (!rec || rec.status === 'Completed') return;

        const now = Date.now();
        const elapsed = Math.max(1, Math.round((now - (rec.lastTick || now)) / 1000));
        rec.lastTick = now;

        if (rec.status === 'On Break') {
          rec.breakSeconds = (Number(rec.breakSeconds) || 0) + elapsed;
        } else if (rec.status === 'Working') {
          rec.activeSeconds = (Number(rec.activeSeconds) || 0) + elapsed;
        }
        setStored('attendance_records', attList);

        const wClock = document.getElementById('live-work-timer');
        const bClock = document.getElementById('live-break-timer');
        if (wClock) wClock.textContent = formatHMS(rec.activeSeconds);
        if (bClock) bClock.textContent = formatHMS(rec.breakSeconds);

        if ((rec.activeSeconds + rec.breakSeconds) % 25 === 0) {
          postToSheet('ATTENDANCE_SYNC', rec);
        }
      }, 1000);
    }

    function getTargetData(user, scopeOverride, mKey) {
      const allUsers = getUsersForMonth(mKey || selectedMonthKey);
      let baseTarget = 0;
      let agentCount = 1;
      
      if (canViewAll(user)) {
        const defaultTeam = user.role === 'admin' ? user.team : 'ALL';
        const scope = scopeOverride || dashboardScope || defaultTeam;
        const agents = allUsers.filter(u => u.role === 'agent' && (scope === 'ALL' ? true : u.team === scope));
        const tls = allUsers.filter(u => u.role === 'admin' && (scope === 'ALL' ? true : u.team === scope));
        const agentsTargetSum = agents.reduce((sum, a) => sum + (Number(a.baseTarget) || 0), 0);
        const tlsTargetSum = tls.reduce((sum, tl) => sum + (Number(tl.baseTarget) || TL_DEFAULT_BASE_TARGET), 0);
        baseTarget = agentsTargetSum + tlsTargetSum;
        agentCount = agents.length || 1;
      } else {
        const freshUser = allUsers.find(u => String(u.id) === String(user.id)) || user;
        baseTarget = (freshUser.baseTarget !== undefined && freshUser.baseTarget !== null) ? Number(freshUser.baseTarget) : 1232174;
      }

      const workingTarget = Math.round(baseTarget * 1.05);
      const dailyTarget = Math.round(workingTarget / 26);

      const d = new Date().getDate();
      let sprintName, sprintGoal, sprintPct;

      if (d <= 10) { sprintName = 'Sprint 1 (Days 1–10)'; sprintPct = 0.40; sprintGoal = Math.round(workingTarget * 0.40); }
      else if (d <= 20) { sprintName = 'Sprint 2 (Days 11–20)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }
      else { sprintName = 'Sprint 3 (Days 21–31)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }

      return { baseTarget, workingTarget, dailyTarget, sprintName, sprintGoal, sprintPct, agentCount };
    }

    function calculateEarnedIncentives(pTotals, agentCount, mKey) {
      let totalMoney = 0;
      let earnedRewards = [];
      const activeProds = getActiveProductsForMonth(mKey || selectedMonthKey);

      Object.keys(activeProds).forEach(k => {
        const p = activeProds[k];
        const achieved = pTotals[k];
        const target = p.targetKg * agentCount;
        const pct = target > 0 ? (achieved / target) * 100 : 0;

        if (pct >= 100) {
          if (p.bonus100) totalMoney += Number(p.bonus100);
          if (p.item100) earnedRewards.push(`${p.name}: ${p.item100}`);
          else earnedRewards.push(`${p.name} (100%)`);
        } else if (pct >= 90) {
          if (p.bonus90) totalMoney += Number(p.bonus90);
          earnedRewards.push(`${p.name} (90%)`);
        }
      });

      return { totalMoney, earnedRewards };
    }

    let lastSentRequestKey = '';
    let lastSentRequestTime = 0;

    function deduplicateActivityLogsList(logsArr) {
      if (!Array.isArray(logsArr)) return [];
      const result = [];
      const seenMap = new Map();
      logsArr.forEach(item => {
        if (!item) return;
        const sig = `${item.date}|${item.userId}|${item.action}|${item.details}`;
        const tStr = String(item.time || '');
        const m = tStr.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?/i);
        let secOfDay = null;
        if (m) {
          let hh = parseInt(m[1], 10);
          const mm = parseInt(m[2], 10) || 0;
          const ss = parseInt(m[3], 10) || 0;
          const ap = (m[4] || '').toUpperCase();
          if (ap === 'PM' && hh < 12) hh += 12;
          if (ap === 'AM' && hh === 12) hh = 0;
          secOfDay = hh * 3600 + mm * 60 + ss;
        }
        if (seenMap.has(sig)) {
          const prevSec = seenMap.get(sig);
          if (secOfDay !== null && prevSec !== null && Math.abs(secOfDay - prevSec) <= 8) {
            return;
          }
          if (tStr === seenMap.get(sig + '_raw')) {
            return;
          }
        }
        seenMap.set(sig, secOfDay);
        seenMap.set(sig + '_raw', tStr);
        result.push(item);
      });
      return result;
    }

    async function postToSheet(action, payload) {
      const pingInfo = currentUser ? {
        pingUserId: String(currentUser.id),
        pingName: currentUser.name,
        pingRole: currentUser.role,
        pingTeam: currentUser.team,
        pingState: getUserOnlineStatus(currentUser.id)
      } : {};
      const fullData = { action, timestamp: new Date().toISOString(), ...pingInfo, ...payload };

      if (action !== 'ATTENDANCE_SYNC' && action !== 'SEND_CHAT_MESSAGE' && action !== 'MARK_CHAT_READ' && action !== 'SAVE_MONTHLY_CONFIG') {
        const reqSignature = `${action}_${fullData.userId || ''}_${fullData.date || ''}_${fullData.logAction || ''}_${fullData.logDetails || ''}`;
        const nowMs = Date.now();
        if (reqSignature === lastSentRequestKey && (nowMs - lastSentRequestTime) < 2500) {
          return;
        }
        lastSentRequestKey = reqSignature;
        lastSentRequestTime = nowMs;
      }

      try {
        const bodyParams = new URLSearchParams();
        bodyParams.append('action', action);
        bodyParams.append('payload', JSON.stringify(fullData));
        await fetch(webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: bodyParams.toString()
        });
      } catch (err) {
        const params = new URLSearchParams({ action, payload: JSON.stringify(fullData) });
        new Image().src = `${webhookUrl}?${params.toString()}&_cb=${Date.now()}`;
      }
    }

    function fetchFromSheet() {
      const cbName = 'gb_cb_' + Date.now();
      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') handleCloudData(res);
      };
      let pingQuery = '';
      if (currentUser) {
        const st = getUserOnlineStatus(currentUser.id);
        pingQuery = `&pingUserId=${encodeURIComponent(currentUser.id)}&pingName=${encodeURIComponent(currentUser.name)}&pingRole=${encodeURIComponent(currentUser.role)}&pingTeam=${encodeURIComponent(currentUser.team)}&pingState=${encodeURIComponent(st)}&monthKey=${encodeURIComponent(selectedMonthKey)}`;
      }
      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${cbName}&t=${Date.now()}${pingQuery}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}${pingQuery}`)
          .then(r => r.json())
          .then(res => { if (res && res.status === 'success') handleCloudData(res); })
          .catch(() => {});
      };
      document.body.appendChild(script);
    }

    function isUserInteractingWithControl() {
      const active = document.activeElement;
      if (!active) return false;
      if (active.id === 'chatComposerInput') return false;
      const tag = (active.tagName || '').toUpperCase();
      return tag === 'SELECT' || tag === 'INPUT' || tag === 'TEXTAREA';
    }

    function hasOnlineStateChanged(cloudList, localList) {
      if (!Array.isArray(cloudList) || !Array.isArray(localList)) return true;
      if (cloudList.length !== localList.length) return true;
      const norm = arr => arr.map(u => `${u.id}_${u.state}_${getUserOnlineStatus(u.id)}`).sort().join('|');
      return norm(cloudList) !== norm(localList);
    }

    function hasAttendanceChanged(cloudAtt, localAtt) {
      if (!Array.isArray(cloudAtt) || !Array.isArray(localAtt)) return true;
      if (cloudAtt.length !== localAtt.length) return true;
      const stripTick = arr => arr.map(({ lastTick, ...rest }) => rest);
      return JSON.stringify(stripTick(cloudAtt)) !== JSON.stringify(stripTick(localAtt));
    }

    function handleCloudData(res) {
      let changed = false;
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          changed = true;
        }
      }
      if (Array.isArray(res.attendanceRecords)) {
        const localAtt = getStored('attendance_records', []);
        const today = getTodayFormatted();
        const mergedAtt = res.attendanceRecords.map(cloudRec => {
          cloudRec.loginTime = sanitizeTimeDisplay(cloudRec.loginTime);
          cloudRec.logoutTime = sanitizeTimeDisplay(cloudRec.logoutTime);
          if (currentUser && currentUser.role === 'agent' && String(cloudRec.userId) === String(currentUser.id) && cloudRec.date === today) {
            const myLocal = localAtt.find(a => String(a.userId) === String(currentUser.id) && a.date === today);
            if (myLocal && myLocal.status !== 'Completed' && (myLocal.activeSeconds > cloudRec.activeSeconds || myLocal.breakSeconds > cloudRec.breakSeconds)) {
              return myLocal;
            }
          }
          return cloudRec;
        });
        const stateChanged = hasAttendanceChanged(mergedAtt, localAtt);
        setStored('attendance_records', mergedAtt);
        if (stateChanged) changed = true;
      }
      if (Array.isArray(res.onlineUsers)) {
        const localOnline = getStored('online_users', []);
        const onlineStateDiff = hasOnlineStateChanged(res.onlineUsers, localOnline);
        setStored('online_users', res.onlineUsers);
        if (onlineStateDiff) changed = true;
      }
      if (Array.isArray(res.activityLogs) && res.activityLogs.length > 0) {
        const cleanCloudLogs = deduplicateActivityLogsList(res.activityLogs);
        const localLogs = getStored('activity_logs', []);
        if (JSON.stringify(cleanCloudLogs) !== JSON.stringify(localLogs)) {
          const hadPreviousSync = localLogs.length > 0;
          setStored('activity_logs', cleanCloudLogs);
          if (currentUser && hasFeatureAccess(currentUser, 'feat_bell_floor_alerts')) {
            syncAdminBellNotificationsFromActivityLogs(cleanCloudLogs, hadPreviousSync);
          }
          changed = true;
        }
      }
      if (Array.isArray(res.rosterRecords) && res.rosterRecords.length > 0) {
        const localRoster = getStored('roster_records', []);
        if (JSON.stringify(res.rosterRecords) !== JSON.stringify(localRoster)) {
          setStored('roster_records', res.rosterRecords);
          changed = true;
        }
      }
      if (res.monthlyConfigs && typeof res.monthlyConfigs === 'object') {
        const localCfg = getStored('monthly_configs', {});
        const mergedConfigs = { ...localCfg, ...res.monthlyConfigs };

        if (localCfg['CHAT_AND_NOTICES'] || res.monthlyConfigs['CHAT_AND_NOTICES']) {
          const locHub = localCfg['CHAT_AND_NOTICES'] || {};
          const cldHub = res.monthlyConfigs['CHAT_AND_NOTICES'] || {};

          const msgMap = new Map();
          (Array.isArray(cldHub.messages) ? cldHub.messages : []).forEach(m => { if (m && m.id) msgMap.set(m.id, m); });
          (Array.isArray(locHub.messages) ? locHub.messages : []).forEach(m => {
            if (m && m.id && !msgMap.has(m.id) && (Date.now() - Number(m.ts || 0) < 20000)) {
              msgMap.set(m.id, m);
            }
          });
          const mergedMsgs = Array.from(msgMap.values()).sort((a, b) => Number(a.ts || 0) - Number(b.ts || 0)).slice(-220);

          const noticeMap = new Map();
          (Array.isArray(cldHub.notices) ? cldHub.notices : []).forEach(n => { if (n && n.id) noticeMap.set(n.id, n); });
          (Array.isArray(locHub.notices) ? locHub.notices : []).forEach(n => {
            if (n && n.id && !noticeMap.has(n.id) && (Date.now() - Number(n.ts || 0) < 20000)) {
              noticeMap.set(n.id, n);
            }
          });
          const mergedNotices = Array.from(noticeMap.values()).sort((a, b) => Number(a.ts || 0) - Number(b.ts || 0)).slice(-40);

          const mergedReads = {};
          const locReads = (locHub.readReceipts && typeof locHub.readReceipts === 'object') ? locHub.readReceipts : {};
          const cldReads = (cldHub.readReceipts && typeof cldHub.readReceipts === 'object') ? cldHub.readReceipts : {};
          new Set([...Object.keys(locReads), ...Object.keys(cldReads)]).forEach(uid => {
            mergedReads[uid] = {};
            const uLoc = locReads[uid] || {};
            const uCld = cldReads[uid] || {};
            new Set([...Object.keys(uLoc), ...Object.keys(uCld)]).forEach(rId => {
              mergedReads[uid][rId] = Math.max(Number(uLoc[rId] || 0), Number(uCld[rId] || 0));
            });
          });

          mergedConfigs['CHAT_AND_NOTICES'] = { messages: mergedMsgs, notices: mergedNotices, readReceipts: mergedReads };
        }

        if (JSON.stringify(mergedConfigs) !== JSON.stringify(localCfg)) {
          const hadPrevCfg = Object.keys(localCfg).length > 0;
          setStored('monthly_configs', mergedConfigs);
          if (currentUser) {
            syncIncomingChatAndNoticesFromConfigs(mergedConfigs, hadPrevCfg);
          }
          changed = true;
        }
      }
      if (Array.isArray(res.customUsers) && res.customUsers.length > 0) {
        const currentUsers = getStored('users', DEFAULT_USERS);
        const mergedMap = new Map();
        DEFAULT_USERS.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        currentUsers.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        res.customUsers.forEach(u => mergedMap.set(String(u.id), normalizeUserRecord(u)));
        const mergedArr = Array.from(mergedMap.values());
        if (JSON.stringify(mergedArr) !== JSON.stringify(currentUsers)) {
          setStored('users', mergedArr);
          changed = true;
        }
      }
      if (changed && currentUser && !isAnyModalOpen() && !isUserInteractingWithControl()) {
        renderAppLayout();
      }
    }

    function executeInstantLogout() {
      const loggingOutUser = currentUser ? { ...currentUser } : null;
      let attSyncPayload = null;
      let logoutPayload = null;

      if (loggingOutUser) {
        if (loggingOutUser.role === 'agent') {
          const today = getTodayFormatted();
          let attList = getStored('attendance_records', []);
          let rec = attList.find(a => String(a.userId) === String(loggingOutUser.id) && a.date === today);
          if (rec) {
            rec.status = 'Completed';
            rec.breakReason = '-';
            rec.logoutTime = getNowTimeStr();
            setStored('attendance_records', attList);
            attSyncPayload = { ...rec };
          }
        }
        const logMeta = recordActivityLog('User Logout', `Logged out of the portal (${loggingOutUser.role.toUpperCase()})`);
        logoutPayload = {
          userId: String(loggingOutUser.id),
          userName: loggingOutUser.name,
          team: loggingOutUser.team,
          pingUserId: String(loggingOutUser.id),
          pingName: loggingOutUser.name,
          pingRole: loggingOutUser.role,
          pingTeam: loggingOutUser.team,
          pingState: 'Offline',
          ...logMeta
        };
      }

      // Immediately clear timers, session state, and render Login screen (Zero Delay!)
      if (pollInterval) clearInterval(pollInterval);
      if (dutyTimerInterval) clearInterval(dutyTimerInterval);
      if (dutyReminderInterval) clearInterval(dutyReminderInterval);
      notificationDropdownOpen = false;
      currentUser = null;
      localStorage.removeItem('gb_session_user');
      document.getElementById('app').innerHTML = renderLogin();

      // Fire cloud syncs non-blocking in the background
      if (attSyncPayload) {
        postToSheet('ATTENDANCE_SYNC', attSyncPayload).catch(() => {});
      }
      if (logoutPayload) {
        postToSheet('USER_LOGOUT', logoutPayload).catch(() => {});
      }
    }

    // STRICT DEDUPLICATION ENGINE: Ensures 1 record per Agent per Date (or 1 Monthly Summary per Agent per Month)
    // Eliminates duplicate date double-counting and fixes Dashboard vs Table mismatches!
    function deduplicateSalesRecordsList(records) {
      if (!Array.isArray(records)) return [];
      const map = new Map();
      records.forEach(s => {
        if (!s || !s.userId || !s.date) return;
        const cleanDate = String(s.date).replace(/^'/, '').trim();
        const key = `${String(s.userId).trim()}_${cleanDate}`;
        if (!map.has(key)) {
          map.set(key, { ...s, date: cleanDate });
        }
      });
      return Array.from(map.values());
    }

    // Smart Per-Agent Product KG Resolver:
    // If an agent has a MONTHLY_PROD_MM/YYYY summary uploaded via AI ERP Product Report,
    // use the higher of (Monthly ERP Summary vs Sum of Daily Entries) per product so daily & monthly never double-count!
    // Also returns the exact submission date/timestamp for each record.
    function formatFullMonthDateDisplay(rawDateStr) {
      if (!rawDateStr || rawDateStr === '-' || rawDateStr === 'Not Updated Yet') return 'Not Updated Yet';
      let s = String(rawDateStr).replace(/^'/, '').trim();
      let rangeSuffix = '';
      const rangeMatch = s.match(/\((\d{1,2}\s+[A-Za-z]+\s+20\d{2}\s*[–\-]\s*\d{1,2}\s+[A-Za-z]+\s+20\d{2})\)/);
      if (rangeMatch) {
        rangeSuffix = ` (${rangeMatch[1]})`;
        s = s.replace(rangeMatch[0], '').trim();
      }
      if (s.includes('GMT') || s.includes('00:00:00') || /^[A-Z][a-z]{2}\s+[A-Z][a-z]{2}\s+\d{1,2}\s+20\d{2}/.test(s)) {
        const parsedD = new Date(s.replace(/\s*\(.*?\)\s*/g, ''));
        if (!isNaN(parsedD.getTime())) {
          const fullMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
          return `${fullMonths[parsedD.getMonth()]} ${parsedD.getDate()}, ${parsedD.getFullYear()}${rangeSuffix}`;
        }
      }
      const mainDatePart = s.split(',')[0].trim();
      const p = mainDatePart.split('/');
      if (p.length === 3) {
        const fullMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const mIdx = parseInt(p[1], 10) - 1;
        const dayNum = parseInt(p[0], 10);
        const yrNum = p[2].split(' ')[0];
        if (mIdx >= 0 && mIdx < 12 && !isNaN(dayNum)) {
          return `${fullMonths[mIdx]} ${dayNum}, ${yrNum}${rangeSuffix}`;
        }
      }
      return s + rangeSuffix;
    }

    function computeAgentDriveProductStats(agentObj, monthSalesList, mKey) {
      const mk = mKey || selectedMonthKey;
      const activeProds = getActiveProductsForMonth(mk);
      const agSales = deduplicateSalesRecordsList(monthSalesList).filter(s => String(s.userId) === String(agentObj.id));

      const dailyEntries = agSales.filter(s => !String(s.date || '').startsWith('MONTHLY_PROD_'));
      const monthlySummaryEntry = agSales.find(s => String(s.date || '') === `MONTHLY_PROD_${mk}`);

      const prodKg = {};
      Object.keys(activeProds).forEach(k => {
        const dailySum = dailyEntries.reduce((acc, c) => acc + (Number(c[k]) || 0), 0);
        const monthlyVal = monthlySummaryEntry ? (Number(monthlySummaryEntry[k]) || 0) : 0;
        prodKg[k] = Number(Math.max(dailySum, monthlyVal).toFixed(2));
      });

      const productLogs = agSales.filter(s => {
        return Object.keys(activeProds).some(k => (Number(s[k]) || 0) > 0);
      });

      let lastSubmittedDate = 'Not Updated Yet';
      let coveredDateRange = `01/${mk} – ${getTodayFormatted()}`;
      if (monthlySummaryEntry) {
        if (monthlySummaryEntry.coveredDateRange) {
          coveredDateRange = monthlySummaryEntry.coveredDateRange;
        }
        if (monthlySummaryEntry.lastUpdatedDate) {
          lastSubmittedDate = formatFullMonthDateDisplay(monthlySummaryEntry.lastUpdatedDate);
        } else if (monthlySummaryEntry.submittedAt) {
          lastSubmittedDate = formatFullMonthDateDisplay(monthlySummaryEntry.submittedAt);
        } else {
          lastSubmittedDate = formatFullMonthDateDisplay(getTodayFormatted());
        }
      } else if (productLogs.length > 0) {
        const firstLog = productLogs[0];
        if (firstLog.coveredDateRange) coveredDateRange = firstLog.coveredDateRange;
        if (firstLog.lastUpdatedDate) {
          lastSubmittedDate = formatFullMonthDateDisplay(firstLog.lastUpdatedDate);
        } else if (String(firstLog.date).startsWith('MONTHLY_PROD_')) {
          lastSubmittedDate = formatFullMonthDateDisplay(firstLog.submittedAt || getTodayFormatted());
        } else {
          lastSubmittedDate = formatFullMonthDateDisplay(firstLog.date);
        }
      }

      const totalKgAll = Object.keys(activeProds).reduce((sum, k) => sum + (prodKg[k] || 0), 0);
      const totalTargetKgAll = Object.keys(activeProds).reduce((sum, k) => sum + (Number(activeProds[k].targetKg) || 0), 0);
      const overallPct = totalTargetKgAll > 0 ? Math.round((totalKgAll / totalTargetKgAll) * 100) : 0;
      const incentive = calculateEarnedIncentives(prodKg, 1, mk);

      return {
        agent: agentObj,
        prodKg,
        totalKgAll: Number(totalKgAll.toFixed(2)),
        totalTargetKgAll: Number(totalTargetKgAll.toFixed(2)),
        overallPct,
        incentiveMoney: incentive.totalMoney,
        incentiveRewards: incentive.earnedRewards,
        lastSubmittedDate,
        coveredDateRange,
        productLogs,
        allDailyLogs: dailyEntries,
        monthlySummaryEntry
      };
    }

    function downloadPortalCsvFile(filename, headersArr, rowsArr) {
      const escapeCsvCell = (val) => {
        const s = String(val === null || val === undefined ? '' : val).replace(/"/g, '""');
        return `"${s}"`;
      };
      const csvLines = [
        headersArr.map(escapeCsvCell).join(','),
        ...rowsArr.map(row => row.map(escapeCsvCell).join(','))
      ];
      // Add UTF-8 BOM so Excel opens Bangladeshi Taka (৳) and characters cleanly
      const blob = new Blob(['\uFEFF' + csvLines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showPortalToast('CSV File Downloaded!', `Saved "${filename}" to your device.`, 'success');
    }

    function exportDriveProductCsv() {
      const allAgents = getUsersForMonth(selectedMonthKey).filter(usr => usr.role === 'agent');
      const allSales = deduplicateSalesRecordsList(getStored('sales_records', []));
      const monthSales = allSales.filter(s => String(s.date || '').endsWith(selectedMonthKey));
      const activeProds = getActiveProductsForMonth(selectedMonthKey);
      const prodKeys = Object.keys(activeProds);

      const teamFilteredAgents = driveProdTeamScope === 'ALL'
        ? allAgents
        : allAgents.filter(a => a.team === driveProdTeamScope);
      const displayedAgents = driveProdAgentId === 'ALL'
        ? teamFilteredAgents
        : teamFilteredAgents.filter(a => String(a.id) === String(driveProdAgentId));

      const grandProdTotals = {};
      prodKeys.forEach(k => { grandProdTotals[k] = 0; });
      let grandTotalKg = 0;
      let grandTargetKg = 0;

      const rowsData = displayedAgents.map(ag => {
        const st = computeAgentDriveProductStats(ag, monthSales, selectedMonthKey);
        prodKeys.forEach(k => {
          grandProdTotals[k] = Number(((grandProdTotals[k] || 0) + (st.prodKg[k] || 0)).toFixed(2));
        });
        grandTotalKg = Number((grandTotalKg + st.totalKgAll).toFixed(2));
        grandTargetKg = Number((grandTargetKg + st.totalTargetKgAll).toFixed(2));
        return st;
      }).sort((a, b) => b.totalKgAll - a.totalKgAll);

      const prodExpandedHeaders = [];
      prodKeys.forEach(k => {
        const pName = activeProds[k].name;
        const pTgt = activeProds[k].targetKg;
        prodExpandedHeaders.push(`${pName} Sold (kg)`, `${pName} Target (${pTgt} kg)`, `${pName} Achieved (%)`);
      });

      const headers = [
        'SL', 'Emp ID', 'Agent Name', 'Team',
        ...prodExpandedHeaders,
        'Last Update & Date Range'
      ];

      const csvRows = rowsData.map((st, idx) => {
        const prodCells = [];
        prodKeys.forEach(k => {
          const sold = Number(st.prodKg[k] || 0);
          const tgt = Number(activeProds[k].targetKg || 0);
          const pct = tgt > 0 ? Math.round((sold / tgt) * 100) + '%' : '0%';
          prodCells.push(sold.toFixed(2), tgt.toFixed(2), pct);
        });
        return [
          idx + 1,
          st.agent.id,
          st.agent.name,
          st.agent.team,
          ...prodCells,
          st.lastSubmittedDate || '-'
        ];
      });

      const grandProdCells = [];
      prodKeys.forEach(k => {
        const totSold = Number(grandProdTotals[k] || 0);
        const totTgt = Number((activeProds[k].targetKg || 0) * (rowsData.length || 1));
        const pct = totTgt > 0 ? Math.round((totSold / totTgt) * 100) + '%' : '0%';
        grandProdCells.push(totSold.toFixed(2), totTgt.toFixed(2), pct);
      });
      csvRows.push([
        'TOTAL', 'ALL', `GRAND TOTAL (${rowsData.length} Agents)`, driveProdTeamScope,
        ...grandProdCells,
        `Month: ${selectedMonthKey}`
      ]);

      const safeMonth = selectedMonthKey.replace('/', '-');
      downloadPortalCsvFile(`Drive_Product_${driveProdTeamScope.replace(/\s+/g, '_')}_${safeMonth}.csv`, headers, csvRows);
    }

    function handleSaveDriveProductTotal(e) {
      e.preventDefault();

      const allUsers = getUsersForMonth(selectedMonthKey);

      const fromDateStr = inputValToDateStr(document.getElementById('dpFromDate')?.value);
      const toDateStr = inputValToDateStr(document.getElementById('dpToDate')?.value);
      const rangeLabel = `${cleanDisplayDate(fromDateStr)} – ${cleanDisplayDate(toDateStr)}`;

      const prodValuesObj = { ajwa: 0, pinkSalt: 0, blackGarlic: 0, sunHoney: 0, bsHoney: 0, gawaGhee: 0 };
      Object.keys(activeProds).forEach(k => {
        prodValuesObj[k] = Number(document.getElementById(`dpInput_${k}`)?.value) || 0;
      });

      const lastUpdateFormatted = formatFullMonthDateDisplay(toDateStr || getTodayFormatted());
      const monthlyKeyDate = `MONTHLY_PROD_${selectedMonthKey}`;

      let sales = getStored('sales_records', []);
      sales = sales.map(s => {
        if (String(s.userId) === String(targetAgent.id) && String(s.date || '').endsWith(selectedMonthKey) && !String(s.date).startsWith('MONTHLY_PROD_')) {
          const copy = { ...s };
          Object.keys(activeProds).forEach(k => { copy[k] = 0; });
          return copy;
        }
        return s;
      });

      sales = sales.filter(s => !(String(s.userId) === String(targetAgent.id) && s.date === monthlyKeyDate));
      const entry = {
        userId: String(targetAgent.id),
        userName: targetAgent.name,
        team: targetAgent.team,
        date: monthlyKeyDate,
        coveredDateRange: rangeLabel,
        lastUpdatedDate: `${lastUpdateFormatted} (${rangeLabel})`,
        submittedAt: `${lastUpdateFormatted} (${rangeLabel})`,
        leads: 0, orders: 0, amount: 0, ratio: 0,
        ...prodValuesObj

      sales.unshift(entry);

    function exportMonthlyPerformanceCsv() {
      const u = currentUser;
      const allAgents = getUsersForMonth(selectedMonthKey).filter(usr => usr.role === 'agent');
      const monthSales = deduplicateSalesRecordsList(getStored('sales_records', [])).filter(s => String(s.date || '').endsWith(selectedMonthKey));
      const activeProdsMp = getActiveProductsForMonth(selectedMonthKey);
      const prodKeys = Object.keys(activeProdsMp);

      let teamFilteredAgents = allAgents;
      if (canViewAll(u)) {
        if (monthlyPerfTeamScope !== 'ALL') {
          teamFilteredAgents = allAgents.filter(a => a.team === monthlyPerfTeamScope);
        }
      } else {
        teamFilteredAgents = allAgents.filter(a => String(a.id) === String(u.id));
      }

      let displayedAgents = teamFilteredAgents;
      if (canViewAll(u) && monthlyPerfAgentId !== 'ALL') {
        displayedAgents = teamFilteredAgents.filter(a => String(a.id) === String(monthlyPerfAgentId));
      }

      const safeMonth = selectedMonthKey.replace('/', '-');

      // If a single agent is selected (or logged in as an agent), export both their Monthly Target Summary AND Date-Wise Breakdown!
      if (displayedAgents.length === 1) {
        const ag = displayedAgents[0];
        const agSales = monthSales.filter(s => String(s.userId) === String(ag.id) && !String(s.date || '').startsWith('MONTHLY_PROD_'))
          .sort((a, b) => (parseInt(a.date.split('/')[0], 10) || 0) - (parseInt(b.date.split('/')[0], 10) || 0));
        const baseTgt = Number(ag.baseTarget) || 0;
        const workTgt = Math.round(baseTgt * 1.05);
        const dailyTgt = Math.round(workTgt / 26);

        const headers = [
          'Date', 'Emp ID', 'Agent Name', 'Team', 'Grade',
          'Leads', 'Orders', 'Conv. Ratio (%)', 'Sales Amount (BDT)',
          'Daily Target (BDT)', 'Daily Achieved (%)',
          'Monthly Working Target (+5%)', 'Monthly Achieved Revenue (BDT)', 'Monthly Remaining (BDT)', 'Monthly Achievement Ratio (%)'
        ];
        let totL = 0, totO = 0, totAmt = 0;
        agSales.forEach(dl => {
          totL += Number(dl.leads) || 0;
          totO += Number(dl.orders) || 0;
          totAmt += Number(dl.amount) || 0;
        });
        const totConv = totL > 0 ? ((totO / totL) * 100).toFixed(2) + '%' : '0.00%';
        const totRem = Math.max(0, workTgt - totAmt);

      function getActionBadgeStyle(act) {
        const s = String(act || '').toUpperCase();
        if (s.includes('DELETE')) return 'bg-red-100 text-red-800 border-red-200';
        if (s.includes('SALES') || s.includes('REPORT')) return 'bg-emerald-100 text-emerald-800 border-emerald-200';
        if (s.includes('BREAK')) return 'bg-amber-100 text-amber-800 border-amber-200';
        if (s.includes('RESUME')) return 'bg-teal-100 text-teal-800 border-teal-200';
        if (s.includes('LOGIN')) return 'bg-blue-100 text-blue-800 border-blue-200';
        if (s.includes('LOGOUT')) return 'bg-slate-200 text-slate-700 border-slate-300';
        return 'bg-purple-100 text-purple-800 border-purple-200';

      return `

                <option value="Team Nazim" ${activityTeamFilter === 'Team Nazim' ? 'selected' : ''}>Team Nazim</option>
                <option value="Team Samad" ${activityTeamFilter === 'Team Samad' ? 'selected' : ''}>Team Samad</option>

                ${visibleLogs.length === 0 ? `<tr><td colspan="7" class="p-8 text-center text-slate-400 font-bold">No activity logs recorded yet. Actions will appear here automatically.</td></tr>` : ''}

    function renderDutyRosterView() {
      const u = currentUser;
      const isEditable = hasFeatureAccess(u, 'feat_edit_roster');
      const roster = getRosterForMonth(selectedMonthKey);
      const days = ['sat', 'sun', 'mon', 'tue', 'wed', 'thu', 'fri'];
      const dayLabels = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

      const samadRows = roster.filter(r => r.team === 'Team Samad');
      const nazimRows = roster.filter(r => r.team === 'Team Nazim');
      const floatingRows = roster.filter(r => r.team !== 'Team Samad' && r.team !== 'Team Nazim');

      function computeRosterSummary(rows, excludeTL) {
        const filtered = excludeTL ? rows.filter(r => !r.isTL && r.id !== '10107' && r.id !== '10122') : rows;
        const counts = {
          morning: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 },
          general: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 },
          evening: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 },
          night: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 },
          doCount: { sat: 0, sun: 0, mon: 0, tue: 0, wed: 0, thu: 0, fri: 0 }
        };
        filtered.forEach(r => {
          days.forEach(d => {
            const val = String(r[d] || '').toUpperCase();
            if (val.includes('7:00')) counts.morning[d]++;
            else if (val.includes('10:00')) counts.general[d]++;
            else if (val.includes('3:00')) counts.evening[d]++;
            else if (val.includes('NIGHT') || val.includes('11:00')) counts.night[d]++;
            else if (val === 'DO' || val.includes('OFF')) counts.doCount[d]++;
          });
        });
        return counts;
      }

      const samadSum = computeRosterSummary(samadRows, true);
      const nazimSum = computeRosterSummary(nazimRows, true);
      const combinedAll = computeRosterSummary(roster, false);
      const combinedNoTL = computeRosterSummary(roster, true);

      function renderShiftCell(row, dKey) {
        const val = row[dKey] || '3:00 PM';
        const cellClass = val === 'DO' ? 'roster-do' : (val === 'Night' ? 'roster-night' : 'text-slate-700 font-semibold');
        if (!isEditable) {
          return `<td class="px-1.5 py-2 border border-slate-200 text-center text-[11px] whitespace-nowrap ${cellClass}">${val}</td>`;
        }
        return `
          <td class="p-1 border border-slate-200 text-center ${cellClass}">
            <select onchange="handleRosterShiftChange('${row.id}', '${dKey}', this.value)" class="w-full bg-transparent text-center text-[11px] font-bold focus:outline-none cursor-pointer">
              ${SHIFT_OPTIONS.map(opt => `<option value="${opt}" ${opt === val ? 'selected' : ''}>${opt}</option>`).join('')}
            </select>
          </td>
        `;
      }

                  <td colspan="2" class="p-1.5 border border-slate-200">In Total (Agents)</td>

                `}

            </div>
            `;
          })()}

          <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">

      if (!hasFeatureAccess(currentUser, 'feat_edit_roster')) return;
      const roster = getRosterForMonth(selectedMonthKey);
      const targetRow = roster.find(r => String(r.id) === String(empId));
      if (!targetRow) return;

      const updatedRow = { ...targetRow, [dayKey]: newShift, monthKey: selectedMonthKey };
      pendingRosterEditsMap[`${selectedMonthKey}_${empId}`] = updatedRow;
      renderAppLayout();

    function discardPendingRosterChanges() {
      Object.keys(pendingRosterEditsMap).forEach(k => {
        if (k.startsWith(selectedMonthKey + '_')) delete pendingRosterEditsMap[k];
      });
      renderAppLayout();
      showPortalToast('Changes Discarded', 'Reverted unsaved Duty Roster edits.', 'warning');

    function confirmAndSaveAllRosterChanges() {
      if (!hasFeatureAccess(currentUser, 'feat_edit_roster')) return;
      const keys = Object.keys(pendingRosterEditsMap).filter(k => k.startsWith(selectedMonthKey + '_'));
      if (keys.length === 0) return;

      const changedRows = keys.map(k => pendingRosterEditsMap[k]);
      const namesList = changedRows.map(r => `${r.name} (${r.id})`).join(', ');

      openConfirmWarningModal(
        `Save ${changedRows.length} Duty Roster Change(s)?`,
        `You have modified the weekly shift schedule for <strong>${changedRows.length} member(s)</strong>: ${namesList}.<br><br>Do you want to save and sync these roster updates across all panels and Google Sheet?`,
        'Duty Roster Save Confirmation',
        async () => {
          let savedList = getStored('roster_records', []);
          for (const row of changedRows) {
            const idx = savedList.findIndex(r => r.monthKey === selectedMonthKey && String(r.id) === String(row.id));
            if (idx !== -1) savedList[idx] = row;
            else savedList.push(row);
            delete pendingRosterEditsMap[`${selectedMonthKey}_${row.id}`];
          }
          setStored('roster_records', savedList);

          const logMeta = recordActivityLog('Updated Duty Roster', `Saved Duty Roster updates for ${namesList} (${selectedMonthKey})`);
          renderAppLayout();
          showPortalToast('Duty Roster Saved & Synced!', `Updated schedule for ${changedRows.length} member(s).`, 'success');

          for (const row of changedRows) {
            await postToSheet('SAVE_ROSTER_ROW', { ...row, ...logMeta }).catch(() => {});
          }
        },
        'Yes, Save & Sync Roster',
        true
      );
    }

    function getAutoCurrentSprintPhase() {

    function exportSprintTargetCsv() {
      const allUsers = getUsersForMonth(selectedMonthKey);
      const allAgents = allUsers.filter(u => u.role === 'agent');
      const monthSales = deduplicateSalesRecordsList(getStored('sales_records', []))
        .filter(s => String(s.date || '').endsWith(selectedMonthKey) && !String(s.date || '').startsWith('MONTHLY_PROD_'));

      const effPhase = sprintTabPhase === 'AUTO' ? getAutoCurrentSprintPhase() : sprintTabPhase;
      const phaseMeta = {
        S1: { label: 'Sprint 1 (Days 1-10)', pct: 0.40 },
        S2: { label: 'Sprint 2 (Days 11-20)', pct: 0.35 },
        S3: { label: 'Sprint 3 (Days 21-31)', pct: 0.35 }
      }[effPhase];

      const filteredAgents = sprintTabTeamScope === 'ALL'
        ? allAgents
        : allAgents.filter(a => a.team === sprintTabTeamScope);

      const rows = filteredAgents.map(ag => {
        const baseTgt = Number(ag.baseTarget) || 0;
        const workTgt = Math.round(baseTgt * 1.05);
        const s1Goal = Math.round(workTgt * 0.40);
        const s2Goal = Math.round(workTgt * 0.35);
        const s3Goal = Math.round(workTgt * 0.35);

        const agSales = monthSales.filter(s => String(s.userId) === String(ag.id));
        let s1Sales = 0, s2Sales = 0, s3Sales = 0, activeSprintOrders = 0, activeSprintLeads = 0;

        agSales.forEach(s => {
          const day = parseInt(String(s.date).split('/')[0], 10) || 0;
          const amt = Number(s.amount) || 0;
          if (day <= 10) {
            s1Sales += amt;
            if (effPhase === 'S1') { activeSprintOrders += Number(s.orders) || 0; activeSprintLeads += Number(s.leads) || 0; }
          } else if (day <= 20) {
            s2Sales += amt;
            if (effPhase === 'S2') { activeSprintOrders += Number(s.orders) || 0; activeSprintLeads += Number(s.leads) || 0; }
          } else {
            s3Sales += amt;
            if (effPhase === 'S3') { activeSprintOrders += Number(s.orders) || 0; activeSprintLeads += Number(s.leads) || 0; }
          }
        });

        const curGoal = effPhase === 'S1' ? s1Goal : (effPhase === 'S2' ? s2Goal : s3Goal);
        const curSales = effPhase === 'S1' ? s1Sales : (effPhase === 'S2' ? s2Sales : s3Sales);
        const curRem = Math.max(0, curGoal - curSales);
        const curPct = curGoal > 0 ? Number(((curSales / curGoal) * 100).toFixed(2)) : 0;

        return {
          ag, workTgt, s1Goal, s1Sales, s2Goal, s2Sales, s3Goal, s3Sales,
          curGoal, curSales, curRem, curPct, activeSprintOrders, activeSprintLeads
        };
      }).sort((a, b) => b.curSales - a.curSales || b.curPct - a.curPct);

      const headers = [
        'Rank', 'Emp ID', 'Agent Name', 'Team', 'Grade', 'Monthly Working Target (+5%)',
        `${phaseMeta.label} Goal`, `${phaseMeta.label} Achieved`, `${phaseMeta.label} Remaining`, `${phaseMeta.label} Achieved (%)`,
        'Sprint 1 (1-10) Achieved', 'Sprint 2 (11-20) Achieved', 'Sprint 3 (21-31) Achieved'
      ];

      const csvRows = rows.map((r, i) => [
        i + 1, r.ag.id, r.ag.name, r.ag.team, r.ag.grade, r.workTgt,
        r.curGoal, r.curSales, r.curRem, `${r.curPct}%`,
        r.s1Sales, r.s2Sales, r.s3Sales
      ]);

      const safeMonth = selectedMonthKey.replace('/', '-');
      downloadPortalCsvFile(`Sprint_Target_${effPhase}_${sprintTabTeamScope.replace(/\s+/g, '_')}_${safeMonth}.csv`, headers, csvRows);
    }

    function renderSprintTargetView() {
      const u = currentUser;
      const isAdminOrSup = canViewAll(u);
      const isSprintActive = isSprintSystemActiveForMonth(selectedMonthKey);
      const allUsers = getUsersForMonth(selectedMonthKey);
      const allAgents = allUsers.filter(usr => usr.role === 'agent');
      const monthSales = deduplicateSalesRecordsList(getStored('sales_records', []))
        .filter(s => String(s.date || '').endsWith(selectedMonthKey) && !String(s.date || '').startsWith('MONTHLY_PROD_'));
      const monthLabel = (AVAILABLE_MONTHS.find(m => m.key === selectedMonthKey) || {label: selectedMonthKey}).label;

      const autoPhase = getAutoCurrentSprintPhase();
      const effPhase = sprintTabPhase === 'AUTO' ? autoPhase : sprintTabPhase;
      const phaseInfo = {
        S1: { key: 'S1', name: 'Sprint 1 (Days 1–10)', short: 'Sprint 1 (1–10)', dateRange: `01/${selectedMonthKey} – 10/${selectedMonthKey}`, pct: 0.40, pctLabel: '40% of Monthly Target' },
        S2: { key: 'S2', name: 'Sprint 2 (Days 11–20)', short: 'Sprint 2 (11–20)', dateRange: `11/${selectedMonthKey} – 20/${selectedMonthKey}`, pct: 0.35, pctLabel: '35% of Monthly Target' },
        S3: { key: 'S3', name: 'Sprint 3 (Days 21–31)', short: 'Sprint 3 (21–31)', dateRange: `21/${selectedMonthKey} – End of Month`, pct: 0.35, pctLabel: '35% of Monthly Target' }
      }[effPhase];

      // Calculate TL (Nazim & Samad) 80% & 100% Total Target Reward Milestones (Visible ONLY to Admin / Supervisor, NEVER to Agents)
      let nazimTL = null, samadTL = null;
      if (isAdminOrSup) {
        function calcTLMilestone(teamName, tlName) {
          const tAgents = allAgents.filter(a => a.team === teamName);
          const tTLs = allUsers.filter(usr => usr.role === 'admin' && usr.team === teamName);
          const agentsBase = tAgents.reduce((s, a) => s + (Number(a.baseTarget) || 0), 0);
          const tlBase = tTLs.reduce((s, tl) => s + (Number(tl.baseTarget) || TL_DEFAULT_BASE_TARGET), 0);
          const totalWorkTgt = Math.round((agentsBase + tlBase) * 1.05);
          const target80 = Math.round(totalWorkTgt * 0.80);
          const target100 = totalWorkTgt;
          const achieved = monthSales.filter(s => s.team === teamName).reduce((s, c) => s + (Number(c.amount) || 0), 0);
          const pct = target100 > 0 ? Number(((achieved / target100) * 100).toFixed(1)) : 0;
          const rem80 = Math.max(0, target80 - achieved);
          const rem100 = Math.max(0, target100 - achieved);
          return { teamName, tlName, agentCount: tAgents.length, target80, target100, achieved, pct, rem80, rem100 };
        }
        nazimTL = calcTLMilestone('Team Nazim', 'Md. Nazimur Rahman');
        samadTL = calcTLMilestone('Team Samad', 'Md Abdus Samad');
      }

      // Filter Agents by Team Scope
      const filteredAgents = sprintTabTeamScope === 'ALL'
        ? allAgents
        : allAgents.filter(a => a.team === sprintTabTeamScope);

      let sumWorkTgt = 0, sumCurGoal = 0, sumCurSales = 0;
      let sumS1Goal = 0, sumS2Goal = 0, sumS3Goal = 0;
      let sumS1 = 0, sumS2 = 0, sumS3 = 0;

      const rankedSprintAgents = filteredAgents.map(ag => {
        const baseTgt = Number(ag.baseTarget) || 0;
        const workTgt = Math.round(baseTgt * 1.05);
        const s1Goal = Math.round(workTgt * 0.40);
        const s2Goal = Math.round(workTgt * 0.35);
        const s3Goal = Math.round(workTgt * 0.35);

        const agSales = monthSales.filter(s => String(s.userId) === String(ag.id));
        let s1Sales = 0, s2Sales = 0, s3Sales = 0, sprintOrders = 0, sprintLeads = 0;

        agSales.forEach(s => {
          const day = parseInt(String(s.date).split('/')[0], 10) || 0;
          const amt = Number(s.amount) || 0;
          if (day <= 10) {
            s1Sales += amt;
            if (effPhase === 'S1') { sprintOrders += Number(s.orders) || 0; sprintLeads += Number(s.leads) || 0; }
          } else if (day <= 20) {
            s2Sales += amt;
            if (effPhase === 'S2') { sprintOrders += Number(s.orders) || 0; sprintLeads += Number(s.leads) || 0; }
          } else {
            s3Sales += amt;
            if (effPhase === 'S3') { sprintOrders += Number(s.orders) || 0; sprintLeads += Number(s.leads) || 0; }
          }
        });

        const curGoal = effPhase === 'S1' ? s1Goal : (effPhase === 'S2' ? s2Goal : s3Goal);
        const curSales = effPhase === 'S1' ? s1Sales : (effPhase === 'S2' ? s2Sales : s3Sales);
        const curRem = Math.max(0, curGoal - curSales);
        const curPct = curGoal > 0 ? Number(((curSales / curGoal) * 100).toFixed(1)) : 0;
        const s1Pct = s1Goal > 0 ? Math.round((s1Sales / s1Goal) * 100) : 0;
        const s2Pct = s2Goal > 0 ? Math.round((s2Sales / s2Goal) * 100) : 0;

        const conv = sprintLeads > 0 ? ((sprintOrders / sprintLeads) * 100).toFixed(1) : '0.0';

        sumWorkTgt += workTgt;
        sumCurGoal += curGoal;

        sumS2Goal += s2Goal;
        sumS3Goal += s3Goal;
        sumS1 += s1Sales;

      function calcTeamStats(teamName) {
        const tAgents = allUsers.filter(a => a.team === teamName);
        const tTLs = monthUsersAll.filter(u => u.role === 'admin' && u.team === teamName);
        const agentsBase = tAgents.reduce((s, a) => s + Number(a.baseTarget || 0), 0);
        const tlBase = tTLs.reduce((s, tl) => s + (Number(tl.baseTarget) || TL_DEFAULT_BASE_TARGET), 0);
        const baseTgt = agentsBase + tlBase;
        const workTgt = Math.round(baseTgt * 1.05);
        const tSales = monthSales.filter(s => s.team === teamName);
        const leads = tSales.reduce((s, c) => s + Number(c.leads || 0), 0);
        const orders = tSales.reduce((s, c) => s + Number(c.orders || 0), 0);
        const revenue = tSales.reduce((s, c) => s + Number(c.amount || 0), 0);
        const conv = leads > 0 ? ((orders / leads) * 100).toFixed(2) : '0.00';
        const pct = workTgt > 0 ? Math.min(100, Math.round((revenue / workTgt) * 100)) : 0;
        return { teamName, agentCount: tAgents.length, workTgt, leads, orders, revenue, conv, pct };
      }

      const nazimStats = calcTeamStats('Team Nazim');
      const samadStats = calcTeamStats('Team Samad');

        const orders = agSales.reduce((s, c) => s + Number(c.orders || 0), 0);
        const revenue = agSales.reduce((s, c) => s + Number(c.amount || 0), 0);

        const workTgt = Math.round(((ag.baseTarget !== undefined && ag.baseTarget !== null) ? Number(ag.baseTarget) : 1232174) * 1.05);
        const pct = workTgt > 0 ? Math.round((revenue / workTgt) * 100) : 0;
        return { ...ag, leads, orders, revenue, conv, workTgt, pct };
      }).sort((a, b) => b.revenue - a.revenue || b.orders - a.orders);

    function quickAssignAgentToTeam(agentId, newTeamName) {
      if (!hasFeatureAccess(currentUser, 'feat_manage_users')) return;
      const allUsers = getUsersForMonth(selectedMonthKey);
      const targetUser = allUsers.find(u => String(u.id) === String(agentId));
      if (!targetUser) return;

      openConfirmWarningModal(
        `Assign ${targetUser.name} to ${newTeamName}?`,
        `Are you sure you want to assign <strong>${targetUser.name} (${targetUser.id})</strong> from <strong>${targetUser.team}</strong> to <strong>${newTeamName}</strong>? All their sales, roster, and targets will immediately sync under ${newTeamName}.`,
        'Team Assignment Confirmation',
        async () => {
          let users = getStored('users', DEFAULT_USERS);
          const idx = users.findIndex(u => String(u.id) === String(agentId));
          if (idx !== -1) {
            users[idx].team = newTeamName;
            setStored('users', users);
          }

          let sales = getStored('sales_records', []);
          sales = sales.map(s => String(s.userId) === String(agentId) ? { ...s, team: newTeamName } : s);
          setStored('sales_records', sales);

          let attList = getStored('attendance_records', []);
          attList = attList.map(a => String(a.userId) === String(agentId) ? { ...a, team: newTeamName } : a);
          setStored('attendance_records', attList);

          let rosterList = getStored('roster_records', []);
          rosterList = rosterList.map(r => String(r.id) === String(agentId) ? { ...r, team: newTeamName } : r);
          setStored('roster_records', rosterList);

          const logMeta = recordActivityLog('Assigned Agent Team', `Assigned ${targetUser.name} (${targetUser.id}) to ${newTeamName}`);
          renderAppLayout();
          showPortalToast('Team Assigned & Synced!', `${targetUser.name} is now assigned to ${newTeamName}.`, 'success');
          if (idx !== -1) {
            postToSheet('SAVE_USER', { ...users[idx], ...logMeta }).catch(() => {});
          }
        },
        `Yes, Assign to ${newTeamName}`,
        true
      );
    }

    function renderManageAgents() {
      const u = currentUser;
      let allUsers = getUsersForMonth(selectedMonthKey);
      if (isSupervisor(u)) {
        allUsers = allUsers.filter(usr => usr.role !== 'admin');
      }

      // Pin Supervisor and TLs (Admins) at the top always (regardless of online/offline status),
      // and sort all other users (Agents) with Online / On Break first, followed by Offline users.
      const topPinnedRoleRank = (usr) => {
        if (usr.role === 'supervisor' || String(usr.id) === '10001') return 1;
        if (usr.role === 'admin' || String(usr.id) === '10122' || String(usr.id) === '10107') return 2;
        return 3;
      };
      const onlineStatusRank = (usr) => {
        const st = getUserOnlineStatus(usr.id);
        if (st === 'Online') return 1;
        if (st === 'On Break') return 2;
        return 3; // Offline
      };

      allUsers = [...allUsers].sort((a, b) => {
        const pinA = topPinnedRoleRank(a);
        const pinB = topPinnedRoleRank(b);
        if (pinA !== pinB) return pinA - pinB;
        // If both are regular agents (pin === 3), show Online/On Break first, then Offline
        if (pinA === 3) {
          const stA = onlineStatusRank(a);
          const stB = onlineStatusRank(b);
          if (stA !== stB) return stA - stB;

        return 0;

      const monthLabel = (AVAILABLE_MONTHS.find(m => m.key === selectedMonthKey) || {label: selectedMonthKey}).label;

    function handleAddCustomProductSlot() {
      if (!hasFeatureAccess(currentUser, 'feat_edit_products')) return;
      // Save any current edits in the modal before adding a new slot
      syncProductModalInputsToStorage();
      let configs = getStored('monthly_configs', {});
      if (!configs[selectedMonthKey]) configs[selectedMonthKey] = { users: {}, products: {} };
      if (!configs[selectedMonthKey].products) configs[selectedMonthKey].products = {};

      const newKey = 'customProd_' + Date.now();
      const idx = Object.keys(configs[selectedMonthKey].products).length;
      const st = EXTRA_PRODUCT_STYLES[idx % EXTRA_PRODUCT_STYLES.length];
      configs[selectedMonthKey].products[newKey] = {
        name: 'New Product ' + (idx + 1),
        targetKg: 25,
        bonus90: 500,
        bonus100: 1000,
        style: st.style,
        badge: st.badge,
        bar: st.bar,
        icon: st.icon,
        enabled: true,
        isCustom: true
      };
      setStored('monthly_configs', configs);
      renderAppLayout();
      openModal('productConfigModal');

    function handleRemoveCustomProduct(prodKey) {
      if (!hasFeatureAccess(currentUser, 'feat_edit_products')) return;
      syncProductModalInputsToStorage();
      let configs = getStored('monthly_configs', {});
      if (configs[selectedMonthKey] && configs[selectedMonthKey].products) {
        delete configs[selectedMonthKey].products[prodKey];
        setStored('monthly_configs', configs);

      renderAppLayout();
      openModal('productConfigModal');

    function syncProductModalInputsToStorage() {
      const allProds = getAllConfiguredProductsForMonth(selectedMonthKey);
      let configs = getStored('monthly_configs', {});
      if (!configs[selectedMonthKey]) configs[selectedMonthKey] = { users: {}, products: {} };
      if (!configs[selectedMonthKey].products) configs[selectedMonthKey].products = {};

      Object.keys(allProds).forEach(k => {
        const enEl = document.getElementById(`cfg_en_${k}`);
        const nameEl = document.getElementById(`cfg_name_${k}`);
        const kgEl = document.getElementById(`cfg_kg_${k}`);
        const b90El = document.getElementById(`cfg_b90_${k}`);
        const b100El = document.getElementById(`cfg_b100_${k}`);
        if (!nameEl) return;

        configs[selectedMonthKey].products[k] = {
          ...(configs[selectedMonthKey].products[k] || {}),
          enabled: enEl ? enEl.checked : true,
          name: nameEl.value.trim() || allProds[k].name,
          targetKg: Number(kgEl?.value) || allProds[k].targetKg,
          bonus90: Number(b90El?.value) || 0,
          bonus100: Number(b100El?.value) || 0,
          isCustom: Boolean(allProds[k].isCustom)
        };
      });
      setStored('monthly_configs', configs);
      return configs;
    }

    async function handleSaveGradeConfig(e) {
      e.preventDefault();
      if (!hasFeatureAccess(currentUser, 'feat_edit_grades_targets')) return;
      let configs = getStored('monthly_configs', {});
      if (!configs[selectedMonthKey]) configs[selectedMonthKey] = { users: {}, products: {}, gradeTargets: {} };
      if (!configs[selectedMonthKey].gradeTargets) configs[selectedMonthKey].gradeTargets = {};
      if (!configs[selectedMonthKey].users) configs[selectedMonthKey].users = {};

      const gradeKeys = ['A+', 'A', 'A-', 'B', 'C', 'TL'];
      gradeKeys.forEach(gk => {
        const val = Number(document.getElementById(`cfg_grade_${gk}`)?.value) || 0;
        configs[selectedMonthKey].gradeTargets[gk] = val;
      });

      // Automatically update all users in this month whose grade matches one of the updated grades!
      const currentMonthUsers = getUsersForMonth(selectedMonthKey);
      currentMonthUsers.forEach(u => {
        const g = u.role === 'admin' ? 'TL' : u.grade;
        if (configs[selectedMonthKey].gradeTargets[g] !== undefined) {
          configs[selectedMonthKey].users[u.id] = {
            grade: g,
            baseTarget: configs[selectedMonthKey].gradeTargets[g]
          };
        }
      });

      setStored('monthly_configs', configs);
      const logMeta = recordActivityLog('Updated Grade Targets', `Updated monthly grade & TL targets for ${selectedMonthKey}`);
      closeModal('gradeConfigModal');
      renderAppLayout();
      showPortalToast('Grade & TL Targets Saved', `Updated targets for ${selectedMonthKey} applied to all matching agents & TLs!`, 'success');
      postToSheet('SAVE_MONTHLY_CONFIG', { monthKey: selectedMonthKey, configJson: JSON.stringify(configs[selectedMonthKey]), ...logMeta }).catch(() => {});
    }

        isNewAccount ? 'Created User ID' : 'Updated User ID',

    function updateLiveRatio() {
      const u = currentUser;
      const allUsers = getUsersForMonth(selectedMonthKey);
      const agentId = hasFeatureAccess(u, 'feat_manage_all_sales') ? document.getElementById('subAgentId')?.value : u.id;
      const targetAgent = allUsers.find(usr => String(usr.id) === String(agentId)) || u;

      const workingTarget = Math.round(((targetAgent.baseTarget !== undefined && targetAgent.baseTarget !== null) ? Number(targetAgent.baseTarget) : 1232174) * 1.05);
      const dailyTarget = Math.round(workingTarget / 26);

      const leads = Number(document.getElementById('subLeads')?.value) || 0;
      const orders = Number(document.getElementById('subOrders')?.value) || 0;
      const amount = Number(document.getElementById('subAmount')?.value) || 0;

      const conv = leads > 0 ? ((orders / leads) * 100).toFixed(2) : '0.00';
      const ach = dailyTarget > 0 ? Math.round((amount / dailyTarget) * 100) : 0;

      document.getElementById('liveConvRatio').textContent = conv + '%';
      document.getElementById('liveDailyTarget').textContent = '৳' + dailyTarget.toLocaleString();
      document.getElementById('liveDailyAch').textContent = ach + '%';
    }

    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

    let lastSelectedAgentId = null;

    // Night-Shift Aware Default Report Date Helper:
    // If an agent worked the 11:00 PM Night shift (e.g. entered on the 1st at 11 PM and finishes on the 2nd at 7 AM),
    // when they submit their report after midnight (12:00 AM – 8:59 AM), their default report date is the Night shift start date (the 1st)!
    function getEffectiveReportDateForAgent(agentId) {
      const now = new Date();
      if (agentId && now.getHours() < 9) {
        const yesterday = new Date(now);
        yesterday.setDate(now.getDate() - 1);
        const yMonthKey = `${String(yesterday.getMonth() + 1).padStart(2, '0')}/${yesterday.getFullYear()}`;
        const rosterList = getRosterForMonth(yMonthKey);
        const myRow = rosterList.find(r => String(r.id) === String(agentId));
        if (myRow) {
          const dayKeys = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
          const yShift = String(myRow[dayKeys[yesterday.getDay()]] || '').trim().toUpperCase();
          if (yShift.includes('NIGHT') || yShift.includes('11:00')) {
            return `${String(yesterday.getDate()).padStart(2, '0')}/${String(yesterday.getMonth() + 1).padStart(2, '0')}/${yesterday.getFullYear()}`;
          }
        }
      }
      return getTodayFormatted();
    }

        const preferredId = agentId || lastSelectedAgentId || (allAg[0] && allAg[0].id);
        if (selEl && preferredId) {
          selEl.value = preferredId;
          lastSelectedAgentId = preferredId;
          resolvedAgentId = preferredId;
        }
      }
      const targetDate = (dateStr && dateStr !== 'ALL') ? dateStr : getEffectiveReportDateForAgent(resolvedAgentId);
      document.getElementById('subDate').value = dateToInputVal(targetDate);
      onModalChange();
      openModal('submitModal');
    }

        lastSelectedAgentId = agentId;

      const existing = sales.find(s => String(s.userId) === String(agentId) && s.date === dateStr);

      if (existing) {
        document.getElementById('subLeads').value = existing.leads || 0;

    function commitSalesEntryInstant(entry, targetAgent, isUpdate) {
      let sales = getStored('sales_records', []);
      sales = sales.filter(s => !(String(s.userId) === String(entry.userId) && s.date === entry.date));
      sales.unshift(entry);
      setStored('sales_records', sales);

      const submittedMonthKey = entry.date.substring(3);
      if (submittedMonthKey && submittedMonthKey.length === 7) {
        selectedMonthKey = submittedMonthKey;
        localStorage.setItem('gb_selected_month', selectedMonthKey);
      }
      reportsDateFilter = entry.date;

      const logMeta = recordActivityLog(
        isUpdate ? 'Updated Sales Report' : 'Submitted Sales Report',
        `${isUpdate ? 'Updated' : 'Submitted'} sales report for ${targetAgent.name} (${entry.date}) — Leads: ${entry.leads}, Orders: ${entry.orders}, Amount: ৳${entry.amount.toLocaleString()}`
      );

      // Instant 0ms UI update & sleek toast notification
      closeModal('submitModal');
      renderAppLayout();
      showPortalToast(
        isUpdate ? 'Report Updated & Synced' : 'Report Saved & Synced',
        `${targetAgent.name}'s report (${entry.date}) — ৳${entry.amount.toLocaleString()} updated across all panels!`,

          `<strong>New Data:</strong> Leads ${leads}, Orders ${orders}, Amount ৳${amount.toLocaleString()}

        // Helper: Convert any File or Clipboard Blob into a normalized PNG DataURL via HTML5 Canvas
    // This completely prevents Tesseract/Leptonica `Cannot read properties of null (reading 'SetImageFile')` on Ctrl+V pasted screenshots!
        // =========================================================================
    // ULTRA-ACCURATE ERP TABLE OCR PREPROCESSOR & CALCULATIVE PARSER
    // =========================================================================
    // 1. Erases light-grey table borders (RGB >= 200) and scales image 2.25x so
    //    Tesseract reads every single row (1 to 25+) without skipping a single line!
    function normalizeImageBlobToDataUrl(fileOrBlob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(ev) {
          const dataUrl = ev.target.result;
          const img = new Image();
          img.onload = function() {
            try {
              const origW = img.naturalWidth || img.width || 1200;
              const origH = img.naturalHeight || img.height || 800;
              // Scale up small/medium screenshots so 11px table fonts become crisp 24px fonts
              const scale = origW < 1800 ? 2.2 : 1.25;
              const w = Math.round(origW * scale);
              const h = Math.round(origH * scale);

              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, w, h);
              ctx.imageSmoothingEnabled = true;
              ctx.imageSmoothingQuality = 'high';
              ctx.drawImage(img, 0, 0, w, h);

              // Erase light-grey table gridlines (e.g. Gray ~215-248) -> pure white (255)
              // and sharpen dark text so Tesseract never drops table rows!
              const imgData = ctx.getImageData(0, 0, w, h);
              const d = imgData.data;
              for (let i = 0; i < d.length; i += 4) {
                const r = d[i], g = d[i + 1], b = d[i + 2];
                const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                const maxDiff = Math.max(Math.abs(r - g), Math.abs(g - b), Math.abs(r - b));
                if (lum >= 202 || (lum >= 188 && maxDiff <= 14)) {
                  // Table border line or light background -> pure white
                  d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
                } else if (lum < 155) {
                  // Dark text pixel -> darken for crisp OCR contrast
                  const v = Math.max(0, Math.round(lum * 0.45));
                  d[i] = v; d[i + 1] = v; d[i + 2] = v;
                }
              }
              ctx.putImageData(imgData, 0, 0);
              resolve(canvas.toDataURL('image/png'));
            } catch (canvasErr) {
              resolve(dataUrl);
            }
          };
          img.onerror = function() {
            resolve(dataUrl);
          };
          img.src = dataUrl;
        };
        reader.onerror = function(err) {
          reject(err);
        };
        reader.readAsDataURL(fileOrBlob);
      });
    }

    async function runSafeTesseractOcr(imageDataUrl) {
      // Use PSM 6 (Uniform block of text / table) so Tesseract reads row-by-row left-to-right!
      try {
        if (window.Tesseract && typeof Tesseract.createWorker === 'function') {
          const worker = await Tesseract.createWorker('eng');
          if (typeof worker.setParameters === 'function') {
            await worker.setParameters({
              tessedit_pageseg_mode: '6',
              preserve_interword_spaces: '1'
            });
          }
          const ret = await worker.recognize(imageDataUrl);
          await worker.terminate();
          return ret?.data?.text || '';
        }
      } catch (wErr) {}
      if (window.Tesseract && typeof Tesseract.recognize === 'function') {
        const res = await Tesseract.recognize(imageDataUrl, 'eng');
        return res?.data?.text || '';
      }
      return '';
    }

    async function processAiErpImageFiles(files) {
      if (!files || files.length === 0) return;

      const progBox = document.getElementById('aiScanProgressBox');
      const resBox = document.getElementById('aiAnalysisResultContainer');
      const stageTitle = document.getElementById('aiScanStageTitle');
      const pctBadge = document.getElementById('aiScanPctBadge');

      if (progBox) progBox.classList.remove('hidden');
      if (resBox) resBox.classList.add('hidden');

      let combinedText = '';
      try {
        for (let i = 0; i < files.length; i++) {
          const f = files[i];
          const labelName = (f && f.name && f.name !== 'image.png') ? f.name : `Clipboard Screenshot #${i + 1}`;
          if (stageTitle) stageTitle.textContent = `AI Enhancing & Scanning Table Rows (${labelName})...`;
          if (pctBadge) pctBadge.textContent = `Enhancing...`;

          const safePngDataUrl = await normalizeImageBlobToDataUrl(f);
          if (pctBadge) pctBadge.textContent = `Reading Rows...`;
          const extractedText = await runSafeTesseractOcr(safePngDataUrl);
          combinedText += '\n' + (extractedText || '');
          if (pctBadge) pctBadge.textContent = `${Math.round(((i + 1) / files.length) * 100)}% Done`;
        }

        const rawArea = document.getElementById('aiRawOcrTextarea');
        if (rawArea) rawArea.value = combinedText.trim();

        analyzeErpOcrText(combinedText);
        showPortalToast('AI Table Calculation Complete!', 'Calculated exact KG for each product variant × Quantity Sold. Review below!', 'success');
      } catch (err) {
        showPortalToast('Manual Review Mode', 'Opened table editor so you can review or paste report text directly.', 'warning');
        analyzeErpOcrText('');
      } finally {
        if (progBox) progBox.classList.add('hidden');
      }
    }

    // Listen for Ctrl+V (Clipboard Paste) to directly upload copied screenshots OR copied ERP table text!
    window.addEventListener('paste', async (e) => {
      if (!currentUser || !hasFeatureAccess(currentUser, 'feat_ai_erp_import')) return;
      const aiModalEl = document.getElementById('aiImportModal');
      const isAiModalVisible = aiModalEl && !aiModalEl.classList.contains('hidden');
