<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghorerbazar - SalesTrack Pro Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', 'Hind Siliguri', sans-serif; background-color: #f8fafc; }
    .glass-sidebar { background: #ffffff; border-right: 1px solid #e2e8f0; }
    .card-neo { background: #ffffff; border-radius: 20px; border: 1px solid #eef2f8; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); }
    .tab-active { background: #2563eb; color: #ffffff !important; box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.5); }
    .badge-soft-orange { background-color: #ffedd5; color: #c2410c; }
    .badge-soft-blue { background-color: #dbeafe; color: #1d4ed8; }
    
    .highlight-card-blue { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.35); }
    .highlight-card-emerald { background: linear-gradient(135deg, #059669 0%, #047857 100%); color: #ffffff; box-shadow: 0 12px 28px -6px rgba(5, 150, 105, 0.35); }
    .highlight-card-purple { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); color: #ffffff; box-shadow: 0 12px 28px -6px rgba(124, 58, 237, 0.35); }
    .highlight-card-amber { background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); color: #ffffff; box-shadow: 0 12px 28px -6px rgba(234, 88, 12, 0.35); }
    .highlight-card-indigo { background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); color: #ffffff; box-shadow: 0 12px 28px -6px rgba(79, 70, 229, 0.35); }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const DEFAULT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzSU2lVaPwCtdDJM3mvmpDSx2HQxm96nPYSkHOEpKSKGrxRPS_8A8b0v25TkT2WVHO8Fug/exec";

    const DEFAULT_USERS = [
      { id: '10122', name: 'Md. Nazimur Rahman (TL)', role: 'admin', team: 'Team Nazim', pass: 'admin123' },
      { id: '10107', name: 'Md Abdus Samad (TL)', role: 'admin', team: 'Team Samad', pass: 'admin123' },
      
      { id: '10191', name: 'Shagor Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 650, monthlyAmountTarget: 1300000 },
      { id: '10289', name: 'Abdullah Dipu', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11044', name: 'Hasibul Islam Eraz', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10741', name: 'Kamruzzaman Shujon', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10803', name: 'Md. Abdullah Mahmud', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11042', name: 'Md. Ashiqur Rahman', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10328', name: 'Sheikh MD Rayhan', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10135', name: 'Ranju Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },

      { id: '10098', name: 'Habibur Rahman Shuvo', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10136', name: 'Al-Amin Kazi', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11007', name: 'Zubayer Al Mahmud', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11101', name: 'Md. Mehedi Amin', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11120', name: 'Abu Sayed', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '11130', name: 'Rabbir Hossain Molla', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10806', name: 'Abdullah Al Soad', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 },
      { id: '10128', name: 'Al-Amin', role: 'agent', team: 'Team Samad', pass: '123456', monthlyOrdersTarget: 260, monthlyAmountTarget: 320000 }
    ];

    function getStored(k, d) { const r = localStorage.getItem('gb_' + k); return r ? JSON.parse(r) : d; }
    function setStored(k, v) { localStorage.setItem('gb_' + k, JSON.stringify(v)); }

    if (!localStorage.getItem('gb_users')) setStored('users', DEFAULT_USERS);

    let currentUser = getStored('session_user', null);
    let activeTab = 'dashboard';
    let timerInterval = null;
    let pollInterval = null;
    let webhookUrl = localStorage.getItem('gb_webhook_url') || DEFAULT_WEBHOOK_URL;

    function getTodayFormatted() {
      const d = new Date();
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function cleanDisplayDate(raw) {
      if (!raw) return getTodayFormatted();
      let s = String(raw).trim();
      const p = s.split('/');
      if (p.length === 3) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const mIdx = parseInt(p[1], 10) - 1;
        if (mIdx >= 0 && mIdx < 12) return `${p[0]} ${months[mIdx]} ${p[2]}`;
      }
      return s;
    }

    function dateToInputVal(dateStr) {
      if (!dateStr) return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/');
      if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }

    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-');
      if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }

    function getUserTargetInfo(user) {
      const allUsers = getStored('users', []);
      if (user.role === 'admin') {
        const teamAgents = allUsers.filter(u => u.role === 'agent' && u.team === user.team);
        const monthlyAmount = teamAgents.reduce((sum, a) => sum + (Number(a.monthlyAmountTarget) || 0), 0);
        const monthlyOrders = teamAgents.reduce((sum, a) => sum + (Number(a.monthlyOrdersTarget) || 0), 0);
        return { monthlyAmountTarget: monthlyAmount, monthlyOrdersTarget: monthlyOrders, dailyAmountTarget: Math.round(monthlyAmount / 26), dailyOrdersTarget: Math.round(monthlyOrders / 26), agentCount: teamAgents.length };
      } else {
        const fresh = allUsers.find(u => u.id === user.id) || user;
        const monthlyAmount = Number(fresh.monthlyAmountTarget) || 320000;
        const monthlyOrders = Number(fresh.monthlyOrdersTarget) || 260;
        return { monthlyAmountTarget: monthlyAmount, monthlyOrdersTarget: monthlyOrders, dailyAmountTarget: Math.round(monthlyAmount / 26), dailyOrdersTarget: Math.round(monthlyOrders / 26), agentCount: 1 };
      }
    }

    function getFreshUser() {
      if (!currentUser) return null;
      const users = getStored('users', []);
      const match = users.find(u => u.id === currentUser.id);
      if (match) { currentUser = { ...currentUser, ...match }; setStored('session_user', currentUser); }
      return currentUser;
    }

    // UNIFIED SYNC FOR BOTH ADMIN & AGENT (FIXED PAYLOAD BUG)
    async function postToSheet(action, payload) {
      try {
        const fullData = { action, timestamp: new Date().toISOString(), ...payload };
        const params = new URLSearchParams({ action: action, payload: JSON.stringify(fullData), ...payload });
        fetch(`${webhookUrl}?${params.toString()}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});
        new Image().src = `${webhookUrl}?${params.toString()}&_cb=${Date.now()}`;
      } catch (e) { console.warn('Sync warning:', e); }
    }

    function fetchFromSheet() {
      const callbackName = 'gb_cb_' + Date.now();
      window[callbackName] = function(res) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') handleCloudDataReceived(res);
      };
      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${callbackName}&t=${Date.now()}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}`).then(r => r.json()).then(res => { if (res && res.status === 'success') handleCloudDataReceived(res); }).catch(() => {});
      };
      document.body.appendChild(script);
    }

    function handleCloudDataReceived(res) {
      let hasChanges = false;
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          hasChanges = true;
        }
      }
      if (hasChanges && currentUser) {
        getFreshUser();
        render();
      }
    }

    function startBackgroundSync() {
      if (pollInterval) clearInterval(pollInterval);
      fetchFromSheet();
      pollInterval = setInterval(fetchFromSheet, 3000);
    }

    function init() { getFreshUser(); render(); if (currentUser && currentUser.role === 'agent') startShiftTimer(); startBackgroundSync(); }

    function render() {
      const app = document.getElementById('app');
      if (!currentUser) { app.innerHTML = renderLogin(); }
      else { getFreshUser(); app.innerHTML = renderAppLayout(); attachCharts(); }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 via-orange-50/30 to-blue-50/40">
          <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 p-8">
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-500 text-white shadow-lg mb-4"><i class="fa-solid fa-basket-shopping text-3xl"></i></div>
              <h1 class="text-2xl font-black text-slate-900">Ghorerbazar</h1>
              <p class="text-xs font-bold text-slate-400 mt-1 uppercase">Sign In to SalesTrack</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
              <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">User ID</label><input type="text" id="loginId" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold"></div>
              <div><label class="block text-xs font-bold uppercase text-slate-600 mb-1.5">Password</label><input type="password" id="loginPass" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold"></div>
              <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-2.5 rounded-lg text-center font-semibold"></div>
              <button type="submit" class="w-full py-3.5 bg-orange-500 text-white font-bold rounded-xl shadow-lg">Sign In</button>
            </form>
          </div>
        </div>
      `;
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const users = getStored('users', []);
      const user = users.find(u => u.id === id && u.pass === pass);
      if (!user) { document.getElementById('loginError').textContent = 'ভুল User ID অথবা Password!'; document.getElementById('loginError').classList.remove('hidden'); return; }
      currentUser = user; setStored('session_user', user); render(); startBackgroundSync();
    }

    function handleLogout() { if (pollInterval) clearInterval(pollInterval); currentUser = null; localStorage.removeItem('gb_session_user'); activeTab = 'dashboard'; render(); }
    function setTab(tab) { activeTab = tab; render(); }

    function startShiftTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const attendance = getStored('attendance', []);
        const todayStr = getTodayFormatted();
        const session = attendance.find(a => a.userId === currentUser.id && a.date === todayStr);
        if (session) {
          if (!session.isOnBreak) session.activeSeconds = (session.activeSeconds || 0) + 1;
          setStored('attendance', attendance);
          const shiftEl = document.getElementById('timer-working-clock');
          if (shiftEl) shiftEl.textContent = formatTime(session.activeSeconds);
        }
      }, 1000);
    }

    function formatTime(sec) {
      const h = String(Math.floor(sec / 3600)).padStart(2, '0');
      const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function renderAppLayout() {
      const u = getFreshUser();
      return `
        <div class="flex-1 flex min-h-screen">
          <aside class="w-64 glass-sidebar flex flex-col justify-between p-5 z-20">
            <div>
              <div class="flex items-center gap-3 px-2 mb-8">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-500 text-white flex items-center justify-center font-bold"><i class="fa-solid fa-chart-line"></i></div>
                <div><h1 class="text-base font-extrabold text-slate-900">SalesTrack</h1><p class="text-[10px] text-slate-400 font-bold uppercase">Cloud Connected</p></div>
              </div>
              <nav class="space-y-1.5">
                <button onclick="setTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold ${activeTab === 'dashboard' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-house"></i> Dashboard</button>
                <button onclick="setTab('attendance')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold ${activeTab === 'attendance' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-regular fa-clock"></i> Attendance & Live</button>
                <button onclick="setTab('performance')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold ${activeTab === 'performance' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-chart-pie"></i> Performance</button>
                <button onclick="setTab('daily_reports')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold ${activeTab === 'daily_reports' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-file-invoice"></i> Daily Reports</button>
                <button onclick="setTab('target')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold ${activeTab === 'target' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-bullseye"></i> Target Setup</button>
                <button onclick="setTab('ranking')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold ${activeTab === 'ranking' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-trophy"></i> Ranking & Teams</button>
                ${u.role === 'admin' ? `<button onclick="setTab('settings')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-xs font-bold ${activeTab === 'settings' ? 'tab-active' : 'text-slate-500 hover:bg-slate-50'}"><i class="fa-solid fa-gear"></i> Settings</button>` : ''}
              </nav>
            </div>
            <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
          </aside>

          <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            <header class="h-16 px-8 flex items-center justify-between border-b border-slate-200 bg-white sticky top-0 z-10">
              <div class="flex items-center gap-2"><span class="text-xs font-bold text-slate-400 uppercase">Workspace</span>/<span class="text-xs font-extrabold text-slate-800 uppercase capitalize">${activeTab.replace('_', ' ')}</span></div>
              <div class="flex items-center gap-4">
                <button onclick="fetchFromSheet()" class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block mr-1 animate-pulse"></span> Cloud Live</button>
                <div class="flex items-center gap-2.5 pl-3 border-l border-slate-200">
                  <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xs">${u.name.charAt(0)}</div>
                  <div><p class="text-xs font-bold text-slate-800 leading-none">${u.name}</p><span class="text-[10px] font-semibold text-slate-400 uppercase">${u.role === 'admin' ? 'Admin' : 'Agent'}</span></div>
                </div>
              </div>
            </header>
            <main class="p-8 flex-1">${renderTabContent()}</main>
          </div>
        </div>

        <!-- Submit Modal -->
        <div id="submitModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-sm font-extrabold text-slate-900">Daily Sales Report</h3>
              <button onclick="closeModal('submitModal')" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleSalesSubmit(event)" class="space-y-3.5">
              <div id="agentSelectContainer" class="${u.role === 'admin' ? '' : 'hidden'}">
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Select Agent</label>
                <select id="subAgentId" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold">
                  ${getStored('users', []).filter(usr => usr.role === 'agent').map(usr => `<option value="${usr.id}">${usr.name} (${usr.id})</option>`).join('')}
                </select>
              </div>
              <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Report Date</label><input type="date" id="subDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
              <div class="grid grid-cols-3 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Leads</label><input type="number" id="subLeads" required min="1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Orders</label><input type="number" id="subOrders" required min="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
                <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Amount (৳)</label><input type="number" id="subAmount" required min="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
              </div>
              <div class="flex justify-between items-center pt-2">
                <button type="button" id="deleteReportBtn" onclick="handleDeleteCurrentReport()" class="hidden px-4 py-2 text-xs font-bold text-red-600 bg-red-50 rounded-xl">Delete</button>
                <div class="flex gap-2">
                  <button type="button" onclick="closeModal('submitModal')" class="px-4 py-2 text-xs font-bold text-slate-600">Cancel</button>
                  <button type="submit" class="px-5 py-2.5 text-xs font-bold text-white bg-blue-600 rounded-xl">Submit</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function openReportModal(targetAgentId, targetDateStr) {
      const u = getFreshUser();
      document.getElementById('subDate').value = dateToInputVal(targetDateStr || getTodayFormatted());
      if (u.role === 'admin' && targetAgentId) { document.getElementById('subAgentId').value = targetAgentId; }
      
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      const sales = getStored('sales_records', []);
      const existing = sales.find(s => s.userId === agentId && s.date === dateStr);
      
      if (existing) {
        document.getElementById('subLeads').value = existing.leads;
        document.getElementById('subOrders').value = existing.orders;
        document.getElementById('subAmount').value = existing.amount;
        document.getElementById('deleteReportBtn').classList.remove('hidden');
      } else {
        document.getElementById('subLeads').value = '';
        document.getElementById('subOrders').value = '';
        document.getElementById('subAmount').value = '';
        document.getElementById('deleteReportBtn').classList.add('hidden');
      }
      openModal('submitModal');
    }

    async function handleSalesSubmit(e) {
      e.preventDefault();
      const u = getFreshUser();
      const allUsers = getStored('users', []);

      let targetAgent = u;
      if (u.role === 'admin') {
        const selId = document.getElementById('subAgentId').value;
        targetAgent = allUsers.find(usr => usr.id === selId) || u;
      }

      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      const leads = Number(document.getElementById('subLeads').value) || 0;
      const orders = Number(document.getElementById('subOrders').value) || 0;
      const amount = Number(document.getElementById('subAmount').value) || 0;
      const ratio = leads > 0 ? Number(((orders / leads) * 100).toFixed(2)) : 0;

      let sales = getStored('sales_records', []);
      const existingIdx = sales.findIndex(s => s.userId === targetAgent.id && s.date === dateStr);

      const entry = {
        id: existingIdx !== -1 ? sales[existingIdx].id : 'rec_' + targetAgent.id + '_' + Date.now(),
        userId: targetAgent.id,
        userName: targetAgent.name,
        team: targetAgent.team,
        date: dateStr,
        time: new Date().toLocaleTimeString(),
        leads, orders, amount, ratio
      };

      if (existingIdx !== -1) sales[existingIdx] = entry;
      else sales.unshift(entry);

      setStored('sales_records', sales);
      render();

      await postToSheet('DAILY_SALES_SUBMIT', entry);
      alert(`ধন্যবাদ! ${targetAgent.name}-এর রিপোর্ট সফলভাবে সেভ হয়েছে।`);
      closeModal('submitModal');
      setTimeout(fetchFromSheet, 1500);
    }

    async function handleDeleteCurrentReport() {
      const u = getFreshUser();
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);

      if (!confirm(`আপনি কি নিশ্চিতভাবে এই রিপোর্টটি (${dateStr}) মুছে ফেলতে চান?`)) return;

      let sales = getStored('sales_records', []);
      sales = sales.filter(s => !(s.userId === agentId && s.date === dateStr));
      setStored('sales_records', sales);
      render();

      await postToSheet('DELETE_SALES_RECORD', { userId: agentId, date: dateStr });
      alert('রিপোর্টটি সফলভাবে ডিলিট করা হয়েছে!');
      closeModal('submitModal');
      setTimeout(fetchFromSheet, 1500);
    }

    function renderTabContent() {
      switch(activeTab) {
        case 'dashboard': return renderDashboardView();
        case 'attendance': return renderAttendanceView();
        case 'performance': return renderPerformanceView();
        case 'daily_reports': return renderDailyReportsView();
        case 'target': return renderTargetSetupView();
        case 'ranking': return renderRankingView();
        case 'settings': return renderSettingsView();
        default: return renderDashboardView();
      }
    }

    function renderDashboardView() {
      const u = getFreshUser();
      const t = getUserTargetInfo(u);
      const sales = getStored('sales_records', []);
      const todayStr = getTodayFormatted();
      const attendance = getStored('attendance', []);
      const todaySession = attendance.find(a => a.userId === u.id && a.date === todayStr) || { activeSeconds: 0 };

      const mySales = u.role === 'admin' ? sales.filter(s => s.team === u.team) : sales.filter(s => s.userId === u.id);

      const totalLeads = mySales.reduce((a, c) => a + c.leads, 0);
      const totalOrders = mySales.reduce((a, c) => a + c.orders, 0);
      const totalAmount = mySales.reduce((a, c) => a + c.amount, 0);
      const avgConversionRatio = totalLeads > 0 ? ((totalOrders / totalLeads) * 100).toFixed(2) : '0.00';

      const targetAmount = t.monthlyAmountTarget;
      const targetOrders = t.monthlyOrdersTarget;
      const dailyOrdersTarget = t.dailyOrdersTarget;
      const dailyAmountTarget = t.dailyAmountTarget;
      const achievePct = targetAmount > 0 ? Math.min(100, Math.round((totalAmount / targetAmount) * 100)) : 0;

      return `
        <div class="space-y-6">
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-2xl font-black text-slate-900 leading-tight">Welcome, ${u.name}! 👋</h2>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${u.role === 'admin' ? 'bg-orange-100 text-orange-800' : 'bg-blue-100 text-blue-800'}">
                  ${u.team} (${u.role === 'admin' ? `Team Leader • ${t.agentCount} Agents Total Sum` : 'Sales Agent'})
                </span>
              </div>
            </div>
            <div class="flex flex-wrap items-center gap-3">
              <div class="px-4 py-2.5 bg-blue-50/90 border border-blue-200 rounded-xl text-left">
                <span class="text-[10px] uppercase font-black text-blue-700 block tracking-wider">🎯 Daily Amount Target</span>
                <p class="text-sm font-black text-blue-900 mt-0.5">৳${dailyAmountTarget.toLocaleString()} <span class="text-xs font-bold text-blue-600">(${dailyOrdersTarget} Orders)</span></p>
              </div>
              <button onclick="openReportModal()" class="px-5 py-3 rounded-xl text-xs font-bold text-white ${u.role === 'admin' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-blue-600 hover:bg-blue-700'} shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-plus text-sm"></i> ${u.role === 'admin' ? 'Add / Edit Agent Report' : 'Submit Daily Report'}
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="highlight-card-blue p-5 rounded-2xl"><span class="text-xs font-bold uppercase tracking-wider text-blue-100">Total Leads</span><p class="text-3xl font-black text-white mt-4">${totalLeads}</p></div>
            <div class="highlight-card-emerald p-5 rounded-2xl"><span class="text-xs font-bold uppercase tracking-wider text-emerald-100">Total Orders</span><p class="text-3xl font-black text-white mt-4">${totalOrders} / ${targetOrders}</p></div>
            <div class="highlight-card-purple p-5 rounded-2xl"><span class="text-xs font-bold uppercase tracking-wider text-purple-100">Sales Amount</span><p class="text-2xl font-black text-white mt-4">৳${totalAmount.toLocaleString()}</p></div>
            <div class="highlight-card-indigo p-5 rounded-2xl"><span class="text-xs font-bold uppercase tracking-wider text-indigo-100">Monthly Target</span><p class="text-2xl font-black text-white mt-4">৳${targetAmount.toLocaleString()}</p></div>
            <div class="highlight-card-amber p-5 rounded-2xl"><span class="text-xs font-bold uppercase tracking-wider text-amber-100">Achievement</span><p class="text-3xl font-black text-white mt-4">${achievePct}%</p></div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 card-neo p-6">
              <h3 class="text-sm font-extrabold text-slate-900 mb-4">Sales Performance Trend</h3>
              <div class="h-60 w-full"><canvas id="salesTrendChart"></canvas></div>
            </div>
            <div class="card-neo p-6">
              <h3 class="text-sm font-extrabold text-slate-900 mb-3">Live Duty Status</h3>
              <p class="text-3xl font-black font-mono text-slate-800 my-2" id="timer-working-clock">${formatTime(todaySession.activeSeconds)}</p>
              <p class="text-[11px] text-slate-400 font-semibold mb-4">Shift active</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderAttendanceView() {
      const users = getStored('users', []).filter(u => u.role === 'agent');
      const attendance = getStored('attendance', []);
      const todayStr = getTodayFormatted();
      return `
        <div class="space-y-6">
          <h2 class="text-xl font-black text-slate-900">Attendance & Live Shift Tracking</h2>
          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b uppercase text-slate-400 font-bold">
                <tr><th class="p-4">Agent Name</th><th class="p-4">Team</th><th class="p-4">Status</th><th class="p-4">Active Time</th></tr>
              </thead>
              <tbody class="divide-y font-medium">
                ${users.map(u => {
                  const s = attendance.find(a => a.userId === u.id && a.date === todayStr);
                  return `<tr><td class="p-4 font-bold">${u.name} (${u.id})</td><td class="p-4">${u.team}</td><td class="p-4"><span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 font-bold">Online</span></td><td class="p-4 font-mono">${s ? formatTime(s.activeSeconds) : '00:00:00'}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderPerformanceView() {
      return `
        <div class="space-y-6">
          <h2 class="text-xl font-black text-slate-900">Performance & Conversion Analytics</h2>
          <div class="card-neo p-6 space-y-4">
            <p class="text-xs font-bold text-slate-600">• Conversion Ratio = (Total Orders ÷ Total Leads) × 100%</p>
            <p class="text-xs font-bold text-slate-600">• Daily Target = Monthly Target Amount ÷ 26 Working Days</p>
            <div class="h-64"><canvas id="conversionPieChart"></canvas></div>
          </div>
        </div>
      `;
    }
    
    function renderDailyReportsView() {
      const sales = getStored('sales_records', []);
      return `
        <div class="space-y-6">
          <div class="flex items-center justify-between">
            <h2 class="text-xl font-black text-slate-900">Agent Daily Reports Log</h2>
            <button onclick="openReportModal()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">New / Edit Report</button>
          </div>
          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b border-slate-100 uppercase text-slate-400 font-bold">
                <tr><th class="p-4">Report Date</th><th class="p-4">Agent Name</th><th class="p-4">Team</th><th class="p-4">Leads</th><th class="p-4">Orders</th><th class="p-4">Amount</th><th class="p-4 text-right">Action</th></tr>
              </thead>
              <tbody class="divide-y divide-slate-100 font-medium">
                ${sales.length === 0 ? '<tr><td colspan="7" class="p-8 text-center text-slate-400">কোন রেকর্ড নেই।</td></tr>' : ''}
                ${sales.map(s => `
                  <tr>
                    <td class="p-4">${cleanDisplayDate(s.date)}</td>
                    <td class="p-4 font-bold">${s.userName} (${s.userId})</td>
                    <td class="p-4">${s.team}</td>
                    <td class="p-4">${s.leads}</td>
                    <td class="p-4 font-bold text-blue-600">${s.orders}</td>
                    <td class="p-4 font-bold text-emerald-600">৳${s.amount.toLocaleString()}</td>
                    <td class="p-4 text-right"><button onclick="openReportModal('${s.userId}', '${s.date}')" class="px-3 py-1 bg-slate-100 rounded font-bold">Edit / Delete</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderTargetSetupView() {
      const users = getStored('users', []).filter(u => u.role === 'agent');
      return `
        <div class="space-y-6">
          <h2 class="text-xl font-black text-slate-900">Target Management</h2>
          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b uppercase text-slate-400 font-bold">
                <tr><th class="p-4">Agent Name</th><th class="p-4">Team</th><th class="p-4">Monthly Target (Amount)</th><th class="p-4">Monthly Orders</th></tr>
              </thead>
              <tbody class="divide-y font-medium">
                ${users.map(u => `<tr><td class="p-4 font-bold">${u.name} (${u.id})</td><td class="p-4">${u.team}</td><td class="p-4 font-bold text-emerald-600">৳${(u.monthlyAmountTarget || 320000).toLocaleString()}</td><td class="p-4 font-bold text-blue-600">${u.monthlyOrdersTarget || 260} Orders</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderRankingView() {
      const users = getStored('users', []).filter(u => u.role === 'agent');
      const sales = getStored('sales_records', []);
      const ranked = users.map(u => {
        const uSales = sales.filter(s => s.userId === u.id);
        const amount = uSales.reduce((a, c) => a + c.amount, 0);
        const orders = uSales.reduce((a, c) => a + c.orders, 0);
        return { ...u, amount, orders };
      }).sort((a, b) => b.amount - a.amount);

      return `
        <div class="space-y-6">
          <h2 class="text-xl font-black text-slate-900">Agent Rankings & Leaderboard</h2>
          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 border-b uppercase text-slate-400 font-bold">
                <tr><th class="p-4">Rank</th><th class="p-4">Agent Name</th><th class="p-4">Team</th><th class="p-4">Total Sales</th><th class="p-4">Orders</th></tr>
              </thead>
              <tbody class="divide-y font-medium">
                ${ranked.map((r, i) => `<tr><td class="p-4 font-black">${i+1}</td><td class="p-4 font-bold">${r.name}</td><td class="p-4">${r.team}</td><td class="p-4 font-bold text-emerald-600">৳${r.amount.toLocaleString()}</td><td class="p-4 font-bold text-blue-600">${r.orders}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }
    
    function renderSettingsView() {
      return `
        <div class="max-w-xl card-neo p-6 space-y-5">
          <h2 class="text-lg font-black text-slate-900">Cloud Sync Settings</h2>
          <input type="url" id="settingsWebhook" value="${webhookUrl}" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold">
          <button onclick="saveSettingsWebhook()" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold">Save & Connect</button>
        </div>
      `;
    }

    function saveSettingsWebhook() {
      webhookUrl = document.getElementById('settingsWebhook').value.trim() || DEFAULT_WEBHOOK_URL;
      localStorage.setItem('gb_webhook_url', webhookUrl);
      alert('Updated!'); fetchFromSheet();
    }

    function attachCharts() {
      if (activeTab === 'dashboard') {
        const ctx = document.getElementById('salesTrendChart');
        if (ctx) {
          new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], datasets: [{ data: [15, 25, 35, 30, 45, 55, 40], backgroundColor: '#2563eb' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
          });
        }
      } else if (activeTab === 'performance') {
        const ctxP = document.getElementById('conversionPieChart');
        if (ctxP) {
          new Chart(ctxP, {
            type: 'doughnut',
            data: { labels: ['Converted', 'Unconverted'], datasets: [{ data: [65, 35], backgroundColor: ['#059669', '#e2e8f0'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
          });
        }
      }
    }

    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

    window.addEventListener('load', init);
  </script>
</html>
