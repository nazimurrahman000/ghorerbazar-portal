    function getStored(key, def) { const r = localStorage.getItem('gb_' + key); return r ? JSON.parse(r) : def; }

    function getTodayFormatted() {
      const d = new Date(); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }
    function dateToInputVal(dateStr) {
      if (!dateStr) return new Date().toISOString().split('T')[0];
      const p = dateStr.split('/'); if (p.length === 3) return `${p[2]}-${p[1]}-${p[0]}`;
      return new Date().toISOString().split('T')[0];
    }
    function inputValToDateStr(val) {
      if (!val) return getTodayFormatted();
      const p = val.split('-'); if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
      return getTodayFormatted();
    }
    function cleanDisplayDate(raw) {
      if (!raw) return getTodayFormatted();
      let s = String(raw).trim();
      const p = s.split('/');
      if (p.length === 3) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const mIdx = parseInt(p[1], 10) - 1;
        if (mIdx >= 0 && mIdx < 12) return `${p[0]} ${months[mIdx]} ${p[2]}`;
      }
      return s;
    }

    // Sprint & Target Logic (5% Buffer Added)
    function getTargetData(user) {
      const allUsers = getStored('users', []);
      let baseTarget = 0;
      let agentCount = 1;
      
      if (user.role === 'admin') {
        const teamAgents = allUsers.filter(u => u.role === 'agent' && u.team === user.team);
        baseTarget = teamAgents.reduce((sum, a) => sum + (a.baseTarget || 0), 0);
        agentCount = teamAgents.length || 1;
      } else {
        const freshUser = allUsers.find(u => u.id === user.id) || user;
        baseTarget = freshUser.baseTarget || 0;
      }

      const workingTarget = Math.round(baseTarget * 1.05); // +5% Extra for Return/Cancel
      const d = new Date().getDate();
      let sprintName, sprintGoal, sprintPct;

      if (d <= 10) { sprintName = 'Sprint 1 (Days 1–10)'; sprintPct = 0.40; sprintGoal = Math.round(workingTarget * 0.40); }
      else if (d <= 20) { sprintName = 'Sprint 2 (Days 11–20)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }
      else { sprintName = 'Sprint 3 (Days 21–31)'; sprintPct = 0.35; sprintGoal = Math.round(workingTarget * 0.35); }

      return { baseTarget, workingTarget, sprintName, sprintGoal, sprintPct, agentCount };
    }

    // TRIPLE-REDUNDANCY SYNC (Form + Fetch + Image Beacon)
    async function postToSheet(action, payload) {
      const fullData = { action, timestamp: new Date().toISOString(), ...payload };
      const params = new URLSearchParams({ action, payload: JSON.stringify(fullData), ...payload });

      // Method 1: Fetch No-CORS
      fetch(`${webhookUrl}?${params.toString()}`, { method: 'GET', mode: 'no-cors' }).catch(() => {});

      // Method 2: Image Beacon
      new Image().src = `${webhookUrl}?${params.toString()}&_cb=${Date.now()}`;

      // Method 3: Hidden Form POST
      try {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = webhookUrl;
        form.target = 'hidden_iframe_target';
        form.style.display = 'none';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'payload';
        input.value = JSON.stringify(fullData);
        form.appendChild(input);

        let iframe = document.getElementById('hidden_iframe_target');
        if (!iframe) {
          iframe = document.createElement('iframe');
          iframe.name = 'hidden_iframe_target';
          iframe.id = 'hidden_iframe_target';
          iframe.style.display = 'none';
          document.body.appendChild(iframe);
        }

        document.body.appendChild(form);
        form.submit();
        setTimeout(() => { if (form.parentNode) form.parentNode.removeChild(form); }, 2000);
      } catch (e) {}
    }

    // CENTRAL CLOUD DATA PULL
    function fetchFromSheet() {
      const cbName = 'gb_cb_' + Date.now();
      window[cbName] = function(res) {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.status === 'success') handleCloudData(res);
      };
      const script = document.createElement('script');
      script.src = `${webhookUrl}?callback=${cbName}&t=${Date.now()}`;
      script.onerror = function() {
        if (script.parentNode) script.parentNode.removeChild(script);
        fetch(`${webhookUrl}?t=${Date.now()}`)
          .then(r => r.json())
          .then(res => { if (res && res.status === 'success') handleCloudData(res); })
          .catch(() => {});
      };
      document.body.appendChild(script);
    }

    function handleCloudData(res) {
      if (Array.isArray(res.salesRecords)) {
        const local = getStored('sales_records', []);
        if (JSON.stringify(res.salesRecords) !== JSON.stringify(local)) {
          setStored('sales_records', res.salesRecords);
          if (currentUser) renderAppLayout();
        }
      }
    }

    function init() {
      if (currentUser) {
        renderAppLayout();
        fetchFromSheet();
        if (pollInterval) clearInterval(pollInterval);
        pollInterval = setInterval(fetchFromSheet, 3500);
      } else {
        document.getElementById('app').innerHTML = renderLogin();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const user = getStored('users', []).find(u => u.id === id && u.pass === pass);
      if (!user) { alert('ভুল User ID অথবা Password!'); return; }
      currentUser = user;
      setStored('session_user', user);
      webhookUrl = DEFAULT_WEBHOOK_URL;
      init();
    }

      clearInterval(pollInterval);
      currentUser = null;

    function renderDashboard() {

      let mySales = u.role === 'admin' ? allSales.filter(s => s.team === u.team) : allSales.filter(s => s.userId === u.id);

      const thisMonthSales = mySales.filter(s => s.date.endsWith(currentMonthStr));

        if (tInfo.sprintName.includes('Sprint 1') && d <= 10) return acc + curr.amount;
        if (tInfo.sprintName.includes('Sprint 2') && d > 10 && d <= 20) return acc + curr.amount;
        if (tInfo.sprintName.includes('Sprint 3') && d > 20) return acc + curr.amount;
        return acc;
      }, 0);

      const monthTotalAmount = thisMonthSales.reduce((acc, curr) => acc + curr.amount, 0);
      const monthTotalOrders = thisMonthSales.reduce((acc, curr) => acc + curr.orders, 0);
      const monthTotalLeads = thisMonthSales.reduce((acc, curr) => acc + curr.leads, 0);
      
      const sprintPct = tInfo.sprintGoal > 0 ? Math.min(100, Math.round((sprintSalesAmount / tInfo.sprintGoal) * 100)) : 0;

                  <span>Achieved: <strong class="text-amber-300 text-sm">৳${sprintSalesAmount.toLocaleString()}</strong></span>
                </div>
                <div class="progress-white-bg h-3">
                  <div class="bg-amber-400 h-3 rounded-full transition-all" style="width: ${sprintPct}%"></div>
                </div>
                <div class="flex justify-between items-center mt-2 text-[11px] font-bold text-blue-100">
                  <span>Remaining: ৳${Math.max(0, tInfo.sprintGoal - sprintSalesAmount).toLocaleString()}</span>
                  <span class="text-white font-black">${sprintPct}% Completed</span>

              </div>
            </div>

            <div class="grad-monthly p-6 rounded-3xl relative overflow-hidden">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] font-black uppercase tracking-widest text-emerald-200 block">Monthly Total (With 5% Return Buffer)</span>
                  <h3 class="text-xl font-black text-white mt-1">Target: ৳${tInfo.workingTarget.toLocaleString()}</h3>
                </div>
                <div class="w-10 h-10 rounded-2xl bg-white/20 flex items-center justify-center text-white text-lg">
                  <i class="fa-solid fa-bullseye"></i>
                </div>
              </div>
              <div class="mt-6">
                <div class="flex justify-between text-xs font-bold mb-2 text-emerald-100">
                  <span>Total Orders: <strong class="text-white text-sm">${monthTotalOrders}</strong> (Leads: ${monthTotalLeads})</span>
                  <span>Revenue: <strong class="text-amber-300 text-sm">৳${monthTotalAmount.toLocaleString()}</strong></span>
                </div>
                <div class="progress-white-bg h-3">
                  <div class="bg-white h-3 rounded-full transition-all" style="width: ${monthPct}%"></div>
                </div>
                <div class="flex justify-between items-center mt-2 text-[11px] font-bold text-emerald-100">
                  <span>Remaining: ৳${Math.max(0, tInfo.workingTarget - monthTotalAmount).toLocaleString()}</span>
                  <span class="text-white font-black">${monthPct}% Achieved</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Product Targets Colorful Gradient Grid -->
          <div>
            <div class="flex items-center justify-between mb-4 mt-2">
              <h3 class="text-base font-black text-slate-800">
                <i class="fa-solid fa-gift text-orange-500 mr-1.5"></i> 
                Facebook Product Incentive Targets (${u.role === 'admin' ? `Team Sum • ${tInfo.agentCount} Agents` : 'Individual Goal'})
              </h3>
              <span class="text-xs font-bold text-slate-500">90% = Entry Bonus | 100% = Full Bonus</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              ${Object.keys(FB_PRODUCTS).map(k => {
                const p = FB_PRODUCTS[k];
                const achieved = pTotals[k];
                const target = p.targetKg * tInfo.agentCount; 
                const pct = Math.min(100, target > 0 ? Math.round((achieved / target) * 100) : 0);
                return `
                  <div class="${p.grad} p-5 rounded-3xl relative overflow-hidden transition-transform hover:-translate-y-1">
                    <div class="flex justify-between items-start mb-3">
                      <div>
                        <h4 class="font-black text-base text-white">${p.name}</h4>
                        <p class="text-[11px] text-white/80 font-bold">Target: ${target.toFixed(2)} kg</p>

                      <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center text-white">
                        <i class="fa-solid ${p.icon}"></i>
                      </div>
                    </div>
                    <div class="flex justify-between items-baseline mb-1.5">
                      <span class="text-2xl font-black text-white">${achieved.toFixed(2)} <span class="text-xs font-bold">kg</span></span>

    function renderReports() {

      const sales = getStored('sales_records', []).filter(s => u.role === 'admin' ? s.team === u.team : s.userId === u.id);
      
      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h2 class="text-xl font-black text-slate-900">Daily Sales & Product Logs</h2>
              <p class="text-xs font-semibold text-slate-400">আপনার প্রতিদিনের এন্ট্রি এখান থেকে এডিট বা ডিলিট করতে পারবেন</p>
            </div>
            <button onclick="openReportModal()" class="px-5 py-2.5 tab-active text-white rounded-xl text-xs font-bold"><i class="fa-solid fa-plus mr-1"></i> Add New Report</button>
          </div>
          <div class="card-neo overflow-hidden overflow-x-auto">

                  <th class="p-4 text-right">Actions</th>

              <tbody class="divide-y font-medium">

                ${sales.map(s => `
                  <tr class="hover:bg-slate-50">
                    <td class="p-4 font-bold text-slate-700">${cleanDisplayDate(s.date)}</td>
                    <td class="p-4 font-extrabold text-slate-900">${s.userName} <span class="text-slate-400 text-[10px]">(${s.userId})</span></td>
                    <td class="p-4 font-bold">${s.leads}</td>
                    <td class="p-4 font-extrabold text-blue-600">${s.orders}</td>
                    <td class="p-4 font-black text-emerald-600">৳${Number(s.amount).toLocaleString()}</td>
                    <td class="p-4 text-[11px] font-bold text-slate-600">
                      <span class="px-2 py-0.5 bg-amber-50 text-amber-800 rounded">Ajwa: ${s.ajwa||0}kg</span>
                      <span class="px-2 py-0.5 bg-rose-50 text-rose-800 rounded">Salt: ${s.pinkSalt||0}kg</span>
                      <span class="px-2 py-0.5 bg-purple-50 text-purple-800 rounded">Garlic: ${s.blackGarlic||0}kg</span>
                      <span class="px-2 py-0.5 bg-yellow-50 text-yellow-800 rounded">Sun.H: ${s.sunHoney||0}kg</span>
                      <span class="px-2 py-0.5 bg-blue-50 text-blue-800 rounded">BS.H: ${s.bsHoney||0}kg</span>
                      <span class="px-2 py-0.5 bg-emerald-50 text-emerald-800 rounded">Ghee: ${s.gawaGhee||0}kg</span>
                    </td>
                    <td class="p-4 text-right space-x-1">
                      <button onclick="openReportModal('${s.userId}', '${s.date}')" class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg font-bold hover:bg-blue-100"><i class="fa-solid fa-pen-to-square"></i> Edit / Delete</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderTeamStats() {
      const users = getStored('users', []).filter(u => u.role === 'agent' && u.team === currentUser.team);
      const sales = getStored('sales_records', []);
      const currentMonthStr = getTodayFormatted().substring(3);
      
      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <h2 class="text-xl font-black text-slate-900">Team Performance Leaderboard (${currentUser.team})</h2>
            <button onclick="openReportModal()" class="px-4 py-2 tab-active text-white rounded-xl text-xs font-bold">+ Add Agent Report</button>
          </div>
          <div class="card-neo overflow-hidden">
            <table class="w-full text-left text-xs">
              <thead class="grad-header text-white uppercase font-bold">
                <tr>
                  <th class="p-4">Agent Name</th>
                  <th class="p-4">Grade</th>
                  <th class="p-4">Base Target</th>
                  <th class="p-4">Working Target (+5%)</th>
                  <th class="p-4">Achieved Revenue</th>
                  <th class="p-4">Progress</th>
                  <th class="p-4 text-right">Action</th>
                </tr>
              </thead>
              <tbody class="divide-y font-medium">
                ${users.map(ag => {
                  const agSales = sales.filter(s => s.userId === ag.id && s.date.endsWith(currentMonthStr));
                  const rev = agSales.reduce((a, c) => a + Number(c.amount || 0), 0);
                  const workingTgt = Math.round(ag.baseTarget * 1.05);
                  const pct = Math.min(100, Math.round((rev / workingTgt) * 100));
                  return `<tr class="hover:bg-slate-50">
                    <td class="p-4 font-extrabold text-slate-800">${ag.name} <span class="text-slate-400">(${ag.id})</span></td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 font-black">${ag.grade}</span></td>
                    <td class="p-4 font-bold text-slate-500">৳${ag.baseTarget.toLocaleString()}</td>
                    <td class="p-4 font-extrabold text-amber-600">৳${workingTgt.toLocaleString()}</td>
                    <td class="p-4 font-black text-emerald-600 text-sm">৳${rev.toLocaleString()}</td>
                    <td class="p-4 font-black text-blue-600">${pct}%</td>
                    <td class="p-4 text-right">
                      <button onclick="openReportModal('${ag.id}')" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 font-bold rounded-lg hover:bg-indigo-100">Add / Edit Data</button>
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSubmitModal() {
      const u = currentUser;
      const users = getStored('users', []).filter(usr => usr.role === 'agent' && (u.role === 'admin' ? usr.team === u.team : true));
      
      return `
        <div id="submitModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl max-h-[92vh] overflow-y-auto border border-slate-100">
            <div class="flex items-center justify-between mb-4 pb-3 border-b">
              <div>
                <h3 class="text-base font-black text-slate-900">Ghorerbazar Facebook - Daily Entry</h3>
                <p class="text-[11px] font-bold text-slate-400">লিড, অর্ডার এবং প্রোডাক্টের ওজন (কেজি-তে) দিন</p>
              </div>
              <button type="button" onclick="closeModal('submitModal')" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form onsubmit="handleSalesSubmit(event)" class="space-y-4">
              <div id="agentSelectContainer" class="${u.role === 'admin' ? '' : 'hidden'}">
                <label class="block text-xs font-extrabold text-slate-600 uppercase mb-1">Select Agent</label>
                <select id="subAgentId" onchange="onModalChange()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800">
                  ${users.map(usr => `<option value="${usr.id}">${usr.name} (${usr.id})</option>`).join('')}
                </select>
              </div>

              <div>
                <label class="block text-xs font-extrabold text-slate-600 uppercase mb-1">Report Date</label>
                <input type="date" id="subDate" required onchange="onModalChange()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800">
              </div>

              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block text-[10px] font-extrabold text-slate-500 uppercase mb-1">Total Leads</label>
                  <input type="number" id="subLeads" required min="0" placeholder="50" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold">
                </div>
                <div>
                  <label class="block text-[10px] font-extrabold text-slate-500 uppercase mb-1">Total Orders</label>
                  <input type="number" id="subOrders" required min="0" placeholder="15" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold">
                </div>
                <div>
                  <label class="block text-[10px] font-extrabold text-slate-500 uppercase mb-1">Sales Amount (৳)</label>
                  <input type="number" id="subAmount" required min="0" placeholder="35000" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold">
                </div>
              </div>

              <div class="border-t pt-4 mt-4">
                <h4 class="text-xs font-black text-slate-800 uppercase mb-1"><i class="fa-solid fa-scale-balanced mr-1 text-orange-500"></i> Incentive Products Sold (Enter in KG)</h4>
                <div class="p-2.5 mb-3 rounded-xl bg-amber-50 border border-amber-200 text-[11px] font-bold text-amber-900">
                  💡 টিপস: গ্রামের হিসাব কেজিতে দিন — <strong>200gm = 0.2</strong> | <strong>250gm = 0.25</strong> | <strong>400gm = 0.4</strong> | <strong>500gm = 0.5</strong> | <strong>1kg = 1</strong>
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div><label class="block text-[11px] font-extrabold text-slate-600 mb-1">Ajwa Dates (kg)</label><input type="number" step="0.01" id="subAjwa" min="0" placeholder="0.5 বা 1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[11px] font-extrabold text-slate-600 mb-1">Pink Salt (kg)</label><input type="number" step="0.01" id="subPinkSalt" min="0" placeholder="0.5 বা 1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[11px] font-extrabold text-slate-600 mb-1">Black Garlic (kg)</label><input type="number" step="0.01" id="subBlackGarlic" min="0" placeholder="0.25 বা 0.5" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[11px] font-extrabold text-slate-600 mb-1">Sundarban Honey (kg)</label><input type="number" step="0.01" id="subSunHoney" min="0" placeholder="0.25, 0.5 বা 1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[11px] font-extrabold text-slate-600 mb-1">Black Seed Honey (kg)</label><input type="number" step="0.01" id="subBSHoney" min="0" placeholder="0.25, 0.5 বা 1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
                  <div><label class="block text-[11px] font-extrabold text-slate-600 mb-1">Gawa Ghee (kg)</label><input type="number" step="0.01" id="subGawaGhee" min="0" placeholder="0.2, 0.4, 0.5 বা 1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold"></div>
                </div>
              </div>

              <div class="flex justify-between items-center pt-4 border-t">
                <button type="button" id="deleteReportBtn" onclick="handleDelete()" class="hidden px-4 py-2.5 text-xs font-extrabold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow">
                  <i class="fa-solid fa-trash-can mr-1"></i> Delete Report
                </button>
                <div class="flex gap-2 ml-auto">
                  <button type="button" onclick="closeModal('submitModal')" class="px-4 py-2.5 text-xs font-bold text-slate-600 bg-slate-100 rounded-xl">Cancel</button>
                  <button type="submit" class="px-6 py-2.5 text-xs font-extrabold text-white tab-active rounded-xl shadow-lg">
                    <i class="fa-solid fa-cloud-arrow-up mr-1"></i> Save & Sync
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

    function openReportModal(agentId, dateStr) {
      document.getElementById('subDate').value = dateToInputVal(dateStr || getTodayFormatted());
      if (currentUser.role === 'admin' && agentId) {
        document.getElementById('subAgentId').value = agentId;
      }
      onModalChange();
      openModal('submitModal');
    }

    function onModalChange() {
      const u = currentUser;
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);
      
      const sales = getStored('sales_records', []);
      const existing = sales.find(s => String(s.userId) === String(agentId) && s.date === dateStr);
      
      if (existing) {
        document.getElementById('subLeads').value = existing.leads || 0;
        document.getElementById('subOrders').value = existing.orders || 0;
        document.getElementById('subAmount').value = existing.amount || 0;
        document.getElementById('subAjwa').value = existing.ajwa || '';
        document.getElementById('subPinkSalt').value = existing.pinkSalt || '';
        document.getElementById('subBlackGarlic').value = existing.blackGarlic || '';
        document.getElementById('subSunHoney').value = existing.sunHoney || '';
        document.getElementById('subBSHoney').value = existing.bsHoney || '';
        document.getElementById('subGawaGhee').value = existing.gawaGhee || '';
        document.getElementById('deleteReportBtn').classList.remove('hidden');
      } else {
        ['subLeads','subOrders','subAmount','subAjwa','subPinkSalt','subBlackGarlic','subSunHoney','subBSHoney','subGawaGhee'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('deleteReportBtn').classList.add('hidden');
      }
    }

    async function handleSalesSubmit(e) {
      e.preventDefault();
      const u = currentUser;
      const allUsers = getStored('users', []);
      const targetAgent = u.role === 'admin' ? allUsers.find(usr => usr.id === document.getElementById('subAgentId').value) : u;

      const entry = {
        userId: String(targetAgent.id),
        userName: targetAgent.name,
        team: targetAgent.team,
        date: inputValToDateStr(document.getElementById('subDate').value),
        leads: Number(document.getElementById('subLeads').value) || 0,
        orders: Number(document.getElementById('subOrders').value) || 0,
        amount: Number(document.getElementById('subAmount').value) || 0,
        ratio: Number(document.getElementById('subLeads').value) > 0 ? Number((Number(document.getElementById('subOrders').value) / Number(document.getElementById('subLeads').value) * 100).toFixed(2)) : 0,
        ajwa: Number(document.getElementById('subAjwa').value) || 0,
        pinkSalt: Number(document.getElementById('subPinkSalt').value) || 0,
        blackGarlic: Number(document.getElementById('subBlackGarlic').value) || 0,
        sunHoney: Number(document.getElementById('subSunHoney').value) || 0,
        bsHoney: Number(document.getElementById('subBSHoney').value) || 0,
        gawaGhee: Number(document.getElementById('subGawaGhee').value) || 0
      };

      let sales = getStored('sales_records', []);
      const idx = sales.findIndex(s => String(s.userId) === String(entry.userId) && s.date === entry.date);
      if (idx !== -1) sales[idx] = entry; else sales.unshift(entry);
      setStored('sales_records', sales);

      await postToSheet('DAILY_SALES_SUBMIT', entry);
      
      alert(`সফলভাবে গুগল শিটে ও ড্যাশবোর্ডে সেভ হয়েছে!`);
      closeModal('submitModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }

    async function handleDelete() {
      const u = currentUser;
      const agentId = u.role === 'admin' ? document.getElementById('subAgentId').value : u.id;
      const dateStr = inputValToDateStr(document.getElementById('subDate').value);

      if (!confirm(`আপনি কি নিশ্চিতভাবে ${dateStr} তারিখের এই রিপোর্টটি ডিলিট করতে চান?`)) return;
      
      let sales = getStored('sales_records', []);
      sales = sales.filter(s => !(String(s.userId) === String(agentId) && s.date === dateStr));
      setStored('sales_records', sales);

      await postToSheet('DELETE_SALES_RECORD', { userId: String(agentId), date: dateStr });
      
      alert('রিপোর্ট সফলভাবে ডিলিট হয়েছে!');
      closeModal('submitModal');
      renderAppLayout();
      setTimeout(fetchFromSheet, 1500);
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
