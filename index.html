<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghorerbazar - Sales Agent & Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
    body { font-family: 'Hind Siliguri', sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="app"></div>

  <script>
    // Initial Seed Data with Team Nazim & Team Samad
    const DEFAULT_USERS = [
      // Admins (Team Leaders)
      { id: '10122', name: 'Md. Nazimur Rahman (TL)', role: 'admin', team: 'Team Nazim', pass: 'admin123', targetOrders: 260, targetAmount: 350000 },
      { id: '10107', name: 'Md Abdus Samad (TL)', role: 'admin', team: 'Team Samad', pass: 'admin123', targetOrders: 260, targetAmount: 350000 },
      
      // Team Nazim Agents
      { id: '10191', name: 'Shagor Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '10289', name: 'Abdullah Dipu', role: 'agent', team: 'Team Nazim', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '11044', name: 'Hasibul Islam Eraz', role: 'agent', team: 'Team Nazim', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '10741', name: 'Kamruzzaman Shujon', role: 'agent', team: 'Team Nazim', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '10803', name: 'Md. Abdullah Mahmud', role: 'agent', team: 'Team Nazim', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '11042', name: 'Md. Ashiqur Rahman', role: 'agent', team: 'Team Nazim', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '10328', name: 'Sheikh MD Rayhan', role: 'agent', team: 'Team Nazim', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '10135', name: 'Ranju Ahmed', role: 'agent', team: 'Team Nazim', pass: '123456', targetOrders: 180, targetAmount: 220000 },

      // Team Samad Agents
      { id: '10098', name: 'Habibur Rahman Shuvo', role: 'agent', team: 'Team Samad', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '10136', name: 'Al-Amin Kazi', role: 'agent', team: 'Team Samad', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '11007', name: 'Zubayer Al Mahmud', role: 'agent', team: 'Team Samad', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '11101', name: 'Md. Mehedi Amin', role: 'agent', team: 'Team Samad', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '11120', name: 'Abu Sayed', role: 'agent', team: 'Team Samad', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '11130', name: 'Rabbir Hossain Molla', role: 'agent', team: 'Team Samad', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '10806', name: 'Abdullah Al Soad', role: 'agent', team: 'Team Samad', pass: '123456', targetOrders: 180, targetAmount: 220000 },
      { id: '10128', name: 'Al-Amin', role: 'agent', team: 'Team Samad', pass: '123456', targetOrders: 180, targetAmount: 220000 }
    ];

    // Persistence Layer
    function getStored(key, def) {
      const data = localStorage.getItem('gb_' + key);
      return data ? JSON.parse(data) : def;
    }
    function setStored(key, val) {
      localStorage.setItem('gb_' + key, JSON.stringify(val));
    }

    if (!localStorage.getItem('gb_users')) {
      setStored('users', DEFAULT_USERS);
    } else {
      let users = getStored('users', []);
      users = users.map(u => {
        if ((u.id === '10122' || u.id === '10107') && u.pass === '123456') {
          return { ...u, pass: 'admin123' };
        }
        return u;
      });
      setStored('users', users);
    }

    let currentUser = getStored('session_user', null);
    let activeTab = 'home';
    let timerInterval = null;
    let webhookUrl = localStorage.getItem('gb_webhook_url') || '';

    // Sheet Sync Function
    async function syncToGoogleSheet(action, payload) {
      if (!webhookUrl) return;
      try {
        await fetch(webhookUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, timestamp: new Date().toISOString(), ...payload })
        });
      } catch (err) {
        console.warn('Sheet sync error:', err);
      }
    }

    function init() {
      render();
      if (currentUser && currentUser.role === 'agent') {
        startShiftTimer();
      }
    }

    function render() {
      const app = document.getElementById('app');
      if (!currentUser) {
        app.innerHTML = renderLogin();
      } else if (currentUser.role === 'admin') {
        app.innerHTML = renderAdminDashboard();
      } else {
        app.innerHTML = renderAgentDashboard();
      }
    }

    function renderLogin() {
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-orange-50 via-slate-50 to-amber-100">
          <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 glass-card">
            <div class="text-center mb-8">
              <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-500 text-white shadow-lg shadow-orange-500/30 mb-4">
                <i class="fa-solid fa-basket-shopping text-3xl"></i>
              </div>
              <h1 class="text-3xl font-bold tracking-tight text-slate-900">Ghorerbazar</h1>
              <p class="text-sm font-semibold text-slate-500 mt-1 uppercase tracking-wider">Sign In</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-5">
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">User ID (Emp ID)</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-regular fa-id-badge text-lg"></i>
                  </span>
                  <input type="text" id="loginId" required placeholder="e.g. 10122 or 10191" 
                    class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all font-medium">
                </div>
              </div>
              <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-lock text-base"></i>
                  </span>
                  <input type="password" id="loginPass" required placeholder="Enter password" 
                    class="w-full pl-11 pr-11 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all font-medium">
                  <button type="button" onclick="togglePassVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600">
                    <i id="passIcon" class="fa-regular fa-eye"></i>
                  </button>
                </div>
              </div>
              <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200 font-medium text-center"></div>
              <button type="submit" 
                class="w-full py-3.5 px-4 bg-orange-500 hover:bg-orange-600 active:scale-[0.99] text-white font-bold text-base rounded-xl shadow-lg shadow-orange-500/25 transition-all flex items-center justify-center gap-2">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function togglePassVisibility() {
      const input = document.getElementById('loginPass');
      const icon = document.getElementById('passIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const errBox = document.getElementById('loginError');

      const users = getStored('users', []);
      const user = users.find(u => u.id === id && u.pass === pass);

      if (!user) {
        errBox.textContent = 'ভুল User ID অথবা Password! অনুগ্রহ করে সঠিক তথ্য দিন।';
        errBox.classList.remove('hidden');
        return;
      }

      currentUser = user;
      setStored('session_user', user);

      // Track Login Session
      if (user.role === 'agent') {
        const attendance = getStored('attendance', []);
        let todaySession = attendance.find(a => a.userId === user.id && a.date === new Date().toLocaleDateString('en-GB'));
        if (!todaySession) {
          todaySession = {
            userId: user.id,
            userName: user.name,
            team: user.team,
            date: new Date().toLocaleDateString('en-GB'),
            loginTime: new Date().toLocaleTimeString(),
            activeSeconds: 0,
            breakSeconds: 0,
            isOnBreak: false,
            breakLogs: []
          };
          attendance.push(todaySession);
          setStored('attendance', attendance);
          syncToGoogleSheet('AGENT_LOGIN', todaySession);
        }
      }

      render();
      if (currentUser.role === 'agent') startShiftTimer();
    }

    function handleLogout() {
      if (timerInterval) clearInterval(timerInterval);
      if (currentUser && currentUser.role === 'agent') {
        syncToGoogleSheet('AGENT_LOGOUT', { userId: currentUser.id, name: currentUser.name, time: new Date().toLocaleTimeString() });
      }
      currentUser = null;
      localStorage.removeItem('gb_session_user');
      render();
    }

    function startShiftTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const attendance = getStored('attendance', []);
        const todayStr = new Date().toLocaleDateString('en-GB');
        const session = attendance.find(a => a.userId === currentUser.id && a.date === todayStr);
        if (session) {
          if (session.isOnBreak) {
            session.breakSeconds = (session.breakSeconds || 0) + 1;
          } else {
            session.activeSeconds = (session.activeSeconds || 0) + 1;
          }
          setStored('attendance', attendance);
          
          const shiftEl = document.getElementById('timer-shift');
          const breakEl = document.getElementById('timer-break');
          if (shiftEl) shiftEl.textContent = formatTime(session.activeSeconds);
          if (breakEl) breakEl.textContent = formatTime(session.breakSeconds);
        }
      }, 1000);
    }

    function formatTime(totalSec) {
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function toggleBreak() {
      const attendance = getStored('attendance', []);
      const todayStr = new Date().toLocaleDateString('en-GB');
      const session = attendance.find(a => a.userId === currentUser.id && a.date === todayStr);
      if (session) {
        session.isOnBreak = !session.isOnBreak;
        if (session.isOnBreak) {
          session.breakLogs.push({ start: new Date().toLocaleTimeString(), end: null });
        } else {
          if (session.breakLogs.length > 0) {
            session.breakLogs[session.breakLogs.length - 1].end = new Date().toLocaleTimeString();
          }
        }
        setStored('attendance', attendance);
        syncToGoogleSheet('BREAK_TOGGLE', { userId: currentUser.id, isOnBreak: session.isOnBreak, time: new Date().toLocaleTimeString() });
        render();
      }
    }

    // Agent Submission
    function submitDailySales(e) {
      e.preventDefault();
      const leads = Number(document.getElementById('eodLeads').value) || 0;
      const orders = Number(document.getElementById('eodOrders').value) || 0;
      const amount = Number(document.getElementById('eodAmount').value) || 0;
      const ratio = leads > 0 ? ((orders / leads) * 100).toFixed(2) : 0;

      const sales = getStored('sales_records', []);
      const entry = {
        id: 'rec_' + Date.now(),
        userId: currentUser.id,
        userName: currentUser.name,
        team: currentUser.team,
        date: new Date().toLocaleDateString('en-GB'),
        time: new Date().toLocaleTimeString(),
        leads,
        orders,
        amount,
        ratio: Number(ratio)
      };

      sales.unshift(entry);
      setStored('sales_records', sales);
      syncToGoogleSheet('DAILY_SALES_SUBMIT', entry);

      alert('ধন্যবাদ! আজকের সেলস রিপোর্ট সফলভাবে সাবমিট ও সেভ করা হয়েছে।');
      document.getElementById('eodForm').reset();
      render();
    }

    // Admin Agent Creation
    function createAgentByAdmin(e) {
      e.preventDefault();
      const id = document.getElementById('newAgentId').value.trim();
      const name = document.getElementById('newAgentName').value.trim();
      const team = document.getElementById('newAgentTeam').value;
      const pass = document.getElementById('newAgentPass').value.trim() || '123456';
      const targetOrders = Number(document.getElementById('newAgentOrders').value) || 180;
      const targetAmount = Number(document.getElementById('newAgentAmount').value) || 220000;

      const users = getStored('users', []);
      if (users.find(u => u.id === id)) {
        alert('এই Employee ID দিয়ে ইতিমধ্যে একজন এজেন্ট রয়েছে!');
        return;
      }

      const newAgent = { id, name, role: 'agent', team, pass, targetOrders, targetAmount };
      users.push(newAgent);
      setStored('users', users);
      syncToGoogleSheet('CREATE_AGENT', newAgent);

      alert(`নতুন এজেন্ট ${name} (ID: ${id}) সফলভাবে যোগ করা হয়েছে!`);
      closeModal('createAgentModal');
      render();
    }

    function openModal(id) { document.getElementById(id)?.classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id)?.classList.add('hidden'); }

    function setTab(tab) {
      activeTab = tab;
      render();
    }

    function saveWebhookUrl() {
      const url = document.getElementById('webhookInput').value.trim();
      webhookUrl = url;
      localStorage.setItem('gb_webhook_url', url);
      alert('Google Sheets Webhook URL সেভ হয়েছে! এখন সকল ডাটা লাইভ শিটে পাঠানো হবে।');
      closeModal('webhookModal');
      render();
    }

    // Agent Dashboard Render
    function renderAgentDashboard() {
      const todayStr = new Date().toLocaleDateString('en-GB');
      const attendance = getStored('attendance', []);
      const session = attendance.find(a => a.userId === currentUser.id && a.date === todayStr) || { activeSeconds: 0, breakSeconds: 0, isOnBreak: false };
      const sales = getStored('sales_records', []);
      const mySales = sales.filter(s => s.userId === currentUser.id);

      const totalMonthOrders = mySales.reduce((acc, c) => acc + c.orders, 0);
      const totalMonthAmount = mySales.reduce((acc, c) => acc + c.amount, 0);
      const totalMonthLeads = mySales.reduce((acc, c) => acc + c.leads, 0);
      const monthRatio = totalMonthLeads > 0 ? ((totalMonthOrders / totalMonthLeads) * 100).toFixed(1) : 0;
      const orderProgress = Math.min(100, Math.round((totalMonthOrders / (currentUser.targetOrders || 1)) * 100));

      return `
        <div class="min-h-screen bg-slate-50 flex flex-col">
          <!-- Navbar -->
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center font-bold">
                  <i class="fa-solid fa-basket-shopping"></i>
                </div>
                <div>
                  <h1 class="text-lg font-bold text-slate-900 leading-tight">Ghorerbazar</h1>
                  <p class="text-xs text-slate-500 font-medium">Agent Portal &bull; ${currentUser.name} (${currentUser.id})</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <button onclick="handleLogout()" class="px-3.5 py-1.5 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors flex items-center gap-1.5">
                  <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
                </button>
              </div>
            </div>
          </header>

          <!-- Main Body -->
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 space-y-6">
            <!-- Timer Banner -->
            <div class="bg-gradient-to-r from-orange-500 to-amber-500 rounded-2xl p-6 text-white shadow-lg">
              <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full ${session.isOnBreak ? 'bg-amber-300 animate-ping' : 'bg-emerald-300 animate-pulse'}"></span>
                    <span class="text-xs uppercase font-bold tracking-wider opacity-90">${session.isOnBreak ? 'Currently on Break' : 'Duty Time Running'}</span>
                  </div>
                  <h2 class="text-2xl font-bold mt-1">স্বাগতম, ${currentUser.name}!</h2>
                  <p class="text-xs opacity-80 mt-0.5">আপনার টিম: <span class="font-semibold underline">${currentUser.team}</span></p>
                </div>
                <div class="flex items-center gap-6 bg-white/10 backdrop-blur px-5 py-3 rounded-xl border border-white/20">
                  <div class="text-center">
                    <p class="text-xs text-orange-100 uppercase tracking-wider font-semibold">Active Time</p>
                    <p id="timer-shift" class="text-2xl font-black font-mono tracking-tight">${formatTime(session.activeSeconds)}</p>
                  </div>
                  <div class="w-px h-8 bg-white/20"></div>
                  <div class="text-center">
                    <p class="text-xs text-orange-100 uppercase tracking-wider font-semibold">Break Time</p>
                    <p id="timer-break" class="text-2xl font-black font-mono tracking-tight">${formatTime(session.breakSeconds)}</p>
                  </div>
                  <button onclick="toggleBreak()" class="ml-2 px-4 py-2 rounded-xl text-xs font-bold shadow-md transition-all active:scale-95 ${session.isOnBreak ? 'bg-emerald-500 hover:bg-emerald-600 text-white' : 'bg-amber-400 hover:bg-amber-500 text-slate-900'}">
                    <i class="fa-solid ${session.isOnBreak ? 'fa-play' : 'fa-pause'} mr-1"></i>
                    ${session.isOnBreak ? 'Resume Work' : 'Take Break'}
                  </button>
                </div>
              </div>
            </div>

            <!-- Performance Metrics -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-xs font-bold uppercase text-slate-500">Monthly Orders</p>
                <div class="flex items-baseline justify-between mt-2">
                  <p class="text-2xl font-extrabold text-slate-900">${totalMonthOrders}</p>
                  <span class="text-xs font-bold text-orange-600">Target: ${currentUser.targetOrders}</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-1.5 mt-3">
                  <div class="bg-orange-500 h-1.5 rounded-full" style="width: ${orderProgress}%"></div>
                </div>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-xs font-bold uppercase text-slate-500">Sales Amount</p>
                <p class="text-2xl font-extrabold text-emerald-600 mt-2">৳ ${totalMonthAmount.toLocaleString()}</p>
                <p class="text-xs text-slate-400 mt-2">Target: ৳ ${(currentUser.targetAmount || 0).toLocaleString()}</p>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-xs font-bold uppercase text-slate-500">Conversion Ratio</p>
                <p class="text-2xl font-extrabold text-blue-600 mt-2">${monthRatio}%</p>
                <p class="text-xs text-slate-400 mt-2">Total Leads: ${totalMonthLeads}</p>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <p class="text-xs font-bold uppercase text-slate-500">Today's Shift Status</p>
                <p class="text-base font-bold text-slate-800 mt-2 flex items-center gap-1.5">
                  <i class="fa-regular fa-clock text-orange-500"></i> Started at ${session.loginTime || '--:--'}
                </p>
                <span class="inline-block mt-2 px-2.5 py-0.5 rounded-full text-xs font-semibold ${session.isOnBreak ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">
                  ${session.isOnBreak ? 'Taking Break' : 'Active Duty'}
                </span>
              </div>
            </div>

            <!-- EOD Submission Form & History -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="text-base font-bold text-slate-900 flex items-center gap-2 mb-4">
                  <i class="fa-solid fa-file-pen text-orange-500"></i>
                  Daily Sales Entry (EOD)
                </h3>
                <form id="eodForm" onsubmit="submitDailySales(event)" class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Today's Leads Count</label>
                    <input type="number" id="eodLeads" required min="1" placeholder="e.g. 50" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Total Sales Orders</label>
                    <input type="number" id="eodOrders" required min="0" placeholder="e.g. 15" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Total Sales Amount (BDT)</label>
                    <input type="number" id="eodAmount" required min="0" placeholder="e.g. 24500" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                  </div>
                  <button type="submit" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-sm shadow-md shadow-orange-500/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Submit & Save to Sheet</span>
                  </button>
                </form>
              </div>

              <!-- History View (Read Only for Agent) -->
              <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-slate-500"></i>
                    Performance History (View Only)
                  </h3>
                  <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-medium">Read-Only Mode</span>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-sm">
                    <thead>
                      <tr class="border-b border-slate-100 text-xs font-bold uppercase text-slate-400">
                        <th class="py-2.5">Date</th>
                        <th class="py-2.5">Leads</th>
                        <th class="py-2.5">Orders</th>
                        <th class="py-2.5">Amount</th>
                        <th class="py-2.5">Conversion</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 font-medium">
                      ${mySales.length === 0 ? '<tr><td colspan="5" class="py-8 text-center text-slate-400">কোন সেলস রেকর্ড এখনো নেই। EOD সাবমিট করুন।</td></tr>' : ''}
                      ${mySales.map(s => `
                        <tr>
                          <td class="py-3 font-semibold text-slate-700">${s.date} <span class="text-xs text-slate-400 font-normal">${s.time}</span></td>
                          <td class="py-3">${s.leads}</td>
                          <td class="py-3 font-bold text-orange-600">${s.orders}</td>
                          <td class="py-3 font-semibold text-emerald-600">৳ ${s.amount.toLocaleString()}</td>
                          <td class="py-3">
                            <span class="px-2 py-0.5 rounded text-xs font-bold ${s.ratio >= 25 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-700'}">${s.ratio}%</span>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </main>
        </div>
      `;
    }

    // Admin Dashboard Render
    function renderAdminDashboard() {
      const users = getStored('users', []).filter(u => u.role === 'agent');
      const sales = getStored('sales_records', []);
      const attendance = getStored('attendance', []);
      const todayStr = new Date().toLocaleDateString('en-GB');

      // Team Metrics Calculation
      const teamNazimAgents = users.filter(u => u.team === 'Team Nazim');
      const teamSamadAgents = users.filter(u => u.team === 'Team Samad');

      const nazimSales = sales.filter(s => s.team === 'Team Nazim');
      const samadSales = sales.filter(s => s.team === 'Team Samad');

      const nazimOrders = nazimSales.reduce((a, c) => a + c.orders, 0);
      const samadOrders = samadSales.reduce((a, c) => a + c.orders, 0);

      const nazimAmount = nazimSales.reduce((a, c) => a + c.amount, 0);
      const samadAmount = samadSales.reduce((a, c) => a + c.amount, 0);

      return `
        <div class="min-h-screen bg-slate-50 flex flex-col">
          <!-- Admin Navbar -->
          <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-orange-500 text-white flex items-center justify-center font-bold">
                  <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                  <h1 class="text-lg font-bold text-slate-900 leading-tight">Ghorerbazar Admin Panel</h1>
                  <p class="text-xs text-slate-500 font-medium">Logged as: ${currentUser.name} (${currentUser.team})</p>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <button onclick="openModal('webhookModal')" class="px-3 py-1.5 text-xs font-bold ${webhookUrl ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-amber-50 text-amber-700 border-amber-200'} border rounded-lg flex items-center gap-1.5">
                  <i class="fa-solid fa-table"></i> ${webhookUrl ? 'Sheets: Connected' : 'Connect Google Sheet'}
                </button>
                <button onclick="openModal('createAgentModal')" class="px-3.5 py-1.5 text-xs font-bold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow-sm flex items-center gap-1.5">
                  <i class="fa-solid fa-user-plus"></i> Create Agent
                </button>
                <button onclick="handleLogout()" class="px-3.5 py-1.5 text-xs font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors">
                  Sign Out
                </button>
              </div>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 space-y-6">
            <!-- Team Comparison Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Team Nazim -->
              <div class="bg-white rounded-2xl p-6 border-2 ${currentUser.id === '10122' ? 'border-orange-400' : 'border-slate-200'} shadow-sm">
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <h3 class="text-base font-bold text-slate-900">Team Nazim</h3>
                    <p class="text-xs text-slate-500 font-medium">Team Leader: Md. Nazimur Rahman (10122)</p>
                  </div>
                  <span class="px-3 py-1 rounded-full text-xs font-bold bg-orange-100 text-orange-800">${teamNazimAgents.length} Agents</span>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                  <div>
                    <p class="text-xs uppercase font-bold text-slate-400">Total Orders</p>
                    <p class="text-2xl font-black text-slate-800">${nazimOrders}</p>
                  </div>
                  <div>
                    <p class="text-xs uppercase font-bold text-slate-400">Total Revenue</p>
                    <p class="text-2xl font-black text-emerald-600">৳ ${nazimAmount.toLocaleString()}</p>
                  </div>
                </div>
              </div>

              <!-- Team Samad -->
              <div class="bg-white rounded-2xl p-6 border-2 ${currentUser.id === '10107' ? 'border-orange-400' : 'border-slate-200'} shadow-sm">
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <h3 class="text-base font-bold text-slate-900">Team Samad</h3>
                    <p class="text-xs text-slate-500 font-medium">Team Leader: Md Abdus Samad (10107)</p>
                  </div>
                  <span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800">${teamSamadAgents.length} Agents</span>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                  <div>
                    <p class="text-xs uppercase font-bold text-slate-400">Total Orders</p>
                    <p class="text-2xl font-black text-slate-800">${samadOrders}</p>
                  </div>
                  <div>
                    <p class="text-xs uppercase font-bold text-slate-400">Total Revenue</p>
                    <p class="text-2xl font-black text-emerald-600">৳ ${samadAmount.toLocaleString()}</p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Agent Performance & Live Shift Monitoring Table -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h3 class="text-base font-bold text-slate-900">Live Agent Shift & Performance Monitoring</h3>
                  <p class="text-xs text-slate-500 font-medium">Real-time status, targets, achievement ratios and full edit access</p>
                </div>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                  <thead>
                    <tr class="border-b border-slate-200 text-xs font-bold uppercase text-slate-400">
                      <th class="py-3">Agent</th>
                      <th class="py-3">Team</th>
                      <th class="py-3">Shift Status</th>
                      <th class="py-3">Active / Break</th>
                      <th class="py-3">Orders (Achieved / Target)</th>
                      <th class="py-3">Sales Amount</th>
                      <th class="py-3">Conversion</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 font-medium">
                    ${users.map(agent => {
                      const agentSales = sales.filter(s => s.userId === agent.id);
                      const totalOrders = agentSales.reduce((a, c) => a + c.orders, 0);
                      const totalAmount = agentSales.reduce((a, c) => a + c.amount, 0);
                      const totalLeads = agentSales.reduce((a, c) => a + c.leads, 0);
                      const ratio = totalLeads > 0 ? ((totalOrders / totalLeads) * 100).toFixed(1) : 0;
                      const session = attendance.find(a => a.userId === agent.id && a.date === todayStr);

                      let statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-500">Offline</span>';
                      if (session) {
                        if (session.isOnBreak) {
                          statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-amber-100 text-amber-800 animate-pulse">On Break</span>';
                        } else {
                          statusBadge = '<span class="px-2 py-0.5 rounded text-xs font-bold bg-emerald-100 text-emerald-800">Online Working</span>';
                        }
                      }

                      const pct = Math.round((totalOrders / (agent.targetOrders || 1)) * 100);

                      return `
                        <tr class="hover:bg-slate-50/50">
                          <td class="py-3.5">
                            <div class="font-bold text-slate-800">${agent.name}</div>
                            <div class="text-xs text-slate-400 font-mono">ID: ${agent.id}</div>
                          </td>
                          <td class="py-3.5">
                            <span class="text-xs font-semibold px-2 py-0.5 rounded ${agent.team === 'Team Nazim' ? 'bg-orange-50 text-orange-700' : 'bg-blue-50 text-blue-700'}">${agent.team}</span>
                          </td>
                          <td class="py-3.5">${statusBadge}</td>
                          <td class="py-3.5 text-xs font-mono">
                            <div><i class="fa-regular fa-clock text-emerald-500"></i> ${session ? formatTime(session.activeSeconds) : '00:00:00'}</div>
                            <div class="text-slate-400"><i class="fa-solid fa-mug-saucer text-amber-500"></i> ${session ? formatTime(session.breakSeconds) : '00:00:00'}</div>
                          </td>
                          <td class="py-3.5">
                            <div class="flex items-center gap-2">
                              <span class="font-bold text-slate-900">${totalOrders}</span>
                              <span class="text-xs text-slate-400">/ ${agent.targetOrders}</span>
                              <span class="text-xs font-bold ${pct >= 100 ? 'text-emerald-600' : 'text-slate-500'}">(${pct}%)</span>
                            </div>
                          </td>
                          <td class="py-3.5 font-bold text-emerald-600">৳ ${totalAmount.toLocaleString()}</td>
                          <td class="py-3.5">
                            <span class="px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-800">${ratio}%</span>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          <!-- Modal: Create Agent -->
          <div id="createAgentModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-slate-900">নতুন এজেন্ট অ্যাকাউন্ট তৈরি</h3>
                <button onclick="closeModal('createAgentModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
              </div>
              <form onsubmit="createAgentByAdmin(event)" class="space-y-3.5">
                <div>
                  <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Employee ID</label>
                  <input type="text" id="newAgentId" required placeholder="e.g. 11150" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                  <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Agent Full Name</label>
                  <input type="text" id="newAgentName" required placeholder="e.g. Tanvir Ahmed" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div>
                  <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Team Selection</label>
                  <select id="newAgentTeam" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                    <option value="Team Nazim">Team Nazim</option>
                    <option value="Team Samad">Team Samad</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Initial Password</label>
                  <input type="text" id="newAgentPass" value="123456" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Monthly Orders Target</label>
                    <input type="number" id="newAgentOrders" value="180" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                  </div>
                  <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Target Amount (BDT)</label>
                    <input type="number" id="newAgentAmount" value="220000" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500">
                  </div>
                </div>
                <button type="submit" class="w-full py-3 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl text-sm shadow-md transition-all mt-2">
                  Create Agent Account
                </button>
              </form>
            </div>
          </div>

          <!-- Modal: Webhook Connect -->
          <div id="webhookModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100">
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-slate-900">Google Sheets Webhook Setup</h3>
                <button onclick="closeModal('webhookModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
              </div>
              <p class="text-xs text-slate-500 mb-3">Google Apps Script Web App থেকে পাওয়া URL টি এখানে পেস্ট করে সেভ করুন:</p>
              <input type="url" id="webhookInput" value="${webhookUrl}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:ring-2 focus:ring-orange-500 mb-4">
              <div class="flex justify-end gap-2">
                <button onclick="closeModal('webhookModal')" class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
                <button onclick="saveWebhookUrl()" class="px-4 py-2 text-xs font-bold text-white bg-orange-500 hover:bg-orange-600 rounded-lg shadow-sm">Save Webhook</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
